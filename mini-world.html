
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Mini World</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
    font-family:Arial,sans-serif;
    background:#69c7e8;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    pointer-events:none;
    color:white;
    text-shadow:0 2px 4px #000;
    text-align:center;
}

#name{
    font-size:28px;
    font-weight:bold;
    margin-top:12px;
}

#biome{
    display:inline-block;
    margin-top:7px;
    padding:7px 15px;
    border-radius:18px;
    background:#0009;
    font-weight:bold;
}

#controls{
    position:fixed;
    left:15px;
    bottom:15px;
    width:230px;
    height:175px;
}

button{
    font-family:Arial,sans-serif;
    font-weight:bold;
}

.move{
    position:absolute;
    width:72px;
    height:55px;
    border:2px solid #ffffff77;
    border-radius:15px;
    background:#18251ddd;
    color:white;
    font-size:13px;
    touch-action:none;
}

.move:active{
    background:#4a8054;
    transform:scale(.95);
}

#up{
    left:79px;
    top:0;
}

#down{
    left:79px;
    bottom:0;
}

#turnLeft{
    left:0;
    top:60px;
}

#turnRight{
    right:0;
    top:60px;
}

#worldButtons{
    position:fixed;
    right:15px;
    bottom:15px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.world{
    width:125px;
    height:43px;
    border:0;
    border-radius:13px;
    background:#18251ddd;
    color:white;
    font-size:13px;
}

.world:active{
    transform:scale(.95);
}

#start{
    position:fixed;
    inset:0;
    z-index:20;
    background:linear-gradient(#61c8ec,#4d9d57);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:25px;
}

#start h1{
    font-size:45px;
    margin:10px 0;
}

#start p{
    font-size:18px;
    line-height:1.5;
    max-width:520px;
}

#startButton{
    margin-top:15px;
    border:0;
    border-radius:17px;
    padding:17px 35px;
    font-size:21px;
    background:#52d47a;
    color:#082512;
}

#message{
    position:fixed;
    left:50%;
    bottom:205px;
    transform:translateX(-50%);
    background:#000c;
    color:white;
    padding:10px 17px;
    border-radius:17px;
    display:none;
    font-weight:bold;
    white-space:nowrap;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div id="name">Mini World</div>
    <div id="biome">Grassland</div>
</div>

<div id="controls">
    <button class="move" id="up">FORWARD</button>
    <button class="move" id="down">BACK</button>
    <button class="move" id="turnLeft">TURN LEFT</button>
    <button class="move" id="turnRight">TURN RIGHT</button>
</div>

<div id="worldButtons">
    <button class="world" onclick="changeBiome('grass')">GRASSLAND</button>
    <button class="world" onclick="changeBiome('forest')">FOREST</button>
    <button class="world" onclick="changeBiome('desert')">DESERT</button>
    <button class="world" onclick="changeBiome('snow')">SNOWLAND</button>
    <button class="world" onclick="changeBiome('island')">ISLAND</button>
</div>

<div id="message"></div>

<div id="start">
    <div style="font-size:75px;">Mini World</div>
    <h1>Mini World</h1>
    <p>
        Explore a huge world with different biomes.
        Travel through grasslands, forests, deserts,
        snowy lands and islands.
    </p>
    <button id="startButton">START GAME</button>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W=0;
let H=0;

function resize(){
    W=window.innerWidth;
    H=window.innerHeight;

    const dpr=Math.min(window.devicePixelRatio||1,1.5);

    canvas.width=Math.floor(W*dpr);
    canvas.height=Math.floor(H*dpr);

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();


/* =========================
   PLAYER
========================= */

const player={
    x:0,
    y:0,
    angle:0,
    speed:125
};


/* =========================
   CONTROLS
========================= */

const controls={
    forward:false,
    back:false,
    left:false,
    right:false
};

function hold(id,name){

    const b=document.getElementById(id);

    b.addEventListener("pointerdown",e=>{
        e.preventDefault();
        controls[name]=true;
        b.setPointerCapture(e.pointerId);
    });

    b.addEventListener("pointerup",()=>{
        controls[name]=false;
    });

    b.addEventListener("pointercancel",()=>{
        controls[name]=false;
    });

    b.addEventListener("lostpointercapture",()=>{
        controls[name]=false;
    });
}

hold("up","forward");
hold("down","back");
hold("turnLeft","left");
hold("turnRight","right");


/* =========================
   BIOMES
========================= */

let currentBiome="grass";

const biomeData={
    grass:{
        name:"Grassland",
        sky:"#71cbea",
        ground:"#65a947",
        ground2:"#4f9139",
        tree:"#2f7c35",
        trunk:"#69452c"
    },

    forest:{
        name:"Forest",
        sky:"#70b9dc",
        ground:"#39753a",
        ground2:"#2c6030",
        tree:"#17582b",
        trunk:"#4d3423"
    },

    desert:{
        name:"Desert",
        sky:"#e9c77a",
        ground:"#d7a952",
        ground2:"#c4933d",
        tree:"#568c45",
        trunk:"#72502c"
    },

    snow:{
        name:"Snowland",
        sky:"#9ed7ee",
        ground:"#e8f1f3",
        ground2:"#cbdde2",
        tree:"#28633e",
        trunk:"#5b4935"
    },

    island:{
        name:"Island",
        sky:"#54c6e7",
        ground:"#d9bd68",
        ground2:"#4caa4d",
        tree:"#26803d",
        trunk:"#67462c"
    }
};

function changeBiome(name){

    currentBiome=name;

    document.getElementById("biome").textContent=
        biomeData[name].name;

    player.x=0;
    player.y=0;

    showMessage(
        "Exploring "+biomeData[name].name
    );
}


/* =========================
   WORLD OBJECTS
========================= */

let objects=[];

let seed=93741;

function random(){

    seed=(seed*1664525+1013904223)>>>0;

    return seed/4294967296;
}

function makeWorld(){

    objects=[];

    for(let i=0;i<180;i++){

        const a=random()*Math.PI*2;
        const d=120+random()*1200;

        objects.push({
            x:Math.cos(a)*d,
            y:Math.sin(a)*d,
            size:20+random()*45,
            type:random()
        });
    }
}

makeWorld();


/* =========================
   CAMERA PROJECTION
========================= */

function project(x,y){

    const dx=x-player.x;
    const dy=y-player.y;

    const c=Math.cos(player.angle);
    const s=Math.sin(player.angle);

    const forward=dx*c+dy*s;
    const side=-dx*s+dy*c;

    if(forward<8)return null;

    const scale=520/forward;

    return{
        x:W/2+side*scale,
        y:H*.52,
        scale:scale,
        depth:forward
    };
}


/* =========================
   SKY
========================= */

function drawSky(){

    const b=biomeData[currentBiome];

    const g=ctx.createLinearGradient(
        0,0,0,H*.55
    );

    g.addColorStop(0,b.sky);
    g.addColorStop(1,"#d7edf2");

    ctx.fillStyle=g;

    ctx.fillRect(0,0,W,H);
}


/* =========================
   GROUND
========================= */

function drawGround(){

    const b=biomeData[currentBiome];

    ctx.fillStyle=b.ground;

    ctx.fillRect(
        0,
        H*.52,
        W,
        H*.48
    );

    ctx.globalAlpha=.25;

    ctx.strokeStyle=b.ground2;

    for(let i=0;i<12;i++){

        const y=
            H*.52+
            Math.pow(i/11,1.7)*H*.48;

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();
    }

    ctx.globalAlpha=1;
}


/* =========================
   TREE
========================= */

function drawTree(o){

    const p=project(o.x,o.y);

    if(!p)return;

    if(p.x<-200||p.x>W+200)return;

    const b=biomeData[currentBiome];

    const s=o.size*p.scale;

    if(s<2)return;

    /*
       Shadow
    */

    ctx.fillStyle="#16351a66";

    ctx.beginPath();

    ctx.ellipse(
        p.x,
        p.y+4,
        s*.9,
        s*.22,
        0,0,Math.PI*2
    );

    ctx.fill();


    /*
       Trunk
    */

    ctx.fillStyle=b.trunk;

    ctx.fillRect(
        p.x-s*.16,
        p.y-s*3,
        s*.32,
        s*3
    );


    /*
       Leaves
    */

    ctx.fillStyle=b.tree;

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y-s*3.4,
        s*1.05,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        p.x-s*.7,
        p.y-s*2.8,
        s*.75,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        p.x+s*.7,
        p.y-s*2.8,
        s*.75,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================
   ROCK
========================= */

function drawRock(o){

    const p=project(o.x,o.y);

    if(!p)return;

    const s=o.size*p.scale;

    if(s<2)return;

    let color="#777";

    if(currentBiome==="desert"){
        color="#a47743";
    }

    if(currentBiome==="snow"){
        color="#9caeb2";
    }

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.ellipse(
        p.x,
        p.y,
        s,
        s*.55,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================
   CACTUS
========================= */

function drawCactus(o){

    const p=project(o.x,o.y);

    if(!p)return;

    const s=o.size*p.scale;

    if(s<2)return;

    ctx.fillStyle="#4d873d";

    ctx.fillRect(
        p.x-s*.18,
        p.y-s*3,
        s*.36,
        s*3
    );

    ctx.fillRect(
        p.x-s*.65,
        p.y-s*2.1,
        s*.5,
        s*.28
    );

    ctx.fillRect(
        p.x+s*.2,
        p.y-s*1.6,
        s*.5,
        s*.28
    );
}


/* =========================
   SNOW TREE
========================= */

function drawSnowTree(o){

    const p=project(o.x,o.y);

    if(!p)return;

    const s=o.size*p.scale;

    if(s<2)return;

    ctx.fillStyle="#665442";

    ctx.fillRect(
        p.x-s*.12,
        p.y-s*3,
        s*.24,
        s*3
    );

    ctx.fillStyle="#f4f7f8";

    for(let i=0;i<3;i++){

        ctx.beginPath();

        ctx.moveTo(
            p.x,
            p.y-s*(4-i*.7)
        );

        ctx.lineTo(
            p.x-s*(1.1-i*.2),
            p.y-s*(2.7-i*.5)
        );

        ctx.lineTo(
            p.x+s*(1.1-i*.2),
            p.y-s*(2.7-i*.5)
        );

        ctx.closePath();

        ctx.fill();
    }
}


/* =========================
   ISLAND PALM
========================= */

function drawPalm(o){

    const p=project(o.x,o.y);

    if(!p)return;

    const s=o.size*p.scale;

    if(s<2)return;

    ctx.strokeStyle="#75502d";
    ctx.lineWidth=Math.max(2,s*.18);

    ctx.beginPath();

    ctx.moveTo(p.x,p.y);
    ctx.lineTo(
        p.x-s*.15,
        p.y-s*3
    );

    ctx.stroke();

    ctx.strokeStyle="#28783b";
    ctx.lineWidth=Math.max(1,s*.12);

    for(let i=0;i<6;i++){

        const a=
            i*Math.PI/3;

        ctx.beginPath();

        ctx.moveTo(
            p.x-s*.15,
            p.y-s*3
        );

        ctx.lineTo(
            p.x-s*.15+
            Math.cos(a)*s*1.3,
            p.y-s*3+
            Math.sin(a)*s*.7
        );

        ctx.stroke();
    }
}


/* =========================
   DRAW WORLD
========================= */

function drawObjects(){

    const visible=[];

    for(const o of objects){

        const dx=o.x-player.x;
        const dy=o.y-player.y;

        const c=Math.cos(player.angle);
        const s=Math.sin(player.angle);

        const depth=dx*c+dy*s;

        if(depth>8){

            visible.push({
                depth:depth,
                object:o
            });
        }
    }

    visible.sort(
        (a,b)=>b.depth-a.depth
    );

    for(const v of visible){

        const o=v.object;

        if(currentBiome==="desert" &&
           o.type<.25){

            drawCactus(o);

        }else if(currentBiome==="snow" &&
                 o.type<.55){

            drawSnowTree(o);

        }else if(currentBiome==="island" &&
                 o.type<.45){

            drawPalm(o);

        }else if(o.type<.72){

            drawTree(o);

        }else{

            drawRock(o);
        }
    }
}


/* =========================
   MOVEMENT
========================= */

function update(dt){

    /*
       Correct controls:
       FORWARD = forward
       BACK = backward
       LEFT = left turn
       RIGHT = right turn
    */

    if(controls.left){
        player.angle-=2.4*dt;
    }

    if(controls.right){
        player.angle+=2.4*dt;
    }

    let direction=0;

    if(controls.forward){
        direction+=1;
    }

    if(controls.back){
        direction-=1;
    }

    if(direction!==0){

        player.x+=
            Math.cos(player.angle)*
            player.speed*
            direction*
            dt;

        player.y+=
            Math.sin(player.angle)*
            player.speed*
            direction*
            dt;
    }
}


/* =========================
   MESSAGE
========================= */

let messageTimer=0;

function showMessage(text){

    const m=document.getElementById("message");

    m.textContent=text;
    m.style.display="block";

    clearTimeout(messageTimer);

    messageTimer=setTimeout(()=>{
        m.style.display="none";
    },1500);
}


/* =========================
   GAME LOOP
========================= */

let running=false;
let last=performance.now();

function loop(now){

    if(!running)return;

    const dt=Math.min(
        (now-last)/1000,
        .05
    );

    last=now;

    update(dt);

    drawSky();
    drawGround();
    drawObjects();

    requestAnimationFrame(loop);
}


/* =========================
   START
========================= */

document.getElementById(
    "startButton"
).addEventListener("click",()=>{

    document.getElementById(
        "start"
    ).style.display="none";

    running=true;
    last=performance.now();

    requestAnimationFrame(loop);
});

</script>

</body>
</html>
```
