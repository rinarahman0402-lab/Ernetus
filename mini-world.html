
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mini World</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#75c9ed;
  font-family:Arial,sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#start,#win,#task{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  color:white;
}

#start{
  background:linear-gradient(#57bde8,#43a95e);
}

#win{
  display:none;
  background:linear-gradient(#ffb347,#e85d5d);
}

#task{
  display:none;
  inset:auto 50% 25px auto;
  transform:translateX(50%);
  width:min(92%,500px);
  height:auto;
  background:#101b1de8;
  border-radius:20px;
  padding:18px;
}

h1{
  font-size:clamp(42px,10vw,72px);
  margin:8px;
}

h2{
  margin:5px;
}

p{
  font-size:18px;
  line-height:1.5;
  max-width:650px;
}

.mainButton{
  border:0;
  border-radius:20px;
  padding:18px 35px;
  background:#ffd34e;
  color:#173b20;
  font-size:21px;
  font-weight:bold;
  margin-top:15px;
  touch-action:manipulation;
}

.mainButton:active{
  transform:scale(.94);
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  z-index:20;
  display:none;
  justify-content:space-between;
  gap:8px;
  pointer-events:none;
}

.info{
  background:#101820d9;
  color:white;
  border-radius:13px;
  padding:9px 12px;
  font-weight:bold;
  font-size:14px;
}

#controls{
  position:fixed;
  z-index:30;
  left:12px;
  bottom:15px;
  width:250px;
  height:180px;
  display:none;
}

.control{
  position:absolute;
  width:78px;
  height:58px;
  border:2px solid #ffffffaa;
  border-radius:17px;
  background:#15241ddd;
  color:white;
  font-weight:bold;
  font-size:12px;
  touch-action:none;
}

.control:active{
  background:#3d9c55;
  transform:scale(.93);
}

#up{
  left:86px;
  top:0;
}

#down{
  left:86px;
  bottom:0;
}

#turnLeft{
  left:0;
  top:61px;
}

#turnRight{
  right:0;
  top:61px;
}

#action{
  position:fixed;
  z-index:30;
  right:15px;
  bottom:25px;
  display:none;
  border:0;
  border-radius:18px;
  padding:17px 20px;
  background:#ffd34e;
  color:#173b20;
  font-weight:bold;
  font-size:15px;
  touch-action:manipulation;
}

#message{
  position:fixed;
  z-index:40;
  left:50%;
  top:70px;
  transform:translateX(-50%);
  background:#101820e8;
  color:white;
  padding:11px 17px;
  border-radius:15px;
  display:none;
  font-weight:bold;
  text-align:center;
  max-width:90%;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="start">
  <div style="font-size:75px">🌎</div>
  <h1>Mini World</h1>

  <p>
    Explore different worlds and biomes.
    Complete the task in each world to unlock the next one!
  </p>

  <button class="mainButton" id="startButton">
    PLAY MINI WORLD
  </button>
</div>


<div id="win">
  <div style="font-size:75px">🏆</div>
  <h1>YOU EXPLORED MINI WORLD!</h1>
  <p>
    You completed every biome and finished every task.
  </p>

  <button class="mainButton" id="againButton">
    PLAY AGAIN
  </button>
</div>


<div id="hud">

  <div class="info">
    WORLD:
    <span id="worldName">FOREST</span>
  </div>

  <div class="info">
    TASK:
    <span id="taskNumber">1</span>/4
  </div>

</div>


<div id="controls">

  <button class="control" id="up">
    MOVE FORWARD
  </button>

  <button class="control" id="down">
    MOVE BACK
  </button>

  <button class="control" id="turnLeft">
    TURN LEFT
  </button>

  <button class="control" id="turnRight">
    TURN RIGHT
  </button>

</div>


<button id="action">
  DO TASK
</button>


<div id="message"></div>


<div id="task">
  <h2 id="taskTitle"></h2>
  <p id="taskDescription"></p>
</div>


<script>

/* =====================================================
   MINI WORLD
   Completely self-contained.
   No WebGL.
   No external libraries.
   ===================================================== */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


/* =====================================================
   UI
   ===================================================== */

const startScreen=
  document.getElementById("start");

const winScreen=
  document.getElementById("win");

const startButton=
  document.getElementById("startButton");

const againButton=
  document.getElementById("againButton");

const controls=
  document.getElementById("controls");

const actionButton=
  document.getElementById("action");

const hud=
  document.getElementById("hud");

const worldName=
  document.getElementById("worldName");

const taskNumber=
  document.getElementById("taskNumber");

const message=
  document.getElementById("message");

const taskBox=
  document.getElementById("task");

const taskTitle=
  document.getElementById("taskTitle");

const taskDescription=
  document.getElementById("taskDescription");


/* =====================================================
   SIZE
   ===================================================== */

let W=innerWidth;
let H=innerHeight;

function resize(){

  W=innerWidth;
  H=innerHeight;

  canvas.width=W;
  canvas.height=H;

}

addEventListener("resize",resize);

resize();


/* =====================================================
   WORLDS
   ===================================================== */

const worlds=[

  {
    name:"FOREST",
    sky:"#71c8ed",
    ground:"#4c9b4f",
    task:"Find the glowing crystal in the forest.",
    object:"crystal"
  },

  {
    name:"DESERT",
    sky:"#f2c875",
    ground:"#d6a34b",
    task:"Find the ancient golden temple.",
    object:"temple"
  },

  {
    name:"SNOW",
    sky:"#bfe5f5",
    ground:"#eaf5fa",
    task:"Find the frozen blue crystal.",
    object:"ice"
  },

  {
    name:"VOLCANO",
    sky:"#ef704e",
    ground:"#5a3030",
    task:"Reach the glowing volcano rock.",
    object:"lava"
  }

];


let world=0;
let gameRunning=false;


/* =====================================================
   PLAYER
   ===================================================== */

let px=0;
let pz=0;
let angle=0;


/* =====================================================
   CONTROLS
   ===================================================== */

const keys={
  forward:false,
  back:false,
  left:false,
  right:false
};


function hold(id,key){

  const button=
    document.getElementById(id);

  button.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      keys[key]=true;
    }
  );

  button.addEventListener(
    "pointerup",
    e=>{
      e.preventDefault();
      keys[key]=false;
    }
  );

  button.addEventListener(
    "pointercancel",
    ()=>{
      keys[key]=false;
    }
  );

  button.addEventListener(
    "pointerleave",
    ()=>{
      keys[key]=false;
    }
  );

}


hold("up","forward");
hold("down","back");
hold("turnLeft","left");
hold("turnRight","right");


/* =====================================================
   KEYBOARD
   ===================================================== */

addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowUp")
      keys.forward=true;

    if(e.key==="ArrowDown")
      keys.back=true;

    if(e.key==="ArrowLeft")
      keys.left=true;

    if(e.key==="ArrowRight")
      keys.right=true;

  }
);


addEventListener(
  "keyup",
  e=>{

    if(e.key==="ArrowUp")
      keys.forward=false;

    if(e.key==="ArrowDown")
      keys.back=false;

    if(e.key==="ArrowLeft")
      keys.left=false;

    if(e.key==="ArrowRight")
      keys.right=false;

  }
);


/* =====================================================
   WORLD OBJECT
   ===================================================== */

let target={
  x:0,
  z:-30
};


function createTarget(){

  const side=
    18+Math.random()*22;

  target.x=
    (Math.random()<.5?-1:1)*side;

  target.z=
    -(25+Math.random()*35);

}


/* =====================================================
   DECORATION
   ===================================================== */

let decorations=[];


function makeDecorations(){

  decorations=[];

  for(let i=0;i<45;i++){

    const x=
      (Math.random()-.5)*120;

    const z=
      (Math.random()-.5)*120;

    decorations.push({
      x:x,
      z:z,
      size:.7+Math.random()*1.8,
      type:i%3
    });

  }

}


/* =====================================================
   TASK
   ===================================================== */

let taskDone=false;


function startWorld(){

  px=0;
  pz=10;
  angle=0;

  taskDone=false;

  createTarget();
  makeDecorations();

  worldName.textContent=
    worlds[world].name;

  taskNumber.textContent=
    world+1;

  taskTitle.textContent=
    worlds[world].name+
    " TASK";

  taskDescription.textContent=
    worlds[world].task;

  taskBox.style.display="block";

  setTimeout(()=>{
    taskBox.style.display="none";
  },3500);

}


/* =====================================================
   DISTANCE
   ===================================================== */

function distanceToTarget(){

  const dx=
    target.x-px;

  const dz=
    target.z-pz;

  return Math.sqrt(
    dx*dx+dz*dz
  );

}


/* =====================================================
   TASK BUTTON
   ===================================================== */

actionButton.addEventListener(
  "click",
  ()=>{

    if(distanceToTarget()<5){

      taskDone=true;

      showMessage(
        "TASK COMPLETE! Next world unlocked!"
      );

      setTimeout(
        nextWorld,
        1300
      );

    }else{

      showMessage(
        "You are too far away. Explore the world!"
      );

    }

  }
);


/* =====================================================
   NEXT WORLD
   ===================================================== */

function nextWorld(){

  if(world<worlds.length-1){

    world++;

    startWorld();

  }else{

    gameRunning=false;

    controls.style.display="none";
    actionButton.style.display="none";
    hud.style.display="none";

    winScreen.style.display="flex";

  }

}


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text){

  message.textContent=text;

  message.style.display="block";

  clearTimeout(window.msgTimer);

  window.msgTimer=
    setTimeout(
      ()=>{
        message.style.display="none";
      },
      1800
    );

}


/* =====================================================
   MOVEMENT
   ===================================================== */

function update(){

  if(!gameRunning)
    return;

  const speed=.12;

  if(keys.left)
    angle-=.045;

  if(keys.right)
    angle+=.045;


  let movement=0;

  if(keys.forward)
    movement+=1;

  if(keys.back)
    movement-=1;


  if(movement!==0){

    /*
      Forward always goes where the
      player is facing.
    */

    px+=
      Math.sin(angle)*
      speed*
      movement;

    pz+=
      Math.cos(angle)*
      speed*
      movement;

  }


  /* keep player inside world */

  px=Math.max(
    -55,
    Math.min(55,px)
  );

  pz=Math.max(
    -55,
    Math.min(55,pz)
  );


  if(distanceToTarget()<7){

    actionButton.style.display=
      "block";

  }else{

    actionButton.style.display=
      "none";

  }

}


/* =====================================================
   SIMPLE 3D PROJECTION
   ===================================================== */

function project(x,z){

  const dx=x-px;
  const dz=z-pz;

  const sin=Math.sin(angle);
  const cos=Math.cos(angle);

  const forward=
    dx*sin+dz*cos;

  const side=
    dx*cos-dz*sin;


  if(forward<=.2)
    return null;


  const scale=
    Math.min(
      900/forward,
      900
    );


  return {

    x:W/2+side*scale,

    y:H*.52,

    scale:scale,

    depth:forward

  };

}


/* =====================================================
   SKY
   ===================================================== */

function drawSky(){

  const w=
    worlds[world];

  ctx.fillStyle=
    w.sky;

  ctx.fillRect(
    0,
    0,
    W,
    H*.58
  );

}


/* =====================================================
   GROUND
   ===================================================== */

function drawGround(){

  const w=
    worlds[world];

  ctx.fillStyle=
    w.ground;

  ctx.fillRect(
    0,
    H*.58,
    W,
    H*.42
  );


  /* perspective ground lines */

  ctx.strokeStyle=
    "rgba(255,255,255,.08)";

  ctx.lineWidth=2;

  for(let i=1;i<12;i++){

    const y=
      H*.58+
      Math.pow(i/12,1.7)*H*.42;

    ctx.beginPath();

    ctx.moveTo(0,y);

    ctx.lineTo(W,y);

    ctx.stroke();

  }

}


/* =====================================================
   TREES / DECORATIONS
   ===================================================== */

function drawDecoration(d){

  const p=
    project(d.x,d.z);

  if(!p)
    return;


  if(p.x<-200||
     p.x>W+200)
    return;


  const s=
    Math.max(
      5,
      p.scale*d.size*.018
    );


  if(world===0){

    /* forest tree */

    ctx.fillStyle="#69452d";

    ctx.fillRect(
      p.x-s*.18,
      p.y-s*5,
      s*.36,
      s*5
    );

    ctx.fillStyle="#28733a";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y-s*6,
      s*2.2,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#3e9648";

    ctx.beginPath();

    ctx.arc(
      p.x-s,
      p.y-s*5.5,
      s*1.5,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  else if(world===1){

    /* desert cactus */

    ctx.fillStyle="#3e7d42";

    ctx.fillRect(
      p.x-s*.35,
      p.y-s*5,
      s*.7,
      s*5
    );

    ctx.fillRect(
      p.x-s*1.4,
      p.y-s*3.8,
      s,
      s*.7
    );

    ctx.fillRect(
      p.x+s*.4,
      p.y-s*3,
      s,
      s*.7
    );

  }

  else if(world===2){

    /* snow tree */

    ctx.fillStyle="#75553d";

    ctx.fillRect(
      p.x-s*.15,
      p.y-s*5,
      s*.3,
      s*5
    );

    ctx.fillStyle="#f8ffff";

    for(let i=0;i<3;i++){

      ctx.beginPath();

      ctx.moveTo(
        p.x,
        p.y-s*(8-i*1.8)
      );

      ctx.lineTo(
        p.x-s*(2.5-i*.4),
        p.y-s*(3+i)
      );

      ctx.lineTo(
        p.x+s*(2.5-i*.4),
        p.y-s*(3+i)
      );

      ctx.closePath();

      ctx.fill();

    }

  }

  else{

    /* volcano rocks */

    ctx.fillStyle="#4a2924";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y-s,
      s*2,
      Math.PI,
      0
    );

    ctx.fill();

  }

}


/* =====================================================
   TARGET
   ===================================================== */

function drawTarget(){

  const p=
    project(
      target.x,
      target.z
    );

  if(!p)
    return;

  const s=
    Math.max(
      10,
      p.scale*.04
    );


  if(world===0){

    /* glowing forest crystal */

    ctx.fillStyle=
      "#66ffff";

    ctx.shadowColor=
      "#66ffff";

    ctx.shadowBlur=
      25;

    ctx.beginPath();

    ctx.moveTo(
      p.x,
      p.y-s*4
    );

    ctx.lineTo(
      p.x+s,
      p.y
    );

    ctx.lineTo(
      p.x,
      p.y+s*2
    );

    ctx.lineTo(
      p.x-s,
      p.y
    );

    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur=0;

  }

  else if(world===1){

    /* temple */

    ctx.fillStyle="#f7c948";

    ctx.fillRect(
      p.x-s*2,
      p.y-s*3,
      s*4,
      s*3
    );

    ctx.beginPath();

    ctx.moveTo(
      p.x-s*3,
      p.y-s*3
    );

    ctx.lineTo(
      p.x,
      p.y-s*6
    );

    ctx.lineTo(
      p.x+s*3,
      p.y-s*3
    );

    ctx.closePath();

    ctx.fill();

  }

  else if(world===2){

    /* ice crystal */

    ctx.fillStyle="#83eaff";

    ctx.shadowColor="#83eaff";

    ctx.shadowBlur=25;

    ctx.beginPath();

    ctx.moveTo(
      p.x,
      p.y-s*6
    );

    ctx.lineTo(
      p.x+s*2,
      p.y
    );

    ctx.lineTo(
      p.x,
      p.y+s*2
    );

    ctx.lineTo(
      p.x-s*2,
      p.y
    );

    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur=0;

  }

  else{

    /* lava rock */

    ctx.fillStyle="#ff4b1f";

    ctx.shadowColor="#ff4b1f";

    ctx.shadowBlur=30;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y-s,
      s*2,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

  }

}


/* =====================================================
   DRAW WORLD
   ===================================================== */

function render(){

  if(!gameRunning)
    return;


  update();

  drawSky();

  drawGround();


  /* distant objects first */

  const sorted=
    decorations
      .slice()
      .sort(
        (a,b)=>{
          const da=
            (a.x-px)**2+
            (a.z-pz)**2;

          const db=
            (b.x-px)**2+
            (b.z-pz)**2;

          return db-da;
        }
      );


  sorted.forEach(
    drawDecoration
  );


  drawTarget();


  /* crosshair */

  ctx.strokeStyle=
    "rgba(255,255,255,.8)";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    W/2-8,
    H/2
  );

  ctx.lineTo(
    W/2+8,
    H/2
  );

  ctx.moveTo(
    W/2,
    H/2-8
  );

  ctx.lineTo(
    W/2,
    H/2+8
  );

  ctx.stroke();


  requestAnimationFrame(
    render
  );

}


/* =====================================================
   START
   ===================================================== */

startButton.addEventListener(
  "click",
  ()=>{

    world=0;

    gameRunning=true;

    startScreen.style.display="none";

    winScreen.style.display="none";

    hud.style.display="flex";

    controls.style.display="block";

    startWorld();

    render();

  }
);


/* =====================================================
   AGAIN
   ===================================================== */

againButton.addEventListener(
  "click",
  ()=>{

    world=0;

    gameRunning=true;

    winScreen.style.display="none";

    hud.style.display="flex";

    controls.style.display="block";

    startWorld();

    render();

  }
);

</script>

</body>
</html>
```
