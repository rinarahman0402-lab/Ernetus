<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mini World 3D</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.hidden {
  display: none !important;
}

/* START SCREEN */

#startScreen,
#completeScreen {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
  background: linear-gradient(
    #64c9ed,
    #4b9b55
  );
}

.panel {
  width: 100%;
  max-width: 520px;
  text-align: center;
  color: white;
}

.panel h1 {
  font-size: clamp(40px, 11vw, 72px);
  margin: 0 0 15px;
}

.panel p {
  font-size: 19px;
  line-height: 1.5;
}

.bigButton {
  position: static;
  min-width: 240px;
  min-height: 70px;
  margin-top: 20px;
  border: none;
  border-radius: 25px;
  background: #ffd447;
  color: #17351d;
  font-size: 22px;
  font-weight: bold;
}

/* HUD */

#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
}

.hudBox {
  background: rgba(7,28,18,.88);
  color: white;
  padding: 11px 15px;
  border-radius: 17px;
  font-weight: bold;
  font-size: 15px;
  border: 2px solid rgba(255,255,255,.25);
}

/* TASK */

#taskBox {
  position: fixed;
  top: 72px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;

  width: min(88vw, 430px);

  background: rgba(7,28,18,.92);
  color: white;

  border-radius: 18px;
  padding: 12px 18px;

  text-align: center;
  font-size: 17px;
  font-weight: bold;

  pointer-events: none;
}

#taskProgress {
  font-size: 13px;
  opacity: .8;
  margin-top: 5px;
}

/* CONTROLS */

#controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 15px;
  height: 225px;
  z-index: 30;
  pointer-events: none;
}

.control {
  position: absolute;

  min-width: 118px;
  min-height: 62px;

  border-radius: 22px;

  border: 3px solid rgba(255,255,255,.45);

  background: rgba(7,30,18,.9);

  color: white;

  font-size: 15px;
  font-weight: bold;

  pointer-events: auto;

  touch-action: manipulation;

  user-select: none;
}

.control:active {
  background: #3d9650;
  transform: scale(.94);
}

#forward {
  left: 50%;
  bottom: 145px;
  transform: translateX(-50%);
}

#back {
  left: 50%;
  bottom: 3px;
  transform: translateX(-50%);
}

#left {
  left: 12px;
  bottom: 74px;
}

#right {
  right: 12px;
  bottom: 74px;
}

#turnLeft {
  left: 12px;
  bottom: 3px;
}

#turnRight {
  right: 12px;
  bottom: 3px;
}

/* WORLD MESSAGE */

#worldMessage {
  position: fixed;
  left: 50%;
  bottom: 250px;
  transform: translateX(-50%);

  z-index: 25;

  background: rgba(0,0,0,.7);
  color: white;

  padding: 10px 17px;
  border-radius: 15px;

  text-align: center;
  font-weight: bold;

  max-width: 90vw;

  pointer-events: none;
}

/* LOADING */

#loading {
  position: fixed;
  inset: 0;
  z-index: 200;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #07150d;
  color: white;

  font-size: 22px;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="loading">
  Loading Mini World 3D...
</div>

<div id="game"></div>


<!-- START -->

<div id="startScreen" class="hidden">
  <div class="panel">

    <h1>🌍 Mini World</h1>

    <p>
      Explore different 3D worlds and complete tasks
      to unlock new biomes.
    </p>

    <p>
      Your next world is unlocked by adventure —
      not by pressing a level button.
    </p>

    <button id="playButton" class="bigButton">
      PLAY GAME
    </button>

  </div>
</div>


<!-- COMPLETE -->

<div id="completeScreen" class="hidden">
  <div class="panel">

    <h1>🏆 World Complete!</h1>

    <p id="completeText">
      You completed the world!
    </p>

    <button id="continueButton" class="bigButton">
      CONTINUE
    </button>

  </div>
</div>


<!-- HUD -->

<div id="hud" class="hidden">

  <div class="hudBox">
    WORLD:
    <span id="worldName">FOREST</span>
  </div>

  <div class="hudBox">
    TASKS:
    <span id="taskNumber">0</span> /
    <span id="taskTotal">5</span>
  </div>

</div>


<!-- TASK -->

<div id="taskBox" class="hidden">

  <div id="taskText">
    Task
  </div>

  <div id="taskProgress">
    0 / 1
  </div>

</div>


<!-- MESSAGE -->

<div id="worldMessage" class="hidden">
  Explore!
</div>


<!-- CONTROLS -->

<div id="controls" class="hidden">

  <button class="control" id="forward">
    MOVE<br>FORWARD
  </button>

  <button class="control" id="back">
    MOVE<br>BACK
  </button>

  <button class="control" id="left">
    MOVE<br>LEFT
  </button>

  <button class="control" id="right">
    MOVE<br>RIGHT
  </button>

  <button class="control" id="turnLeft">
    TURN<br>LEFT
  </button>

  <button class="control" id="turnRight">
    TURN<br>RIGHT
  </button>

</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.min.js"></script>


<script>

/* =========================================================
   MINI WORLD 3D
========================================================= */

let scene;
let camera;
let renderer;
let clock;

let player;

let started = false;

let currentWorld = 0;

let currentTask = 0;

let taskAmount = 0;

let taskTarget;

let taskObjects = [];

let worldObjects = [];

const WORLD_SIZE = 260;

const PLAYER_SPEED = 0.16;

const TURN_SPEED = 0.045;


/* =========================================================
   WORLDS
========================================================= */

const worlds = [

  {
    name: "FOREST",

    sky: 0x76cbea,

    ground: 0x3f913c,

    tasks: [

      {
        text: "Touch the glowing tree",
        type: "tree",
        amount: 1
      },

      {
        text: "Collect 3 red berries",
        type: "berries",
        amount: 3
      },

      {
        text: "Visit the forest pond",
        type: "pond",
        amount: 1
      },

      {
        text: "Find the golden stone",
        type: "gold",
        amount: 1
      },

      {
        text: "Reach the forest shrine",
        type: "shrine",
        amount: 1
      }

    ]
  },


  {
    name: "DESERT",

    sky: 0xe8b65c,

    ground: 0xd7a84c,

    tasks: [

      {
        text: "Find the giant cactus",
        type: "cactus",
        amount: 1
      },

      {
        text: "Collect 3 blue crystals",
        type: "crystals",
        amount: 3
      },

      {
        text: "Reach the desert oasis",
        type: "oasis",
        amount: 1
      },

      {
        text: "Find the ancient statue",
        type: "statue",
        amount: 1
      },

      {
        text: "Reach the desert temple",
        type: "temple",
        amount: 1
      }

    ]
  },


  {
    name: "SNOW",

    sky: 0x9bd8ed,

    ground: 0xe9f5ff,

    tasks: [

      {
        text: "Find the giant snow tree",
        type: "snowtree",
        amount: 1
      },

      {
        text: "Collect 3 ice crystals",
        type: "ice",
        amount: 3
      },

      {
        text: "Visit the frozen lake",
        type: "lake",
        amount: 1
      },

      {
        text: "Find the ice statue",
        type: "icestatue",
        amount: 1
      },

      {
        text: "Reach the snowy castle",
        type: "castle",
        amount: 1
      }

    ]
  },


  {
    name: "JUNGLE",

    sky: 0x65c8b0,

    ground: 0x267d39,

    tasks: [

      {
        text: "Find the giant jungle flower",
        type: "flower",
        amount: 1
      },

      {
        text: "Collect 3 jungle fruits",
        type: "fruit",
        amount: 3
      },

      {
        text: "Cross the jungle river",
        type: "river",
        amount: 1
      },

      {
        text: "Find the ancient ruins",
        type: "ruins",
        amount: 1
      },

      {
        text: "Reach the jungle temple",
        type: "jungleTemple",
        amount: 1
      }

    ]
  },


  {
    name: "SWAMP",

    sky: 0x6c927b,

    ground: 0x314d36,

    tasks: [

      {
        text: "Find the giant mushroom",
        type: "mushroom",
        amount: 1
      },

      {
        text: "Collect 3 swamp gems",
        type: "swampgem",
        amount: 3
      },

      {
        text: "Cross the swamp",
        type: "swampwater",
        amount: 1
      },

      {
        text: "Find the hidden hut",
        type: "hut",
        amount: 1
      },

      {
        text: "Reach the swamp crystal",
        type: "swampcrystal",
        amount: 1
      }

    ]
  }

];


/* =========================================================
   CONTROLS
========================================================= */

const keys = {

  forward: false,
  back: false,
  left: false,
  right: false,
  turnLeft: false,
  turnRight: false

};


/* =========================================================
   HTML
========================================================= */

const loading =
  document.getElementById("loading");

const startScreen =
  document.getElementById("startScreen");

const completeScreen =
  document.getElementById("completeScreen");

const hud =
  document.getElementById("hud");

const controls =
  document.getElementById("controls");

const taskBox =
  document.getElementById("taskBox");

const taskText =
  document.getElementById("taskText");

const taskProgress =
  document.getElementById("taskProgress");

const worldMessage =
  document.getElementById("worldMessage");

const worldName =
  document.getElementById("worldName");

const taskNumber =
  document.getElementById("taskNumber");

const taskTotal =
  document.getElementById("taskTotal");


/* =========================================================
   START
========================================================= */

document
.getElementById("playButton")
.addEventListener("click", startGame);


document
.getElementById("continueButton")
.addEventListener("click", continueWorld);


/* =========================================================
   START GAME
========================================================= */

function startGame() {

  started = true;

  startScreen.classList.add("hidden");

  hud.classList.remove("hidden");

  controls.classList.remove("hidden");

  taskBox.classList.remove("hidden");

  worldMessage.classList.remove("hidden");

  loadWorld(currentWorld);

}


/* =========================================================
   THREE.JS SETUP
========================================================= */

function setup3D() {

  scene =
    new THREE.Scene();

  camera =
    new THREE.PerspectiveCamera(

      70,

      window.innerWidth /
      window.innerHeight,

      0.1,

      500

    );


  renderer =
    new THREE.WebGLRenderer({

      antialias: true,

      powerPreference:
        "high-performance"

    });


  renderer.setSize(

    window.innerWidth,

    window.innerHeight

  );


  renderer.setPixelRatio(

    Math.min(
      window.devicePixelRatio,
      1.5
    )

  );


  renderer.shadowMap.enabled = true;

  renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


  document
    .getElementById("game")
    .appendChild(renderer.domElement);


  clock =
    new THREE.Clock();


  window.addEventListener(
    "resize",
    resize
  );


  animate();

}


/* =========================================================
   LIGHT
========================================================= */

function createLights() {

  const ambient =
    new THREE.HemisphereLight(

      0xffffff,

      0x304030,

      1.8

    );

  scene.add(ambient);


  const sun =
    new THREE.DirectionalLight(

      0xffffff,

      2.5

    );


  sun.position.set(

    60,
    100,
    40

  );


  sun.castShadow = true;


  sun.shadow.mapSize.width = 1024;

  sun.shadow.mapSize.height = 1024;


  scene.add(sun);

}


/* =========================================================
   GROUND
========================================================= */

function createGround(world) {

  const geometry =
    new THREE.PlaneGeometry(

      WORLD_SIZE,

      WORLD_SIZE,

      50,

      50

    );


  const material =
    new THREE.MeshStandardMaterial({

      color:
        world.ground,

      roughness: 1

    });


  const ground =
    new THREE.Mesh(

      geometry,

      material

    );


  ground.rotation.x =
    -Math.PI / 2;


  ground.receiveShadow = true;


  scene.add(ground);

  worldObjects.push(ground);

}


/* =========================================================
   TREE
========================================================= */

function createTree(
  x,
  z,
  giant = false
) {

  const group =
    new THREE.Group();


  const trunk =
    new THREE.Mesh(

      new THREE.CylinderGeometry(

        giant ? 1.6 : .7,

        giant ? 2 : 1,

        giant ? 12 : 6,

        10

      ),

      new THREE.MeshStandardMaterial({

        color: 0x70462c

      })

    );


  trunk.position.y =
    giant ? 6 : 3;


  trunk.castShadow = true;


  group.add(trunk);


  for (let i = 0; i < 4; i++) {

    const leaves =
      new THREE.Mesh(

        new THREE.SphereGeometry(

          giant ? 4 : 2.3,

          10,

          8

        ),

        new THREE.MeshStandardMaterial({

          color:
            giant
              ? 0x0e6c25
              : 0x217b2f

        })

      );


    leaves.position.set(

      THREE.MathUtils.randFloat(
        -1.5,
        1.5
      ),

      (giant ? 9 : 5) +
      i * 1.2,

      THREE.MathUtils.randFloat(
        -1.5,
        1.5
      )

    );


    leaves.castShadow = true;

    group.add(leaves);

  }


  group.position.set(
    x,
    0,
    z
  );


  scene.add(group);

  worldObjects.push(group);


  return group;

}


/* =========================================================
   ROCK
========================================================= */

function createRock(
  x,
  z,
  color = 0x687068
) {

  const rock =
    new THREE.Mesh(

      new THREE.DodecahedronGeometry(

        THREE.MathUtils.randFloat(
          .7,
          2
        )

      ),

      new THREE.MeshStandardMaterial({

        color: color,

        roughness: 1

      })

    );


  rock.position.set(

    x,

    .8,

    z

  );


  rock.castShadow = true;


  scene.add(rock);

  worldObjects.push(rock);

}


/* =========================================================
   WATER
========================================================= */

function createWater(
  x,
  z,
  size,
  color = 0x238fd1
) {

  const water =
    new THREE.Mesh(

      new THREE.CylinderGeometry(

        size,
        size,
        .25,
        32

      ),

      new THREE.MeshStandardMaterial({

        color: color,

        roughness: .15,

        metalness: .1

      })

    );


  water.position.set(

    x,

    .12,

    z

  );


  scene.add(water);

  worldObjects.push(water);

  return water;

}


/* =========================================================
   GLOWING OBJECT
========================================================= */

function createGlowObject(
  x,
  z,
  color,
  type,
  size = 1
) {

  const object =
    new THREE.Mesh(

      new THREE.SphereGeometry(

        size,

        16,

        12

      ),

      new THREE.MeshStandardMaterial({

        color: color,

        emissive: color,

        emissiveIntensity: .8

      })

    );


  object.position.set(

    x,

    size,

    z

  );


  object.userData.taskType =
    type;


  object.castShadow = true;


  scene.add(object);


  taskObjects.push(object);


  return object;

}


/* =========================================================
   CREATE RANDOM DECORATION
========================================================= */

function decorateWorld(world) {

  for (let i = 0; i < 70; i++) {

    const x =
      THREE.MathUtils.randFloatSpread(
        WORLD_SIZE - 20
      );

    const z =
      THREE.MathUtils.randFloatSpread(
        WORLD_SIZE - 20
      );


    if (
      Math.abs(x) < 15 &&
      Math.abs(z) < 15
    ) {
      continue;
    }


    if (
      world.name === "FOREST" ||
      world.name === "JUNGLE"
    ) {

      createTree(
        x,
        z,
        false
      );

    }

    else if (
      world.name === "DESERT"
    ) {

      createRock(
        x,
        z,
        0xb98a43
      );

    }

    else if (
      world.name === "SNOW"
    ) {

      createRock(
        x,
        z,
        0xbfd1d8
      );

    }

    else {

      createRock(
        x,
        z,
        0x3b4d40
      );

    }

  }

}


/* =========================================================
   SPECIAL OBJECTS
========================================================= */

function createTaskObject(
  type
) {

  let x =
    THREE.MathUtils.randFloat(
      -75,
      75
    );

  let z =
    THREE.MathUtils.randFloat(
      -75,
      75
    );


  /* Keep task away from spawn */

  while (
    Math.hypot(x,z) < 25
  ) {

    x =
      THREE.MathUtils.randFloat(
        -75,
        75
      );

    z =
      THREE.MathUtils.randFloat(
        -75,
        75
      );

  }


  let object;


  /* TREE */

  if (type === "tree") {

    object =
      createTree(
        x,
        z,
        true
      );

  }


  /* BERRIES */

  else if (type === "berries") {

    for (let i = 0; i < 3; i++) {

      object =
        createGlowObject(

          x + i * 2,

          z,

          0xff3048,

          "berries",

          .6

        );

    }

  }


  /* POND */

  else if (type === "pond") {

    object =
      createWater(
        x,
        z,
        7
      );

    object.userData.taskType =
      "pond";

    taskObjects.push(object);

  }


  /* GOLD */

  else if (type === "gold") {

    object =
      createGlowObject(

        x,
        z,

        0xffd21f,

        "gold",

        1.2

      );

  }


  /* SHRINE */

  else if (type === "shrine") {

    object =
      createShrine(
        x,
        z,
        0x9b59ff,
        "shrine"
      );

  }


  /* DESERT */

  else if (type === "cactus") {

    object =
      createCactus(
        x,
        z
      );

  }


  else if (type === "crystals") {

    for (let i = 0; i < 3; i++) {

      object =
        createGlowObject(

          x + i * 2,

          z,

          0x38bfff,

          "crystals",

          .7

        );

    }

  }


  else if (type === "oasis") {

    object =
      createWater(
        x,
        z,
        8,
        0x29c7e8
      );

    object.userData.taskType =
      "oasis";

    taskObjects.push(object);

  }


  else if (type === "statue") {

    object =
      createStatue(
        x,
        z,
        0xb58b50,
        "statue"
      );

  }


  else if (type === "temple") {

    object =
      createTemple(
        x,
        z,
        0xc68c38,
        "temple"
      );

  }


  /* SNOW */

  else if (type === "snowtree") {

    object =
      createTree(
        x,
        z,
        true
      );

    object.scale.set(
      1,
      1,
      1
    );

  }


  else if (type === "ice") {

    for (let i = 0; i < 3; i++) {

      object =
        createGlowObject(

          x + i * 2,

          z,

          0x8eeaff,

          "ice",

          .8

        );

    }

  }


  else if (type === "lake") {

    object =
      createWater(
        x,
        z,
        9,
        0x7ed8ff
      );

    object.userData.taskType =
      "lake";

    taskObjects.push(object);

  }


  else if (type === "icestatue") {

    object =
      createStatue(
        x,
        z,
        0xa9eaff,
        "icestatue"
      );

  }


  else if (type === "castle") {

    object =
      createTemple(
