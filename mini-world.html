
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mini World</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#74c8ef;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#start,#levelComplete{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:25px;
  color:white;
}

#start{
  background:linear-gradient(
    #65c5ed 0%,
    #83d06b 55%,
    #39733b 100%
  );
}

#levelComplete{
  display:none;
  background:#163b20dd;
}

.title{
  font-size:clamp(42px,11vw,75px);
  font-weight:900;
  text-shadow:4px 4px 0 #20502b;
}

.subtitle{
  max-width:650px;
  font-size:18px;
  line-height:1.5;
}

.bigButton{
  margin-top:22px;
  border:0;
  border-radius:20px;
  padding:18px 32px;
  background:#ffd447;
  color:#17351d;
  font-size:20px;
  font-weight:900;
}

.bigButton:active{
  transform:scale(.94);
}

#hud{
  display:none;
  position:fixed;
  z-index:20;
  top:9px;
  left:9px;
  right:9px;
  justify-content:space-between;
  gap:7px;
  pointer-events:none;
}

.info{
  background:#102016dd;
  color:white;
  border-radius:14px;
  padding:9px 12px;
  font-size:12px;
  font-weight:bold;
}

#taskBox{
  position:fixed;
  z-index:20;
  top:58px;
  right:9px;
  width:190px;
  background:#102016dd;
  color:white;
  border-radius:16px;
  padding:12px;
  font-size:12px;
}

#taskBox h3{
  margin:0 0 8px;
  font-size:15px;
}

.task{
  margin:7px 0;
}

#controls{
  display:none;
  position:fixed;
  z-index:25;
  left:10px;
  bottom:10px;
  width:285px;
  height:185px;
}

.moveButton{
  position:absolute;
  width:88px;
  height:58px;
  border:2px solid #ffffff77;
  border-radius:17px;
  background:#102016dd;
  color:white;
  font-size:11px;
  font-weight:900;
}

.moveButton:active{
  background:#3c8b43;
  transform:scale(.93);
}

#up{
  left:98px;
  top:0;
}

#down{
  left:98px;
  bottom:0;
}

#left{
  left:0;
  top:63px;
}

#right{
  right:0;
  top:63px;
}

.actionButton{
  position:fixed;
  z-index:25;
  right:14px;
  bottom:30px;
  width:125px;
  min-height:58px;
  border:0;
  border-radius:18px;
  background:#ffd447;
  color:#17351d;
  font-size:12px;
  font-weight:900;
}

#message{
  display:none;
  position:fixed;
  z-index:40;
  left:50%;
  top:78px;
  transform:translateX(-50%);
  background:#102016ee;
  color:white;
  padding:12px 18px;
  border-radius:15px;
  font-weight:bold;
  text-align:center;
}

#levelButton{
  margin-top:15px;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>


<!-- START -->

<div id="start">

  <div style="font-size:90px">🌎</div>

  <div class="title">
    MINI WORLD
  </div>

  <p class="subtitle">
    Explore a giant miniature world, complete tasks,
    discover new biomes and unlock new areas.
  </p>

  <p>
    🌳 Forest &nbsp; 🏜️ Desert &nbsp; ❄️ Snow &nbsp; 🌊 Coast
  </p>

  <button class="bigButton" id="playButton">
    PLAY GAME
  </button>

</div>


<!-- HUD -->

<div id="hud">

  <div class="info">
    LEVEL:
    <span id="level">1</span>
  </div>

  <div class="info">
    TASK:
    <span id="taskProgress">0 / 1</span>
  </div>

  <div class="info">
    COINS:
    <span id="coins">0</span>
  </div>

</div>


<!-- TASKS -->

<div id="taskBox">

  <h3>🌟 CURRENT TASK</h3>

  <div id="taskText">
    Find the forest crystal.
  </div>

</div>


<!-- CONTROLS -->

<div id="controls">

  <button class="moveButton" id="up">
    MOVE FORWARD
  </button>

  <button class="moveButton" id="down">
    MOVE BACK
  </button>

  <button class="moveButton" id="left">
    TURN LEFT
  </button>

  <button class="moveButton" id="right">
    TURN RIGHT
  </button>

</div>


<button
  class="actionButton"
  id="actionButton">
  INTERACT
</button>


<div id="message"></div>


<!-- LEVEL COMPLETE -->

<div id="levelComplete">

  <div style="font-size:80px">⭐</div>

  <div class="title">
    LEVEL COMPLETE!
  </div>

  <p id="nextText" class="subtitle"></p>

  <button
    class="bigButton"
    id="nextButton">
    NEXT WORLD
  </button>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas=
  document.getElementById("canvas");

const ctx=
  canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

  W=innerWidth;
  H=innerHeight;

  const dpr=
    Math.min(
      devicePixelRatio || 1,
      2
    );

  canvas.width=W*dpr;
  canvas.height=H*dpr;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );
}

resize();

addEventListener(
  "resize",
  resize
);


/* =====================================================
   GAME STATE
===================================================== */

let playing=false;

let level=1;

let coins=0;

let taskDone=false;

let currentBiome="forest";

let player={
  x:0,
  z:35,
  angle:0
};

const controls={
  forward:false,
  back:false,
  left:false,
  right:false
};

let objects=[];


/* =====================================================
   BIOMES
===================================================== */

const biomes=[

  {
    name:"forest",
    title:"🌳 Forest",
    sky:"#75cbed",
    ground:"#55a947"
  },

  {
    name:"desert",
    title:"🏜️ Desert",
    sky:"#f4c979",
    ground:"#d7a54c"
  },

  {
    name:"snow",
    title:"❄️ Snow",
    sky:"#a8d9ef",
    ground:"#e7eef2"
  },

  {
    name:"coast",
    title:"🌊 Coast",
    sky:"#6bc7e7",
    ground:"#d9c57b"
  }

];


/* =====================================================
   TASKS
===================================================== */

const tasks=[

  {
    text:"Find the forest crystal.",
    object:"crystal"
  },

  {
    text:"Find the hidden mushroom.",
    object:"mushroom"
  },

  {
    text:"Reach the giant tree.",
    object:"giantTree"
  },

  {
    text:"Find the golden flower.",
    object:"flower"
  },

  {
    text:"Discover the tiny waterfall.",
    object:"waterfall"
  },

  {
    text:"Find the hidden cave.",
    object:"cave"
  },

  {
    text:"Reach the mountain stone.",
    object:"stone"
  },

  {
    text:"Find the treasure chest.",
    object:"chest"
  }

];

let taskIndex=0;


/* =====================================================
   CREATE WORLD
===================================================== */

function createWorld(){

  objects=[];

  taskDone=false;

  const task=
    tasks[taskIndex % tasks.length];


  /*
    Main task object is placed
    somewhere in the world.
  */

  objects.push({

    type:task.object,

    x:random(-70,70),

    z:random(-100,-20),

    found:false

  });


  /*
    Trees / rocks / plants
  */

  for(let i=0;i<60;i++){

    objects.push({

      type:
        currentBiome==="forest"
        ? "tree"
        : currentBiome==="desert"
        ? "cactus"
        : currentBiome==="snow"
        ? "pine"
        : "palm",

      x:random(-100,100),

      z:random(-110,80),

      size:random(.7,1.5)

    });

  }


  /*
    Small rocks
  */

  for(let i=0;i<35;i++){

    objects.push({

      type:"rock",

      x:random(-100,100),

      z:random(-110,80),

      size:random(.4,.9)

    });

  }


  player.x=0;
  player.z=35;
  player.angle=0;


  updateTaskUI();

}


/* =====================================================
   RANDOM
===================================================== */

function random(a,b){

  return a+
    Math.random()*(b-a);

}


/* =====================================================
   PROJECTION
===================================================== */

function project(
  x,
  z,
  size
){

  const dx=
    x-player.x;

  const dz=
    z-player.z;


  const sin=
    Math.sin(player.angle);

  const cos=
    Math.cos(player.angle);


  const forward=
    -dx*sin+
    -dz*cos;


  const side=
    dx*cos+
    -dz*sin;


  if(forward<=1)
    return null;


  const scale=
    440/forward;


  return {

    x:
      W/2+
      side*scale,

    y:
      H*.49+
      135*scale,

    size:
      Math.max(
        2,
        size*scale
      ),

    depth:forward

  };

}


/* =====================================================
   DRAW GROUND
===================================================== */

function drawGround(){

  const biome=
    biomes.find(
      b=>b.name===currentBiome
    );


  const gradient=
    ctx.createLinearGradient(
      0,0,
      0,H
    );


  gradient.addColorStop(
    0,
    biome.sky
  );


  gradient.addColorStop(
    .5,
    biome.ground
  );


  gradient.addColorStop(
    1,
    biome.ground
  );


  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,0,W,H
  );


  /*
    Perspective ground lines
  */

  ctx.strokeStyle=
    "#ffffff22";

  for(let i=0;i<13;i++){

    const y=
      H*.52+
      i*i*8;

    ctx.beginPath();

    ctx.moveTo(
      0,y
    );

    ctx.lineTo(
      W,y
    );

    ctx.stroke();

  }

}


/* =====================================================
   DRAW TREE
===================================================== */

function drawTree(o){

  const p=
    project(
      o.x,
      o.z,
      o.size
    );

  if(!p)
    return;


  let trunk="#6c401d";
  let leaves="#27853a";


  if(o.type==="pine"){

    leaves="#397c52";

  }

  if(o.type==="palm"){

    leaves="#298c48";

  }


  ctx.fillStyle=trunk;

  ctx.fillRect(

    p.x-p.size*.16,

    p.y-p.size*2.4,

    p.size*.32,

    p.size*2.4

  );


  ctx.fillStyle=leaves;


  if(
    o.type==="palm"
  ){

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y-p.size*2.6,
      p.size*.9,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  else{

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y-p.size*2.6,
      p.size*1.15,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
      p.x-p.size*.55,
      p.y-p.size*2.9,
      p.size*.8,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =====================================================
   DRAW CACTUS
===================================================== */

function drawCactus(o){

  const p=
    project(
      o.x,
      o.z,
      o.size
    );

  if(!p)
    return;


  ctx.strokeStyle="#2d8138";

  ctx.lineWidth=
    Math.max(
      2,
      p.size*.25
    );

  ctx.lineCap="round";


  ctx.beginPath();

  ctx.moveTo(
    p.x,
    p.y
  );

  ctx.lineTo(
    p.x,
    p.y-p.size*2
  );

  ctx.moveTo(
    p.x,
    p.y-p.size
  );

  ctx.lineTo(
    p.x-p.size*.7,
    p.y-p.size*1.3
  );

  ctx.stroke();

}


/* =====================================================
   DRAW ROCK
===================================================== */

function drawRock(o){

  const p=
    project(
      o.x,
      o.z,
      o.size
    );

  if(!p)
    return;


  ctx.fillStyle="#777b70";

  ctx.beginPath();

  ctx.ellipse(
    p.x,
    p.y,
    p.size,
    p.size*.55,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

}


/* =====================================================
   DRAW SPECIAL OBJECT
===================================================== */

function drawSpecial(o){

  const p=
    project(
      o.x,
      o.z,
      1.3
    );

  if(!p)
    return;


  const s=
    Math.max(
      7,
      Math.min(
        55,
        p.size
      )
    );


  ctx.save();

  ctx.translate(
    p.x,
    p.y
  );


  if(o.type==="crystal"){

    ctx.fillStyle="#61efff";

    ctx.beginPath();

    ctx.moveTo(
      0,-s*1.5
    );

    ctx.lineTo(
      s*.8,0
    );

    ctx.lineTo(
      0,s
    );

    ctx.lineTo(
      -s*.8,0
    );

    ctx.closePath();

    ctx.fill();

  }


  if(o.type==="mushroom"){

    ctx.fillStyle="#fff1d0";

    ctx.fillRect(
      -s*.15,
      0,
      s*.3,
      s
    );

    ctx.fillStyle="#d94b45";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      s,
      Math.PI,
      Math.PI*2
    );

    ctx.fill();

  }


  if(o.type==="giantTree"){

    ctx.fillStyle="#633b1c";

    ctx.fillRect(
      -s*.35,
      -s*2.5,
      s*.7,
      s*2.5
    );

    ctx.fillStyle="#1c7333";

    ctx.beginPath();

    ctx.arc(
      0,
      -s*2.8,
      s*1.8,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  if(o.type==="flower"){

    ctx.strokeStyle="#39833d";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(
      0,s
    );

    ctx.lineTo(
      0,-s
    );

    ctx.stroke();

    ctx.fillStyle="#ffd83d";

    ctx.beginPath();

    ctx.arc(
      0,
      -s,
      s*.45,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  if(o.type==="waterfall"){

    ctx.fillStyle="#58bfe8";

    ctx.fillRect(
      -s*.7,
      -s*2,
      s*1.4,
      s*2
    );

    ctx.fillStyle="#6f7775";

    ctx.fillRect(
      -s,
      -s*2.2,
      s*2,
      s*.35
    );

  }


  if(o.type==="cave"){

    ctx.fillStyle="#303530";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      s*1.2,
      Math.PI,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#080b09";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      s*.7,
      Math.PI,
      Math.PI*2
    );

    ctx.fill();

  }


  if(o.type==="stone"){

    ctx.fillStyle="#aaa9a1";

    ctx.beginPath();

    ctx.moveTo(
      -s,
      s
    );

    ctx.lineTo(
      -s*.6,
      -s
    );

    ctx.lineTo(
      s*.6,
      -s*1.3
    );

    ctx.lineTo(
      s,
      s
    );

    ctx.closePath();

    ctx.fill();

  }


  if(o.type==="chest"){

    ctx.fillStyle="#8b541f";

    ctx.fillRect(
      -s,
      -s*.5,
      s*2,
      s
    );

    ctx.fillStyle="#ffd447";

    ctx.fillRect(
      -s*.12,
      -s*.5,
      s*.24,
      s
    );

  }


  ctx.restore();

}


/* =====================================================
   PLAYER
===================================================== */

function drawPlayer(){

  const x=W/2;
  const y=H*.66;


  ctx.save();

  ctx.translate(
    x,y
  );


  /*
    Small 3D-looking character
  */

  ctx.fillStyle="#4b7fd1";

  ctx.beginPath();

  ctx.ellipse(
    0,
    15,
    18,
    25,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#f2c59b";

  ctx.beginPath();

  ctx.arc(
    0,
    -20,
    17,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#3c291d";

  ctx.beginPath();

  ctx.arc(
    0,
    -28,
    18,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();


  ctx.strokeStyle="#273f75";

  ctx.lineWidth=6;

  ctx.beginPath();

  ctx.moveTo(
    -10,
    35
  );

  ctx.lineTo(
    -17,
    55
  );

  ctx.moveTo(
    10,
    35
  );

  ctx.lineTo(
    17,
    55
  );

  ctx.stroke();


  ctx.restore();

}


/* =====================================================
   DRAW WORLD
===================================================== */

function drawWorld(){

  drawGround();


  const visible=[];


  for(
    const o of objects
  ){

    const dx=
      o.x-player.x;

    const dz=
      o.z-player.z;


    const depth=
      Math.hypot(
        dx,dz
      );


    visible.push({
      object:o,
      depth:depth
    });

  }


  /*
    Far objects first.
    This makes the objects overlap
    like a perspective world.
  */

  visible.sort(
    (a,b)=>
      b.depth-a.depth
  );


  for(
    const item of visible
  ){

    const o=
      item.object;


    if(
      o.type==="tree" ||
      o.type==="pine" ||
      o.type==="palm"
    ){

      drawTree(o);

    }

    else if(
      o.type==="cactus"
    ){

      drawCactus(o);

    }

    else if(
      o.type==="rock"
    ){

      drawRock(o);

    }

    else{

      if(!o.found)
        drawSpecial(o);

    }

  }


  drawPlayer();

}


/* =====================================================
   UPDATE PLAYER
===================================================== */

function updatePlayer(dt){

  const speed=
    10*dt;

  const turn=
    2.4*dt;


  /*
    LEFT REALLY TURNS LEFT
  */

  if(controls.left){

    player.angle-=turn;

  }


  /*
    RIGHT REALLY TURNS RIGHT
  */

  if(controls.right){

    player.angle+=turn;

  }


  if(controls.forward){

    player.x +=
      Math.sin(player.angle)*
      speed;

    player.z +=
      -Math.cos(player.angle)*
      speed;

  }


  if(controls.back){

    player.x -=
      Math.sin(player.angle)*
      speed;

    player.z -=
      -Math.cos(player.angle)*
      speed;

  }


  player.x=
    Math.max(
      -100,
      Math.min(
        100,
        player.x
      )
    );


  player.z=
    Math.max(
      -110,
      Math.min(
        90,
        player.z
      )
    );

}


/* =====================================================
   INTERACTION
===================================================== */

document
.getElementById("actionButton")
.addEventListener(
  "click",
  function(){

    if(!playing)
      return;


    const taskObject=
      objects.find(
        o=>
          !o.found &&
          o.type===
          tasks[
            taskIndex %
            tasks.length
          ].object
      );


    if(!taskObject)
      return;


    const distance=
      Math.hypot(
        taskObject.x-player.x,
        taskObject.z-player.z
      );


    if(distance>9){

      showMessage(
        "Move closer to the task object!"
      );

      return;

    }


    taskObject.found=true;

    taskDone=true;

    coins+=25;


    updateTaskUI();


    showMessage(
      "Task complete! +25 coins"
    );


    setTimeout(
      completeLevel,
      500
    );

  }
);


/* =====================================================
   LEVEL COMPLETE
===================================================== */

function completeLevel(){

  playing=false;


  document.getElementById(
    "levelComplete"
  ).style.display="flex";


  const nextBiome=
    biomes[
      level % biomes.length
    ];


  document.getElementById(
    "nextText"
  ).textContent=
    "You finished Level "+
    level+
    ". Next you can explore "+
    nextBiome.title+"!";

}


/* =====================================================
   NEXT WORLD
===================================================== */

document
.getElementById("nextButton")
.addEventListener(
  "click",
  function(){

    level++;

    taskIndex++;

    currentBiome=
      biomes[
        (level-1) %
        biomes.length
      ].name;


    document.getElementById(
      "levelComplete"
    ).style.display="none";


    createWorld();

    playing=true;


    updateHUD();


    showMessage(
      "Welcome to "+
      biomes[
        (level-1) %
        biomes.length
      ].title
    );

  }
);


/* =====================================================
   TASK UI
===================================================== */

function updateTaskUI(){

  const task=
    tasks[
      taskIndex %
      tasks.length
    ];


  document.getElementById(
    "taskText"
  ).textContent=
    task.text;


  document.getElementById(
    "taskProgress"
  ).textContent=
    taskDone
    ? "1 / 1"
    : "0 / 1";

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  document.getElementById(
    "level"
  ).textContent=
    level;


  document.getElementById(
    "coins"
  ).textContent=
    coins;


  updateTaskUI();

}


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer=null;


function showMessage(text){

  const box=
    document.getElementById(
      "message"
    );


  box.textContent=text;

  box.style.display="block";
