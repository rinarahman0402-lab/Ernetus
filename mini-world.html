<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>Mini World 3D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#65c8ea;
  touch-action:none;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#start,#complete{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  background:linear-gradient(#55c6ea,#4d9848);
  padding:25px;
}

#complete{
  display:none;
}

#start h1,#complete h1{
  font-size:clamp(38px,9vw,68px);
  margin:8px;
}

#start p,#complete p{
  max-width:600px;
  font-size:18px;
  line-height:1.5;
}

.bigButton{
  border:0;
  border-radius:18px;
  padding:17px 32px;
  font-size:21px;
  font-weight:bold;
  background:#f4d35e;
  color:#173b1b;
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  z-index:5;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.panel{
  background:#000b;
  color:white;
  padding:9px 13px;
  border-radius:14px;
  font-weight:bold;
}

#task{
  position:fixed;
  top:58px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  color:white;
  background:#000b;
  padding:10px 15px;
  border-radius:15px;
  font-weight:bold;
  text-align:center;
  max-width:90%;
  pointer-events:none;
}

#controls{
  position:fixed;
  left:12px;
  bottom:13px;
  width:230px;
  height:165px;
  z-index:10;
}

.moveButton{
  position:absolute;
  width:75px;
  height:55px;
  border:2px solid #ffffff88;
  border-radius:16px;
  background:#17251ddd;
  color:white;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;

  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  touch-action:none;
}

.moveButton:active{
  transform:scale(.94);
  background:#4d8c4e;
}

#forward{
  left:78px;
  top:0;
}

#back{
  left:78px;
  bottom:0;
}

#left{
  left:0;
  top:55px;
}

#right{
  right:0;
  top:55px;
}

#action{
  position:fixed;
  right:15px;
  bottom:20px;
  z-index:10;
  display:none;

  border:0;
  border-radius:18px;
  padding:18px 22px;
  background:#f4d35e;
  color:#173b1b;
  font-size:17px;
  font-weight:bold;

  -webkit-user-select:none;
  user-select:none;
  touch-action:none;
}

#message{
  position:fixed;
  left:50%;
  bottom:100px;
  transform:translateX(-50%);
  z-index:12;
  display:none;
  background:#000d;
  color:white;
  padding:11px 17px;
  border-radius:16px;
  font-weight:bold;
  text-align:center;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js"
  }
}
</script>

</head>

<body>

<div id="start">

  <div style="font-size:80px">🌎</div>

  <h1>Mini World 3D</h1>

  <p>
    Explore five different 3D worlds.
    Complete the task in each world to unlock the next one.
    You cannot simply skip to another world.
  </p>

  <button class="bigButton" id="startButton">
    START ADVENTURE
  </button>

</div>


<div id="complete">

  <div style="font-size:80px">🏆</div>

  <h1>MINI WORLD COMPLETE!</h1>

  <p>
    You completed all five worlds and every task!
  </p>

  <button class="bigButton" id="againButton">
    PLAY AGAIN
  </button>

</div>


<div id="hud">

  <div class="panel">
    MINI WORLD 3D
  </div>

  <div class="panel">
    WORLD <span id="worldNumber">1</span> / 5
  </div>

</div>


<div id="task">
  Find the glowing crystal.
</div>


<div id="controls">

  <button class="moveButton" id="forward">
    FORWARD
  </button>

  <button class="moveButton" id="back">
    BACK
  </button>

  <button class="moveButton" id="left">
    TURN LEFT
  </button>

  <button class="moveButton" id="right">
    TURN RIGHT
  </button>

</div>


<button id="action">
  COMPLETE TASK
</button>


<div id="message"></div>


<script type="module">

import * as THREE from "three";


/* =========================
   BASIC VARIABLES
========================= */

const startScreen=
document.getElementById("start");

const completeScreen=
document.getElementById("complete");

const startButton=
document.getElementById("startButton");

const againButton=
document.getElementById("againButton");

const worldNumber=
document.getElementById("worldNumber");

const taskText=
document.getElementById("task");

const actionButton=
document.getElementById("action");

const message=
document.getElementById("message");


let scene;
let camera;
let renderer;
let clock;

let player;

let running=false;

let currentWorld=1;

let taskObject;

let taskReady=false;


/* =========================
   INPUT
========================= */

const input={
  forward:false,
  back:false,
  left:false,
  right:false
};


function setupHoldButton(id,key){

  const button=
  document.getElementById(id);


  function press(event){

    event.preventDefault();

    input[key]=true;

  }


  function release(event){

    event.preventDefault();

    input[key]=false;

  }


  button.addEventListener(
    "pointerdown",
    press
  );


  button.addEventListener(
    "pointerup",
    release
  );


  button.addEventListener(
    "pointercancel",
    release
  );


  button.addEventListener(
    "pointerleave",
    release
  );

}


setupHoldButton(
  "forward",
  "forward"
);

setupHoldButton(
  "back",
  "back"
);

setupHoldButton(
  "left",
  "left"
);

setupHoldButton(
  "right",
  "right"
);


/* Keyboard controls also work on computers. */

window.addEventListener(
  "keydown",
  event=>{

    if(event.key==="ArrowUp")
      input.forward=true;

    if(event.key==="ArrowDown")
      input.back=true;

    if(event.key==="ArrowLeft")
      input.left=true;

    if(event.key==="ArrowRight")
      input.right=true;

  }
);


window.addEventListener(
  "keyup",
  event=>{

    if(event.key==="ArrowUp")
      input.forward=false;

    if(event.key==="ArrowDown")
      input.back=false;

    if(event.key==="ArrowLeft")
      input.left=false;

    if(event.key==="ArrowRight")
      input.right=false;

  }
);


/* =========================
   WORLDS
========================= */

const worlds=[

  {
    name:"Meadow",
    sky:0x65c8ea,
    ground:0x5ba34b,
    task:"Find the glowing crystal."
  },

  {
    name:"Forest",
    sky:0x72b9d2,
    ground:0x326d38,
    task:"Find the ancient tree."
  },

  {
    name:"Desert",
    sky:0xe7c37c,
    ground:0xd3a24d,
    task:"Find the desert shrine."
  },

  {
    name:"Snow Valley",
    sky:0xa8d9ed,
    ground:0xe8eeee,
    task:"Find the frozen beacon."
  },

  {
    name:"Island",
    sky:0x58c9e8,
    ground:0xd6bd6c,
    task:"Find the treasure chest."
  }

];


/* =========================
   MESSAGE
========================= */

function showMessage(text){

  message.textContent=text;

  message.style.display=
    "block";

  clearTimeout(
    showMessage.timer
  );

  showMessage.timer=
    setTimeout(
      ()=>{
        message.style.display=
          "none";
      },
      1800
    );

}


/* =========================
   CREATE SCENE
========================= */

function createScene(){

  scene=
    new THREE.Scene();


  scene.background=
    new THREE.Color(
      worlds[currentWorld-1].sky
    );


  scene.fog=
    new THREE.Fog(
      worlds[currentWorld-1].sky,
      25,
      170
    );


  camera=
    new THREE.PerspectiveCamera(
      72,
      innerWidth/innerHeight,
      0.1,
      250
    );


  renderer=
    new THREE.WebGLRenderer({
      antialias:true
    });


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      1.5
    )
  );


  renderer.setSize(
    innerWidth,
    innerHeight
  );


  renderer.shadowMap.enabled=true;


  document.body.appendChild(
    renderer.domElement
  );


  /* Lighting */

  const skyLight=
    new THREE.HemisphereLight(
      0xffffff,
      0x35552e,
      2.3
    );

  scene.add(skyLight);


  const sun=
    new THREE.DirectionalLight(
      0xffffff,
      2.8
    );

  sun.position.set(
    30,
    60,
    20
  );

  sun.castShadow=true;

  scene.add(sun);


  /* Ground */

  const ground=
    new THREE.Mesh(

      new THREE.PlaneGeometry(
        500,
        500
      ),

      new THREE.MeshStandardMaterial({
        color:
          worlds[currentWorld-1].ground
      })

    );


  ground.rotation.x=
    -Math.PI/2;


  ground.receiveShadow=true;


  scene.add(ground);


  /* Player */

  player=
    new THREE.Group();


  player.position.set(
    0,
    1.2,
    0
  );


  scene.add(player);


  /*
    Camera is actually inside the
    3D world at the player's position.
  */

  camera.position.set(
    0,
    0,
    0
  );


  player.add(camera);


  createPlayerArms();


  createWorld();


}


/* =========================
   PLAYER ARMS
========================= */

function createPlayerArms(){

  const material=
    new THREE.MeshStandardMaterial({
      color:0x4c9b43
    });


  const leftArm=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .08,
        .12,
        1.2,
        8
      ),
      material
    );


  leftArm.rotation.z=
    -.8;

  leftArm.position.set(
    -.5,
    -.35,
    -.7
  );


  camera.add(leftArm);


  const rightArm=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .08,
        .12,
        1.2,
        8
      ),
      material
    );


  rightArm.rotation.z=
    .8;

  rightArm.position.set(
    .5,
    -.35,
    -.7
  );


  camera.add(rightArm);

}


/* =========================
   TREE
========================= */

function makeTree(
  x,
  z,
  scale=1
){

  const tree=
    new THREE.Group();


  const trunk=
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        .25*scale,
        .35*scale,
        3*scale,
        8
      ),

      new THREE.MeshStandardMaterial({
        color:0x68452b
      })

    );


  trunk.position.y=
    1.5*scale;


  trunk.castShadow=true;

  tree.add(trunk);


  const leaves=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        1.4*scale,
        12,
        10
      ),

      new THREE.MeshStandardMaterial({
        color:
          worlds[currentWorld-1].name===
          "Snow Valley"
          ?0x376f49
          :0x28783b
      })

    );


  leaves.position.y=
    3.1*scale;


  leaves.castShadow=true;

  tree.add(leaves);


  tree.position.set(
    x,
    0,
    z
  );


  scene.add(tree);

}


/* =========================
   ROCK
========================= */

function makeRock(x,z){

  const rock=
    new THREE.Mesh(

      new THREE.DodecahedronGeometry(
        .8+Math.random()*.6,
        0
      ),

      new THREE.MeshStandardMaterial({
        color:0x737b73
      })

    );


  rock.position.set(
    x,
    .45,
    z
  );


  rock.castShadow=true;

  scene.add(rock);

}


/* =========================
   SPECIAL TASK OBJECT
========================= */

function createTaskObject(){

  const world=
    worlds[currentWorld-1];


  taskObject=
    new THREE.Group();


  if(world.name==="Meadow"){

    const crystal=
      new THREE.Mesh(

        new THREE.OctahedronGeometry(
          1.3
        ),

        new THREE.MeshStandardMaterial({
          color:0x7ff6ff,
          emissive:0x2288aa,
          emissiveIntensity:1
        })

      );


    crystal.position.y=
      1.3;

    taskObject.add(crystal);

  }


  if(world.name==="Forest"){

    const trunk=
      new THREE.Mesh(

        new THREE.CylinderGeometry(
          1.1,
          1.4,
          6,
          10
        ),

        new THREE.MeshStandardMaterial({
          color:0x55351f
        })

      );


    trunk.position.y=3;

    taskObject.add(trunk);


    const leaves=
      new THREE.Mesh(

        new THREE.SphereGeometry(
          3,
          12,
          10
        ),

        new THREE.MeshStandardMaterial({
          color:0x175b2d
        })

      );


    leaves.position.y=6;

    taskObject.add(leaves);

  }


  if(world.name==="Desert"){

    const base=
      new THREE.Mesh(

        new THREE.BoxGeometry(
          3,
          2,
          3
        ),

        new THREE.MeshStandardMaterial({
          color:0x9a6934
        })

      );


    base.position.y=1;

    taskObject.add(base);


    const roof=
      new THREE.Mesh(

        new THREE.ConeGeometry(
          2.5,
          1.5,
          4
        ),

        new THREE.MeshStandardMaterial({
          color:0xe1c277
        })

      );


    roof.position.y=2.75;

    taskObject.add(roof);

  }


  if(world.name==="Snow Valley"){

    const beacon=
      new THREE.Mesh(

        new THREE.CylinderGeometry(
          .5,
          .7,
          4,
          10
        ),

        new THREE.MeshStandardMaterial({
          color:0xd9ffff,
          emissive:0x55ddff,
          emissiveIntensity:1
        })

      );


    beacon.position.y=2;

    taskObject.add(beacon);

  }


  if(world.name==="Island"){

    const chest=
      new THREE.Mesh(

        new THREE.BoxGeometry(
          2.4,
          1.4,
          1.5
        ),

        new THREE.MeshStandardMaterial({
          color:0x70452b
        })

      );


    chest.position.y=.7;

    taskObject.add(chest);


    const gold=
      new THREE.Mesh(

        new THREE.BoxGeometry(
          1.5,
          .2,
          .2
        ),

        new THREE.MeshStandardMaterial({
          color:0xf0c83e
        })

      );


    gold.position.y=1.1;

    taskObject.add(gold);

  }


  /* Put the task object far enough away to explore. */

  const angle=
    Math.random()*
    Math.PI*2;


  const distance=
    35+Math.random()*25;


  taskObject.position.set(
    Math.cos(angle)*distance,
    0,
    Math.sin(angle)*distance
  );


  scene.add(taskObject);

}


/* =========================
   CREATE WORLD
========================= */

function createWorld(){

  const world=
    worlds[currentWorld-1];


  scene.background=
    new THREE.Color(
      world.sky
    );


  scene.fog=
    new THREE.Fog(
      world.sky,
      25,
      170
    );


  /* Trees */

  for(let i=0;i<75;i++){

    const angle=
      Math.random()*Math.PI*2;

    const distance=
      12+Math.random()*130;


    if(world.name==="Desert"){

      if(i%2===0){

        makeTree(
          Math.cos(angle)*distance,
          Math.sin(angle)*distance,
          .6
        );

      }else{

        makeRock(
          Math.cos(angle)*distance,
          Math.sin(angle)*distance
        );

      }

    }else{

      makeTree(
        Math.cos(angle)*distance,
        Math.sin(angle)*distance,
        .7+Math.random()*.7
      );

    }

  }


  createTaskObject();

}


/* =========================
   RESET WORLD
========================= */

function loadWorld(number){

  currentWorld=
    number;


  worldNumber.textContent=
    currentWorld;


  taskText.textContent=
    worlds[currentWorld-1].task;


  /* Remove old world objects */

  while(scene.children.length>0){

    scene.remove(
      scene.children[
        scene.children.length-1
      ]
    );

  }


  /* Recreate lighting and world */

  createScene();


  taskReady=false;

  actionButton.style.display=
    "none";


  showMessage(
    "Welcome to "+
    worlds[currentWorld-1].name
  );

}


/* =========================
   TASK CHECK
========================= */

function updateTask(){

  if(!taskObject)
    return;


  const distance=
    player.position.distanceTo(
      taskObject.position
    );


  if(
    distance<5 &&
    !taskReady
  ){

    taskReady=true;

    actionButton.style.display=
      "block";

    showMessage(
      "You found the task! Press COMPLETE TASK."
    );

  }


  if(distance>=5){

    taskReady=false;

    actionButton.style.display=
      "none";

  }

}


/* =========================
   COMPLETE TASK
========================= */

function completeTask(){

  if(!taskReady)
    return;


  actionButton.style.display=
    "none";


  if(currentWorld<5){

    showMessage(
      "Task complete! Next world unlocked!"
    );


    setTimeout(
      ()=>{
        loadWorld(
          currentWorld+1
        );
      },
      1200
    );


  }else{

    running=false;

    completeScreen.style.display=
      "flex";

  }

}


actionButton.addEventListener(
  "pointerdown",
  event=>{
    event.preventDefault();
    completeTask();
  }
);


/* =========================
   MOVEMENT
========================= */

function updateMovement(dt){

  const speed=7;


  if(input.left){

    player.rotation.y+=
      2.2*dt;

  }


  if(input.right){

    player.rotation.y-=
      2.2*dt;

  }


  let movement=0;


  if(input.forward)
    movement+=1;


  if(input.back)
    movement-=1;


  if(movement!==0){

    const direction=
      new THREE.Vector3(
        0,
        0,
        -1
      );


    direction.applyQuaternion(
      player.quaternion
    );


    player.position.addScaledVector(
      direction,
      movement*speed*dt
    );

  }


  /* Keep player above ground. */

  player.position.y=1.2;

}


/* =========================
   GAME LOOP
========================= */

function animate(){

  if(!running)
    return;


  requestAnimationFrame(
    animate
  );


  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );


  updateMovement(dt);

  updateTask();


  renderer.render(
    scene,
    camera
  );

}


/* =========================
   START GAME
========================= */

function startGame(){

  startScreen.style.display=
    "none";

  completeScreen.style.display=
    "none";


  if(!scene){

    currentWorld=1;

    createScene();

  }


  running=true;

  clock.start();

  animate();

}


startButton.addEventListener(
  "click",
  startGame
);


againButton.addEventListener(
  "click",
  ()=>{

    currentWorld=1;

    if(scene){

      renderer.domElement.remove();

    }

    scene=null;

    startGame();

  }
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  ()=>{

    if(!camera || !renderer)
      return;


    camera.aspect=
      innerWidth/
      innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

</script>

</body>
</html>
