
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mini World 3D</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
touch-action:none;
}

canvas{
display:block;
}

#loading{
position:fixed;
inset:0;
z-index:20;
background:linear-gradient(#6ecbff,#3b8c42);
color:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

#loading h1{
font-size:36px;
}

#gameUI{
position:fixed;
inset:0;
z-index:10;
pointer-events:none;
color:white;
text-shadow:0 2px 4px #000;
}

#title{
position:absolute;
top:12px;
left:50%;
transform:translateX(-50%);
font-size:25px;
font-weight:bold;
white-space:nowrap;
}

#biome{
position:absolute;
top:52px;
left:50%;
transform:translateX(-50%);
background:#0008;
padding:8px 16px;
border-radius:20px;
font-weight:bold;
}

#gemBox{
position:absolute;
top:92px;
left:50%;
transform:translateX(-50%);
background:#0008;
padding:8px 16px;
border-radius:20px;
}

#joystick{
position:absolute;
left:20px;
bottom:25px;
width:190px;
height:190px;
pointer-events:auto;
}

.control{
position:absolute;
width:65px;
height:65px;
border:0;
border-radius:20px;
background:rgba(20,30,40,.75);
color:white;
font-size:30px;
font-weight:bold;
box-shadow:0 4px 10px #0006;
}

#forward{
left:62px;
top:0;
}

#back{
left:62px;
bottom:0;
}

#turnLeft{
left:0;
top:62px;
}

#turnRight{
right:0;
top:62px;
}

#lookArea{
position:absolute;
right:20px;
bottom:30px;
width:150px;
height:150px;
border-radius:50%;
border:2px solid #ffffff55;
background:#0002;
pointer-events:auto;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-weight:bold;
}

#message{
position:absolute;
bottom:190px;
left:50%;
transform:translateX(-50%);
background:#000b;
padding:12px 18px;
border-radius:18px;
display:none;
white-space:nowrap;
}

#win{
position:fixed;
inset:0;
z-index:30;
display:none;
align-items:center;
justify-content:center;
background:#07150dcc;
color:white;
text-align:center;
}

#winBox{
background:#000c;
padding:30px;
border-radius:25px;
}

#win button{
padding:14px 25px;
border:0;
border-radius:14px;
font-size:18px;
font-weight:bold;
}
</style>
</head>

<body>

<div id="loading">
<div style="font-size:75px">🌍</div>
<h1>Mini World 3D</h1>
<p>Building four worlds...</p>
</div>

<div id="gameUI">

<div id="title">🌍 Mini World 3D</div>

<div id="biome">
🌱 Grassland
</div>

<div id="gemBox">
💎 Gems: <span id="gems">0</span>/12
</div>

<div id="joystick">

<button class="control" id="forward">▲</button>
<button class="control" id="back">▼</button>
<button class="control" id="turnLeft">◀</button>
<button class="control" id="turnRight">▶</button>

</div>

<div id="lookArea">
DRAG<br>
TO LOOK
</div>

<div id="message"></div>

</div>

<div id="win">
<div id="winBox">
<div style="font-size:80px">🏆</div>
<h1>You explored Mini World!</h1>
<p>You found every gem.</p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script>

if(typeof THREE==="undefined"){
document.getElementById("loading").innerHTML=
"<h1>Mini World could not load</h1><p>Please refresh the page.</p>";
throw new Error("Three.js failed");
}


/* =========================
SCENE
========================= */

const scene=
new THREE.Scene();

scene.background=
new THREE.Color(0x72cfff);

scene.fog=
new THREE.Fog(
0x72cfff,
45,
110
);


/* =========================
CAMERA
========================= */

const camera=
new THREE.PerspectiveCamera(
65,
innerWidth/innerHeight,
0.1,
180
);


/* =========================
RENDERER
========================= */

const renderer=
new THREE.WebGLRenderer({
antialias:false,
powerPreference:"low-power"
});

renderer.setPixelRatio(
Math.min(devicePixelRatio,1.5)
);

renderer.setSize(
innerWidth,
innerHeight
);

document.body.appendChild(renderer.domElement);


/* =========================
LIGHT
========================= */

scene.add(
new THREE.HemisphereLight(
0xdaf5ff,
0x354d27,
2
)
);

const sun=
new THREE.DirectionalLight(
0xffffff,
2
);

sun.position.set(
30,40,20
);

scene.add(sun);


/* =========================
WORLD
========================= */

const worldSize=140;

const ground=
new THREE.Mesh(
new THREE.PlaneGeometry(
worldSize,
worldSize
),
new THREE.MeshLambertMaterial({
color:0x58a848
})
);

ground.rotation.x=
-Math.PI/2;

scene.add(ground);


/*
Four biomes:

north = snow
south = desert
east = jungle
west = grassland
*/


/* =========================
BIOME PATCHES
========================= */

function makeBiome(
x,
z,
width,
depth,
color
){

const patch=
new THREE.Mesh(
new THREE.PlaneGeometry(
width,
depth
),
new THREE.MeshLambertMaterial({
color:color
})
);

patch.rotation.x=
-Math.PI/2;

patch.position.set(
x,
0.015,
z
);

scene.add(patch);

}


/* Snowland */

makeBiome(
0,-45,
65,30,
0xdcecf2
);


/* Desert */

makeBiome(
0,45,
65,30,
0xd9b765
);


/* Jungle */

makeBiome(
45,0,
30,65,
0x26743b
);


/* Grassland */

makeBiome(
-45,0,
30,65,
0x61ae4d
);


/* =========================
TREES
========================= */

function tree(
x,z,
type
){

const group=
new THREE.Group();


let trunkColor=0x75462d;
let leafColor=0x2c8135;


if(type==="snow"){
leafColor=0x8db5c0;
}

if(type==="jungle"){
leafColor=0x155522;
}


const trunk=
new THREE.Mesh(
new THREE.CylinderGeometry(
.18,.25,1.8,7
),
new THREE.MeshLambertMaterial({
color:trunkColor
})
);

trunk.position.y=.9;

group.add(trunk);


const leaves=
new THREE.Mesh(
new THREE.ConeGeometry(
1.15,2.7,8
),
new THREE.MeshLambertMaterial({
color:leafColor
})
);

leaves.position.y=2.4;

group.add(leaves);


group.position.set(
x,0,z
);

scene.add(group);

}


/* grassland trees */

for(let i=0;i<20;i++){

tree(
-35+
(Math.random()*20-10),
(Math.random()*55-27),
"grass"
);

}


/* jungle trees */

for(let i=0;i<25;i++){

tree(
35+
(Math.random()*20-10),
(Math.random()*55-27),
"jungle"
);

}


/* snow trees */

for(let i=0;i<15;i++){

tree(
Math.random()*55-27,
-45+
(Math.random()*18-9),
"snow"
);

}


/* =========================
CACTI
========================= */

function cactus(x,z){

const material=
new THREE.MeshLambertMaterial({
color:0x3e8f3b
});

const c=
new THREE.Group();

const main=
new THREE.Mesh(
new THREE.CylinderGeometry(
.18,.22,1.5,7
),
material
);

main.position.y=.75;

c.add(main);


const arm=
new THREE.Mesh(
new THREE.CylinderGeometry(
.1,.13,.7,7
),
material
);

arm.position.set(
.35,.75,0
);

arm.rotation.z=
-Math.PI/2;

c.add(arm);


c.position.set(
x,0,z
);

scene.add(c);

}


for(let i=0;i<22;i++){

cactus(
Math.random()*55-27,
30+
Math.random()*25
);

}


/* =========================
SNOW ROCKS
========================= */

for(let i=0;i<30;i++){

const rock=
new THREE.Mesh(
new THREE.DodecahedronGeometry(
.35+
Math.random()*.5
),
new THREE.MeshLambertMaterial({
color:0xbcc9ce
})
);

rock.position.set(
Math.random()*55-27,
.3,
-45+
Math.random()*25
);

scene.add(rock);

}


/* =========================
WATER
========================= */

const water=
new THREE.Mesh(
new THREE.PlaneGeometry(
25,25
),
new THREE.MeshLambertMaterial({
color:0x35aee5
})
);

water.rotation.x=
-Math.PI/2;

water.position.set(
-45,
.03,
0
);

scene.add(water);


/* =========================
PLAYER
========================= */

const player=
new THREE.Group();


const body=
new THREE.Mesh(
new THREE.CapsuleGeometry(
.38,.8,6,8
),
new THREE.MeshLambertMaterial({
color:0x3e69d2
})
);

body.position.y=.9;

player.add(body);


const head=
new THREE.Mesh(
new THREE.SphereGeometry(
.4,10,8
),
new THREE.MeshLambertMaterial({
color:0xf0b27a
})
);

head.position.y=1.65;

player.add(head);


player.position.set(
0,0,0
);

scene.add(player);


/* =========================
GEMS
========================= */

const gemPositions=[

[-40,-20],
[-50,20],
[-35,35],

[40,-20],
[50,10],
[35,25],

[-20,-48],
[5,-50],
[20,-43],

[-25,43],
[0,50],
[25,43]

];

const gems=[];

function createGem(x,z){

const gem=
new THREE.Mesh(
new THREE.OctahedronGeometry(
.42
),
new THREE.MeshLambertMaterial({
color:0x63e8ff,
emissive:0x155566
})
);

gem.position.set(
x,.7,z
);

scene.add(gem);

gems.push({
object:gem,
found:false
});

}

gemPositions.forEach(
p=>createGem(p[0],p[1])
);


/* =========================
ANIMALS
========================= */

function animal(
x,z,color
){

const group=
new THREE.Group();

const material=
new THREE.MeshLambertMaterial({
color:color
});


const body=
new THREE.Mesh(
new THREE.SphereGeometry(
.45,8,7
),
material
);

body.scale.z=1.4;
body.position.y=.6;

group.add(body);


const head=
new THREE.Mesh(
new THREE.SphereGeometry(
.3,8,7
),
material
);

head.position.set(
0,.75,-.55
);

group.add(head);


group.position.set(
x,0,z
);

scene.add(group);

return group;

}


const animals=[

animal(-43,-15,0x8c633c),
animal(-38,15,0xd8d8d8),
animal(43,-15,0xc38b52),
animal(42,20,0x8a6a43)

];


/* =========================
CONTROLS
========================= */

let movingForward=false;
let movingBack=false;
let turningLeft=false;
let turningRight=false;


function holdButton(
id,
setter
){

const button=
document.getElementById(id);


button.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
setter(true);
}
);


button.addEventListener(
"pointerup",
e=>{
e.preventDefault();
setter(false);
}
);


button.addEventListener(
"pointercancel",
()=>{
setter(false);
}
);


button.addEventListener(
"pointerleave",
()=>{
setter(false);
}
);

}


holdButton(
"forward",
v=>movingForward=v
);

holdButton(
"back",
v=>movingBack=v
);

holdButton(
"turnLeft",
v=>turningLeft=v
);

holdButton(
"turnRight",
v=>turningRight=v
);


/* =========================
LOOK CONTROLS
========================= */

const lookArea=
document.getElementById(
"lookArea"
);

let looking=false;
let previousX=0;


lookArea.addEventListener(
"pointerdown",
e=>{

looking=true;
previousX=e.clientX;

lookArea.setPointerCapture(
e.pointerId
);

}
);


lookArea.addEventListener(
"pointermove",
e=>{

if(!looking)return;

const difference=
e.clientX-previousX;


/*
Natural touch direction:

drag LEFT = look LEFT
drag RIGHT = look RIGHT
*/

player.rotation.y +=
difference*.008;

previousX=e.clientX;

}
);


lookArea.addEventListener(
"pointerup",
()=>{
looking=false;
}
);


/* =========================
GAME
========================= */

let found=0;

const gemText=
document.getElementById("gems");

const biomeText=
document.getElementById("biome");

const message=
document.getElementById("message");


function showMessage(text){

message.textContent=text;
message.style.display="block";

clearTimeout(
showMessage.timer
);

showMessage.timer=
setTimeout(
()=>{
message.style.display="none";
},
1800
);

}


/* =========================
BIOME DETECTION
========================= */

function updateBiome(){

let x=player.position.x;
let z=player.position.z;

let name="🌱 Grassland";


if(z<-30)
name="❄️ Snowland";

else if(z>30)
name="🏜️ Desert";

else if(x>30)
name="🌴 Jungle";

else if(x<-30)
name="🌱 Grassland";


biomeText.textContent=name;

}


/* =========================
LOOP
========================= */

let last=
performance.now();


function animate(now){

requestAnimationFrame(
animate
);


const delta=
Math.min(
(now-last)/1000,
.05
);

last=now;


/* turning */

if(turningLeft)
player.rotation.y +=
2.4*delta;

if(turningRight)
player.rotation.y -=
2.4*delta;


/* movement */

let movement=0;

if(movingForward)
movement+=1;

if(movingBack)
movement-=1;


if(movement!==0){

const speed=
5.5*delta;


/*
Forward is always the
direction the player faces.
*/

player.position.x +=
Math.sin(player.rotation.y)
*
movement*
speed;


player.position.z +=
Math.cos(player.rotation.y)
*
movement*
speed;

}


/* world boundary */

player.position.x=
THREE.MathUtils.clamp(
player.position.x,
-62,
62
);

player.position.z=
THREE.MathUtils.clamp(
player.position.z,
-62,
62
);


/* camera */

const cameraDistance=7;

camera.position.x=
player.position.x-
Math.sin(player.rotation.y)
*
cameraDistance;

camera.position.z=
player.position.z-
Math.cos(player.rotation.y)
*
cameraDistance;

camera.position.y=4;

camera.lookAt(
player.position.x,
1.1,
player.position.z
);


/* gems */

for(const gem of gems){

if(gem.found)
continue;

gem.object.rotation.y +=
delta*2;

gem.object.position.y=
.7+
Math.sin(now*.003)*.12;


const distance=
Math.hypot(
gem.object.position.x-
player.position.x,
gem.object.position.z-
player.position.z
);


if(distance<1.5){

gem.found=true;

gem.object.visible=false;

found++;

gemText.textContent=
found;

showMessage(
"💎 Gem found! "+
found+
"/12"
);


if(found===12){

document.getElementById(
"win"
).style.display="flex";

}

}

}


/* animals */

animals.forEach(
(animal,index)=>{

animal.rotation.y=
Math.sin(
now*.0005+index
)*.2;

}
);


updateBiome();

renderer.render(
scene,
camera
);

}


/* =========================
RESIZE
========================= */

addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

}
);


/* =========================
START
========================= */

setTimeout(
()=>{

document.getElementById(
"loading"
).style.display="none";

},
800
);


requestAnimationFrame(
animate
);

</script>

</body>
</html>
```
