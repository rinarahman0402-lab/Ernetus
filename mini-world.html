
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mini World</title>

<style>
*{
 box-sizing:border-box;
 user-select:none;
 -webkit-user-select:none;
 touch-action:none;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
}

canvas{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
}

#start,#win{
 position:fixed;
 inset:0;
 z-index:50;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
 padding:25px;
 color:white;
}

#start{
 background:linear-gradient(
   #72ccec,
   #78c75c 55%,
   #315e31
 );
}

#win{
 display:none;
 background:#173d21ee;
}

.title{
 font-size:clamp(42px,11vw,75px);
 font-weight:900;
 text-shadow:4px 4px #244b29;
}

.subtitle{
 max-width:650px;
 font-size:18px;
 line-height:1.5;
}

.bigButton{
 margin-top:20px;
 border:0;
 border-radius:20px;
 padding:18px 35px;
 background:#ffd447;
 color:#18351d;
 font-size:21px;
 font-weight:900;
}

.bigButton:active{
 transform:scale(.94);
}

#hud{
 display:none;
 position:fixed;
 z-index:20;
 top:10px;
 left:10px;
 right:10px;
 justify-content:space-between;
 gap:8px;
 pointer-events:none;
}

.info{
 background:#142218dd;
 color:white;
 padding:10px 13px;
 border-radius:14px;
 font-weight:bold;
 font-size:12px;
}

#task{
 display:none;
 position:fixed;
 z-index:20;
 top:60px;
 left:50%;
 transform:translateX(-50%);
 background:#142218dd;
 color:white;
 padding:11px 17px;
 border-radius:14px;
 font-weight:bold;
 text-align:center;
}

#controls{
 display:none;
 position:fixed;
 z-index:30;
 left:10px;
 bottom:10px;
 width:285px;
 height:185px;
}

.move{
 position:absolute;
 width:88px;
 height:58px;
 border:2px solid #ffffff66;
 border-radius:17px;
 background:#142218dd;
 color:white;
 font-size:10px;
 font-weight:900;
}

.move:active{
 background:#438e48;
 transform:scale(.93);
}

#forward{
 left:98px;
 top:0;
}

#back{
 left:98px;
 bottom:0;
}

#left{
 left:0;
 top:63px;
}

#right{
 right:0;
 top:63px;
}

#action{
 display:none;
 position:fixed;
 z-index:30;
 right:14px;
 bottom:30px;
 width:125px;
 min-height:60px;
 border:0;
 border-radius:18px;
 background:#ffd447;
 color:#18351d;
 font-weight:900;
}

#message{
 display:none;
 position:fixed;
 z-index:40;
 top:105px;
 left:50%;
 transform:translateX(-50%);
 background:#142218ee;
 color:white;
 padding:12px 18px;
 border-radius:15px;
 font-weight:bold;
 text-align:center;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<!-- START SCREEN -->

<div id="start">

 <div style="font-size:90px">🌍</div>

 <div class="title">
  MINI WORLD
 </div>

 <p class="subtitle">
  Explore different worlds and biomes.
  Complete tasks to unlock new areas!
 </p>

 <p>
  🌳 Forest &nbsp; 🏜️ Desert &nbsp;
  ❄️ Snow &nbsp; 🌋 Volcano
 </p>

 <button
   type="button"
   class="bigButton"
   id="playButton">
   PLAY GAME
 </button>

</div>


<!-- HUD -->

<div id="hud">

 <div class="info">
  WORLD: <span id="worldName">FOREST</span>
 </div>

 <div class="info">
  TASKS: <span id="taskCount">0 / 5</span>
 </div>

</div>


<div id="task">
 TASK: Explore the forest
</div>


<!-- CONTROLS -->

<div id="controls">

 <button
   type="button"
   class="move"
   id="forward">
   MOVE FORWARD
 </button>

 <button
   type="button"
   class="move"
   id="back">
   MOVE BACK
 </button>

 <button
   type="button"
   class="move"
   id="left">
   TURN LEFT
 </button>

 <button
   type="button"
   class="move"
   id="right">
   TURN RIGHT
 </button>

</div>


<button
 type="button"
 id="action">
 DO TASK
</button>


<div id="message"></div>


<!-- WIN -->

<div id="win">

 <div style="font-size:85px">🏆</div>

 <div class="title">
  WORLD COMPLETE!
 </div>

 <p
   class="subtitle"
   id="winText">
   You completed the world!
 </p>

 <button
   type="button"
   class="bigButton"
   id="nextButton">
   NEXT WORLD
 </button>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
 document.getElementById("canvas");

const ctx =
 canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

 W=innerWidth;
 H=innerHeight;

 const dpr=
  Math.min(
   devicePixelRatio || 1,
   2
  );

 canvas.width=W*dpr;
 canvas.height=H*dpr;

 canvas.style.width=W+"px";
 canvas.style.height=H+"px";

 ctx.setTransform(
  dpr,0,0,dpr,0,0
 );
}

resize();

window.addEventListener(
 "resize",
 resize
);


/* =====================================================
   GAME STATE
===================================================== */

let playing=false;

let worldIndex=0;

let completedTasks=0;

let currentTask=null;

let objects=[];

const player={
 x:0,
 z:35,
 angle:0
};

const keys={
 forward:false,
 back:false,
 left:false,
 right:false
};


/* =====================================================
   WORLDS
===================================================== */

const worlds=[

 {
  name:"FOREST",
  sky:"#73c9e8",
  ground:"#5da34c",
  tree:"#237438",
  tasks:[
   "Find the giant tree",
   "Find the blue flower",
   "Explore the forest",
   "Find the hidden stone",
   "Reach the forest clearing"
  ]
 },

 {
  name:"DESERT",
  sky:"#f3c77b",
  ground:"#d7a957",
  tree:"#7b5b2b",
  tasks:[
   "Find the oasis",
   "Find the ancient rock",
   "Explore the dunes",
   "Find the hidden cactus",
   "Reach the desert ruins"
  ]
 },

 {
  name:"SNOW",
  sky:"#b9dff1",
  ground:"#e8f2f5",
  tree:"#315a47",
  tasks:[
   "Find the frozen lake",
   "Find the snow tree",
   "Explore the snowy valley",
   "Find the ice crystal",
   "Reach the mountain"
  ]
 },

 {
  name:"VOLCANO",
  sky:"#514b50",
  ground:"#55372e",
  tree:"#332b28",
  tasks:[
   "Find the lava rock",
   "Find the black tree",
   "Explore the volcano",
   "Find the crystal",
   "Reach the volcano entrance"
  ]
 }

];


/* =====================================================
   RANDOM
===================================================== */

function random(a,b){
 return a+
  Math.random()*(b-a);
}


/* =====================================================
   CREATE WORLD
===================================================== */

function createWorld(){

 objects=[];

 player.x=0;
 player.z=35;
 player.angle=0;

 completedTasks=0;

 currentTask=
  worlds[worldIndex].tasks[0];

 /*
  Create trees.
 */

 for(let i=0;i<65;i++){

  objects.push({

   type:"tree",

   x:random(-100,100),

   z:random(-115,90),

   size:random(.7,1.6)

  });
 }


 /*
  Create rocks.
 */

 for(let i=0;i<25;i++){

  objects.push({

   type:"rock",

   x:random(-100,100),

   z:random(-110,80),

   size:random(.5,1.2)

  });
 }


 /*
  Create task objects.
 */

 for(let i=0;i<5;i++){

  objects.push({

   type:"task",

   task:i,

   x:random(-75,75),

   z:random(-100,-15),

   size:1.2,

   completed:false

  });

 }

 updateUI();

}


/* =====================================================
   PROJECTION
===================================================== */

function project(x,z,size){

 const dx=x-player.x;
 const dz=z-player.z;

 const sin=
  Math.sin(player.angle);

 const cos=
  Math.cos(player.angle);

 const forward=
  -dx*sin-dz*cos;

 const side=
  dx*cos-dz*sin;

 if(forward<=1)
  return null;

 const scale=
  430/forward;

 return{

  x:
   W/2+
   side*scale,

  y:
   H*.50+
   140*scale,

  size:
   Math.max(
    2,
    size*scale
   ),

  depth:forward

 };

}


/* =====================================================
   GROUND
===================================================== */

function drawGround(){

 const world=
  worlds[worldIndex];

 const gradient=
  ctx.createLinearGradient(
   0,0,0,H
  );

 gradient.addColorStop(
  0,
  world.sky
 );

 gradient.addColorStop(
  .48,
  world.ground
 );

 gradient.addColorStop(
  1,
  "#273b27"
 );

 ctx.fillStyle=gradient;

 ctx.fillRect(
  0,0,W,H
 );


 ctx.strokeStyle=
  "#ffffff20";

 for(let i=0;i<14;i++){

  const y=
   H*.53+i*i*8;

  ctx.beginPath();

  ctx.moveTo(0,y);
  ctx.lineTo(W,y);

  ctx.stroke();

 }

}


/* =====================================================
   TREE
===================================================== */

function drawTree(o){

 const p=
  project(
   o.x,
   o.z,
   o.size
  );

 if(!p)return;

 const world=
  worlds[worldIndex];

 const s=
  Math.max(
   5,
   Math.min(
    100,
    p.size
   )
  );


 ctx.fillStyle=
  world.tree;

 ctx.fillRect(
  p.x-s*.15,
  p.y-s*2.2,
  s*.3,
  s*2.2
 );


 ctx.beginPath();

 ctx.arc(
  p.x,
  p.y-s*2.4,
  s*1.2,
  0,
  Math.PI*2
 );

 ctx.fill();


 ctx.beginPath();

 ctx.arc(
  p.x-s*.55,
  p.y-s*2.75,
  s*.75,
  0,
  Math.PI*2
 );

 ctx.fill();

}


/* =====================================================
   ROCK
===================================================== */

function drawRock(o){

 const p=
  project(
   o.x,
   o.z,
   o.size
  );

 if(!p)return;

 const s=
  Math.max(
   4,
   Math.min(
    45,
    p.size
   )
  );

 ctx.fillStyle=
  worldIndex===1
  ? "#a77b43"
  : worldIndex===2
  ? "#cbd6dc"
  : worldIndex===3
  ? "#392e2b"
  : "#59645a";

 ctx.beginPath();

 ctx.ellipse(
  p.x,
  p.y,
  s,
  s*.55,
  0,
  0,
  Math.PI*2
 );

 ctx.fill();

}


/* =====================================================
   TASK OBJECT
===================================================== */

function drawTask(o){

 if(o.completed)
  return;

 const p=
  project(
   o.x,
   o.z,
   o.size
  );

 if(!p)return;

 const s=
  Math.max(
   7,
   Math.min(
    50,
    p.size
   )
  );

 ctx.fillStyle=
  "#ffd447";

 ctx.beginPath();

 ctx.arc(
  p.x,
  p.y-s,
  s*.6,
  0,
  Math.PI*2
 );

 ctx.fill();

 ctx.fillStyle="#ffffff";

 ctx.font=
  "bold "+
  Math.max(9,s*.45)+
  "px Arial";

 ctx.textAlign="center";

 ctx.fillText(
  "!",
  p.x,
  p.y-s*.8
 );

}


/* =====================================================
   WORLD
===================================================== */

function drawWorld(){

 drawGround();

 const list=[];

 for(
  const o of objects
 ){

  list.push({

   depth:
    Math.hypot(
     o.x-player.x,
     o.z-player.z
    ),

   object:o

  });

 }

 list.sort(
  (a,b)=>
   b.depth-a.depth
 );

 for(
  const item of list
 ){

  const o=
   item.object;

  if(o.type==="tree")
   drawTree(o);

  else if(o.type==="rock")
   drawRock(o);

  else
   drawTask(o);

 }


 drawPlayer();

}


/* =====================================================
   PLAYER
===================================================== */

function drawPlayer(){

 const x=W/2;
 const y=H*.65;

 ctx.save();

 ctx.translate(
  x,y
 );

 ctx.fillStyle=
  "#394c9b";

 ctx.beginPath();

 ctx.arc(
  0,
  -18,
  13,
  0,
  Math.PI*2
 );

 ctx.fill();

 ctx.fillRect(
  -11,
  -5,
  22,
  35
 );

 ctx.fillStyle=
  "#25336d";

 ctx.fillRect(
  -18,
  30,
  12,
  22
 );

 ctx.fillRect(
  6,
  30,
  12,
  22
 );

 ctx.restore();

}


/* =====================================================
   MOVEMENT
===================================================== */

function updatePlayer(dt){

 const speed=
  9*dt;

 const turn=
  2.5*dt;


 /*
   LEFT = TURN LEFT
   RIGHT = TURN RIGHT
 */

 if(keys.left)
  player.angle-=turn;

 if(keys.right)
  player.angle+=turn;


 if(keys.forward){

  player.x+=
   Math.sin(
    player.angle
   )*speed;

  player.z+=
   -Math.cos(
    player.angle
   )*speed;

 }


 if(keys.back){

  player.x-=
   Math.sin(
    player.angle
   )*speed;

  player.z-=
   -Math.cos(
    player.angle
   )*speed;

 }


 player.x=
  Math.max(
   -105,
   Math.min(
    105,
    player.x
   )
  );

 player.z=
  Math.max(
   -115,
   Math.min(
    90,
    player.z
   )
  );

}


/* =====================================================
   TASK
===================================================== */

document
 .getElementById("action")
 .addEventListener(
  "click",
  function(){

   if(!playing)
    return;

   let nearest=null;
   let distance=Infinity;

   for(
    const o of objects
   ){

    if(
     o.type!=="task" ||
     o.completed
    )
     continue;

    const d=
     Math.hypot(
      o.x-player.x,
      o.z-player.z
     );

    if(d<distance){

     distance=d;
     nearest=o;

    }

   }


   if(!nearest)
    return;


   if(distance>9){

    showMessage(
     "Move closer to the glowing task!"
    );

    return;

   }


   nearest.completed=true;

   completedTasks++;

   updateUI();

   if(completedTasks>=5){

    setTimeout(
     completeWorld,
     400
    );

   }else{

    currentTask=
     worlds[worldIndex]
     .tasks[completedTasks];

    updateUI();

    showMessage(
     "Task complete!"
    );

   }

  }
);


/* =====================================================
   UPDATE UI
===================================================== */

function updateUI(){

 const world=
  worlds[worldIndex];

 document.getElementById(
  "worldName"
 ).textContent=
  world.name;

 document.getElementById(
  "taskCount"
 ).textContent=
  completedTasks+
  " / 5";

 document.getElementById(
  "task"
 ).textContent=
  "TASK: "+
  currentTask;

}


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer=null;

function showMessage(text){

 const box=
  document.getElementById(
   "message"
  );

 box.textContent=text;

 box.style.display="block";

 clearTimeout(
  messageTimer
 );

 messageTimer=
  setTimeout(
   function(){

    box.style.display="none";

   },
   1800
  );

}


/* =====================================================
   COMPLETE WORLD
===================================================== */

function completeWorld(){

 playing=false;

 document.getElementById(
  "win"
 ).style.display="flex";

 document.getElementById(
  "winText"
 ).textContent=
  worlds[worldIndex].name+
  " complete! You unlocked the next world.";

}


/* =====================================================
   NEXT WORLD
===================================================== */

document
 .getElementById("nextButton")
 .addEventListener(
  "click",
  function(){

   worldIndex++;

   if(
    worldIndex>=worlds.length
   ){

    worldIndex=0;

   }

   createWorld();

   document.getElementById(
    "win"
   ).style.display="none";

   playing=true;

   updateUI();

   showMessage(
    "Welcome to "+
    worlds[worldIndex].name+
    "!"
   );

  }
);


/* =====================================================
   TOUCH CONTROLS
===================================================== */

function holdButton(
 id,
 key
){

 const button=
  document.getElementById(id);

 button.addEventListener(
  "pointerdown",
  function(e){

   e.preventDefault();

   keys[key]=true;

   button.setPointerCapture(
    e.pointerId
   );

  }
 );

 function stop(){

  keys[key]=false;

 }

 button.addEventListener(
  "pointerup",
  stop
 );

 button.addEventListener(
  "pointercancel",
  stop
 );

 button.addEventListener(
  "lostpointercapture",
  stop
 );

}

holdButton(
 "forward",
 "forward"
);

holdButton(
 "back",
 "back"
);

holdButton(
 "left",
 "left"
);

holdButton(
 "right",
 "right"
);


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
 "keydown",
 function(e){

  if(e.key==="ArrowUp")
   keys.forward=true;

  if(e.key==="ArrowDown")
   keys.back=true;

  if(e.key==="ArrowLeft")
   keys.left=true;

  if(e.key==="ArrowRight")
   keys.right=true;

 }
);

window.addEventListener(
 "keyup",
 function(e){

  if(e.key==="ArrowUp")
   keys.forward=false;

  if(e.key==="ArrowDown")
   keys.back=false;

  if(e.key==="ArrowLeft")
   keys.left=false;

  if(e.key==="ArrowRight")
   keys.right=false;

 }
);


/* =====================================================
   PLAY GAME — FIXED
===================================================== */

function startGame(){

 /*
  This is deliberately a normal function.
  The button calls it directly.
 */

 if(playing)
  return;

 worldIndex=0;

 createWorld();

 playing=true;

 document.getElementById(
  "start"
 ).style.display="none";

 document.getElementById(
  "hud"
 ).style.display="flex";

 document.getElementById(
  "task"
 ).style.display="block";

 document.getElementById(
  "controls"
 ).style.display="block";

 document.getElementById(
  "action"
 ).style.display="block";

 showMessage(
  "Mini World started!"
 );

}


/*
 IMPORTANT:
 Both click AND pointerup call the same
 start function. This makes the button
 work reliably on phones and computers.
 */

const playButton=
 document.getElementById(
  "playButton"
 );

playButton.addEventListener(
 "click",
 startGame
);

playButton.addEventListener(
 "pointerup",
 function(e){

  e.preventDefault();

  startGame();

 }
);


/* =====================================================
   GAME LOOP
===================================================== */

let lastTime=0;

function gameLoop(time){

 const dt=
  Math.min(
   .04,
   lastTime
    ? (time-lastTime)/1000
    : 0
  );

 lastTime=time;

 if(playing){

  updatePlayer(dt);

  drawWorld();

 }

 requestAnimationFrame(
  gameLoop
 );

}

requestAnimationFrame(
 gameLoop
);

</script>

</body>
</html>
```
