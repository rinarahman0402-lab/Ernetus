<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Impossible Maze</title>
  <style>
    body {
      background-color: #0b0c10;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }

    h1 { color: #66fcf1; margin-bottom: 5px; }
    #status { font-size: 1.1rem; color: #45a29e; margin-bottom: 15px; text-align: center; }

    #maze {
      width: 300px;
      height: 250px;
      background: #1f2833;
      border: 4px solid #66fcf1;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
    }

    #player {
      width: 20px;
      height: 20px;
      background: #45a29e;
      border-radius: 50%;
      position: absolute;
      top: 20px;
      left: 20px;
      transition: all 0.05s linear;
    }

    #exit {
      width: 30px;
      height: 30px;
      background: #66fcf1;
      border-radius: 6px;
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #0b0c10;
      font-size: 0.8rem;
    }

    .wall {
      position: absolute;
      background: #c5c6c7;
      border-radius: 4px;
    }

    /* Mobile D-Pad Buttons */
    .controls {
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(2, 50px);
      gap: 5px;
    }

    .btn {
      background: #45a29e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn:active { background: #66fcf1; color: #000; }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <h1>🌀 The Impossible Maze</h1>
  <div id="status">Use the buttons to reach the Exit!</div>

  <div id="maze">
    <div id="player"></div>
    <div id="exit">GOAL</div>
    <div class="wall" style="width: 150px; height: 15px; top: 80px; left: 0;"></div>
    <div class="wall" style="width: 15px; height: 100px; top: 80px; right: 80px;"></div>
  </div>

  <!-- Touch Controls -->
  <div class="controls">
    <button class="btn" id="btn-up">⬆️</button>
    <button class="btn" id="btn-left">⬅️</button>
    <button class="btn" id="btn-down">⬇️</button>
    <button class="btn" id="btn-right">➡️</button>
  </div>

  <script>
    const player = document.getElementById('player');
    const exit = document.getElementById('exit');
    const status = document.getElementById('status');
    const maze = document.getElementById('maze');

    let posX = 20;
    let posY = 20;
    let pranks = 0;

    function move(dir) {
      if (dir === 'right') posX = Math.min(260, posX + 20);
      if (dir === 'left') posX = Math.max(0, posX - 20);
      if (dir === 'down') posY = Math.min(210, posY + 20);
      if (dir === 'up') posY = Math.max(0, posY - 20);

      player.style.left = posX + 'px';
      player.style.top = posY + 'px';

      // Prank logic
      if (posX > 180 && posY > 150) {
        if (pranks === 0) {
          exit.style.bottom = 'auto';
          exit.style.top = '20px';
          status.innerText = "😜 NOPE! The exit moved!";
          pranks++;
        } else if (pranks === 1 && posY < 50) {
          maze.style.transform = 'rotate(180deg)';
          status.innerText = "🙃 WHOOPS! Upside down mode!";
          pranks++;
        } else if (pranks === 2 && posX < 50) {
          status.innerText = "🎉 YOU BEAT THE IMPOSSIBLE MAZE!";
          status.style.color = "#66fcf1";
        }
      }
    }

    // Touch Button Listeners
    document.getElementById('btn-up').onclick = () => move('up');
    document.getElementById('btn-down').onclick = () => move('down');
    document.getElementById('btn-left').onclick = () => move('left');
    document.getElementById('btn-right').onclick = () => move('right');

    // Keyboard Listeners
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') move('right');
      if (e.key === 'ArrowLeft') move('left');
      if (e.key === 'ArrowDown') move('down');
      if (e.key === 'ArrowUp') move('up');
    });
  </script>
</body>
</html>
