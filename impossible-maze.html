<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Impossible Maze</title>
  <style>
    body {
      background-color: #0b0c10;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }

    h1 { color: #66fcf1; margin-bottom: 5px; }
    #status { font-size: 1.1rem; color: #45a29e; margin-bottom: 15px; text-align: center; height: 30px; }

    #maze {
      width: 300px;
      height: 250px;
      background: #1f2833;
      border: 4px solid #66fcf1;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      transition: transform 0.5s ease;
    }

    #player {
      width: 24px;
      height: 24px;
      background: #45a29e;
      border-radius: 50%;
      position: absolute;
      top: 10px;
      left: 10px;
      transition: all 0.1s ease;
      z-index: 10;
    }

    #exit {
      width: 36px;
      height: 36px;
      background: #66fcf1;
      border-radius: 8px;
      position: absolute;
      top: 200px;
      left: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #0b0c10;
      font-size: 0.75rem;
      transition: all 0.2s ease;
    }

    .wall {
      position: absolute;
      background: #c5c6c7;
      border-radius: 4px;
    }

    .controls {
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(2, 50px);
      gap: 5px;
    }

    .btn {
      background: #45a29e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn:active { background: #66fcf1; color: #000; }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <h1>🌀 The Impossible Maze</h1>
  <div id="status">Guide the dot to the GOAL!</div>

  <div id="maze">
    <div id="player"></div>
    <div id="exit">GOAL</div>
    <div class="wall" style="width: 150px; height: 12px; top: 80px; left: 0;"></div>
    <div class="wall" style="width: 12px; height: 100px; top: 80px; right: 80px;"></div>
  </div>

  <div class="controls">
    <button class="btn" id="btn-up">⬆️</button>
    <button class="btn" id="btn-left">⬅️</button>
    <button class="btn" id="btn-down">⬇️</button>
    <button class="btn" id="btn-right">➡️</button>
  </div>

  <script>
    const player = document.getElementById('player');
    const exit = document.getElementById('exit');
    const status = document.getElementById('status');
    const maze = document.getElementById('maze');

    let posX = 10;
    let posY = 10;
    let exitX = 250;
    let exitY = 200;
    let phase = 0;
    let won = false;

    function move(dir) {
      if (won) return;

      if (dir === 'right') posX = Math.min(265, posX + 25);
      if (dir === 'left') posX = Math.max(10, posX - 25);
      if (dir === 'down') posY = Math.min(215, posY + 25);
      if (dir === 'up') posY = Math.max(10, posY - 25);

      player.style.left = posX + 'px';
      player.style.top = posY + 'px';

      checkPranks();
    }

    function checkPranks() {
      let dist = Math.hypot(posX - exitX, posY - exitY);

      // Phase 1: Goal runs away when close
      if (dist < 50 && phase === 0) {
        exitX = 250;
        exitY = 10;
        exit.style.left = exitX + 'px';
        exit.style.top = exitY + 'px';
        status.innerText = "😜 TOO SLOW! The goal ran away!";
        phase = 1;
        return;
      }

      // Phase 2: Screen flips upside down when close again
      if (dist < 50 && phase === 1) {
        maze.style.transform = 'rotate(180deg)';
        exitX = 10;
        exitY = 200;
        exit.style.left = exitX + 'px';
        exit.style.top = exitY + 'px';
        status.innerText = "🙃 WHOOPS! Upside down mode!";
        phase = 2;
        return;
      }

      // Phase 3: Final Win Detection
      if (dist < 35 && phase === 2) {
        won = true;
        status.innerText = "🎉 IMPOSSIBLE! YOU ACTUALLY BEAT IT!";
        status.style.color = "#66fcf1";
        exit.style.background = "#00ffcc";
      }
    }

    document.getElementById('btn-up').onclick = () => move('up');
    document.getElementById('btn-down').onclick = () => move('down');
    document.getElementById('btn-left').onclick = () => move('left');
    document.getElementById('btn-right').onclick = () => move('right');

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') move('right');
      if (e.key === 'ArrowLeft') move('left');
      if (e.key === 'ArrowDown') move('down');
      if (e.key === 'ArrowUp') move('up');
    });
  </script>
</body>
</html>
