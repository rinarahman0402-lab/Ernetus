<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Emoji Planet Tycoon - Fire Planet 🔥</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      overflow: hidden; font-family: 'Segoe UI', Quicksand, sans-serif;
      background: #090305; color: #fff; user-select: none;
      -webkit-user-select: none; touch-action: manipulation;
    }

    /* TOP HUD */
    #hud {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 500px; display: flex; justify-content: space-between;
      align-items: center; z-index: 10; pointer-events: none;
    }
    .hud-badge {
      background: rgba(20, 5, 5, 0.85); border: 2px solid #FF4500;
      backdrop-filter: blur(8px); border-radius: 20px; padding: 6px 14px;
      font-weight: 800; font-size: 0.9rem; color: #FF4500; display: flex;
      align-items: center; gap: 6px; box-shadow: 0 4px 15px rgba(255, 69, 0, 0.3);
    }
    .badge-overheat { border-color: #ffaa00; color: #ffaa00; }

    /* CONTROLS BAR */
    #controls {
      position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 10; width: 92%; max-width: 450px;
    }
    .btn-build {
      flex: 1; background: #260a04; border: 2px solid #FF4500; color: #fff;
      padding: 10px; border-radius: 16px; font-weight: bold; font-size: 0.85rem;
      cursor: pointer; text-align: center; box-shadow: 0 4px 0 #991b1b;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .btn-build:active { transform: translateY(3px); box-shadow: none; }
    .btn-build:disabled { opacity: 0.5; border-color: #555; box-shadow: none; }

    canvas { display: block; width: 100%; height: 100%; }

    /* FLOATING POPUP TEXT */
    .pop-text {
      position: absolute; font-weight: 900; font-size: 1.2rem; pointer-events: none;
      animation: floatUp 0.8s ease-out forwards; z-index: 20; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-30px) scale(1.3); }
    }
  </style>
</head>
<body>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-badge">🔥 <span id="heat-txt">100</span> Heat Power</div>
    <div class="hud-badge badge-overheat" id="overheat-badge">Status: Normal</div>
  </div>

  <canvas id="canvas"></canvas>

  <!-- CONTROLS -->
  <div id="controls">
    <button class="btn-build" id="btn-factory" onclick="buyBuilding('factory')">
      <span>🏭 Volcano Factory</span>
      <span style="font-size: 0.75rem; color: #FF4500;">50 Heat</span>
    </button>
    <button class="btn-build" id="btn-pipe" onclick="buyBuilding('pipe')">
      <span>🌋 Lava Pipe</span>
      <span style="font-size: 0.75rem; color: #FF4500;">30 Heat</span>
    </button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // GAME STATE
    let heatPower = 100;
    let buildings = [];
    let ashParticles = [];
    let residents = [];
    let dragonite = null;
    let charizard = null;

    let isOverheated = false;
    let floodedTimer = 0;
    let audioCtx = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // INITIAL RESIDENTS
    function initGame() {
      // Add starting building
      buildings.push({ type: 'factory', x: canvas.width / 2, y: canvas.height / 2 + 50 });

      // Spawn volcanic residents
      const sprites = ['🔥', '🌋', '🦎'];
      for (let i = 0; i < 5; i++) {
        residents.push({
          x: Math.random() * (canvas.width - 100) + 50,
          y: Math.random() * 150 + (canvas.height / 2),
          vx: (Math.random() - 0.5) * 1.5,
          icon: sprites[i % sprites.length]
        });
      }

      // Initialize Ash Embers
      for (let i = 0; i < 40; i++) {
        ashParticles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 1,
          vy: - (Math.random() * 1.5 + 0.5),
          alpha: Math.random()
        });
      }
    }

    // WEB AUDIO SYNTHESIZER: 3-Second Dragonite Roar
    function playDragoniteRoar() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const now = audioCtx.currentTime;

      // 1. LOW DEEP BASS RUMBLE (80Hz Sub-bass)
      const bassOsc = audioCtx.createOscillator();
      const bassGain = audioCtx.createGain();
      bassOsc.type = 'sawtooth';
      bassOsc.frequency.setValueAtTime(80, now);
      bassOsc.frequency.exponentialRampToValueAtTime(30, now + 3.0);
      bassGain.gain.setValueAtTime(0.8, now);
      bassGain.gain.exponentialRampToValueAtTime(0.01, now + 3.0);
      bassOsc.connect(bassGain);

      // 2. HIGH DRACONIC SCREECH (2kHz Peak)
      const screechOsc = audioCtx.createOscillator();
      const screechGain = audioCtx.createGain();
      screechOsc.type = 'triangle';
      screechOsc.frequency.setValueAtTime(1200, now);
      screechOsc.frequency.linearRampToValueAtTime(2400, now + 0.6);
      screechOsc.frequency.exponentialRampToValueAtTime(400, now + 3.0);
      screechGain.gain.setValueAtTime(0.0, now);
      screechGain.gain.linearRampToValueAtTime(0.6, now + 0.3);
      screechGain.gain.exponentialRampToValueAtTime(0.01, now + 3.0);
      screechOsc.connect(screechGain);

      // 3. AIR DISPLACEMENT & CAVE ECHO NOISE
      const bufferSize = audioCtx.sampleRate * 3.0;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const noiseSource = audioCtx.createBufferSource();
      noiseSource.buffer = noiseBuffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(800, now);
      filter.Q.setValueAtTime(3.0, now);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.4, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 3.0);

      noiseSource.connect(filter);
      filter.connect(noiseGain);

      // MIX ALL & MASTER OUTPUT
      const masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.9, now);

      bassGain.connect(masterGain);
      screechGain.connect(masterGain);
      noiseGain.connect(masterGain);
      masterGain.connect(audioCtx.destination);

      bassOsc.start(now);
      screechOsc.start(now);
      noiseSource.start(now);

      bassOsc.stop(now + 3.0);
      screechOsc.stop(now + 3.0);
      noiseSource.stop(now + 3.0);
    }

    // BUY BUILDINGS
    function buyBuilding(type) {
      const cost = type === 'factory' ? 50 : 30;
      if (heatPower >= cost) {
        heatPower -= cost;
        const x = Math.random() * (canvas.width - 120) + 60;
        const y = Math.random() * (canvas.height * 0.3) + (canvas.height * 0.5);
        buildings.push({ type, x, y });
        showPopText(x, y, `+1 ${type === 'factory' ? 'Factory' : 'Pipe'}`, '#FF4500');
        updateHUD();
      }
    }

    function updateHUD() {
      document.getElementById('heat-txt').innerText = Math.round(heatPower);
      document.getElementById('btn-factory').disabled = heatPower < 50;
      document.getElementById('btn-pipe').disabled = heatPower < 30;

      const badge = document.getElementById('overheat-badge');
      if (heatPower > 300) {
        badge.innerText = 'STATUS: OVERHEAT (+50%) 🔥';
        badge.style.borderColor = '#ff0000';
        badge.style.color = '#ff0000';
      } else if (floodedTimer > 0) {
        badge.innerText = 'STATUS: FLOODED (-20%) 🌊';
        badge.style.borderColor = '#38bdf8';
        badge.style.color = '#38bdf8';
      } else {
        badge.innerText = 'Status: Normal';
        badge.style.borderColor = '#ffaa00';
        badge.style.color = '#ffaa00';
      }
    }

    function showPopText(x, y, text, color) {
      const el = document.createElement('div');
      el.className = 'pop-text';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.color = color;
      el.innerText = text;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    // CLICK BUILDING TO PLACE / INTERACT
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      // Click Dragonite for extra reward
      if (dragonite && Math.hypot(dragonite.x - clickX, dragonite.y - clickY) < 40) {
        heatPower += 50;
        showPopText(dragonite.x, dragonite.y, '+50 HEAT POWER! 🐲', '#FF4500');
        playDragoniteRoar();
        dragonite = null;
        updateHUD();
      }
    });

    // GAME TICK: Resource Generation
    setInterval(() => {
      let factoryCount = buildings.filter(b => b.type === 'factory').length;
      let genRate = factoryCount * 1;

      // Mechanics Logic
      if (heatPower > 300) genRate *= 1.5; // Overheat
      if (floodedTimer > 0) {
        genRate *= 0.8; // Sabotage
        floodedTimer--;
      }

      heatPower += genRate;
      updateHUD();
    }, 1000);

    // CHANCE EVENTS: Dragonite Drop & Charizard Flyby
    setInterval(() => {
      if (!dragonite && Math.random() < 0.3) {
        dragonite = { x: -50, y: Math.random() * (canvas.height * 0.4) + 50, speed: 2 };
        playDragoniteRoar();
      }
      if (!charizard && Math.random() < 0.4) {
        charizard = { x: canvas.width + 50, y: Math.random() * (canvas.height * 0.3) + 30, speed: -4 };
      }
    }, 8000);

    // DRAW FIRE PLANET
    function drawScene() {
      // 1. Background: Dark Space with Distant Volcanoes
      ctx.fillStyle = '#090305';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Fire Planet Terrain Surface
      const planetY = canvas.height * 0.45;
      ctx.fillStyle = '#1c0704';
      ctx.beginPath();
      ctx.ellipse(canvas.width / 2, canvas.height + 100, canvas.width * 0.75, canvas.height * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#FF4500';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Glowing Lava Cracks
      ctx.strokeStyle = '#ff5500';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(canvas.width * 0.2, planetY + 100);
      ctx.lineTo(canvas.width * 0.35, planetY + 160);
      ctx.lineTo(canvas.width * 0.5, planetY + 120);
      ctx.lineTo(canvas.width * 0.8, planetY + 180);
      ctx.stroke();

      // 3. Draw Buildings
      buildings.forEach(b => {
        if (b.type === 'factory') {
          ctx.font = '3.2rem sans-serif';
          ctx.fillText('🏭', b.x - 25, b.y);
          // Smokestack glow
          ctx.fillStyle = 'rgba(255, 69, 0, 0.4)';
          ctx.beginPath();
          ctx.arc(b.x, b.y - 45, 12, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.font = '2.5rem sans-serif';
          ctx.fillText('🌋', b.x - 20, b.y);
        }
      });

      // 4. Draw Residents
      residents.forEach(r => {
        r.x += r.vx;
        if (r.x < 30 || r.x > canvas.width - 30) r.vx *= -1;
        ctx.font = '1.8rem sans-serif';
        ctx.fillText(r.icon, r.x, r.y);
      });

      // 5. Charizard Flyby (Cosmetic)
      if (charizard) {
        charizard.x += charizard.speed;
        ctx.font = '3rem sans-serif';
        ctx.fillText('🐉', charizard.x, charizard.y);
        if (charizard.x < -100) charizard = null;
      }

      // 6. Dragonite Visit Event
      if (dragonite) {
        dragonite.x += dragonite.speed;
        ctx.font = '3.5rem sans-serif';
        ctx.fillText('🐲', dragonite.x, dragonite.y);
        if (dragonite.x > canvas.width + 100) dragonite = null;
      }

      // 7. Floating Ash Particles
      ashParticles.forEach(p => {
        p.y += p.vy;
        if (p.y < 0) p.y = canvas.height;
        ctx.fillStyle = `rgba(255, 120, 0, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // MAIN LOOP
    function loop() {
      requestAnimationFrame(loop);
      drawScene();
    }

    initGame();
    loop();
  </script>
</body>
</html>
