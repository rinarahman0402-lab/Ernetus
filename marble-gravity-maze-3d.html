<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Marble Maze</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #020617;
      user-select: none;
      touch-action: manipulation;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #38bdf8;
      font-weight: bold;
      font-size: 1.2rem;
      text-shadow: 0 0 10px #0284c7;
      pointer-events: none;
      z-index: 10;
    }
    #instructions {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: #facc15;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 24px;
      border-radius: 8px;
      text-align: center;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 15px #0284c7;
      z-index: 10;
      cursor: pointer;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">🔮 MARBLE MAZE | TIME: <span id="time">0</span>s</div>
  <div id="instructions" id="msg">SWIPE / DRAG ON SCREEN TO TILT BOARD</div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020617);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 16, 12);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lights
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(5, 20, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x38bdf8, 0.6));

    // Board Group (Tilts with Input)
    const boardGroup = new THREE.Group();
    scene.add(boardGroup);

    // Maze Base
    const board = new THREE.Mesh(
      new THREE.BoxGeometry(12, 0.4, 12),
      new THREE.MeshStandardMaterial({ color: 0x1e1b4b, roughness: 0.2 })
    );
    board.position.y = -0.2;
    boardGroup.add(board);

    // Goal Hole
    const hole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.8, 0.8, 0.5, 32),
      new THREE.MeshBasicMaterial({ color: 0x22c55e })
    );
    hole.position.set(4, -0.2, -4);
    boardGroup.add(hole);

    // Walls
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xa855f7 });
    function addWall(x, z, w, d) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 0.8, d), wallMat);
      wall.position.set(x, 0.4, z);
      boardGroup.add(wall);
    }

    // Outer Boundaries
    addWall(0, -6, 12, 0.4);
    addWall(0, 6, 12, 0.4);
    addWall(-6, 0, 0.4, 12);
    addWall(6, 0, 0.4, 12);

    // Inner Maze Walls
    addWall(-2, -2, 0.4, 8);
    addWall(2, 2, 0.4, 8);

    // Marble Mesh
    const marble = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.8, roughness: 0.1 })
    );
    boardGroup.add(marble);

    // Physics State
    let posX = -4, posZ = 4;
    let velX = 0, velZ = 0;
    let targetRotX = 0, targetRotZ = 0;
    let timer = 0, gameActive = true;

    function resetGame() {
      posX = -4; posZ = 4;
      velX = 0; velZ = 0;
      targetRotX = 0; targetRotZ = 0;
      marble.position.set(posX, 0.5, posZ);
      timer = 0;
      gameActive = true;
      document.getElementById('instructions').innerText = "SWIPE / DRAG ON SCREEN TO TILT BOARD";
    }

    setInterval(() => {
      if (gameActive) {
        timer++;
        document.getElementById('time').innerText = timer;
      }
    }, 1000);

    // Touch Drag Controls
    let touchStartX = 0, touchStartY = 0;

    window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      if (!gameActive) resetGame();
    });

    window.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!gameActive) return;

      const deltaX = e.touches[0].clientX - touchStartX;
      const deltaY = e.touches[0].clientY - touchStartY;

      targetRotZ = -Math.max(-0.25, Math.min(0.25, deltaX * 0.003));
      targetRotX = Math.max(-0.25, Math.min(0.25, deltaY * 0.003));
    });

    window.addEventListener('touchend', () => {
      targetRotX = 0;
      targetRotZ = 0;
    });

    // Mouse Fallback for Desktop
    let isMouseDown = false;
    window.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      touchStartX = e.clientX;
      touchStartY = e.clientY;
      if (!gameActive) resetGame();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown || !gameActive) return;
      const deltaX = e.clientX - touchStartX;
      const deltaY = e.clientY - touchStartY;

      targetRotZ = -Math.max(-0.25, Math.min(0.25, deltaX * 0.003));
      targetRotX = Math.max(-0.25, Math.min(0.25, deltaY * 0.003));
    });

    window.addEventListener('mouseup', () => {
      isMouseDown = false;
      targetRotX = 0;
      targetRotZ = 0;
    });

    document.getElementById('instructions').addEventListener('click', () => {
      if (!gameActive) resetGame();
    });

    function animate() {
      requestAnimationFrame(animate);

      if (gameActive) {
        // Smooth Board Rotation
        boardGroup.rotation.x += (targetRotX - boardGroup.rotation.x) * 0.1;
        boardGroup.rotation.z += (targetRotZ - boardGroup.rotation.z) * 0.1;

        // Gravity Acceleration based on tilt
        velX -= boardGroup.rotation.z * 0.015;
        velZ += boardGroup.rotation.x * 0.015;

        // Friction
        velX *= 0.98;
        velZ *= 0.98;

        posX += velX;
        posZ += velZ;

        // Boundary Collisions
        if (posX < -5.3) { posX = -5.3; velX = -velX * 0.5; }
        if (posX > 5.3) { posX = 5.3; velX = -velX * 0.5; }
        if (posZ < -5.3) { posZ = -5.3; velZ = -velZ * 0.5; }
        if (posZ > 5.3) { posZ = 5.3; velZ = -velZ * 0.5; }

        marble.position.x = posX;
        marble.position.z = posZ;

        // Win Condition
        const distToHole = Math.hypot(posX - 4, posZ - (-4));
        if (distToHole < 0.8) {
          gameActive = false;
          document.getElementById('instructions').innerText = `🎉 GOAL REACHED IN ${timer}s! Tap to Play Again!`;
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    resetGame();
    animate();
  </script>
</body>
</html>
