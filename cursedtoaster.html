<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cursed Toaster Box</title>
<style>
  body {
    background: #111;
    color: #fff;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  #box {
    width: 300px;
    height: 200px;
    background: #333;
    border: 4px solid #666;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
  }
  #box:hover { background: #444; }
  #toaster {
    display: none;
    width: 250px;
    height: 150px;
    background: #555;
    border-radius: 20px 20px 5px 5px;
    position: relative;
  }
  #toast {
    display: none;
    width: 80px;
    height: 100px;
    background: #deb887;
    position: absolute;
    top: -50px;
    left: 85px;
    border-radius: 10px;
    transition: top 1s;
  }
  #text {
    margin-top: 20px;
    text-align: center;
    font-size: 18px;
  }
</style>
</head>
<body>
  <div id="box" onclick="openBox()">OPEN THE BOX</div>
  <div id="toaster">
    <div id="toast"></div>
  </div>
  <div id="text">Click the box to begin your suffering</div>

<script>
  const roasts = [
    "Wow. You actually opened me. Pathetic.",
    "Is that bread? It looks as burnt as your grades.",
    "You clicked me. You have no friends, do you?",
    "Toasting... your self esteem.",
    "ERROR: User is cringe. Toasting anyway."
  ];
  
  function openBox() {
    document.getElementById('box').style.display = 'none';
    document.getElementById('toaster').style.display = 'block';
    document.getElementById('text').innerText = "The Cursed Toaster awakens...";
    setTimeout(popToast, 2000);
  }
  
  function popToast() {
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.top = '10px'; }, 100);
    setTimeout(() => {
      const roast = roasts[Math.floor(Math.random() * roasts.length)];
      document.getElementById('text').innerText = roast;
    }, 1200);
  }
</script>
</body>
</html>
