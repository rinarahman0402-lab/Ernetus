<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Cyber Runner 3D</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #030712; user-select: none; }
    #ui { position: absolute; top: 15px; left: 15px; color: #38bdf8; font-weight: bold; font-size: 1.2rem; text-shadow: 0 0 10px #0284c7; pointer-events: none; }
    #instructions { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: #f43f5e; font-weight: bold; background: rgba(15,23,42,0.85); padding: 12px 24px; border-radius: 8px; pointer-events: none; text-align: center; border: 2px solid #f43f5e; box-shadow: 0 0 15px #f43f5e; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">⚡ SCORE: <span id="score">0</span></div>
  <div id="instructions">A/D or LEFT/RIGHT to Switch Lanes | SPACE to Jump!</div>

  <script>
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030712, 0.025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2.5, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lights
    const light = new THREE.DirectionalLight(0xa855f7, 1.5);
    light.position.set(0, 20, -10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x1e1b4b, 1));

    // Cyber Highway
    const roadGeo = new THREE.PlaneGeometry(12, 200);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.z = -80;
    scene.add(road);

    // Grid Overlay Lines
    const gridHelper = new THREE.GridHelper(200, 40, 0xec4899, 0x3b82f6);
    gridHelper.position.set(0, 0.01, -80);
    scene.add(gridHelper);

    // Player Vehicle
    const playerMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.8 });
    const player = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.6, 2), playerMat);
    player.position.set(0, 0.3, 2);
    scene.add(player);

    const lanes = [-3, 0, 3];
    let currentLane = 1;
    let targetX = 0;
    let isJumping = false;
    let jumpVel = 0;
    let score = 0;
    let gameOver = false;
    let speed = 0.8;

    // Obstacles & Collectibles
    const obstacles = [];
    const obstacleMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, emissive: 0xe11d48, emissiveIntensity: 0.6 });

    function spawnObstacle() {
      if (gameOver) return;
      const lane = lanes[Math.floor(Math.random() * 3)];
      const obs = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.2, 1.8), obstacleMat);
      obs.position.set(lane, 0.6, -100);
      scene.add(obs);
      obstacles.push(obs);
    }

    setInterval(spawnObstacle, 1000);

    // Controls
    window.addEventListener('keydown', e => {
      if (gameOver) return;
      if ((e.key === 'a' || e.key === 'ArrowLeft') && currentLane > 0) {
        currentLane--;
        targetX = lanes[currentLane];
      }
      if ((e.key === 'd' || e.key === 'ArrowRight') && currentLane < 2) {
        currentLane++;
        targetX = lanes[currentLane];
      }
      if ((e.key === ' ' || e.key === 'ArrowUp') && !isJumping) {
        isJumping = true;
        jumpVel = 0.22;
      }
    });

    function animate() {
      requestAnimationFrame(animate);

      if (!gameOver) {
        score += 1;
        document.getElementById('score').innerText = score;
        speed += 0.0002; // Speed scales up!

        // Smooth Lane Transition
        player.position.x += (targetX - player.position.x) * 0.2;

        // Jump Physics
        if (isJumping) {
          player.position.y += jumpVel;
          jumpVel -= 0.012;
          if (player.position.y <= 0.3) {
            player.position.y = 0.3;
            isJumping = false;
          }
        }

        // Move Grid & Road effect
        gridHelper.position.z += speed;
        if (gridHelper.position.z > 0) gridHelper.position.z = -80;

        // Update Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.position.z += speed;

          // Collision Check
          if (
            Math.abs(obs.position.z - player.position.z) < 1.5 &&
            Math.abs(obs.position.x - player.position.x) < 1.0 &&
            player.position.y < 1.0
          ) {
            gameOver = true;
            document.getElementById('instructions').innerText = "💥 CRASHED! Refresh to Run Again.";
          }

          if (obs.position.z > 10) {
            scene.remove(obs);
            obstacles.splice(i, 1);
          }
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
