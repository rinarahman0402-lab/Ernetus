<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Cyber Runner</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #020617;
      user-select: none;
      touch-action: manipulation;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #38bdf8;
      font-weight: bold;
      font-size: 1.2rem;
      text-shadow: 0 0 10px #0284c7;
      pointer-events: none;
      z-index: 10;
    }
    #instructions {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: #f43f5e;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 24px;
      border-radius: 8px;
      text-align: center;
      border: 2px solid #f43f5e;
      box-shadow: 0 0 15px #e11d48;
      z-index: 10;
      cursor: pointer;
    }
    .touch-btn {
      position: absolute;
      bottom: 0;
      top: 0;
      width: 50%;
      z-index: 5;
    }
    #left-zone { left: 0; }
    #right-zone { right: 0; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">⚡ SCORE: <span id="score">0</span></div>
  <div id="instructions" id="msg">TAP LEFT / RIGHT TO STEER</div>
  <div id="left-zone" class="touch-btn"></div>
  <div id="right-zone" class="touch-btn"></div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020617);
    scene.fog = new THREE.FogExp2(0x020617, 0.025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 6);
    camera.lookAt(0, 1, -10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Grid Floor
    const grid = new THREE.GridHelper(200, 40, 0xd946ef, 0x0284c7);
    grid.position.z = -50;
    scene.add(grid);

    // Player Cube
    const playerMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, emissive: 0xe11d48 });
    const player = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), playerMat);
    player.position.set(0, 0.6, 0);
    scene.add(player);

    // Lights
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 10, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x38bdf8, 0.5));

    // Obstacles
    const obstacles = [];
    const obstacleMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7 });

    function spawnObstacle() {
      const obs = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), obstacleMat);
      obs.position.set((Math.random() - 0.5) * 12, 0.75, -80);
      scene.add(obs);
      obstacles.push(obs);
    }

    let score = 0;
    let speed = 0.4;
    let moveLeft = false;
    let moveRight = false;
    let gameOver = false;

    // Desktop Controls
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
      if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
      if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
    });

    // Touch Controls
    const leftZone = document.getElementById('left-zone');
    const rightZone = document.getElementById('right-zone');

    leftZone.addEventListener('pointerdown', (e) => { e.preventDefault(); if (gameOver) restartGame(); else moveLeft = true; });
    leftZone.addEventListener('pointerup', () => moveLeft = false);
    rightZone.addEventListener('pointerdown', (e) => { e.preventDefault(); if (gameOver) restartGame(); else moveRight = true; });
    rightZone.addEventListener('pointerup', () => moveRight = false);

    document.getElementById('instructions').addEventListener('click', () => {
      if (gameOver) restartGame();
    });

    function restartGame() {
      score = 0;
      speed = 0.4;
      gameOver = false;
      player.position.x = 0;
      document.getElementById('score').innerText = '0';
      document.getElementById('instructions').innerText = 'TAP LEFT / RIGHT TO STEER';
      obstacles.forEach(obs => scene.remove(obs));
      obstacles.length = 0;
    }

    let spawnTimer = 0;

    function animate() {
      requestAnimationFrame(animate);

      if (!gameOver) {
        // Player Movement
        if (moveLeft && player.position.x > -5.5) player.position.x -= 0.2;
        if (moveRight && player.position.x < 5.5) player.position.x += 0.2;

        // Grid Animation
        grid.position.z += speed;
        if (grid.position.z > 0) grid.position.z = -50;

        // Obstacle Spawning & Movement
        spawnTimer++;
        if (spawnTimer > 20) {
          spawnObstacle();
          spawnTimer = 0;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.position.z += speed;

          // Collision Check
          if (Math.abs(obs.position.z - player.position.z) < 1 && Math.abs(obs.position.x - player.position.x) < 1.2) {
            gameOver = true;
            document.getElementById('instructions').innerText = '💥 CRASHED! Tap Anywhere to Run Again.';
          }

          // Cleanup
          if (obs.position.z > 5) {
            scene.remove(obs);
            obstacles.splice(i, 1);
            score += 10;
            document.getElementById('score').innerText = score;
            speed += 0.002;
          }
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
