<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ash’s Victory Parkour 2D</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16; color: #fff; user-select: none;
      -webkit-user-select: none; touch-action: none;
    }

    #game-container { width: 100%; height: 100%; }

    .touch-btn {
      position: absolute; width: 70px; height: 70px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; z-index: 20; touch-action: manipulation;
    }
    .touch-btn:active { background: rgba(255, 255, 255, 0.4); }

    #btn-left { bottom: 25px; left: 25px; }
    #btn-right { bottom: 25px; left: 110px; }
    #btn-jump { bottom: 25px; right: 25px; width: 85px; height: 85px; background: rgba(234, 179, 8, 0.3); border-color: #eab308; }

    #hud {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 450px; display: flex; justify-content: space-between;
      align-items: center; z-index: 10; pointer-events: none;
    }
    .hud-badge {
      background: rgba(15, 23, 42, 0.85); border: 2px solid #eab308;
      backdrop-filter: blur(8px); border-radius: 20px; padding: 6px 16px;
      font-weight: 800; font-size: 0.95rem; color: #fef08a;
    }

    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 13, 22, 0.92); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px;
    }
    .btn-main {
      background: #eab308; color: #000; border: 3px solid #fff;
      padding: 14px 32px; border-radius: 16px; font-weight: 900;
      font-size: 1.2rem; cursor: pointer; margin-top: 20px;
      box-shadow: 0 6px 0 #ca8a04; transition: transform 0.1s;
    }
    .btn-main:active { transform: translateY(4px); box-shadow: 0 2px 0 #ca8a04; }
  </style>
</head>
<body>

  <audio id="snd-jump" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
  <audio id="snd-bolt" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>
  <audio id="snd-win" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

  <div id="hud">
    <div class="hud-badge">⚡ Bolts: <span id="bolt-count">0</span> / 5</div>
    <div class="hud-badge">🌎 Zone: <span id="zone-txt">Forest</span></div>
  </div>

  <div id="btn-left" class="touch-btn">◀</div>
  <div id="btn-right" class="touch-btn">▶</div>
  <div id="btn-jump" class="touch-btn">⬆</div>

  <div id="game-container"></div>

  <div id="overlay-start" class="overlay">
    <h1 style="font-size: 2.2rem; color: #fef08a; margin: 0; text-shadow: 0 0 15px rgba(234,179,8,0.5);">ASH’S VICTORY PARKOUR</h1>
    <p style="font-size: 0.95rem; color: #cbd5e1; max-width: 320px; margin-top: 12px; line-height: 1.4;">
      Parkour across 3 Earth Zones: <b>Forest 🌲</b>, <b>Volcano 🌋</b>, and <b>Sky ☁️</b>.<br><br>
      Controls: On-screen buttons or <b>Arrow Keys / WASD</b>.<br>
      Goal: Collect <b>5 Lightning Bolts ⚡</b> and reach the Victory Flag!
    </p>
    <button class="btn-main" onclick="startGame()">START RUN ⚡</button>
  </div>

  <div id="overlay-win" class="overlay" style="display: none;">
    <h1 style="font-size: 2.5rem; color: #4ade80; margin: 0;">VICTORY REACHED! 🏆</h1>
    <p style="font-size: 1.1rem; color: #cbd5e1; margin-top: 10px;">Ash completed the Victory Parkour!</p>
    <button class="btn-main" onclick="restartGame()">PLAY AGAIN</button>
  </div>

  <script>
    let game;
    let inputs = { left: false, right: false, jump: false };
    let boltsCollected = 0;

    function setupTouchEvents(id, key) {
      const btn = document.getElementById(id);
      btn.addEventListener('pointerdown', (e) => { e.preventDefault(); inputs[key] = true; });
      btn.addEventListener('pointerup', (e) => { e.preventDefault(); inputs[key] = false; });
      btn.addEventListener('pointerleave', (e) => { e.preventDefault(); inputs[key] = false; });
    }
    setupTouchEvents('btn-left', 'left');
    setupTouchEvents('btn-right', 'right');
    setupTouchEvents('btn-jump', 'jump');

    function startGame() {
      document.getElementById('overlay-start').style.display = 'none';
      initPhaser();
    }

    function restartGame() {
      document.getElementById('overlay-win').style.display = 'none';
      boltsCollected = 0;
      document.getElementById('bolt-count').innerText = 0;
      if (game) game.destroy(true);
      initPhaser();
    }

    function playSound(id) {
      const snd = document.getElementById(id);
      if (snd) { snd.currentTime = 0; snd.play().catch(() => {}); }
    }

    class MainScene extends Phaser.Scene {
      constructor() { super({ key: 'MainScene' }); }

      preload() {
        const graphics = this.make.graphics();
        
        // Ash Player
        graphics.fillStyle(0x3b82f6, 1); graphics.fillRect(0, 0, 32, 48);
        graphics.fillStyle(0xef4444, 1); graphics.fillRect(0, 0, 32, 12);
        graphics.generateTexture('ash', 32, 48); graphics.clear();

        // Platform Earths
        graphics.fillStyle(0x22c55e, 1); graphics.fillRect(0, 0, 160, 24); graphics.generateTexture('earth-forest', 160, 24); graphics.clear();
        graphics.fillStyle(0xef4444, 1); graphics.fillRect(0, 0, 160, 24); graphics.generateTexture('earth-volcano', 160, 24); graphics.clear();
        graphics.fillStyle(0x38bdf8, 1); graphics.fillRect(0, 0, 160, 24); graphics.generateTexture('earth-sky', 160, 24); graphics.clear();

        // High-Visibility Yellow Lightning Bolt
        graphics.fillStyle(0xffff00, 1);
        graphics.fillTriangle(16, 0, 4, 20, 16, 18);
        graphics.fillTriangle(10, 14, 26, 36, 10, 16);
        graphics.generateTexture('bolt', 28, 36); graphics.clear();

        // Flag
        graphics.fillStyle(0x22c55e, 1); graphics.fillRect(0, 0, 6, 60); graphics.fillStyle(0xef4444, 1); graphics.fillTriangle(6, 0, 36, 15, 6, 30); graphics.generateTexture('flag', 36, 60);
      }

      create() {
        this.cameras.main.setBounds(0, 0, 3600, 600);
        this.physics.world.setBounds(0, 0, 3600, 750);

        this.add.rectangle(600, 300, 1200, 600, 0x064e3b).setDepth(-1);
        this.add.rectangle(1800, 300, 1200, 600, 0x450a0a).setDepth(-1);
        this.add.rectangle(3000, 300, 1200, 600, 0x0c4a6e).setDepth(-1);

        this.platforms = this.physics.add.staticGroup();

        // Forest
        this.platforms.create(200, 500, 'earth-forest');
        this.platforms.create(450, 420, 'earth-forest');
        this.platforms.create(700, 350, 'earth-forest');
        this.platforms.create(950, 450, 'earth-forest');

        // Volcano
        this.platforms.create(1250, 400, 'earth-volcano');
        this.platforms.create(1550, 320, 'earth-volcano');
        this.platforms.create(1850, 420, 'earth-volcano');
        this.platforms.create(2150, 360, 'earth-volcano');

        // Sky
        this.platforms.create(2450, 450, 'earth-sky');
        this.platforms.create(2750, 350, 'earth-sky');
        this.platforms.create(3050, 260, 'earth-sky');
        this.platforms.create(3350, 380, 'earth-sky');

        this.player = this.physics.add.sprite(200, 400, 'ash');
        this.player.setBounce(0.1);
        this.player.setCollideWorldBounds(true);
        this.physics.add.collider(this.player, this.platforms);

        this.cameras.main.startFollow(this.player, true, 0.08, 0.08);

        // Explicit Bolt Coordinates floating above platforms
        const boltPositions = [
          { x: 450, y: 350 },
          { x: 950, y: 380 },
          { x: 1550, y: 250 },
          { x: 2150, y: 290 },
          { x: 2750, y: 280 }
        ];

        this.bolts = this.physics.add.group({ allowGravity: false, immovable: true });

        boltPositions.forEach(pos => {
          let b = this.bolts.create(pos.x, pos.y, 'bolt');
          this.tweens.add({
            targets: b,
            y: pos.y - 12,
            duration: 800,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
          });
        });

        this.physics.add.overlap(this.player, this.bolts, this.collectBolt, null, this);

        this.flag = this.physics.add.sprite(3350, 300, 'flag');
        this.physics.add.collider(this.flag, this.platforms);
        this.physics.add.overlap(this.player, this.flag, this.reachFlag, null, this);

        this.cursors = this.input.keyboard.createCursorKeys();
      }

      update() {
        const p = this.player;

        if (p.y > 650) {
          p.setPosition(200, 400);
          p.setVelocity(0, 0);
        }

        if (p.x < 1200) document.getElementById('zone-txt').innerText = 'Forest 🌲';
        else if (p.x < 2400) document.getElementById('zone-txt').innerText = 'Volcano 🌋';
        else document.getElementById('zone-txt').innerText = 'Sky ☁️';

        if (this.cursors.left.isDown || inputs.left) {
          p.setVelocityX(-220);
        } else if (this.cursors.right.isDown || inputs.right) {
          p.setVelocityX(220);
        } else {
          p.setVelocityX(0);
        }

        if ((this.cursors.up.isDown || this.cursors.space.isDown || inputs.jump) && p.body.touching.down) {
          p.setVelocityY(-460);
          playSound('snd-jump');
        }
      }

      collectBolt(player, bolt) {
        bolt.disableBody(true, true);
        boltsCollected++;
        playSound('snd-bolt');
        document.getElementById('bolt-count').innerText = boltsCollected;
      }

      reachFlag() {
        if (boltsCollected >= 5) {
          playSound('snd-win');
          this.scene.pause();
          document.getElementById('overlay-win').style.display = 'flex';
        }
      }
    }

    function initPhaser() {
      const config = {
        type: Phaser.AUTO,
        parent: 'game-container',
        width: window.innerWidth,
        height: window.innerHeight,
        physics: {
          default: 'arcade',
          arcade: { gravity: { y: 900 }, debug: false }
        },
        scene: MainScene
      };
      game = new Phaser.Game(config);
    }
  </script>
</body>
</html>
