<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Dodge</title>
  <style>
    body {
      background-color: #030712;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }
    h1 { color: #38bdf8; margin-bottom: 5px; }
    #hud { font-size: 1.1rem; color: #facc15; margin-bottom: 15px; font-weight: bold; }
    #space {
      width: 300px;
      height: 300px;
      background: #0f172a;
      border: 4px solid #38bdf8;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }
    #star {
      width: 30px;
      height: 30px;
      background: #facc15;
      border-radius: 50%;
      position: absolute;
      top: 135px; left: 135px;
      box-shadow: 0 0 15px #facc15;
    }
    #player {
      width: 16px;
      height: 16px;
      background: #38bdf8;
      border-radius: 50%;
      position: absolute;
      box-shadow: 0 0 8px #38bdf8;
      transform: translate(-8px, -8px);
    }
    .asteroid {
      width: 14px;
      height: 14px;
      background: #ef4444;
      border-radius: 50%;
      position: absolute;
      transform: translate(-7px, -7px);
    }
  </style>
</head>
<body>
  <h1>🌌 Orbital Dodge</h1>
  <div id="hud">Level: <span id="lvl">1 / 3</span> | Survived: <span id="time">0</span>s / 10s</div>

  <div id="space">
    <div id="star"></div>
    <div id="player"></div>
  </div>

  <script>
    const space = document.getElementById('space');
    const playerEl = document.getElementById('player');
    const lvlText = document.getElementById('lvl');
    const timeText = document.getElementById('time');

    let currentLevel = 1;
    let orbitAngle = 0;
    let orbitDir = 1;
    let survivedTime = 0;
    let gameOver = false;
    let asteroids = [];
    let timerId = null;

    const levelSettings = [
      { speed: 0.04, astSpeed: 1.5, spawnRate: 1200 },
      { speed: 0.06, astSpeed: 2.2, spawnRate: 900 },
      { speed: 0.08, astSpeed: 3.0, spawnRate: 600 }
    ];

    space.onclick = () => orbitDir *= -1;

    function spawnAsteroid() {
      if (gameOver) return;
      const angle = Math.random() * Math.PI * 2;
      const x = 150 + Math.cos(angle) * 140;
      const y = 150 + Math.sin(angle) * 140;

      const el = document.createElement('div');
      el.className = 'asteroid';
      space.appendChild(el);

      asteroids.push({ el, x, y, dx: (150 - x) / 100, dy: (150 - y) / 100 });
      setTimeout(spawnAsteroid, levelSettings[currentLevel - 1].spawnRate);
    }

    function startLevel(num) {
      asteroids.forEach(a => a.el.remove());
      asteroids = [];
      survivedTime = 0;
      gameOver = false;
      lvlText.innerText = `${num} / 3`;
      timeText.innerText = survivedTime;

      clearInterval(timerId);
      timerId = setInterval(() => {
        if (!gameOver) {
          survivedTime++;
          timeText.innerText = survivedTime;
          if (survivedTime >= 10) {
            if (currentLevel < 3) {
              currentLevel++;
              startLevel(currentLevel);
            } else {
              gameOver = true;
              document.getElementById('hud').innerText = "🏆 ORBIT SURVIVED! YOU WIN!";
            }
          }
        }
      }, 1000);

      spawnAsteroid();
    }

    function update() {
      if (!gameOver) {
        const set = levelSettings[currentLevel - 1];
        orbitAngle += set.speed * orbitDir;

        const px = 150 + Math.cos(orbitAngle) * 80;
        const py = 150 + Math.sin(orbitAngle) * 80;
        playerEl.style.left = px + 'px';
        playerEl.style.top = py + 'px';

        for (let i = asteroids.length - 1; i >= 0; i--) {
          const a = asteroids[i];
          a.x += a.dx * set.astSpeed;
          a.y += a.dy * set.astSpeed;
          a.el.style.left = a.x + 'px';
          a.el.style.top = a.y + 'px';

          if (Math.hypot(a.x - px, a.y - py) < 14) {
            gameOver = true;
            document.getElementById('hud').innerText = "💥 DESTROYED! Refresh to retry.";
            break;
          }
        }
      }
      requestAnimationFrame(update);
    }

    startLevel(1);
    update();
  </script>
</body>
</html>
