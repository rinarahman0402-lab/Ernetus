<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Missile Defender</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #020617;
      user-select: none;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ef4444;
      font-weight: bold;
      font-size: 1.2rem;
      text-shadow: 0 0 10px #b91c1c;
      pointer-events: none;
    }
    #instructions {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #38bdf8;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 24px;
      border-radius: 8px;
      pointer-events: none;
      text-align: center;
      border: 2px solid #ef4444;
      box-shadow: 0 0 15px #b91c1c;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">🚀 CITIES SAVED: <span id="score">0</span> | CITIES LEFT: <span id="cities">4</span></div>
  <div id="instructions">CLICK / TAP ANYWHERE IN THE SKY TO DETONATE COUNTER-MISSILES!</div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020617);
    scene.fog = new THREE.FogExp2(0x020617, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 25);
    camera.lookAt(0, 5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lights
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(10, 30, 20);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x1e293b, 1));

    // Ground Plane
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 40),
      new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Cities
    const cityMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.6 });
    const cities = [];
    const cityPositions = [-12, -5, 5, 12];

    cityPositions.forEach(x => {
      const city = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 2), cityMat);
      city.position.set(x, 1.5, 0);
      scene.add(city);
      cities.push({ mesh: city, alive: true });
    });

    // Raycasting for Mouse targeting
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const targetPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0); // Sky target plane at z=0

    // Game Entities
    const enemyMissiles = [];
    const blasts = [];
    let score = 0;
    let aliveCities = 4;
    let gameOver = false;

    function spawnEnemyMissile() {
      if (gameOver) return;

      const startX = (Math.random() - 0.5) * 30;
      const targetCity = cities.filter(c => c.alive)[Math.floor(Math.random() * aliveCities)];
      const targetX = targetCity ? targetCity.mesh.position.x : (Math.random() - 0.5) * 20;

      const geo = new THREE.SphereGeometry(0.3, 8, 8);
      const mat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(startX, 22, 0);
      scene.add(mesh);

      const dir = new THREE.Vector3(targetX - startX, -22, 0).normalize();
      enemyMissiles.push({ mesh, dir, speed: 0.12 + Math.random() * 0.08 });
    }

    setInterval(spawnEnemyMissile, 1200);

    // Click to Detonate Blast
    window.addEventListener('pointerdown', (e) => {
      if (gameOver) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const targetPoint = new THREE.Vector3();
      raycaster.ray.intersectPlane(targetPlane, targetPoint);

      if (targetPoint && targetPoint.y > 1) {
        // Create expanding blast sphere
        const blastGeo = new THREE.SphereGeometry(0.5, 16, 16);
        const blastMat = new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.8 });
        const blastMesh = new THREE.Mesh(blastGeo, blastMat);
        blastMesh.position.copy(targetPoint);
        scene.add(blastMesh);

        blasts.push({ mesh: blastMesh, radius: 0.5, maxRadius: 3.5, expanding: true });
      }
    });

    function animate() {
      requestAnimationFrame(animate);

      if (!gameOver) {
        // Update Blasts
        for (let i = blasts.length - 1; i >= 0; i--) {
          const b = blasts[i];
          if (b.expanding) {
            b.radius += 0.12;
            b.mesh.scale.setScalar(b.radius);
            if (b.radius >= b.maxRadius) b.expanding = false;
          } else {
            b.radius -= 0.08;
            b.mesh.scale.setScalar(b.radius);
            if (b.radius <= 0.1) {
              scene.remove(b.mesh);
              blasts.splice(i, 1);
            }
          }
        }

        // Update Enemy Missiles
        for (let i = enemyMissiles.length - 1; i >= 0; i--) {
          const m = enemyMissiles[i];
          m.mesh.position.addScaledVector(m.dir, m.speed);

          // Check Blast Collisions
          let destroyed = false;
          blasts.forEach(b => {
            if (m.mesh.position.distanceTo(b.mesh.position) < b.radius) {
              destroyed = true;
            }
          });

          if (destroyed) {
            scene.remove(m.mesh);
            enemyMissiles.splice(i, 1);
            score++;
            document.getElementById('score').innerText = score;
            continue;
          }

          // Ground/City Hit Check
          if (m.mesh.position.y <= 1.5) {
            scene.remove(m.mesh);
            enemyMissiles.splice(i, 1);

            // Destroy closest city
            cities.forEach(c => {
              if (c.alive && Math.abs(c.mesh.position.x - m.mesh.position.x) < 2) {
                c.alive = false;
                c.mesh.material.color.setHex(0x334155);
                c.mesh.material.emissive.setHex(0x000000);
                aliveCities--;
                document.getElementById('cities').innerText = aliveCities;

                if (aliveCities <= 0) {
                  gameOver = true;
                  document.getElementById('instructions').innerText = `💥 ALL CITIES DESTROYED! Final Score: ${score}. Reload to Try Again!`;
                }
              }
            });
          }
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
