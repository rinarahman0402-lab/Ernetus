<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Mech Fighter Arena</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #020617;
      user-select: none;
      touch-action: manipulation;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #38bdf8;
      font-weight: bold;
      font-size: 1.2rem;
      text-shadow: 0 0 10px #0284c7;
      pointer-events: none;
      z-index: 10;
    }
    #instructions {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      color: #f43f5e;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.85);
      padding: 8px 16px;
      border-radius: 8px;
      text-align: center;
      border: 2px solid #f43f5e;
      z-index: 10;
      font-size: 0.85rem;
      pointer-events: none;
    }
    /* Mobile Controls Overlay */
    .touch-zone {
      position: absolute;
      bottom: 20px;
      z-index: 20;
    }
    #joystick-area {
      left: 20px;
      width: 120px;
      height: 120px;
      background: rgba(56, 189, 248, 0.2);
      border: 2px solid #38bdf8;
      border-radius: 60px;
      touch-action: none;
    }
    #joystick-knob {
      width: 50px;
      height: 50px;
      background: #38bdf8;
      border-radius: 25px;
      position: absolute;
      top: 35px;
      left: 35px;
      pointer-events: none;
    }
    #fire-btn {
      right: 20px;
      bottom: 30px;
      width: 90px;
      height: 90px;
      background: rgba(244, 63, 94, 0.4);
      border: 3px solid #f43f5e;
      border-radius: 45px;
      color: #fff;
      font-weight: bold;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px #e11d48;
    }
    #fire-btn:active {
      background: rgba(244, 63, 94, 0.8);
    }
    #aim-zone {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      z-index: 5;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">🤖 SHIELD: <span id="shield">100</span>% | 💥 KILLS: <span id="score">0</span></div>
  <div id="instructions">Use Joystick to Move | Drag Right Side to Aim | Tap FIRE to Attack</div>

  <!-- Mobile Touch Controls -->
  <div id="joystick-area" class="touch-zone">
    <div id="joystick-knob"></div>
  </div>
  <div id="fire-btn" class="touch-zone">FIRE</div>
  <div id="aim-zone"></div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020617);
    scene.fog = new THREE.FogExp2(0x020617, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lights
    const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
    dirLight.position.set(10, 30, 20);
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0x1e1b4b, 1));

    // Arena Floor
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const grid = new THREE.GridHelper(80, 20, 0x38bdf8, 0x1e293b);
    grid.position.y = 0.01;
    scene.add(grid);

    // Player Mech Setup
    const playerGroup = new THREE.Group();
    playerGroup.position.set(0, 0, 0);
    scene.add(playerGroup);

    const playerTorso = new THREE.Mesh(
      new THREE.BoxGeometry(1.6, 2, 1.2),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3 })
    );
    playerTorso.position.y = 2;
    playerGroup.add(playerTorso);

    const gunMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7 });
    const leftGun = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5), gunMat);
    leftGun.rotation.x = Math.PI / 2;
    leftGun.position.set(-1, 2, -0.8);
    playerGroup.add(leftGun);

    const rightGun = leftGun.clone();
    rightGun.position.x = 1;
    playerGroup.add(rightGun);

    // Game Entities
    const enemies = [];
    const projectiles = [];
    const enemyMat = new THREE.MeshStandardMaterial({ color: 0xe11d48, roughness: 0.3 });
    const playerBoltMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
    const enemyBoltMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e });

    let playerShield = 100;
    let score = 0;
    let gameOver = false;
    let moveVector = { x: 0, z: 0 };
    let aimAngle = 0;

    function spawnEnemy() {
      if (gameOver || enemies.length >= 4) return;
      const group = new THREE.Group();
      const torso = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2, 1.2), enemyMat);
      torso.position.y = 2;
      group.add(torso);

      const angle = Math.random() * Math.PI * 2;
      group.position.set(Math.cos(angle) * 30, 0, Math.sin(angle) * 30);
      scene.add(group);

      enemies.push({ group, cooldown: 0, hp: 3 });
    }

    setInterval(spawnEnemy, 2500);

    // Shooting Function
    function shoot() {
      if (gameOver) return;
      [-1, 1].forEach(offset => {
        const bolt = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), playerBoltMat);
        bolt.position.set(playerGroup.position.x + offset * 0.8, 2, playerGroup.position.z);
        const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(playerGroup.quaternion).normalize();
        scene.add(bolt);
        projectiles.push({ mesh: bolt, dir, isPlayer: true, speed: 0.8 });
      });
    }

    // Touch Joystick Controls
    const joyArea = document.getElementById('joystick-area');
    const joyKnob = document.getElementById('joystick-knob');

    joyArea.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = joyArea.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let dx = touch.clientX - centerX;
      let dy = touch.clientY - centerY;
      const dist = Math.hypot(dx, dy);
      const maxDist = 40;

      if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
      }

      joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      moveVector.x = dx / maxDist;
      moveVector.z = dy / maxDist;
    });

    const resetJoystick = () => {
      joyKnob.style.transform = `translate(0px, 0px)`;
      moveVector.x = 0;
      moveVector.z = 0;
    };

    joyArea.addEventListener('touchend', resetJoystick);
    joyArea.addEventListener('touchcancel', resetJoystick);

    // Aim Touch Zone
    const aimZone = document.getElementById('aim-zone');
    aimZone.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const rect = aimZone.getBoundingClientRect();
      const dx = touch.clientX - (rect.left + rect.width / 2);
      const dy = touch.clientY - (rect.top + rect.height / 2);
      aimAngle = Math.atan2(-dx, -dy);
    });

    // Fire Button
    const fireBtn = document.getElementById('fire-btn');
    fireBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      shoot();
    });

    // Keyboard Fallbacks
    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', e => {
      if (e.key === 'w') keys.w = true;
      if (e.key === 's') keys.s = true;
      if (e.key === 'a') keys.a = true;
      if (e.key === 'd') keys.d = true;
      if (e.key === ' ') shoot();
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'w') keys.w = false;
      if (e.key === 's') keys.s = false;
      if (e.key === 'a') keys.a = false;
      if (e.key === 'd') keys.d = false;
    });

    function animate() {
      requestAnimationFrame(animate);

      if (!gameOver) {
        // Apply Joystick / Keyboard movement
        const speed = 0.2;
        let vx = moveVector.x * speed;
        let vz = moveVector.z * speed;

        if (keys.w) vz -= speed;
        if (keys.s) vz += speed;
        if (keys.a) vx -= speed;
        if (keys.d) vx += speed;

        playerGroup.position.x += vx;
        playerGroup.position.z += vz;

        playerGroup.position.x = Math.max(-38, Math.min(38, playerGroup.position.x));
        playerGroup.position.z = Math.max(-38, Math.min(38, playerGroup.position.z));

        // Mech Rotation
        if (aimAngle !== 0) {
          playerGroup.rotation.y = aimAngle;
        }

        // Camera Follow
        camera.position.set(playerGroup.position.x, playerGroup.position.y + 12, playerGroup.position.z + 16);
        camera.lookAt(playerGroup.position);

        // Update Projectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];
          p.mesh.position.addScaledVector(p.dir, p.speed);

          if (p.isPlayer) {
            enemies.forEach((e, eIdx) => {
              if (p.mesh.position.distanceTo(e.group.position) < 1.8) {
                e.hp--;
                scene.remove(p.mesh);
                projectiles.splice(i, 1);

                if (e.hp <= 0) {
                  scene.remove(e.group);
                  enemies.splice(eIdx, 1);
                  score++;
                  document.getElementById('score').innerText = score;
                }
              }
            });
          } else {
            if (p.mesh.position.distanceTo(playerGroup.position) < 1.5) {
              scene.remove(p.mesh);
              projectiles.splice(i, 1);
              playerShield = Math.max(0, playerShield - 10);
              document.getElementById('shield').innerText = playerShield;

              if (playerShield <= 0) {
                gameOver = true;
                document.getElementById('instructions').innerText = `💥 CRITICAL FAILURE! Score: ${score}. Reload to retry!`;
              }
            }
          }
        }

        // Enemy AI
        enemies.forEach(e => {
          e.group.lookAt(playerGroup.position);
          const dirToPlayer = new THREE.Vector3().subVectors(playerGroup.position, e.group.position).normalize();
          e.group.position.addScaledVector(dirToPlayer, 0.05);

          e.cooldown++;
          if (e.cooldown > 90) {
            e.cooldown = 0;
            const bolt = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), enemyBoltMat);
            bolt.position.set(e.group.position.x, 2, e.group.position.z);
            scene.add(bolt);
            projectiles.push({ mesh: bolt, dir: dirToPlayer.clone(), isPlayer: false, speed: 0.35 });
          }
        });
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
