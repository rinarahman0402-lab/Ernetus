<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Mech Fighter Arena</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #020617;
      user-select: none;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #38bdf8;
      font-weight: bold;
      font-size: 1.2rem;
      text-shadow: 0 0 10px #0284c7;
      pointer-events: none;
    }
    #instructions {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: #f43f5e;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 24px;
      border-radius: 8px;
      pointer-events: none;
      text-align: center;
      border: 2px solid #f43f5e;
      box-shadow: 0 0 15px #e11d48;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">🤖 SHIELD: <span id="shield">100</span>% | 💥 MECHS DESTROYED: <span id="score">0</span></div>
  <div id="instructions">WASD to Move | MOUSE to Aim | CLICK to Fire Plasma Cannons!</div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020617);
    scene.fog = new THREE.FogExp2(0x020617, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lights
    const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
    dirLight.position.set(10, 30, 20);
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0x1e1b4b, 1));

    // Arena Floor
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const grid = new THREE.GridHelper(80, 20, 0x38bdf8, 0x1e293b);
    grid.position.y = 0.01;
    scene.add(grid);

    // Player Mech Setup
    const playerGroup = new THREE.Group();
    playerGroup.position.set(0, 0, 0);
    scene.add(playerGroup);

    const playerTorso = new THREE.Mesh(
      new THREE.BoxGeometry(1.6, 2, 1.2),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3 })
    );
    playerTorso.position.y = 2;
    playerGroup.add(playerTorso);

    // Player Guns
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7 });
    const leftGun = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5), gunMat);
    leftGun.rotation.x = Math.PI / 2;
    leftGun.position.set(-1, 2, -0.8);
    playerGroup.add(leftGun);

    const rightGun = leftGun.clone();
    rightGun.position.x = 1;
    playerGroup.add(rightGun);

    // Game Entities
    const enemies = [];
    const projectiles = [];
    const enemyMat = new THREE.MeshStandardMaterial({ color: 0xe11d48, roughness: 0.3 });
    const playerBoltMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
    const enemyBoltMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e });

    let playerShield = 100;
    let score = 0;
    let gameOver = false;

    function spawnEnemy() {
      if (gameOver || enemies.length >= 4) return;
      const group = new THREE.Group();
      const torso = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2, 1.2), enemyMat);
      torso.position.y = 2;
      group.add(torso);

      const angle = Math.random() * Math.PI * 2;
      group.position.set(Math.cos(angle) * 30, 0, Math.sin(angle) * 30);
      scene.add(group);

      enemies.push({ group, cooldown: 0, hp: 3 });
    }

    setInterval(spawnEnemy, 2500);

    // Controls
    const keys = { w: false, a: false, s: false, d: false };
    const mouse = new THREE.Vector2();
    const raycaster = new THREE.Raycaster();
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    window.addEventListener('keydown', e => {
      if (e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
      if (e.key === 's' || e.key === 'ArrowDown') keys.s = true;
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
      if (e.key === 's' || e.key === 'ArrowDown') keys.s = false;
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
    });

    window.addEventListener('mousemove', e => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener('pointerdown', () => {
      if (gameOver) return;
      // Shoot double bolts
      [-1, 1].forEach(offset => {
        const bolt = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), playerBoltMat);
        bolt.position.set(playerGroup.position.x + offset * 0.8, 2, playerGroup.position.z);
        const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(playerGroup.quaternion).normalize();
        scene.add(bolt);
        projectiles.push({ mesh: bolt, dir, isPlayer: true, speed: 0.8 });
      });
    });

    function animate() {
      requestAnimationFrame(animate);

      if (!gameOver) {
        // Player Movement
        const speed = 0.2;
        if (keys.w) playerGroup.position.z -= speed;
        if (keys.s) playerGroup.position.z += speed;
        if (keys.a) playerGroup.position.x -= speed;
        if (keys.d) playerGroup.position.x += speed;

        // Keep inside arena limits
        playerGroup.position.x = Math.max(-38, Math.min(38, playerGroup.position.x));
        playerGroup.position.z = Math.max(-38, Math.min(38, playerGroup.position.z));

        // Aim player torso at mouse ray intersection
        raycaster.setFromCamera(mouse, camera);
        const hitPoint = new THREE.Vector3();
        raycaster.ray.intersectPlane(groundPlane, hitPoint);
        if (hitPoint) {
          playerGroup.lookAt(hitPoint.x, playerGroup.position.y, hitPoint.z);
        }

        // Camera Follow
        camera.position.set(playerGroup.position.x, playerGroup.position.y + 12, playerGroup.position.z + 16);
        camera.lookAt(playerGroup.position);

        // Update Projectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];
          p.mesh.position.addScaledVector(p.dir, p.speed);

          if (p.isPlayer) {
            // Hit Enemies
            enemies.forEach((e, eIdx) => {
              if (p.mesh.position.distanceTo(e.group.position) < 1.8) {
                e.hp--;
                scene.remove(p.mesh);
                projectiles.splice(i, 1);

                if (e.hp <= 0) {
                  scene.remove(e.group);
                  enemies.splice(eIdx, 1);
                  score++;
                  document.getElementById('score').innerText = score;
                }
              }
            });
          } else {
            // Hit Player
            if (p.mesh.position.distanceTo(playerGroup.position) < 1.5) {
              scene.remove(p.mesh);
              projectiles.splice(i, 1);
              playerShield = Math.max(0, playerShield - 10);
              document.getElementById('shield').innerText = playerShield;

              if (playerShield <= 0) {
                gameOver = true;
                document.getElementById('instructions').innerText = `💥 CRITICAL FAILURE! Final Score: ${score}. Reload to fight again!`;
              }
            }
          }
        }

        // Enemy AI & Firing
        enemies.forEach(e => {
          e.group.lookAt(playerGroup.position);
          const dirToPlayer = new THREE.Vector3().subVectors(playerGroup.position, e.group.position).normalize();
          e.group.position.addScaledVector(dirToPlayer, 0.05);

          e.cooldown++;
          if (e.cooldown > 90) {
            e.cooldown = 0;
            const bolt = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), enemyBoltMat);
            bolt.position.set(e.group.position.x, 2, e.group.position.z);
            scene.add(bolt);
            projectiles.push({ mesh: bolt, dir: dirToPlayer.clone(), isPlayer: false, speed: 0.35 });
          }
        });
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
