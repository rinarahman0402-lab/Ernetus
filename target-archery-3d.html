<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Target Archery 3D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
      user-select: none;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #22c55e;
      font-weight: bold;
      font-size: 1.2rem;
      text-shadow: 2px 2px 4px #000;
      pointer-events: none;
    }
    #instructions {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #facc15;
      font-weight: bold;
      background: rgba(0,0,0,0.7);
      padding: 12px 24px;
      border-radius: 8px;
      pointer-events: none;
      text-align: center;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.7);
      border-radius: 50%;
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">🎯 Score: <span id="score">0</span> | Shots Left: <span id="shots">5</span></div>
  <div id="crosshair"></div>
  <div id="instructions">Click and hold to pull bow, release to shoot!</div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x38bdf8);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(10, 30, 20);
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x64748b, 0.8));

    // Target Stand & Target
    const targetGroup = new THREE.Group();
    const outerGeo = new THREE.CylinderGeometry(2, 2, 0.2, 32);
    const outerMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
    const targetMesh = new THREE.Mesh(outerGeo, outerMat);
    targetMesh.rotation.x = Math.PI / 2;
    targetGroup.add(targetMesh);

    const bullseyeGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.22, 32);
    const bullseyeMat = new THREE.MeshStandardMaterial({ color: 0xfacc15 });
    const bullseye = new THREE.Mesh(bullseyeGeo, bullseyeMat);
    bullseye.rotation.x = Math.PI / 2;
    targetGroup.add(bullseye);

    targetGroup.position.set(0, 2, -30);
    scene.add(targetGroup);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshStandardMaterial({ color: 0x15803d })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Arrow
    const arrowGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.5);
    const arrowMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
    const arrow = new THREE.Mesh(arrowGeo, arrowMat);
    arrow.rotation.x = Math.PI / 2;
    arrow.position.set(0, 1.2, 4);
    scene.add(arrow);

    let isCharging = false;
    let power = 0;
    let arrowFlying = false;
    let arrowVel = new THREE.Vector3();
    let score = 0;
    let shotsLeft = 5;

    window.addEventListener('pointerdown', () => {
      if (arrowFlying || shotsLeft <= 0) return;
      isCharging = true;
      power = 0;
    });

    window.addEventListener('pointerup', () => {
      if (!isCharging || arrowFlying) return;
      isCharging = false;
      arrowFlying = true;
      shotsLeft--;
      document.getElementById('shots').innerText = shotsLeft;
      arrowVel.set(0, 0.05, -Math.max(0.6, power * 1.5));
    });

    function animate() {
      requestAnimationFrame(animate);

      if (isCharging) {
        power = Math.min(1, power + 0.03);
        arrow.position.z = 4 + power * 0.4;
      }

      if (arrowFlying) {
        arrow.position.add(arrowVel);
        arrowVel.y -= 0.0015; // Gravity drop

        // Target Hit Check
        if (arrow.position.z <= targetGroup.position.z + 0.1) {
          arrowFlying = false;
          const hitDist = Math.hypot(arrow.position.x - targetGroup.position.x, arrow.position.y - targetGroup.position.y);

          if (hitDist < 0.6) {
            score += 100;
            document.getElementById('instructions').innerText = "🎯 BULLSEYE! +100 PTS!";
          } else if (hitDist < 2.0) {
            score += 50;
            document.getElementById('instructions').innerText = "🎯 HIT! +50 PTS!";
          } else {
            document.getElementById('instructions').innerText = "❌ MISSED TARGET!";
          }

          document.getElementById('score').innerText = score;

          // Reset Arrow after 1.5s
          setTimeout(resetArrow, 1500);
        }
      }

      // Wobble Target laterally
      targetGroup.position.x = Math.sin(Date.now() * 0.002) * 3;

      renderer.render(scene, camera);
    }

    function resetArrow() {
      if (shotsLeft <= 0) {
        document.getElementById('instructions').innerText = `🏆 GAME OVER! Final Score: ${score}. Reload to Play Again!`;
        return;
      }
      arrow.position.set(0, 1.2, 4);
      document.getElementById('instructions').innerText = "Click and hold to pull bow, release to shoot!";
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
