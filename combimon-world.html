<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combimon World</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: linear-gradient(to bottom, #87CEEB 0%, #7dd87d 100%); min-height: 100vh; }
  #top-bar { background: #222; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #000; }
  #coins { background: gold; color: #000; padding: 10px 20px; border-radius: 25px; font-weight: bold; border: 3px solid #B8860B; }
  #game-container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
  .zone { background: white; border: 5px solid #333; border-radius: 20px; padding: 15px; min-height: 280px; box-shadow: 0 8px 0 #333; }
  .zone-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 3px solid #ccc; }
  .zone-icon { width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .combimon-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; min-height: 100px; }
  .combimon-card { width: 90px; height: 90px; background: #f0f0f0; border: 3px solid #555; border-radius: 14px; overflow: hidden; position: relative; cursor: pointer; }
  .combimon-card img { width: 100%; height: 100%; object-fit: cover; }
  .combimon-card .name { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); color: white; font-size: 10px; text-align: center; padding: 3px; }
  .btn { background: #4CAF50; color: white; border: none; padding: 12px 20px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; border-bottom: 4px solid #2E7D32; margin: 8px 4px; width: 100%; }
  #pokedex { grid-column: 1 / -1; background: linear-gradient(#ff6666, #cc0000); color: white; }
  #dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 12px; margin-top: 15px; }
  .dex-slot { background: rgba(255,255,255,0.2); border: 3px solid white; border-radius: 12px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 45px; font-weight: bold; }
  .dex-caught { background: white; }
  #farm { background: linear-gradient(#deb887, #cd853f); }
  #egg-zone { background: linear-gradient(#ffe4e1, #ffc0cb); }
  #kid-zone { background: linear-gradient(#add8e6, #87CEEB); }
  #teen-zone { background: #dda0dd; }
  #adult-zone { background: linear-gradient(#90ee90, #32CD32); }
</style>
</head>
<body>

<div id="top-bar">
  <h1>COMBIMON WORLD</h1>
  <div id="coins">💰 0</div>
</div>

<div id="game-container">

  <div class="zone" id="pokedex">
    <div class="zone-header"><div class="zone-icon">📖</div><h2 id="dex-title">POKEDEX - 0/15 CAUGHT</h2></div>
    <button class="btn" onclick="catchRandom()">CATCH RANDOM COMBIMON - 100 Coins</button>
    <div id="dex-grid"></div>
  </div>

  <div class="zone" id="farm">
    <div class="zone-header"><div class="zone-icon">🏠</div><h2>BREEDING FARM</h2></div>
    <p>Need 2 Adults to make Egg</p>
    <div class="combimon-grid" id="farm-grid"></div>
    <button class="btn" onclick="makeEgg()">BREED → MAKE EGG</button>
  </div>

  <div class="zone" id="egg-zone">
    <div class="zone-header"><div class="zone-icon">🥚</div><h2>EGG ZONE</h2></div>
    <p>Hatches in <span id="egg-timer">30</span>s</p>
    <div class="combimon-grid" id="egg-grid"></div>
  </div>

  <div class="zone" id="kid-zone">
    <div class="zone-header"><div class="zone-icon">👶</div><h2>KID COMBIMONS</h2></div>
    <p>Evolves in <span id="kid-timer">20</span>s</p>
    <div class="combimon-grid" id="kid-grid"></div>
  </div>

  <div class="zone" id="teen-zone">
    <div class="zone-header"><div class="zone-icon">🧒</div><h2>TEEN COMBIMONS</h2></div>
    <p>Evolves in <span id="teen-timer">20</span>s</p>
    <div class="combimon-grid" id="teen-grid"></div>
  </div>

  <div class="zone" id="adult-zone">
    <div class="zone-header"><div class="zone-icon">💪</div><h2>ADULT COMBIMONS</h2></div>
    <p>Can breed now!</p>
    <div class="combimon-grid" id="adult-grid"></div>
  </div>

</div>

<script>
  const ALL_COMBIMONS = [
    {id: 1, name: "Flufflet", img: "https://placehold.co/90x90/FFFFFF/000?text=Fluff", stage: "kid"},
    {id: 2, name: "Sparky", img: "https://placehold.co/90x90/FFFF00/000?text=Spark", stage: "kid"},
    {id: 3, name: "Aqua Pebble", img: "https://placehold.co/90x90/00BFFF/000?text=Aqua", stage: "kid"},
    {id: 4, name: "Leaflet", img: "https://placehold.co/90x90/32CD32/000?text=Leaf", stage: "kid"},
    {id: 5, name: "Emberling", img: "https://placehold.co/90x90/FF4500/fff?text=Ember", stage: "kid"},
    {id: 6, name: "Voltpaw", img: "https://placehold.co/90x90/FFD700/000?text=Volt", stage: "teen"},
    {id: 7, name: "Coralax", img: "https://placehold.co/90x90/FF69B4/000?text=Coral", stage: "teen"},
    {id: 8, name: "Thornite", img: "https://placehold.co/90x90/228B22/fff?text=Thorn", stage: "teen"},
    {id: 9, name: "Blazekit", img: "https://placehold.co/90x90/FF0000/fff?text=Blaze", stage: "teen"},
    {id: 10, name: "Mystiqueen", img: "https://placehold.co/90x90/9370DB/fff?text=Mystic", stage: "teen"},
    {id: 11, name: "Zapheron", img: "https://placehold.co/90x90/FFA500/000?text=Zap", stage: "adult"},
    {id: 12, name: "Tidalord", img: "https://placehold.co/90x90/0000CD/fff?text=Tidal", stage: "adult"},
    {id: 13, name: "Floraking", img: "https://placehold.co/90x90/006400/fff?text=Flora", stage: "adult"},
    {id: 14, name: "Infernox", img: "https://placehold.co/90x90/DC143C/fff?text=Infer", stage: "adult"},
    {id: 15, name: "Cosmirage", img: "https://placehold.co/90x90/4B0082/fff?text=Cosmo", stage: "adult"}
  ];

  let player = { coins: 500, caught: [], eggs: [], kids: [], teens: [], adults: [] };
  let eggTime = 30, kidTime = 20, teenTime = 20;

  function catchRandom() {
    if(player.coins < 100) return alert("Not enough coins!");
    const available = ALL_COMBIMONS.filter(c => !player.caught.includes(c.id));
    if(available.length === 0) return alert("All caught!");
    const c = available[Math.floor(Math.random() * available.length)];
    player.coins -= 100;
    player.caught.push(c.id);
    if(c.stage === 'kid') player.kids.push({...c});
    if(c.stage === 'teen') player.teens.push({...c});
    if(c.stage === 'adult') player.adults.push({...c});
    updateUI();
  }

  function makeEgg() {
    if(player.adults.length < 2) return alert("Need 2 adults in farm!");
    player.adults.pop(); player.adults.pop();
    player.eggs.push({time: 30});
    updateUI();
  }

  function updateUI() {
    document.getElementById('coins').innerText = `💰 ${player.coins}`;
    document.getElementById('dex-title').innerText = `POKEDEX - ${player.caught.length}/15 CAUGHT`;
    
    const grids = {egg: 'egg-grid', kid: 'kid-grid', teen: 'teen-grid', adult: 'adult-grid'};
    Object.values(grids).forEach(id => document.getElementById(id).innerHTML = '');
    
    player.eggs.forEach(() => addCard('egg-grid', '🥚', 'Egg'));
    player.kids.forEach(c => addCard('kid-grid', c.img, c.name));
    player.teens.forEach(c => addCard('teen-grid', c.img, c.name));
    player.adults.forEach(c => addCard('adult-grid', c.img, c.name));
    
    const dex = document.getElementById('dex-grid'); dex.innerHTML = '';
    ALL_COMBIMONS.forEach(c => {
      const slot = document.createElement('div');
      slot.className = 'dex-slot' + (player.caught.includes(c.id) ? ' dex-caught' : '');
      slot.innerHTML = player.caught.includes(c.id) ? `<img src="${c.img}">` : '?';
      dex.appendChild(slot);
    });
  }

  function addCard(gridId, img, name) {
    const card = document.createElement('div');
    card.className = 'combimon-card';
    card.innerHTML = img.startsWith('http') ? `<img src="${img}"><div class="name">${name}</div>` : `<div style="font-size:40px">${img}</div><div class="name">${name}</div>`;
    document.getElementById(gridId).appendChild(card);
  }

  // GAME LOOP
  setInterval(() => {
    if(player.eggs.length > 0) {
      eggTime--;
      document.getElementById('egg-timer').innerText = eggTime;
      if(eggTime <= 0) {
        eggTime = 30;
        const randomKid = ALL_COMBIMONS.filter(c => c.stage === 'kid')[Math.floor(Math.random() * 5)];
        player.eggs.pop();
        player.kids.push({...randomKid});
      }
    }
    if(player.kids.length > 0) {
      kidTime--;
      document.getElementById('kid-timer').innerText = kidTime;
      if(kidTime <= 0) {
        kidTime = 20;
        const kid = player.kids.pop();
        const teen = ALL_COMBIMONS.find(c => c.stage === 'teen' && c.id === kid.id + 5);
        player.teens.push({...teen});
      }
    }
    if(player.teens.length > 0) {
      teenTime--;
      document.getElementById('teen-timer').innerText = teenTime;
      if(teenTime <= 0) {
        teenTime = 20;
        const teen = player.teens.pop();
        const adult = ALL_COMBIMONS.find(c => c.stage === 'adult' && c.id === teen.id + 5);
        player.adults.push({...adult});
      }
    }
    updateUI();
  }, 1000);

  updateUI();
</script>

</body>
</html>
