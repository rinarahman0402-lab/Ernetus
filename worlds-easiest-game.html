<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>World's Easiest Game</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      overflow: hidden; font-family: 'Impact', 'Arial Black', sans-serif;
      background: #0f172a; user-select: none; -webkit-user-select: none; touch-action: none;
    }
    #ui {
      position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
      text-align: center; color: #fff; z-index: 10; pointer-events: none; width: 90%;
    }
    #status-box {
      margin-top: 15px; font-size: 1.5rem; color: #22c55e;
      text-shadow: 0 0 10px #16a34a; transition: all 0.2s;
    }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(239, 68, 68, 0.9); display: none; flex-direction: column;
      align-items: center; justify-content: center; color: #fff; z-index: 100;
      text-align: center; padding: 20px;
    }
    .btn {
      background: #22c55e; color: #000; border: 4px solid #fff;
      padding: 16px 32px; border-radius: 12px; font-weight: bold;
      font-size: 1.2rem; cursor: pointer; margin-top: 20px;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
    }
    .btn:active { transform: scale(0.95); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">
    <h1 style="margin: 0; font-size: 2.2rem; color: #facc15; text-shadow: 0 0 12px #ca8a04;">
      🏆 WORLD'S EASIEST GAME
    </h1>
    <div id="status-box">Press the Big Green Win Button!</div>
  </div>

  <div id="overlay">
    <h1 style="font-size: 4rem; margin: 0; text-shadow: 0 0 20px #000;">💥 YOU LOST! 💥</h1>
    <p style="font-size: 1.5rem; margin-top: 10px;">How could you press the button?! Unbelievable.</p>
    <button class="btn" style="background: #fff; color: #ef4444;" onclick="resetGame()">TRY AGAIN</button>
  </div>

  <script>
    let scene, camera, renderer, buttonMesh;

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 3, 5);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1.5);
      light.position.set(2, 5, 5);
      scene.add(light, new THREE.AmbientLight(0xffffff, 0.4));

      // Golden Stand
      const baseGeo = new THREE.CylinderGeometry(2, 2.2, 0.6, 32);
      const baseMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.8, roughness: 0.2 });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.position.y = -0.3;
      scene.add(base);

      // Shiny Green Button
      const btnGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.5, 32);
      const btnMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.1, emissive: 0x15803d });
      buttonMesh = new THREE.Mesh(btnGeo, btnMat);
      buttonMesh.position.y = 0.2;
      scene.add(buttonMesh);

      setupRaycaster();
      animate();
    }

    function setupRaycaster() {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      const handlePress = (clientX, clientY) => {
        mouse.x = (clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(buttonMesh);

        if (intersects.length > 0) {
          // Button press animation
          buttonMesh.position.y = 0.05;
          setTimeout(() => {
            buttonMesh.position.y = 0.2;
            document.getElementById('overlay').style.display = 'flex';
          }, 150);
        }
      };

      window.addEventListener('mousedown', e => handlePress(e.clientX, e.clientY));
      window.addEventListener('touchstart', e => handlePress(e.touches[0].clientX, e.touches[0].clientY));
    }

    function resetGame() {
      document.getElementById('overlay').style.display = 'none';
    }

    function animate() {
      requestAnimationFrame(animate);

      // Slow elegant 3D tilt
      scene.rotation.y = Math.sin(Date.now() * 0.001) * 0.2;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
  </script>
</body>
</html>
