<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RATS VS CATS</title>
<style>
  body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial;
    color: white;
  }
  #game {
    width: 600px;
    height: 600px;
    background: #d4a373;
    border: 5px solid #000;
    position: relative;
    overflow: hidden;
  }
  .entity {
    position: absolute;
    font-size: 40px;
    text-align: center;
    width: 50px;
    height: 50px;
    line-height: 50px;
  }
  #player { color: #8b5a2b; }
  .cat { color: #ff0000; }
  #blackCat { color: #000; text-shadow: 0 0 5px #fff; }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 20px;
    background: rgba(0,0,0,0.5);
    padding: 10px;
  }
  #gameOver {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    background: #000;
    padding: 30px;
    font-size: 30px;
    display: none;
    text-align: center;
  }
</style>
</head>
<body>
<div id="game">
  <div id="hud">Time: <span id="time">60</span>s</div>
  <div id="player" class="entity">🐀</div>
  <div id="cat1" class="entity cat">🐈</div>
  <div id="cat2" class="entity cat">🐁</div>
  <div id="blackCat" class="entity">🐈‍⬛</div>
  <div id="gameOver"></div>
</div>

<script>
let player = {x: 300, y: 300, speed: 5};
let cats = [
  {x: 100, y: 100, speed: 2, el: document.getElementById('cat1')},
  {x: 500, y: 500, speed: 2.5, el: document.getElementById('cat2')},
  {x: 300, y: 50, speed: 3, el: document.getElementById('blackCat')}
];
let keys = {};
let time = 60;
let gameActive = true;

document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

function movePlayer() {
  if(keys['ArrowUp']) player.y -= player.speed;
  if(keys['ArrowDown']) player.y += player.speed;
  if(keys['ArrowLeft']) player.x -= player.speed;
  if(keys['ArrowRight']) player.x += player.speed;
  
  player.x = Math.max(0, Math.min(550, player.x));
  player.y = Math.max(0, Math.min(550, player.y));
  
  document.getElementById('player').style.left = player.x + 'px';
  document.getElementById('player').style.top = player.y + 'px';
}

function moveCats() {
  cats.forEach(cat => {
    let dx = player.x - cat.x;
    let dy = player.y - cat.y;
    let dist = Math.sqrt(dx*dx + dy*dy);
    
    cat.x += (dx/dist) * cat.speed;
    cat.y += (dy/dist) * cat.speed;
    
    cat.el.style.left = cat.x + 'px';
    cat.el.style.top = cat.y + 'px';
    
    if(dist < 40) gameOver();
  });
}

function gameOver() {
  gameActive = false;
  document.getElementById('gameOver').innerHTML = "⊙⁠﹏⁠⊙<br>CAUGHT!<br><button onclick='location.reload()'>RETRY</button>";
  document.getElementById('gameOver').style.display = 'block';
}

function gameLoop() {
  if(!gameActive) return;
  movePlayer();
  moveCats();
  time -= 1/60;
  document.getElementById('time').innerText = Math.ceil(time);
  
  if(time <= 0) {
    gameActive = false;
    document.getElementById('gameOver').innerHTML = "YOU SURVIVED!<br><button onclick='location.reload()'>PLAY AGAIN</button>";
    document.getElementById('gameOver').style.display = 'block';
  }
  
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
