<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RATS VS CATS</title>
<style>
  body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial;
    color: white;
    overflow: hidden;
    touch-action: none;
  }
  #game {
    width: 100vw;
    max-width: 600px;
    height: 100vh;
    max-height: 600px;
    background: #d4a373;
    border: 5px solid #000;
    position: relative;
    overflow: hidden;
  }
 .entity {
    position: absolute;
    font-size: 8vw;
    max-font-size: 40px;
    text-align: center;
    width: 50px;
    height: 50px;
    line-height: 50px;
  }
  #player { color: #8b5a2b; }
 .cat { color: #ff0000; }
  #blackCat { color: #000; text-shadow: 0 0 5px #fff; }
  #cheese { color: #ffd700; }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 16px;
    background: rgba(0,0,0,0.5);
    padding: 10px;
    z-index: 30;
  }
  #gameOver {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    background: #000;
    padding: 30px;
    font-size: 24px;
    display: none;
    text-align: center;
    z-index: 40;
  }
  /* MOBILE CONTROLS */
  #controls {
    position: absolute;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 50;
  }
 .dpad {
    display: grid;
    grid-template: "up up up" "left center right" "down down down";
    gap: 5px;
  }
 .btn {
    width: 60px;
    height: 60px;
    background: rgba(0,0,0,0.4);
    border: 2px solid #fff;
    border-radius: 15px;
    font-size: 30px;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
  }
 .btn:active { background: rgba(255,255,255,0.5); }
  #up { grid-area: up; }
  #left { grid-area: left; }
  #right { grid-area: right; }
  #down { grid-area: down; }
  #turboBtn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(255,215,0,0.4);
    border: 3px solid gold;
    font-size: 14px;
  }
</style>
</head>
<body>
<div id="game">
  <div id="hud">Time: <span id="time">60</span>s | Turbo: <span id="turbo">READY</span></div>
  <div id="player" class="entity">🐀</div>
  <div id="cat1" class="entity cat">🐈</div>
  <div id="cat2" class="entity cat">🐁</div>
  <div id="blackCat" class="entity">🐈‍⬛</div>
  <div id="cheese" class="entity">🧀</div>
  <div id="gameOver"></div>

  <div id="controls">
    <div class="dpad">
      <div class="btn" id="up">↑</div>
      <div class="btn" id="left">←</div>
      <div class="btn" id="center"></div>
      <div class="btn" id="right">→</div>
      <div class="btn" id="down">↓</div>
    </div>
    <div class="btn" id="turboBtn">TURBO<br>🧀</div>
  </div>
</div>

<script>
let player = {x: 300, y: 300, speed: 5, baseSpeed: 5, turbo: false, turboTime: 0};
let cats = [
  {x: 100, y: 100, speed: 2, el: document.getElementById('cat1')},
  {x: 500, y: 500, speed: 2.5, el: document.getElementById('cat2')},
  {x: 300, y: 50, speed: 3, el: document.getElementById('blackCat')}
];
let cheese = {x: 450, y: 450};
let keys = {up:false, down:false, left:false, right:false};
let time = 60;
let gameActive = true;

// Keyboard
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowUp') keys.up = true;
  if(e.key === 'ArrowDown') keys.down = true;
  if(e.key === 'ArrowLeft') keys.left = true;
  if(e.key === 'ArrowRight') keys.right = true;
});
document.addEventListener('keyup', e => {
  if(e.key === 'ArrowUp') keys.up = false;
  if(e.key === 'ArrowDown') keys.down = false;
  if(e.key === 'ArrowLeft') keys.left = false;
  if(e.key === 'ArrowRight') keys.right = false;
});

// Mobile buttons
function addTouch(btn, dir) {
  btn.addEventListener('touchstart', e => { e.preventDefault(); keys[dir] = true; });
  btn.addEventListener('touchend', e => { e.preventDefault(); keys[dir] = false; });
  btn.addEventListener('mousedown', () => keys[dir] = true);
  btn.addEventListener('mouseup', () => keys[dir] = false);
}
addTouch(document.getElementById('up'), 'up');
addTouch(document.getElementById('down'), 'down');
addTouch(document.getElementById('left'), 'left');
addTouch(document.getElementById('right'), 'right');

document.getElementById('turboBtn').addEventListener('touchstart', e => { e.preventDefault(); useTurbo(); });
document.getElementById('turboBtn').addEventListener('click', useTurbo);

function useTurbo() {
  if(!player.turbo && player.turboTime <= 0) {
    player.turbo = true;
    player.speed = player.baseSpeed * 2;
    player.turboTime = 180; // 3 seconds
    document.getElementById('turbo').innerText = "GO!";
  }
}

function update() {
  if(!gameActive) return;

  // Move player
  if(keys.up) player.y -= player.speed;
  if(keys.down) player.y += player.speed;
  if(keys.left) player.x -= player.speed;
  if(keys.right) player.x += player.speed;

  player.x = Math.max(0, Math.min(550, player.x));
  player.y = Math.max(0, Math.min(550, player.y));

  // Turbo timer
  if(player.turbo) {
    player.turboTime--;
    if(player.turboTime <= 0) {
      player.turbo = false;
      player.speed = player.baseSpeed;
      document.getElementById('turbo').innerText = "READY";
    }
  }

  // Move cats
  cats.forEach(cat => {
    let dx = player.x - cat.x;
    let dy = player.y - cat.y;
    let dist = Math.sqrt(dx*dx + dy*dy);
    cat.x += (dx/dist) * cat.speed;
    cat.y += (dy/dist) * cat.speed;
    cat.el.style.left = cat.x + 'px';
    cat.el.style.top = cat.y + 'px';
    if(dist < 40) gameOver();
  });

  // Cheese pickup
  if(Math.abs(player.x - cheese.x) < 40 && Math.abs(player.y - cheese.y) < 40) {
    cheese.x = Math.random() * 500;
    cheese.y = Math.random() * 500;
    useTurbo();
  }

  // Update positions
  document.getElementById('player').style.left = player.x + 'px';
  document.getElementById('player').style.top = player.y + 'px';
  document.getElementById('cheese').style.left = cheese.x + 'px';
  document.getElementById('cheese').style.top = cheese.y + 'px';

  // Timer
  time -= 1/60;
  document.getElementById('time').innerText = Math.ceil(time);

  if(time <= 0) {
    gameActive = false;
    document.getElementById('gameOver').innerHTML = "YOU SURVIVED!<br><button onclick='location.reload()'>PLAY AGAIN</button>";
    document.getElementById('gameOver').style.display = 'block';
  }

  requestAnimationFrame(update);
}

function gameOver() {
  gameActive = false;
  document.getElementById('gameOver').innerHTML = "⊙⁠﹏⁠⊙<br>CAUGHT!<br><button onclick='location.reload()'>RETRY</button>";
  document.getElementById('gameOver').style.display = 'block';
}

update();
</script>
</body>
</html>
