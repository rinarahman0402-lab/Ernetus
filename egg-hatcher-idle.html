<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Egg Hatcher Idle</title>
  <style>
    body {
      background-color: #0c0a09;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }

    h1 { color: #f59e0b; margin-bottom: 5px; }
    #hud { font-size: 1.1rem; color: #fef08a; margin-bottom: 12px; font-weight: bold; }

    #enclosure {
      width: 320px;
      height: 360px;
      background: #1c1917;
      border: 4px solid #f59e0b;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
    }

    .incubator {
      background: #292524;
      border: 2px dashed #f59e0b;
      border-radius: 10px;
      width: 100%;
      padding: 10px;
      text-align: center;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: #44403c;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #22c55e;
      transition: width 0.1s linear;
    }

    .btn {
      background: #f59e0b;
      color: #0c0a09;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .dino-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
    }

    .dino-card {
      background: #292524;
      padding: 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .dino-icon { font-size: 1.5rem; }
    .ability-tag { font-size: 0.75rem; color: #38bdf8; }
  </style>
</head>
<body>

  <h1>🥚 Egg Hatcher Idle</h1>
  <div id="hud">🪙 Coins: <span id="coins">50</span> | 🍖 Food: <span id="food">20</span></div>

  <div id="enclosure">
    <div class="incubator">
      <div id="incubator-status" style="font-weight: bold; font-size: 0.9rem;">Incubator: Idle</div>
      <div class="progress-bar"><div class="progress-fill" id="p-fill"></div></div>
      <button class="btn" id="hatch-btn" onclick="startIncubation()">Incubate Egg (20 Food)</button>
    </div>

    <div style="font-size: 0.85rem; color: #a8a29e; width: 100%; margin-bottom: 4px;">Active Dinos:</div>
    <div class="dino-grid" id="dino-list"></div>
  </div>

  <script>
    let coins = 50;
    let food = 20;
    let isIncubating = false;
    let incubateProgress = 0;

    const coinsText = document.getElementById('coins');
    const foodText = document.getElementById('food');
    const fillEl = document.getElementById('p-fill');
    const statusText = document.getElementById('incubator-status');
    const listEl = document.getElementById('dino-list');

    // Traits & Abilities
    const dinoTraits = [
      { icon: '🦎', name: 'Speed Miner', ability: '+5 Coins / sec', type: 'miner', rate: 5 },
      { icon: '🐉', name: 'Fire Breather', ability: 'Burns rocks (+25 Instant Coins)', type: 'fire', rate: 2 },
      { icon: '🦕', name: 'Heavy Eater', ability: 'Consumes Food for 2x Coins', type: 'eater', rate: 10 },
      { icon: '🦖', name: 'Ancient Apex', ability: 'Generates Food & Coins', type: 'apex', rate: 12 }
    ];

    let activeDinos = [];

    function startIncubation() {
      if (isIncubating || food < 20) return;
      food -= 20;
      isIncubating = true;
      incubateProgress = 0;
      statusText.innerText = "Incubating Egg...";
      updateUI();
    }

    function hatchDino() {
      isIncubating = false;
      fillEl.style.width = '0%';
      statusText.innerText = "Incubator: Idle";

      // Pick random dino species
      const species = dinoTraits[Math.floor(Math.random() * dinoTraits.length)];
      activeDinos.push(species);

      renderDinos();
    }

    function renderDinos() {
      listEl.innerHTML = '';
      activeDinos.forEach((d) => {
        const card = document.createElement('div');
        card.className = 'dino-card';
        card.innerHTML = `
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="dino-icon">${d.icon}</span>
            <div>
              <div style="font-weight:bold;">${d.name}</div>
              <div class="ability-tag">${d.ability}</div>
            </div>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    // Main Game Loop (1 tick per second)
    setInterval(() => {
      // Handle Incubation
      if (isIncubating) {
        incubateProgress += 20;
        fillEl.style.width = incubateProgress + '%';
        if (incubateProgress >= 100) {
          hatchDino();
        }
      }

      // Handle Dino Abilities
      let coinGain = 0;
      let foodGain = 1; // Base food regeneration

      activeDinos.forEach(d => {
        if (d.type === 'miner') coinGain += d.rate;
        if (d.type === 'fire') {
          if (Math.random() < 0.3) coinGain += 25; // Random fire blast
        }
        if (d.type === 'eater') {
          if (food >= 2) {
            food -= 2;
            coinGain += d.rate;
          }
        }
        if (d.type === 'apex') {
          coinGain += d.rate;
          foodGain += 2;
        }
      });

      coins += coinGain;
      food += foodGain;
      updateUI();
    }, 1000);

    function updateUI() {
      coinsText.innerText = coins;
      foodText.innerText = food;
    }
  </script>
</body>
</html>
