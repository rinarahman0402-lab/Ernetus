html,body{

#game{

}

}

#objects{

}

.choice{

  color:white;
  font-size:18px;

}

.big{

}

.red{background:#d94b4b}

}

}

.lock{

  border:8px solid #432e1e;

  justify-content:center;
  font-size:50px;

.star{
  font-size:45px;
  background:none;
  border:0;
}

#feedback{

  font-weight:bold;
  text-align:center;
}

#continue{
  display:none;

  border:0;
  border-radius:14px;
  background:#4da1ff;
  color:white;
  font-size:18px;
  font-weight:bold;
