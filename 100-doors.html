
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Doors</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #101827, #263b5c);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.screen {
    width: 100%;
    max-width: 650px;
    min-height: 100vh;
    padding: 25px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.hidden {
    display: none !important;
}

h1 {
    font-size: 48px;
    margin: 10px;
}

h2 {
    font-size: 30px;
}

p {
    font-size: 18px;
}

button {
    border: none;
    border-radius: 14px;
    padding: 14px 25px;
    margin: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    background: #55c2ff;
    color: #07101c;
}

button:hover {
    transform: scale(1.04);
}

#startButton {
    font-size: 24px;
    padding: 18px 45px;
    background: #65e37b;
}

#doorNumber {
    font-size: 24px;
    font-weight: bold;
}

#puzzleBox {
    width: 100%;
    background: rgba(0,0,0,.35);
    border-radius: 22px;
    padding: 25px;
    margin-top: 15px;
}

#question {
    font-size: 24px;
    margin-bottom: 20px;
}

#answerArea {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

input {
    width: 80%;
    max-width: 300px;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 18px;
    text-align: center;
}

#message {
    min-height: 28px;
    margin-top: 15px;
    font-weight: bold;
}

#progress {
    width: 100%;
    height: 14px;
    background: rgba(255,255,255,.2);
    border-radius: 20px;
    overflow: hidden;
    margin-top: 20px;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: #65e37b;
    transition: width .3s;
}

.choice {
    min-width: 120px;
}

.numberButton {
    min-width: 70px;
}

.bigNumber {
    font-size: 40px;
    margin: 15px;
}

#winScreen h1 {
    color: #65e37b;
}
</style>
</head>

<body>

<!-- START SCREEN -->
<div id="startScreen" class="screen">

    <div style="font-size:80px;">🚪</div>

    <h1>100 DOORS</h1>

    <p>
        Can you solve all 100 doors?
    </p>

    <p>
        🧠 Different puzzles<br>
        🔢 Numbers<br>
        🎨 Colors<br>
        🧩 Logic<br>
        👀 Observation
    </p>

    <button id="startButton">
        START GAME
    </button>

</div>


<!-- GAME SCREEN -->
<div id="gameScreen" class="screen hidden">

    <div id="doorNumber">
        DOOR 1 / 100
    </div>

    <div id="progress">
        <div id="progressBar"></div>
    </div>

    <div id="puzzleBox">

        <div id="question"></div>

        <div id="answerArea"></div>

        <div id="message"></div>

    </div>

</div>


<!-- WIN SCREEN -->
<div id="winScreen" class="screen hidden">

    <div style="font-size:90px;">🏆</div>

    <h1>YOU DID IT!</h1>

    <h2>You opened all 100 doors!</h2>

    <p>
        You are officially a 100 Doors master.
    </p>

    <button id="playAgain">
        PLAY AGAIN
    </button>

</div>


<script>

/* ============================
   GAME VARIABLES
============================ */

let currentDoor = 1;

const startScreen =
    document.getElementById("startScreen");

const gameScreen =
    document.getElementById("gameScreen");

const winScreen =
    document.getElementById("winScreen");

const startButton =
    document.getElementById("startButton");

const playAgain =
    document.getElementById("playAgain");

const question =
    document.getElementById("question");

const answerArea =
    document.getElementById("answerArea");

const message =
    document.getElementById("message");

const doorNumber =
    document.getElementById("doorNumber");

const progressBar =
    document.getElementById("progressBar");


/* ============================
   START BUTTON
============================ */

startButton.onclick = function() {

    currentDoor = 1;

    startScreen.classList.add("hidden");

    gameScreen.classList.remove("hidden");

    winScreen.classList.add("hidden");

    loadDoor();

};


/* ============================
   PLAY AGAIN
============================ */

playAgain.onclick = function() {

    currentDoor = 1;

    winScreen.classList.add("hidden");

    gameScreen.classList.remove("hidden");

    loadDoor();

};


/* ============================
   DOOR DATA
============================ */

const puzzles = [

/* 1 */
{
    question: "What is 2 + 3?",
    type: "input",
    answer: "5"
},

/* 2 */
{
    question: "Which number comes next? 2, 4, 6, 8, ?",
    type: "input",
    answer: "10"
},

/* 3 */
{
    question: "Which shape has 3 sides?",
    type: "choice",
    choices: ["Circle","Triangle","Square","Star"],
    answer: "Triangle"
},

/* 4 */
{
    question: "What color do you get by mixing red and blue?",
    type: "choice",
    choices: ["Green","Purple","Orange","Yellow"],
    answer: "Purple"
},

/* 5 */
{
    question: "Which animal says MEOW?",
    type: "choice",
    choices: ["Dog","Cat","Cow","Horse"],
    answer: "Cat"
},

/* 6 */
{
    question: "What is 10 - 4?",
    type: "input",
    answer: "6"
},

/* 7 */
{
    question: "Which is the largest number?",
    type: "choice",
    choices: ["17","71","27","37"],
    answer: "71"
},

/* 8 */
{
    question: "Complete the pattern: 🔴 🔵 🔴 🔵 ?",
    type: "choice",
    choices: ["🔴","🟢","🟡","🟣"],
    answer: "🔴"
},

/* 9 */
{
    question: "How many legs does a spider have?",
    type: "choice",
    choices: ["4","6","8","10"],
    answer: "8"
},

/* 10 */
{
    question: "What is 5 × 2?",
    type: "input",
    answer: "10"
},

/* 11 */
{
    question: "Which one does NOT belong?",
    type: "choice",
    choices: ["Apple","Banana","Carrot","Mango"],
    answer: "Carrot"
},

/* 12 */
{
    question: "What comes next? 5, 10, 15, 20, ?",
    type: "input",
    answer: "25"
},

/* 13 */
{
    question: "Which planet do we live on?",
    type: "choice",
    choices: ["Mars","Earth","Venus","Jupiter"],
    answer: "Earth"
},

/* 14 */
{
    question: "What is half of 20?",
    type: "input",
    answer: "10"
},

/* 15 */
{
    question: "Which is heavier?",
    type: "choice",
    choices: ["A feather","A brick","A bubble","A leaf"],
    answer: "A brick"
},

/* 16 */
{
    question: "What is 7 + 6?",
    type: "input",
    answer: "13"
},

/* 17 */
{
    question: "Which direction is opposite to LEFT?",
    type: "choice",
    choices: ["Right","Up","Down","Forward"],
    answer: "Right"
},

/* 18 */
{
    question: "How many days are in a week?",
    type: "choice",
    choices: ["5","6","7","8"],
    answer: "7"
},

/* 19 */
{
    question: "What is 20 ÷ 4?",
    type: "input",
    answer: "5"
},

/* 20 */
{
    question: "Which animal is known for having a long trunk?",
    type: "choice",
    choices: ["Elephant","Lion","Penguin","Rabbit"],
    answer: "Elephant"
}

];


/* ============================
   LOAD DOOR
============================ */

function loadDoor() {

    message.textContent = "";

    doorNumber.textContent =
        "DOOR " + currentDoor + " / 100";

    progressBar.style.width =
        currentDoor + "%";

    answerArea.innerHTML = "";

    /*
       The first 20 doors use unique
       hand-made puzzles.

       Doors 21-100 are generated
       from several different puzzle
       patterns so they don't simply
       repeat the exact same puzzle.
    */

    const puzzle =
        getPuzzle(currentDoor);

    question.textContent =
        puzzle.question;


    if(puzzle.type === "input") {

        createInputPuzzle(puzzle);

    }

    else if(puzzle.type === "choice") {

        createChoicePuzzle(puzzle);

    }

    else if(puzzle.type === "number") {

        createNumberPuzzle(puzzle);

    }

}


/* ============================
   PUZZLE GENERATOR
============================ */

function getPuzzle(door) {

    if(door <= puzzles.length) {

        return puzzles[door - 1];

    }


    const mode =
        door % 5;


    /* NUMBER SEQUENCE */

    if(mode === 0) {

        const step =
            (door % 7) + 2;

        const first =
            (door % 10) + 1;

        const a =
            first;

        const b =
            a + step;

        const c =
            b + step;

        const d =
            c + step;

        const answer =
            d + step;

        return {
            question:
                "What comes next? " +
                a + ", " +
                b + ", " +
                c + ", " +
                d + ", ?",
            type:"input",
            answer:String(answer)
        };

    }


    /* MATH */

    if(mode === 1) {

        const a =
            door + 5;

        const b =
            (door % 9) + 2;

        return {
            question:
                "What is " +
                a + " + " +
                b + "?",
            type:"input",
            answer:String(a+b)
        };

    }


    /* ODD OR EVEN */

    if(mode === 2) {

        const number =
            door * 3 + 1;

        return {
            question:
                "Is " +
                number +
                " an even or odd number?",
            type:"choice",
            choices:[
                "Even",
                "Odd"
            ],
            answer:
                number % 2 === 0
                ? "Even"
                : "Odd"
        };

    }


    /* BIGGER NUMBER */

    if(mode === 3) {

        const a =
            door + 12;

        const b =
            door + 7;

        return {
            question:
                "Which number is bigger?",
            type:"choice",
            choices:[
                String(a),
                String(b)
            ],
            answer:String(a)
        };

    }


    /* MULTIPLICATION */

    const a =
        (door % 8) + 2;

    const b =
        (door % 6) + 2;

    return {
        question:
            "What is " +
            a +
            " × " +
            b +
            "?",
        type:"input",
        answer:String(a*b)
    };

}


/* ============================
   INPUT PUZZLE
============================ */

function createInputPuzzle(puzzle) {

    const input =
        document.createElement("input");

    input.id = "answerInput";

    input.type = "text";

    input.inputMode = "numeric";

    input.placeholder =
        "Type your answer";


    const button =
        document.createElement("button");

    button.textContent =
        "OPEN DOOR 🚪";


    button.onclick =
        function() {

            checkAnswer(
                input.value.trim(),
                puzzle.answer
            );

        };


    input.addEventListener(
        "keydown",
        function(event) {

            if(event.key === "Enter") {

                checkAnswer(
                    input.value.trim(),
                    puzzle.answer
                );

            }

        }
    );


    answerArea.appendChild(input);

    answerArea.appendChild(button);

}


/* ============================
   CHOICE PUZZLE
============================ */

function createChoicePuzzle(puzzle) {

    puzzle.choices.forEach(
        function(choice) {

            const button =
                document.createElement("button");

            button.className =
                "choice";

            button.textContent =
                choice;


            button.onclick =
                function() {

                    checkAnswer(
                        choice,
                        puzzle.answer
                    );

                };


            answerArea.appendChild(
                button
            );

        }
    );

}


/* ============================
   NUMBER PUZZLE
============================ */

function createNumberPuzzle(puzzle) {

    for(let i=1;i<=4;i++) {

        const button =
            document.createElement("button");

        button.className =
            "numberButton";

        button.textContent =
            i;

        button.onclick =
            function() {

                checkAnswer(
                    String(i),
                    puzzle.answer
                );

            };

        answerArea.appendChild(button);

    }

}


/* ============================
   CHECK ANSWER
============================ */

function checkAnswer(
    playerAnswer,
    correctAnswer
) {

    if(
        playerAnswer.toLowerCase() ===
        correctAnswer.toLowerCase()
    ) {

        message.textContent =
            "✅ Correct! The door opens!";

        message.style.color =
            "#65e37b";


        setTimeout(
            function() {

                if(currentDoor >= 100) {

                    gameScreen.classList.add(
                        "hidden"
                    );

                    winScreen.classList.remove(
                        "hidden"
                    );

                }

                else {

                    currentDoor++;

                    loadDoor();

                }

            },
            700
        );

    }

    else {

        message.textContent =
            "❌ Not quite! Try again.";

        message.style.color =
            "#ff7777";

    }

}


/* ============================
   MAKE SURE GAME STARTS
============================ */

console.log(
    "100 Doors loaded successfully."
);

</script>

</body>
</html>
```
