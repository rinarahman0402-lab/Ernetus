<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forest Heist</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }

    h1 { color: #22c55e; margin-bottom: 5px; }
    #hud { font-size: 1.2rem; color: #facc15; margin-bottom: 15px; font-weight: bold; }

    #forest {
      width: 320px;
      height: 320px;
      background: #14532d;
      border: 4px solid #22c55e;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
    }

    #player {
      width: 24px;
      height: 24px;
      background: #38bdf8;
      border-radius: 50%;
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      z-index: 10;
    }

    .loot {
      width: 20px;
      height: 20px;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .controls {
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(2, 50px);
      gap: 5px;
    }

    .btn {
      background: #22c55e;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:active { background: #4ade80; }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <h1>🌲 Forest Heist</h1>
  <div id="hud">Loot Collected: <span id="score">0</span> / 20</div>

  <div id="forest">
    <div id="player">🦊</div>
  </div>

  <div class="controls">
    <button class="btn" id="btn-up">⬆️</button>
    <button class="btn" id="btn-left">⬅️</button>
    <button class="btn" id="btn-down">⬇️</button>
    <button class="btn" id="btn-right">➡️</button>
  </div>

  <script>
    const forest = document.getElementById('forest');
    const player = document.getElementById('player');
    const scoreText = document.getElementById('score');

    let posX = 10;
    let posY = 10;
    let collected = 0;
    const totalTarget = 20;
    let lootItems = [];

    // Spawn exactly 20 loot items inside the forest
    function spawnAllLoot() {
      const items = ['💎', '💰', '👑', '💍', '🪙'];
      for (let i = 0; i < totalTarget; i++) {
        const item = document.createElement('div');
        item.className = 'loot';
        item.innerText = items[i % items.length];

        // Random positions inside 320x320 bounds
        const x = Math.floor(Math.random() * 280) + 20;
        const y = Math.floor(Math.random() * 280) + 20;

        item.style.left = x + 'px';
        item.style.top = y + 'px';

        forest.appendChild(item);
        lootItems.push({ element: item, x: x, y: y, active: true });
      }
    }

    function move(dir) {
      if (collected >= totalTarget) return;

      if (dir === 'right') posX = Math.min(286, posX + 20);
      if (dir === 'left') posX = Math.max(10, posX - 20);
      if (dir === 'down') posY = Math.min(286, posY + 20);
      if (dir === 'up') posY = Math.max(10, posY - 20);

      player.style.left = posX + 'px';
      player.style.top = posY + 'px';

      checkCollisions();
    }

    function checkCollisions() {
      lootItems.forEach(item => {
        if (item.active) {
          const dist = Math.hypot(posX - item.x, posY - item.y);
          if (dist < 25) {
            item.active = false;
            item.element.remove();
            collected++;
            scoreText.innerText = collected;

            if (collected === totalTarget) {
              document.getElementById('hud').innerText = "🎉 HEIST COMPLETE! All 20 items secured!";
            }
          }
        }
      });
    }

    document.getElementById('btn-up').onclick = () => move('up');
    document.getElementById('btn-down').onclick = () => move('down');
    document.getElementById('btn-left').onclick = () => move('left');
    document.getElementById('btn-right').onclick = () => move('right');

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') move('right');
      if (e.key === 'ArrowLeft') move('left');
      if (e.key === 'ArrowDown') move('down');
      if (e.key === 'ArrowUp') move('up');
    });

    spawnAllLoot();
  </script>
</body>
</html>
