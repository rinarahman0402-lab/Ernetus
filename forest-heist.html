<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forest Heist</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }

    h1 { color: #2ecc71; margin-bottom: 5px; }
    #status { font-size: 1.1rem; color: #f1c40f; margin-bottom: 15px; }

    .game-container {
      display: flex;
      gap: 20px;
      width: 90%;
      max-width: 800px;
    }

    /* Forest Wrapper (The Void behind everything) */
    #forest-container {
      flex: 1;
      height: 380px;
      background: #000000; /* Pure black void */
      border: 4px solid #333;
      border-radius: 15px;
      position: relative;
      overflow: hidden;
    }

    /* Stealable Background Layers */
    .layer {
      position: absolute;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.3s;
    }

    #sky-layer {
      height: 60%;
      top: 0;
      background: #87CEEB;
    }

    #ground-layer {
      height: 40%;
      bottom: 0;
      background: #27ae60;
      border-top: 5px solid #1e8449;
    }

    #river-layer {
      height: 25px;
      bottom: 30px;
      background: #2980b9;
    }

    /* Stealable Emoji Items */
    .item {
      font-size: 2.2rem;
      position: absolute;
      cursor: pointer;
      transition: transform 0.2s;
      z-index: 10;
    }

    .item:hover, .layer-label:hover {
      transform: scale(1.1);
    }

    .layer-label {
      position: absolute;
      font-weight: bold;
      font-size: 0.9rem;
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      z-index: 5;
    }

    /* Zoo Area */
    #zoo {
      flex: 1;
      height: 380px;
      background: #34495e;
      border: 4px solid #2c3e50;
      border-radius: 15px;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px;
      overflow-y: auto;
    }

    /* Items inside Zoo */
    .zoo-item {
      font-size: 1.5rem;
      width: 45px;
      height: 45px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px dashed #7f8c8d;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <h1>🌲 Ultimate Forest Heist 🦁</h1>
  <div id="status">Steal EVERYTHING—animals, clouds, ground, and sky!</div>

  <div class="game-container">
    <!-- The Forest Container -->
    <div id="forest-container">
      <!-- Background Layers -->
      <div id="sky-layer" class="layer stealable" data-name="🌌 Sky">
        <span class="layer-label" style="top:10px; left:10px;">[Steal Sky]</span>
      </div>

      <div id="ground-layer" class="layer stealable" data-name="🟫 Ground">
        <span class="layer-label" style="bottom:10px; left:10px;">[Steal Ground]</span>
      </div>

      <div id="river-layer" class="layer stealable" data-name="🌊 River">
        <span class="layer-label" style="bottom:2px; right:10px;">[Steal River]</span>
      </div>

      <!-- Foreground Items -->
      <div class="item stealable" data-name="☁️ Cloud" style="top:20px; left:40px;">☁️</div>
      <div class="item stealable" data-name="☁️ Cloud" style="top:30px; left:180px;">☁️</div>
      <div class="item stealable" data-name="☀️ Sun" style="top:15px; right:20px;">☀️</div>
      <div class="item stealable" data-name="🐻 Bear" style="top:230px; left:30px;">🐻</div>
      <div class="item stealable" data-name="🦊 Fox" style="top:250px; left:140px;">🦊</div>
      <div class="item stealable" data-name="🦌 Deer" style="top:210px; right:40px;">🦌</div>
      <div class="item stealable" data-name="🌲 Tree" style="top:170px; left:90px;">🌲</div>
      <div class="item stealable" data-name="🌳 Tree" style="top:160px; right:100px;">🌳</div>
      <div class="item stealable" data-name="🍄 Shroom" style="top:290px; left:110px;">🍄</div>
      <div class="item stealable" data-name="🐟 Fish" style="bottom:32px; left:160px; font-size:1.2rem; z-index:6;">🐟</div>
    </div>

    <!-- The Zoo -->
    <div id="zoo"></div>
  </div>

  <script>
    const zoo = document.getElementById('zoo');
    const status = document.getElementById('status');
    const stealables = document.querySelectorAll('.stealable');

    let stolenCount = 0;
    const totalItems = stealables.length;

    stealables.forEach(target => {
      target.addEventListener('click', (e) => {
        e.stopPropagation(); // Stop click from hitting elements behind it

        const name = target.getAttribute('data-name');

        // Move item representation to zoo
        const zooBox = document.createElement('div');
        zooBox.className = 'zoo-item';
        zooBox.innerText = name.split(' ')[0]; // Take emoji
        zooBox.title = name;
        zoo.appendChild(zooBox);

        // Hide/Remove from forest
        target.style.display = 'none';
        stolenCount++;

        status.innerText = `Stolen: ${stolenCount}/${totalItems} elements!`;

        if (stolenCount === totalItems) {
          status.innerText = "🌌 EVERYTHING IS GONE. YOU STOLE THE ENTIRE WORLD INTO THE VOID!";
          status.style.color = "#00ffcc";
        }
      });
    });
  </script>
</body>
</html>
