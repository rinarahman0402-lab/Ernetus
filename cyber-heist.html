<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Heist</title>
  <style>
    body {
      background-color: #030712;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }

    h1 { color: #22d3ee; margin-bottom: 5px; }
    #hud { font-size: 1.2rem; color: #a855f7; margin-bottom: 15px; font-weight: bold; }

    #vault {
      width: 300px;
      height: 300px;
      background: #0f172a;
      border: 4px solid #22d3ee;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
    }

    .entity {
      width: 30px;
      height: 30px;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .laser {
      position: absolute;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .controls {
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(2, 50px);
      gap: 5px;
    }

    .btn {
      background: #22d3ee;
      color: #030712;
      border: none;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:active { background: #67e8f9; }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <h1>💎 Cyber Heist</h1>
  <div id="hud">Level: <span id="level-txt">1 / 3</span> | Steal diamond 💎 & escape to 🚁!</div>

  <div id="vault">
    <div id="player" class="entity">🥷</div>
    <div id="gem" class="entity">💎</div>
    <div id="exit" class="entity">🔒</div>
  </div>

  <div class="controls">
    <button class="btn" id="btn-up">⬆️</button>
    <button class="btn" id="btn-left">⬅️</button>
    <button class="btn" id="btn-down">⬇️</button>
    <button class="btn" id="btn-right">➡️</button>
  </div>

  <script>
    const vault = document.getElementById('vault');
    const playerEl = document.getElementById('player');
    const gemEl = document.getElementById('gem');
    const exitEl = document.getElementById('exit');
    const levelTxt = document.getElementById('level-txt');

    let currentLevel = 1;
    let hasGem = false;
    let player = { x: 0, y: 270 };
    let gem = { x: 270, y: 0 };
    let exit = { x: 0, y: 0 };
    let lasers = [];
    let gameLoop = null;

    const levels = [
      // Level 1: Horizontal Lasers
      {
        player: { x: 0, y: 270 }, gem: { x: 270, y: 0 }, exit: { x: 0, y: 0 },
        lasers: [
          { x: 0, y: 100, w: 180, h: 6, dx: 2, dy: 0, minX: 0, maxX: 120 },
          { x: 120, y: 200, w: 180, h: 6, dx: -2, dy: 0, minX: 0, maxX: 120 }
        ]
      },
      // Level 2: Vertical Sweep
      {
        player: { x: 0, y: 270 }, gem: { x: 270, y: 270 }, exit: { x: 0, y: 0 },
        lasers: [
          { x: 90, y: 0, w: 6, h: 180, dx: 0, dy: 3, minY: 0, maxY: 120 },
          { x: 200, y: 120, w: 6, h: 180, dx: 0, dy: -3, minY: 0, maxY: 120 }
        ]
      },
      // Level 3: Balanced Crossfire (Shortened beam lengths for clear timing windows)
      {
        player: { x: 0, y: 270 }, gem: { x: 135, y: 135 }, exit: { x: 270, y: 0 },
        lasers: [
          { x: 0, y: 80, w: 180, h: 6, dx: 2, dy: 0, minX: 0, maxX: 120 },
          { x: 120, y: 200, w: 180, h: 6, dx: -2, dy: 0, minX: 0, maxX: 120 },
          { x: 150, y: 0, w: 6, h: 160, dx: 0, dy: 2, minY: 0, maxY: 140 }
        ]
      }
    ];

    function loadLevel(num) {
      clearInterval(gameLoop);
      hasGem = false;
      const data = levels[num - 1];

      player = { ...data.player };
      gem = { ...data.gem };
      exit = { ...data.exit };
      lasers = data.lasers.map(l => ({ ...l }));

      levelTxt.innerText = `${num} / 3`;
      exitEl.innerText = '🔒';

      render();
      startLoop();
    }

    function render() {
      playerEl.style.left = player.x + 'px';
      playerEl.style.top = player.y + 'px';

      gemEl.style.display = hasGem ? 'none' : 'flex';
      gemEl.style.left = gem.x + 'px';
      gemEl.style.top = gem.y + 'px';

      exitEl.style.left = exit.x + 'px';
      exitEl.style.top = exit.y + 'px';

      document.querySelectorAll('.laser').forEach(l => l.remove());

      lasers.forEach(l => {
        const lel = document.createElement('div');
        lel.className = 'laser';
        lel.style.left = l.x + 'px';
        lel.style.top = l.y + 'px';
        lel.style.width = l.w + 'px';
        lel.style.height = l.h + 'px';
        vault.appendChild(lel);
      });
    }

    function move(dx, dy) {
      player.x = Math.max(0, Math.min(270, player.x + dx));
      player.y = Math.max(0, Math.min(270, player.y + dy));

      if (!hasGem && Math.hypot(player.x - gem.x, player.y - gem.y) < 25) {
        hasGem = true;
        exitEl.innerText = '🚁';
      }

      if (hasGem && Math.hypot(player.x - exit.x, player.y - exit.y) < 25) {
        if (currentLevel < 3) {
          currentLevel++;
          loadLevel(currentLevel);
        } else {
          clearInterval(gameLoop);
          document.getElementById('hud').innerText = "🏆 HEIST COMPLETE! YOU ESCAPED WITH THE DIAMOND!";
        }
      }

      render();
    }

    function startLoop() {
      gameLoop = setInterval(() => {
        lasers.forEach(l => {
          l.x += l.dx;
          l.y += l.dy;

          if (l.dx !== 0) {
            if (l.x <= l.minX || l.x >= l.maxX) l.dx *= -1;
          }
          if (l.dy !== 0) {
            if (l.y <= l.minY || l.y >= l.maxY) l.dy *= -1;
          }

          // Laser Hitbox Collision
          if (
            player.x + 22 > l.x &&
            player.x + 8 < l.x + l.w &&
            player.y + 22 > l.y &&
            player.y + 8 < l.y + l.h
          ) {
            loadLevel(currentLevel);
          }
        });

        render();
      }, 30);
    }

    document.getElementById('btn-up').onclick = () => move(0, -30);
    document.getElementById('btn-down').onclick = () => move(0, 30);
    document.getElementById('btn-left').onclick = () => move(-30, 0);
    document.getElementById('btn-right').onclick = () => move(30, 0);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') move(0, -30);
      if (e.key === 'ArrowDown') move(0, 30);
      if (e.key === 'ArrowLeft') move(-30, 0);
      if (e.key === 'ArrowRight') move(30, 0);
    });

    loadLevel(1);
  </script>
</body>
</html>
