<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spider Web Weaver</title>
  <style>
    body {
      background-color: #090d16;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }

    h1 { color: #22c55e; margin-bottom: 5px; }
    #hud { font-size: 1.2rem; color: #4ade80; margin-bottom: 15px; font-weight: bold; }

    #web-area {
      width: 300px;
      height: 300px;
      background: #111827;
      border: 4px solid #22c55e;
      border-radius: 12px;
      position: relative;
      cursor: pointer;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .node {
      width: 20px;
      height: 20px;
      background: #374151;
      border: 2px solid #22c55e;
      border-radius: 50%;
      position: absolute;
      transform: translate(-10px, -10px);
      z-index: 5;
    }

    .fly {
      width: 24px;
      height: 24px;
      position: absolute;
      transform: translate(-12px, -12px);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }

    #spider {
      width: 30px;
      height: 30px;
      position: absolute;
      transform: translate(-15px, -15px);
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 6;
      transition: all 0.2s ease;
    }
  </style>
</head>
<body>

  <h1>🕷️ Spider Web Weaver</h1>
  <div id="hud">Level: <span id="level-txt">1 / 3</span> | Tap nodes to connect web & trap flies 🪰!</div>

  <div id="web-area">
    <canvas id="canvas" width="300" height="300"></canvas>
    <div id="spider">🕷️</div>
  </div>

  <script>
    const webArea = document.getElementById('web-area');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const spider = document.getElementById('spider');
    const levelTxt = document.getElementById('level-txt');

    let currentLevel = 1;
    let selectedNode = null;
    let connections = [];
    let nodes = [];
    let flies = [];

    const levels = [
      // Level 1: 4 Corner nodes, 1 Fly
      {
        nodes: [{x: 50, y: 50}, {x: 250, y: 50}, {x: 250, y: 250}, {x: 50, y: 250}],
        flies: [{x: 150, y: 150, trapped: false}]
      },
      // Level 2: 6 Ring nodes, 2 Flies
      {
        nodes: [
          {x: 150, y: 40}, {x: 260, y: 100}, {x: 260, y: 220},
          {x: 150, y: 270}, {x: 40, y: 220}, {x: 40, y: 100}
        ],
        flies: [
          {x: 120, y: 140, trapped: false},
          {x: 180, y: 180, trapped: false}
        ]
      },
      // Level 3: Web Grid, 3 Flies
      {
        nodes: [
          {x: 50, y: 50}, {x: 150, y: 30}, {x: 250, y: 50},
          {x: 270, y: 150}, {x: 250, y: 250}, {x: 150, y: 270},
          {x: 50, y: 250}, {x: 30, y: 150}
        ],
        flies: [
          {x: 100, y: 100, trapped: false},
          {x: 200, y: 100, trapped: false},
          {x: 150, y: 200, trapped: false}
        ]
      }
    ];

    function loadLevel(num) {
      connections = [];
      selectedNode = null;
      document.querySelectorAll('.node, .fly').forEach(e => e.remove());

      const data = levels[num - 1];
      nodes = data.nodes.map(n => ({ ...n }));
      flies = data.flies.map(f => ({ ...f }));

      levelTxt.innerText = `${num} / 3`;

      // Spawn Nodes
      nodes.forEach((n, i) => {
        const nel = document.createElement('div');
        nel.className = 'node';
        nel.style.left = n.x + 'px';
        nel.style.top = n.y + 'px';
        nel.onclick = () => handleNodeClick(i);
        webArea.appendChild(nel);
      });

      // Spawn Flies
      flies.forEach(f => {
        const fel = document.createElement('div');
        fel.className = 'fly';
        fel.innerText = '🪰';
        fel.style.left = f.x + 'px';
        fel.style.top = f.y + 'px';
        webArea.appendChild(fel);
        f.element = fel;
      });

      // Position Spider at Node 0
      spider.style.left = nodes[0].x + 'px';
      spider.style.top = nodes[0].y + 'px';
      selectedNode = 0;

      drawWeb();
    }

    function handleNodeClick(index) {
      if (selectedNode !== null && selectedNode !== index) {
        // Add connection
        connections.push([selectedNode, index]);
        checkFliesTrapped();
      }

      selectedNode = index;
      spider.style.left = nodes[index].x + 'px';
      spider.style.top = nodes[index].y + 'px';

      drawWeb();
    }

    function drawWeb() {
      ctx.clearRect(0, 0, 300, 300);
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 3;

      connections.forEach(([i, j]) => {
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();
      });
    }

    function checkFliesTrapped() {
      // Simplified trap condition: when enough web strands cross near the fly
      flies.forEach(f => {
        let nearbyLines = 0;
        connections.forEach(([i, j]) => {
          const d = distToSegment(f, nodes[i], nodes[j]);
          if (d < 35) nearbyLines++;
        });

        if (nearbyLines >= 2 && !f.trapped) {
          f.trapped = true;
          f.element.innerText = '🕸️';
        }
      });

      if (flies.every(f => f.trapped)) {
        setTimeout(() => {
          if (currentLevel < 3) {
            currentLevel++;
            loadLevel(currentLevel);
          } else {
            document.getElementById('hud').innerText = "🏆 ALL FLIES TRAPPED! YOU BEAT GAME 30!";
          }
        }, 400);
      }
    }

    function distToSegment(p, v, w) {
      const l2 = Math.hypot(v.x - w.x, v.y - w.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    loadLevel(1);
  </script>
</body>
</html>
