<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ant Colony</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #102018;
}

button {
  font-family: Arial, sans-serif;
  touch-action: manipulation;
  cursor: pointer;
}

#startScreen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background:
    radial-gradient(circle at 50% 35%, #6fbd4c 0%, #2d743d 45%, #102018 100%);
  color: white;
  z-index: 10;
}

.antIcon {
  font-size: 90px;
  margin-bottom: 10px;
}

h1 {
  font-size: 48px;
  margin: 5px 20px 10px;
}

#startScreen p {
  font-size: 20px;
  max-width: 600px;
  margin: 10px 25px 30px;
}

#playGame {
  border: 0;
  border-radius: 25px;
  padding: 20px 55px;
  font-size: 27px;
  font-weight: bold;
  background: #ffd447;
  color: #182718;
  box-shadow: 0 8px 0 #b99518;
}

#playGame:active {
  transform: translateY(6px);
  box-shadow: 0 2px 0 #b99518;
}

#game {
  display: none;
  position: fixed;
  inset: 0;
  background: #76bd50;
}

#world {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#topBar {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 3;
}

.info {
  background: rgba(15,35,23,.9);
  color: white;
  padding: 13px 18px;
  border-radius: 18px;
  font-weight: bold;
  font-size: 17px;
}

#controls {
  position: absolute;
  bottom: 25px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 12px;
  z-index: 4;
}

.control {
  width: 105px;
  height: 70px;
  border: 3px solid rgba(255,255,255,.45);
  border-radius: 18px;
  background: rgba(17,38,25,.92);
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.control:active {
  transform: scale(.94);
  background: #315c37;
}

#taskBox {
  position: absolute;
  top: 90px;
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 500px);
  padding: 15px;
  border-radius: 18px;
  background: rgba(15,35,23,.9);
  color: white;
  text-align: center;
  font-weight: bold;
  z-index: 3;
}

#message {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  background: rgba(10,25,15,.95);
  color: white;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  display: none;
  z-index: 5;
}

#message button {
  margin-top: 15px;
  border: 0;
  border-radius: 14px;
  padding: 13px 25px;
  background: #ffd447;
  font-weight: bold;
}
</style>
</head>

<body>

<!-- START SCREEN -->
<div id="startScreen">
  <div class="antIcon">🐜</div>
  <h1>Ant Colony</h1>
  <p>
    Build your colony, collect food, gain experience and unlock stronger ants.
  </p>

  <button id="playGame" type="button">PLAY GAME</button>
</div>

<!-- GAME -->
<div id="game">

  <canvas id="world"></canvas>

  <div id="topBar">
    <div class="info">LEVEL: <span id="level">1</span></div>
    <div class="info">FOOD: <span id="food">0</span></div>
  </div>

  <div id="taskBox">
    TASK: Collect food for the colony
  </div>

  <div id="controls">
    <button class="control" id="left" type="button">LEFT</button>
    <button class="control" id="forward" type="button">FORWARD</button>
    <button class="control" id="right" type="button">RIGHT</button>
  </div>

  <div id="message">
    <div id="messageText"></div>
    <button id="continueButton" type="button">CONTINUE</button>
  </div>

</div>

<script>
"use strict";

/* =========================
   GAME VARIABLES
========================= */

const startScreen = document.getElementById("startScreen");
const game = document.getElementById("game");
const playGame = document.getElementById("playGame");

const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");

const levelText = document.getElementById("level");
const foodText = document.getElementById("food");
const taskBox = document.getElementById("taskBox");

const message = document.getElementById("message");
const messageText = document.getElementById("messageText");
const continueButton = document.getElementById("continueButton");

let gameRunning = false;
let level = 1;
let food = 0;

let player = {
  x: 0,
  y: 0,
  angle: 0
};

let foodObjects = [];

const tasks = [
  "Collect 5 pieces of food",
  "Collect 8 pieces of food",
  "Collect 12 pieces of food",
  "Bring food back to the colony",
  "Explore the forest",
  "Find the hidden food",
  "Collect food near the river"
];

let taskIndex = 0;

/* =========================
   CANVAS
========================= */

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* =========================
   START BUTTON
========================= */

/*
  IMPORTANT:
  This listener is attached directly to the real button.
  It works with mouse AND touchscreen clicks.
*/

playGame.addEventListener("click", function(event) {
  event.preventDefault();

  startScreen.style.display = "none";
  game.style.display = "block";

  startGame();
});

/* =========================
   START GAME
========================= */

function startGame() {

  gameRunning = true;

  player.x = canvas.width / 2;
  player.y = canvas.height / 2 + 100;
  player.angle = 0;

  level = 1;
  food = 0;
  taskIndex = 0;

  levelText.textContent = level;
  foodText.textContent = food;

  createFood();

  updateTask();

  requestAnimationFrame(gameLoop);
}

/* =========================
   CREATE FOOD
========================= */

function createFood() {

  foodObjects = [];

  for (let i = 0; i < 20; i++) {

    foodObjects.push({
      x: 60 + Math.random() * (canvas.width - 120),
      y: 160 + Math.random() * (canvas.height - 300),
      collected: false
    });

  }
}

/* =========================
   TASK
========================= */

function updateTask() {

  taskBox.textContent =
    "TASK: " + tasks[taskIndex % tasks.length];
}

/* =========================
   MOVEMENT
========================= */

function moveForward() {

  player.x += Math.cos(player.angle) * 35;
  player.y += Math.sin(player.angle) * 35;

  keepPlayerInside();

  checkFood();
}

function turnLeft() {
  player.angle -= Math.PI / 8;
}

function turnRight() {
  player.angle += Math.PI / 8;
}

function keepPlayerInside() {

  player.x = Math.max(30, Math.min(canvas.width - 30, player.x));
  player.y = Math.max(130, Math.min(canvas.height - 120, player.y));

}

/* =========================
   CONTROL BUTTONS
========================= */

document.getElementById("forward").addEventListener("click", function() {
  if (gameRunning) moveForward();
});

document.getElementById("left").addEventListener("click", function() {
  if (gameRunning) turnLeft();
});

document.getElementById("right").addEventListener("click", function() {
  if (gameRunning) turnRight();
});

/* =========================
   FOOD COLLECTION
========================= */

function checkFood() {

  for (const item of foodObjects) {

    if (item.collected) continue;

    const dx = player.x - item.x;
    const dy = player.y - item.y;

    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < 35) {

      item.collected = true;

      food++;

      foodText.textContent = food;

      checkTask();

    }
  }
}

/* =========================
   TASK CHECK
========================= */

function checkTask() {

  const needed = 5 + level * 2;

  if (food >= needed) {

    gameRunning = false;

    level++;

    levelText.textContent = level;

    messageText.innerHTML =
      "TASK COMPLETE!<br><br>" +
      "Your colony reached level " + level + "!<br><br>" +
      "You can now continue exploring.";

    message.style.display = "block";
  }
}

/* =========================
   CONTINUE
========================= */

continueButton.addEventListener("click", function() {

  message.style.display = "none";

  food = 0;
  foodText.textContent = food;

  taskIndex++;

  updateTask();

  createFood();

  player.x = canvas.width / 2;
  player.y = canvas.height / 2 + 100;

  gameRunning = true;

  requestAnimationFrame(gameLoop);
});

/* =========================
   DRAW WORLD
========================= */

function drawWorld() {

  /* SKY */

  const sky = ctx.createLinearGradient(
    0, 0,
    0, canvas.height
  );

  sky.addColorStop(0, "#70c9ed");
  sky.addColorStop(.45, "#8bd07b");
  sky.addColorStop(1, "#39723b");

  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  /* GROUND LINES */

  ctx.strokeStyle = "rgba(255,255,255,.12)";
  ctx.lineWidth = 2;

  for (let y = 150; y < canvas.height; y += 70) {

    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();

  }

  /* TREES */

  for (let i = 0; i < 12; i++) {

    const x = (i * 157 + 80) % canvas.width;
    const y = 190 + ((i * 113) % Math.max(200, canvas.height - 300));

    drawTree(x, y);

  }

  /* FOOD */

  for (const item of foodObjects) {

    if (!item.collected) {
      drawFood(item.x, item.y);
    }

  }

  /* COLONY */

  drawColony(80, canvas.height - 170);

  /* PLAYER ANT */

  drawAnt(player.x, player.y, player.angle);
}

/* =========================
   TREE
========================= */

function drawTree(x, y) {

  ctx.fillStyle = "#5b3b25";
  ctx.fillRect(x - 9, y, 18, 55);

  ctx.fillStyle = "#17642f";

  ctx.beginPath();
  ctx.arc(x, y - 15, 38, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x - 25, y + 5, 27, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x + 25, y + 5, 27, 0, Math.PI * 2);
  ctx.fill();
}

/* =========================
   FOOD
========================= */

function drawFood(x, y) {

  ctx.fillStyle = "#e9c46a";

  ctx.beginPath();
  ctx.arc(x, y, 9, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#b98d35";
  ctx.lineWidth = 2;
  ctx.stroke();
}

/* =========================
   COLONY
========================= */

function drawColony(x, y) {

  ctx.fillStyle = "#5a351f";

  ctx.beginPath();
  ctx.ellipse(
    x,
    y,
    75,
    38,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.fillStyle = "#21170f";

  ctx.beginPath();
  ctx.ellipse(
    x,
    y,
    35,
    18,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();
}

/* =========================
   ANT
========================= */

function drawAnt(x, y, angle) {

  ctx.save();

  ctx.translate(x, y);
  ctx.rotate(angle);

  /* shadow */

  ctx.fillStyle = "rgba(0,0,0,.25)";

  ctx.beginPath();
  ctx.ellipse(0, 20, 28, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  /* legs */

  ctx.strokeStyle = "#21170f";
  ctx.lineWidth = 5;

  for (let side of [-1, 1]) {

    for (let i = -1; i <= 1; i++) {

      ctx.beginPath();

      ctx.moveTo(i * 8, side * 5);

      ctx.lineTo(
        i * 15,
        side * 25
      );

      ctx.stroke();
    }
  }

  /* body */

  ctx.fillStyle = "#28170d";

  ctx.beginPath();
  ctx.ellipse(0, 8, 18, 25, 0, 0, Math.PI * 2);
  ctx.fill();

  /* head */

  ctx.beginPath();
  ctx.arc(0, -18, 15, 0, Math.PI * 2);
  ctx.fill();

  /* eyes */

  ctx.fillStyle = "white";

  ctx.beginPath();
  ctx.arc(-5, -21, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(5, -21, 3, 0, Math.PI * 2);
  ctx.fill();

  /* antennae */

  ctx.strokeStyle = "#21170f";
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.moveTo(-7, -29);
  ctx.lineTo(-15, -43);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(7, -29);
  ctx.lineTo(15, -43);
  ctx.stroke();

  ctx.restore();
}

/* =========================
   GAME LOOP
========================= */

function gameLoop() {

  if (!gameRunning) return;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawWorld();

  requestAnimationFrame(gameLoop);
}

</script>

</body>
</html>
