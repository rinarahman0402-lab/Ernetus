
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ant Colony</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#69b957;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#start,#levelScreen{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:25px;
  color:white;
}

#start{
  background:
    linear-gradient(
      #75ccef 0%,
      #78c65d 52%,
      #4a7c35 100%
    );
}

#levelScreen{
  display:none;
  background:#173b20ee;
}

.title{
  font-size:clamp(42px,11vw,75px);
  font-weight:900;
  text-shadow:4px 4px 0 #254d2b;
}

.subtitle{
  max-width:650px;
  line-height:1.5;
  font-size:18px;
}

.bigButton{
  margin-top:22px;
  border:0;
  border-radius:20px;
  padding:18px 34px;
  background:#ffd447;
  color:#18351d;
  font-size:20px;
  font-weight:900;
}

.bigButton:active{
  transform:scale(.94);
}

#hud{
  display:none;
  position:fixed;
  z-index:20;
  top:9px;
  left:9px;
  right:9px;
  justify-content:space-between;
  gap:7px;
  pointer-events:none;
}

.info{
  background:#142218dd;
  color:white;
  border-radius:14px;
  padding:9px 12px;
  font-size:12px;
  font-weight:bold;
}

#task{
  display:none;
  position:fixed;
  z-index:20;
  top:58px;
  left:9px;
  right:9px;
  margin:auto;
  max-width:350px;
  background:#142218dd;
  color:white;
  border-radius:15px;
  padding:11px;
  text-align:center;
  font-size:13px;
  font-weight:bold;
}

#controls{
  display:none;
  position:fixed;
  z-index:30;
  left:10px;
  bottom:10px;
  width:285px;
  height:185px;
}

.move{
  position:absolute;
  width:88px;
  height:58px;
  border:2px solid #ffffff77;
  border-radius:17px;
  background:#142218dd;
  color:white;
  font-size:11px;
  font-weight:900;
}

.move:active{
  background:#4d9848;
  transform:scale(.93);
}

#forward{
  left:98px;
  top:0;
}

#back{
  left:98px;
  bottom:0;
}

#left{
  left:0;
  top:63px;
}

#right{
  right:0;
  top:63px;
}

#action{
  display:none;
  position:fixed;
  z-index:30;
  right:14px;
  bottom:30px;
  width:125px;
  min-height:60px;
  border:0;
  border-radius:18px;
  background:#ffd447;
  color:#17351d;
  font-weight:900;
  font-size:12px;
}

#message{
  display:none;
  position:fixed;
  z-index:40;
  left:50%;
  top:105px;
  transform:translateX(-50%);
  background:#142218ee;
  color:white;
  padding:12px 18px;
  border-radius:15px;
  font-weight:bold;
  text-align:center;
}

.antType{
  font-weight:900;
}

.gold{
  color:#ffd447;
}

.fast{
  color:#ff7043;
}

.flying{
  color:#b9e9ff;
}

.goblin{
  color:#c994ff;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<!-- START SCREEN -->

<div id="start">

  <div style="font-size:90px">🐜</div>

  <div class="title">
    ANT COLONY
  </div>

  <p class="subtitle">
    Build your colony, collect food, complete jobs,
    gain levels and unlock powerful new ant types!
  </p>

  <p>
    🐜 Worker &nbsp;
    ⚡ Flash &nbsp;
    👑 Golden &nbsp;
    🪽 Flying &nbsp;
    👺 Goblin
  </p>

  <button class="bigButton" id="playButton">
    PLAY GAME
  </button>

</div>


<!-- HUD -->

<div id="hud">

  <div class="info">
    LEVEL:
    <span id="level">1</span>
  </div>

  <div class="info">
    FOOD:
    <span id="food">0</span>
  </div>

  <div class="info">
    ANTS:
    <span id="antCount">1</span>
  </div>

  <div class="info">
    COINS:
    <span id="coins">0</span>
  </div>

</div>


<!-- TASK -->

<div id="task"></div>


<!-- CONTROLS -->

<div id="controls">

  <button class="move" id="forward">
    MOVE FORWARD
  </button>

  <button class="move" id="back">
    MOVE BACK
  </button>

  <button class="move" id="left">
    TURN LEFT
  </button>

  <button class="move" id="right">
    TURN RIGHT
  </button>

</div>


<button id="action">
  DO TASK
</button>


<div id="message"></div>


<!-- LEVEL SCREEN -->

<div id="levelScreen">

  <div style="font-size:80px">🐜⭐</div>

  <div class="title">
    LEVEL COMPLETE!
  </div>

  <p class="subtitle" id="levelMessage"></p>

  <button class="bigButton" id="nextButton">
    CONTINUE
  </button>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

  W=innerWidth;
  H=innerHeight;

  const dpr=
    Math.min(
      devicePixelRatio || 1,
      2
    );

  canvas.width=W*dpr;
  canvas.height=H*dpr;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );
}

resize();

addEventListener(
  "resize",
  resize
);


/* =====================================================
   GAME STATE
===================================================== */

let playing=false;

let level=1;

let food=0;

let coins=0;

let antsUnlocked=1;

let currentTask=null;

let taskFinished=false;

let objects=[];

let workers=[];

let player={
  x:0,
  z:30,
  angle:0
};

const controls={
  forward:false,
  back:false,
  left:false,
  right:false
};


/* =====================================================
   ANT TYPES
===================================================== */

const antTypes=[

  {
    name:"Worker Ant",
    emoji:"🐜",
    level:1,
    speed:1,
    work:1
  },

  {
    name:"Flash Ant",
    emoji:"⚡",
    level:3,
    speed:3,
    work:2
  },

  {
    name:"Golden Ant",
    emoji:"👑",
    level:5,
    speed:1.5,
    work:4
  },

  {
    name:"Flying Ant",
    emoji:"🪽",
    level:7,
    speed:2,
    work:3
  },

  {
    name:"Goblin Ant",
    emoji:"👺",
    level:10,
    speed:2.5,
    work:5
  }

];


/* =====================================================
   TASKS
===================================================== */

const tasks=[

  {
    name:"Collect a berry",
    object:"berry",
    reward:10
  },

  {
    name:"Bring a leaf to the nest",
    object:"leaf",
    reward:12
  },

  {
    name:"Find a mushroom",
    object:"mushroom",
    reward:15
  },

  {
    name:"Collect a sugar crystal",
    object:"sugar",
    reward:20
  },

  {
    name:"Find the hidden seed",
    object:"seed",
    reward:25
  },

  {
    name:"Explore the giant flower",
    object:"flower",
    reward:30
  },

  {
    name:"Find the lost food pile",
    object:"foodpile",
    reward:35
  },

  {
    name:"Discover the secret tunnel",
    object:"tunnel",
    reward:40
  }

];


/* =====================================================
   RANDOM
===================================================== */

function random(a,b){

  return a+
    Math.random()*(b-a);

}


/* =====================================================
   CREATE WORLD
===================================================== */

function createWorld(){

  objects=[];

  workers=[];

  taskFinished=false;

  player.x=0;

  player.z=30;

  player.angle=0;


  currentTask=
    tasks[
      (level-1) %
      tasks.length
    ];


  /* Task object */

  objects.push({

    type:currentTask.object,

    x:random(-70,70),

    z:random(-100,-20),

    collected:false

  });


  /* Food */

  for(let i=0;i<20;i++){

    objects.push({

      type:"food",

      x:random(-90,90),

      z:random(-100,70),

      size:random(.5,1)

    });

  }


  /* Grass / plants */

  for(let i=0;i<70;i++){

    objects.push({

      type:"grass",

      x:random(-100,100),

      z:random(-110,80),

      size:random(.4,1.3)

    });

  }


  /* Colony workers */

  for(
    let i=0;
    i<Math.min(
      antsUnlocked,
      12
    );
    i++
  ){

    workers.push({

      x:random(-10,10),

      z:random(15,35),

      angle:random(
        0,
        Math.PI*2
      ),

      type:
        getBestUnlockedAnt(),

      timer:random(0,10)

    });

  }


  updateUI();

}


/* =====================================================
   BEST ANT
===================================================== */

function getBestUnlockedAnt(){

  let best=
    antTypes[0];


  for(
    const ant of antTypes
  ){

    if(
      level>=ant.level
    ){

      best=ant;

    }

  }


  return best;

}


/* =====================================================
   PROJECTION
===================================================== */

function project(
  x,
  z,
  size
){

  const dx=
    x-player.x;

  const dz=
    z-player.z;


  const sin=
    Math.sin(
      player.angle
    );

  const cos=
    Math.cos(
      player.angle
    );


  const forward=
    -dx*sin+
    -dz*cos;

  const side=
    dx*cos+
    -dz*sin;


  if(forward<=1)
    return null;


  const scale=
    430/forward;


  return {

    x:
      W/2+
      side*scale,

    y:
      H*.50+
      135*scale,

    size:
      Math.max(
        2,
        size*scale
      ),

    depth:forward

  };

}


/* =====================================================
   GROUND
===================================================== */

function drawGround(){

  const gradient=
    ctx.createLinearGradient(
      0,0,
      0,H
    );


  gradient.addColorStop(
    0,
    "#74ccee"
  );

  gradient.addColorStop(
    .5,
    "#6db34e"
  );

  gradient.addColorStop(
    1,
    "#355f2e"
  );


  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,0,W,H
  );


  ctx.strokeStyle="#ffffff20";


  for(
    let i=0;
    i<14;
    i++
  ){

    const y=
      H*.53+
      i*i*8;


    ctx.beginPath();

    ctx.moveTo(
      0,y
    );

    ctx.lineTo(
      W,y
    );

    ctx.stroke();

  }

}


/* =====================================================
   DRAW GRASS
===================================================== */

function drawGrass(o){

  const p=
    project(
      o.x,
      o.z,
      o.size
    );

  if(!p)
    return;


  ctx.strokeStyle="#2d8135";

  ctx.lineWidth=
    Math.max(
      1,
      p.size*.13
    );


  ctx.beginPath();

  ctx.moveTo(
    p.x,
    p.y
  );

  ctx.lineTo(
    p.x-p.size*.5,
    p.y-p.size
  );

  ctx.moveTo(
    p.x,
    p.y
  );

  ctx.lineTo(
    p.x+p.size*.5,
    p.y-p.size
  );

  ctx.stroke();

}


/* =====================================================
   DRAW FOOD
===================================================== */

function drawFood(o){

  const p=
    project(
      o.x,
      o.z,
      o.size
    );

  if(!p)
    return;


  ctx.fillStyle="#d94d38";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    Math.max(
      3,
      p.size
    ),
    0,
    Math.PI*2
  );

  ctx.fill();

}


/* =====================================================
   DRAW TASK OBJECT
===================================================== */

function drawTaskObject(o){

  if(o.collected)
    return;


  const p=
    project(
      o.x,
      o.z,
      1.5
    );

  if(!p)
    return;


  const s=
    Math.max(
      7,
      Math.min(
        55,
        p.size
      )
    );


  ctx.save();

  ctx.translate(
    p.x,
    p.y
  );


  if(o.type==="berry"){

    ctx.fillStyle="#d93653";

    ctx.beginPath();

    ctx.arc(
      -s*.4,
      0,
      s*.5,
      0,
      Math.PI*2
    );

    ctx.arc(
      s*.4,
      0,
      s*.5,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  if(o.type==="leaf"){

    ctx.fillStyle="#2d9b42";

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      s*1.3,
      s*.6,
      -.5,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  if(o.type==="mushroom"){

    ctx.fillStyle="#f5e4c5";

    ctx.fillRect(
      -s*.18,
      0,
      s*.36,
      s
    );

    ctx.fillStyle="#d94848";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      s,
      Math.PI,
      Math.PI*2
    );

    ctx.fill();

  }


  if(o.type==="sugar"){

    ctx.fillStyle="#fff3d0";

    ctx.beginPath();

    ctx.moveTo(
      0,-s*1.4
    );

    ctx.lineTo(
      s,
      0
    );

    ctx.lineTo(
      0,
      s
    );

    ctx.lineTo(
      -s,
      0
    );

    ctx.closePath();

    ctx.fill();

  }


  if(o.type==="seed"){

    ctx.fillStyle="#b87938";

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      s*.7,
      s,
      -.3,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  if(o.type==="flower"){

    ctx.strokeStyle="#34863b";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(
      0,s
    );

    ctx.lineTo(
      0,-s
    );

    ctx.stroke();

    ctx.fillStyle="#f5ce3b";

    ctx.beginPath();

    ctx.arc(
      0,
      -s,
      s*.6,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  if(o.type==="foodpile"){

    ctx.fillStyle="#c88637";

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      s*1.5,
      s*.8,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  if(o.type==="tunnel"){

    ctx.fillStyle="#29251f";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      s*1.3,
      Math.PI,
      Math.PI*2
    );

    ctx.fill();

  }


  ctx.restore();

}


/* =====================================================
   DRAW WORKER ANT
===================================================== */

function drawWorker(a){

  const p=
    project(
      a.x,
      a.z,
      .8
    );

  if(!p)
    return;


  const s=
    Math.max(
      4,
      Math.min(
        24,
        p.size
      )
    );


  ctx.save();

  ctx.translate(
    p.x,
    p.y
  );


  /*
    Different visual ant types
  */

  if(
    a.type.name==="Golden Ant"
  ){

    ctx.fillStyle="#ffd447";

  }

  else if(
    a.type.name==="Flash Ant"
  ){

    ctx.fillStyle="#ff633c";

  }

  else if(
    a.type.name==="Goblin Ant"
  ){

    ctx.fillStyle="#8b5cc7";

  }

  else{

    ctx.fillStyle="#21150e";

  }


  /* body */

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    s*.8,
    s*.45,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* head */

  ctx.beginPath();

  ctx.arc(
    s*.65,
    0,
    s*.42,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* legs */

  ctx.strokeStyle=
    ctx.fillStyle;

  ctx.lineWidth=
    Math.max(
      1,
      s*.13
    );


  for(
    let i=-1;
    i<=1;
    i++
  ){

    ctx.beginPath();

    ctx.moveTo(
      i*s*.25,
      -s*.2
    );

    ctx.lineTo(
      i*s*.75,
      -s*.55
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
      i*s*.25,
      s*.2
    );

    ctx.lineTo(
      i*s*.75,
      s*.55
    );

    ctx.stroke();

  }


  ctx.restore();

}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(){

  const x=W/2;
  const y=H*.65;


  ctx.save();

  ctx.translate(
    x,y
  );


  ctx.fillStyle="#17100c";

  ctx.beginPath();

  ctx.ellipse(
    0,
    12,
    15,
    24,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    0,
    -13,
    13,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.strokeStyle="#17100c";

  ctx.lineWidth=3;


  for(
    let i=-1;
    i<=1;
    i++
  ){

    ctx.beginPath();

    ctx.moveTo(
      0,
      0
    );

    ctx.lineTo(
      i*22,
      -10
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
      0,
      10
    );

    ctx.lineTo(
      i*22,
      25
    );

    ctx.stroke();

  }


  ctx.restore();

}


/* =====================================================
   DRAW WORLD
===================================================== */

function drawWorld(){

  drawGround();


  const list=[];


  for(
    const o of objects
  ){

    list.push({

      o:o,

      depth:
        Math.hypot(
          o.x-player.x,
          o.z-player.z
        )

    });

  }


  for(
    const a of workers
  ){

    list.push({

      o:a,

      depth:
        Math.hypot(
          a.x-player.x,
          a.z-player.z
        )

    });

  }


  list.sort(
    (a,b)=>
      b.depth-a.depth
  );


  for(
    const item of list
  ){

    const o=item.o;


    if(
      o.type==="grass"
    ){

      drawGrass(o);

    }

    else if(
      o.type==="food"
    ){

      drawFood(o);

    }

    else if(
      o.type &&
      o.type.name
    ){

      drawWorker(o);

    }

    else{

      drawTaskObject(o);

    }

  }


  drawPlayer();

}


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function updatePlayer(dt){

  const speed=
    8*dt;

  const turn=
    2.5*dt;


  /*
    Correct controls.
  */

  if(controls.left)
    player.angle-=turn;

  if(controls.right)
    player.angle+=turn;


  if(controls.forward){

    player.x +=
      Math.sin(player.angle)*
      speed;

    player.z +=
      -Math.cos(player.angle)*
      speed;

  }


  if(controls.back){

    player.x -=
      Math.sin(player.angle)*
      speed;

    player.z -=
      -Math.cos(player.angle)*
      speed;

  }


  player.x=
    Math.max(
      -100,
      Math.min(
        100,
        player.x
      )
    );


  player.z=
    Math.max(
      -110,
      Math.min(
        90,
        player.z
      )
    );

}


/* =====================================================
   MOVE WORKERS
===================================================== */

function updateWorkers(dt){

  for(
    const ant of workers
  ){

    ant.timer-=dt;


    if(
      ant.timer<=0
    ){

      ant.angle=
        random(
          0,
          Math.PI*2
        );

      ant.timer=
        random(
          1,
          4
        );

    }


    ant.x +=
      Math.sin(
        ant.angle
      )*
      ant.type.speed*
      dt;


    ant.z +=
      -Math.cos(
        ant.angle
      )*
      ant.type.speed*
      dt;


    if(
      Math.abs(ant.x)>18
    ){

      ant.angle+=Math.PI;

    }


    if(
      ant.z<5 ||
      ant.z>45
    ){

      ant.angle+=Math.PI;

    }

  }

}


/* =====================================================
   ACTION
===================================================== */

document
.getElementById("action")
.addEventListener(
  "click",
  function(){

    if(!playing)
      return;


    const object=
      objects.find(
        o=>
          !o.collected &&
          o.type===
          currentTask.object
      );


    if(!object)
      return;


    const distance=
      Math.hypot(
        object.x-player.x,
        object.z-player.z
      );


    if(distance>9){

      showMessage(
        "Move closer to the task!"
      );

      return;

    }


    object.collected=true;

    taskFinished=true;

    food+=currentTask.reward;

    coins+=currentTask.reward;


    updateUI();


    showMessage(
      "Task complete! +"+
      currentTask.reward+
      " food!"
    );


    setTimeout(
      finishLevel,
      600
    );

  }
);


/* =====================================================
   FINISH LEVEL
===================================================== */

function finishLevel(){

  playing=false;


  const unlocked=
    antTypes.filter(
      a=>
        a.level===level+1
    );
