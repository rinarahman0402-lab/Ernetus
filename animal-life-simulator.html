
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Animal Life Simulator</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07120b;
  font-family:Arial,sans-serif;
}

button{
  border:0;
  font-family:Arial,sans-serif;
  touch-action:manipulation;
  cursor:pointer;
}

#start{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background:
    radial-gradient(circle at 50% 25%,#9bdc82,#397448 50%,#07120b);
}

#start h1{
  font-size:44px;
  margin:12px;
}

#start p{
  max-width:650px;
  margin:10px 25px 30px;
  font-size:18px;
  line-height:1.5;
}

#play{
  padding:20px 55px;
  border-radius:25px;
  background:#e8c95a;
  color:#18200f;
  font-size:27px;
  font-weight:bold;
  box-shadow:0 7px 0 #9a812c;
}

#play:active{
  transform:translateY(6px);
  box-shadow:0 1px 0 #9a812c;
}

#selection{
  display:none;
  position:fixed;
  inset:0;
  z-index:19;
  text-align:center;
  color:white;
  padding-top:45px;
  background:linear-gradient(#71b9d0,#487b49);
}

#selection h2{
  font-size:32px;
}

.choice{
  width:170px;
  margin:8px;
  padding:17px;
  border-radius:18px;
  background:#142c1b;
  color:white;
  font-size:19px;
  font-weight:bold;
}

.choice:active{
  transform:scale(.94);
}

#game{
  display:none;
  position:fixed;
  inset:0;
}

#world{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}

#hud{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  z-index:5;
  display:flex;
  justify-content:space-between;
}

.box{
  padding:10px 14px;
  border-radius:15px;
  background:rgba(7,20,11,.82);
  color:white;
  font-weight:bold;
}

#task{
  position:absolute;
  top:58px;
  left:50%;
  transform:translateX(-50%);
  width:min(90%,520px);
  padding:11px;
  border-radius:15px;
  background:rgba(7,20,11,.82);
  color:white;
  text-align:center;
  font-weight:bold;
  z-index:5;
}

#controls{
  position:absolute;
  left:12px;
  bottom:18px;
  z-index:5;
  display:flex;
  gap:8px;
}

.ctrl{
  width:85px;
  height:62px;
  border-radius:17px;
  background:rgba(7,20,11,.9);
  color:white;
  font-weight:bold;
}

.ctrl:active{
  transform:scale(.94);
}

#action{
  position:absolute;
  right:15px;
  bottom:25px;
  z-index:5;
  padding:18px 25px;
  border-radius:18px;
  background:#e8c95a;
  color:#18200f;
  font-weight:bold;
  font-size:17px;
}

#message{
  display:none;
  position:absolute;
  z-index:10;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(88%,420px);
  padding:25px;
  border-radius:22px;
  background:rgba(5,15,8,.96);
  color:white;
  text-align:center;
}

#continue{
  margin-top:15px;
  padding:13px 25px;
  border-radius:14px;
  background:#e8c95a;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="start">
  <div style="font-size:90px">🌲</div>

  <h1>Animal Life Simulator</h1>

  <p>
    Enter a living wilderness. Choose an animal,
    find food, survive predators, explore the world
    and grow stronger.
  </p>

  <button id="play" type="button">PLAY GAME</button>
</div>

<div id="selection">

  <h2>CHOOSE YOUR ANIMAL</h2>

  <button class="choice"
          data-kind="herbivore"
          data-animal="deer"
          type="button">
    DEER<br>
    <small>HERBIVORE</small>
  </button>

  <button class="choice"
          data-kind="herbivore"
          data-animal="rabbit"
          type="button">
    RABBIT<br>
    <small>HERBIVORE</small>
  </button>

  <button class="choice"
          data-kind="carnivore"
          data-animal="lion"
          type="button">
    LION<br>
    <small>CARNIVORE</small>
  </button>

  <button class="choice"
          data-kind="carnivore"
          data-animal="wolf"
          type="button">
    WOLF<br>
    <small>CARNIVORE</small>
  </button>

</div>

<div id="game">

<canvas id="world"></canvas>

<div id="hud">
  <div class="box">
    LEVEL <span id="level">1</span>
  </div>

  <div class="box">
    ENERGY <span id="energy">100</span>%
  </div>
</div>

<div id="task">
  Explore the wilderness.
</div>

<div id="controls">

  <button class="ctrl" id="left" type="button">
    LEFT
  </button>

  <button class="ctrl" id="forward" type="button">
    MOVE
  </button>

  <button class="ctrl" id="right" type="button">
    RIGHT
  </button>

</div>

<button id="action" type="button">
  EAT / HUNT
</button>

<div id="message">

  <div id="messageText"></div>

  <button id="continue" type="button">
    CONTINUE
  </button>

</div>

</div>

<script>
"use strict";

/* =========================
   ELEMENTS
========================= */

const start = document.getElementById("start");
const selection = document.getElementById("selection");
const game = document.getElementById("game");
const play = document.getElementById("play");

const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");

const levelEl = document.getElementById("level");
const energyEl = document.getElementById("energy");
const taskEl = document.getElementById("task");

const message = document.getElementById("message");
const messageText = document.getElementById("messageText");
const continueButton = document.getElementById("continue");

let running = false;
let kind = "";
let animal = "";

let level = 1;
let energy = 100;

let player = {
  x: 0,
  y: 0,
  angle: 0
};

let plants = [];
let animals = [];
let predators = [];
let water = [];
let rocks = [];


/* =========================
   CANVAS SIZE
========================= */

function resize(){

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

}

window.addEventListener("resize", resize);

resize();


/* =========================
   PLAY GAME
========================= */

play.addEventListener("click", function(){

  start.style.display = "none";
  selection.style.display = "block";

});


/* =========================
   ANIMAL SELECTION
========================= */

document.querySelectorAll(".choice").forEach(function(button){

  button.addEventListener("click", function(){

    kind = button.dataset.kind;
    animal = button.dataset.animal;

    selection.style.display = "none";
    game.style.display = "block";

    begin();

  });

});


/* =========================
   BEGIN GAME
========================= */

function begin(){

  running = true;

  level = 1;
  energy = 100;

  player.x = canvas.width / 2;
  player.y = canvas.height / 2;
  player.angle = 0;

  createWorld();

  updateTask();
  updateHUD();

  requestAnimationFrame(loop);

}


/* =========================
   CREATE WORLD
========================= */

function createWorld(){

  plants = [];
  animals = [];
  predators = [];
  water = [];
  rocks = [];

  for(let i = 0; i < 30; i++){

    plants.push({
      x: Math.random() * canvas.width,
      y: 150 + Math.random() *
        Math.max(100, canvas.height - 280),
      size: 8 + Math.random() * 9
    });

  }

  for(let i = 0; i < 10; i++){

    animals.push({
      x: Math.random() * canvas.width,
      y: 160 + Math.random() *
        Math.max(100, canvas.height - 290),
      type: "deer",
      alive: true,
      speed: 0.3 + Math.random() * 0.7,
      phase: Math.random() * 6
    });

  }

  for(let i = 0; i < 5; i++){

    predators.push({
      x: Math.random() * canvas.width,
      y: 160 + Math.random() *
        Math.max(100, canvas.height - 290),
      type: i % 2 ? "wolf" : "lion",
      speed: 0.2 + Math.random() * 0.5
    });

  }

  for(let i = 0; i < 3; i++){

    water.push({
      x: Math.random() * canvas.width,
      y: 180 + Math.random() *
        Math.max(100, canvas.height - 300),
      w: 100 + Math.random() * 140,
      h: 45 + Math.random() * 70
    });

  }

  for(let i = 0; i < 18; i++){

    rocks.push({
      x: Math.random() * canvas.width,
      y: 150 + Math.random() *
        Math.max(100, canvas.height - 270),
      r: 5 + Math.random() * 13
    });

  }

}


/* =========================
   TASK
========================= */

function updateTask(){

  if(kind === "herbivore"){

    taskEl.textContent =
      "SURVIVE: Eat plants and stay away from predators.";

  }else{

    taskEl.textContent =
      "SURVIVE: Hunt herbivores to gain energy.";

  }

}


/* =========================
   MOVEMENT
========================= */

function move(){

  if(!running) return;

  const speed = 4;

  player.x += Math.cos(player.angle) * speed;
  player.y += Math.sin(player.angle) * speed;

  player.x = Math.max(
    25,
    Math.min(canvas.width - 25, player.x)
  );

  player.y = Math.max(
    120,
    Math.min(canvas.height - 70, player.y)
  );

  energy = Math.max(0, energy - 0.12);

}

function turnLeft(){

  if(!running) return;

  player.angle -= 0.13;

}

function turnRight(){

  if(!running) return;

  player.angle += 0.13;

}


/* =========================
   CONTROLS
========================= */

document.getElementById("forward")
.addEventListener("click", move);

document.getElementById("left")
.addEventListener("click", turnLeft);

document.getElementById("right")
.addEventListener("click", turnRight);


/* =========================
   EAT / HUNT
========================= */

document.getElementById("action")
.addEventListener("click", function(){

  if(!running) return;

  if(kind === "herbivore"){

    eatPlant();

  }else{

    hunt();

  }

});


function eatPlant(){

  let nearest = null;
  let best = 70;

  for(const plant of plants){

    const d = distance(
      player.x,
      player.y,
      plant.x,
      plant.y
    );

    if(d < best){

      nearest = plant;
      best = d;

    }

  }

  if(nearest){

    nearest.x = Math.random() * canvas.width;

    nearest.y =
      150 +
      Math.random() *
      Math.max(100, canvas.height - 280);

    energy = Math.min(
      100,
      energy + 25
    );

    checkLevel();

  }

}


function hunt(){

  let target = null;
  let best = 85;

  for(const creature of animals){

    if(!creature.alive) continue;

    const d = distance(
      player.x,
      player.y,
      creature.x,
      creature.y
    );

    if(d < best){

      target = creature;
      best = d;

    }

  }

  if(target){

    target.alive = false;

    energy = Math.min(
      100,
      energy + 35
    );

    checkLevel();

  }

}


/* =========================
   LEVEL
========================= */

function checkLevel(){

  level++;

  levelEl.textContent = level;

  if(level % 2 === 0){

    showMessage(
      "YOU SURVIVED!<br><br>" +
      "You reached level " +
      level +
      "!<br><br>" +
      "The wilderness gets harder."
    );

  }

}


/* =========================
   PREDATORS
========================= */

function updatePredators(){

  for(const predator of predators){

    const dx = player.x - predator.x;
    const dy = player.y - predator.y;

    const d = Math.sqrt(
      dx * dx + dy * dy
    );

    if(kind === "herbivore" && d < 250){

      if(d > 0){

        predator.x +=
          (dx / d) * predator.speed;

        predator.y +=
          (dy / d) * predator.speed;

      }

      if(d < 35){

        energy -= 0.6;

      }

    }

  }

}


/* =========================
   WILDLIFE
========================= */

function updateWildlife(time){

  for(const creature of animals){

    if(!creature.alive) continue;

    creature.x +=
      Math.sin(
        time * 0.001 +
        creature.phase
      ) *
      creature.speed;

    creature.y +=
      Math.cos(
        time * 0.0008 +
        creature.phase
      ) *
      creature.speed;

    creature.x = Math.max(
      20,
      Math.min(
        canvas.width - 20,
        creature.x
      )
    );

    creature.y = Math.max(
      140,
      Math.min(
        canvas.height - 80,
        creature.y
      )
    );

  }

}


/* =========================
   DISTANCE
========================= */

function distance(x1,y1,x2,y2){

  const dx = x1 - x2;
  const dy = y1 - y2;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* =========================
   ENVIRONMENT
========================= */

function drawEnvironment(){

  const sky =
    ctx.createLinearGradient(
      0,
      0,
      0,
      canvas.height
    );

  sky.addColorStop(
    0,
    "#6fa9c2"
  );

  sky.addColorStop(
    0.38,
    "#b6d79a"
  );

  sky.addColorStop(
    1,
    "#294f2d"
  );

  ctx.fillStyle = sky;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* distant hills */

  ctx.fillStyle = "#466e48";

  ctx.beginPath();

  ctx.moveTo(0,330);

  for(
    let x = 0;
    x <= canvas.width;
    x += 70
  ){

    ctx.lineTo(
      x,
      300 +
      Math.sin(x * 0.012) * 35
    );

  }

  ctx.lineTo(
    canvas.width,
    canvas.height
  );

  ctx.lineTo(
    0,
    canvas.height
  );

  ctx.fill();


  /* ground */

  ctx.fillStyle = "#426f38";

  ctx.fillRect(
    0,
    canvas.height * 0.48,
    canvas.width,
    canvas.height * 0.52
  );


  /* sunlight */

  const sunX =
    canvas.width * 0.82;

  const sunY = 100;

  const glow =
    ctx.createRadialGradient(
      sunX,
      sunY,
      10,
      sunX,
      sunY,
      170
    );

  glow.addColorStop(
    0,
    "rgba(255,245,190,.5)"
  );

  glow.addColorStop(
    1,
    "rgba(255,245,190,0)"
  );

  ctx.fillStyle = glow;

  ctx.fillRect(
    sunX - 170,
    sunY - 170,
    340,
    340
  );


  /* water */

  for(const lake of water){

    drawWater(lake);

  }


  /* rocks */

  for(const rock of rocks){

    drawRock(rock);

  }


  /* trees */

  for(let i = 0; i < 14; i++){

    const x =
      (i * 181 + 90) %
      canvas.width;

    const y =
      160 +
      (i * 123) %
      Math.max(
        250,
        canvas.height - 300
      );

    drawTree(x,y);

  }

}


/* =========================
   WATER
========================= */

function drawWater(w){

  ctx.fillStyle =
    "rgba(55,130,165,.8)";

  ctx.beginPath();

  ctx.ellipse(
    w.x,
    w.y,
    w.w,
    w.h,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.strokeStyle =
    "rgba(190,235,245,.5)";

  ctx.lineWidth = 2;

  for(let i = -2; i <= 2; i++){

    ctx.beginPath();

    ctx.moveTo(
      w.x - w.w * 0.65,
      w.y + i * 14
    );

    ctx.quadraticCurveTo(
      w.x,
      w.y + i * 14 - 5,
      w.x + w.w * 0.65,
      w.y + i * 14
    );

    ctx.stroke();

  }

}


/* =========================
   ROCK
========================= */

function drawRock(r){

  ctx.fillStyle = "#66675d";

  ctx.beginPath();

  ctx.moveTo(
    r.x - r.r,
    r.y + r.r * 0.4
  );

  ctx.lineTo(
    r.x - r.r * 0.5,
    r.y - r.r
  );

  ctx.lineTo(
    r.x + r.r * 0.5,
    r.y - r.r * 0.7
  );

  ctx.lineTo(
    r.x + r.r,
    r.y + r.r * 0.5
  );

  ctx.closePath();

  ctx.fill();

}


/* =========================
   TREE
========================= */

function drawTree(x,y){

  const scale =
    0.65 +
    (y / canvas.height) * 0.8;

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(scale,scale);

  /* shadow */

  ctx.fillStyle =
    "rgba(0,0,0,.2)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    55,
    45,
    12,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* trunk */

  const trunk =
    ctx.createLinearGradient(
      -10,
      0,
      15,
      0
    );

  trunk.addColorStop(
    0,
    "#4a2d19"
  );

  trunk.addColorStop(
    0.5,
    "#80512b"
  );

  trunk.addColorStop(
    1,
    "#3d2515"
  );

  ctx.fillStyle = trunk;

  ctx.fillRect(
    -10,
    0,
    20,
    60
  );


  /* foliage */

  ctx.fillStyle = "#205b2c";

  ctx.beginPath();

  ctx.arc(
    0,
    -20,
    40,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.fillStyle = "#347b39";

  ctx.beginPath();

  ctx.arc(
    -27,
    -5,
    27,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    27,
    -5,
    27,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();

}


/* =========================
   PLANTS
========================= */

function drawPlant(p){

  ctx.strokeStyle = "#174b25";
  ctx.lineWidth = 4;

  ctx.beginPath();

  ctx.moveTo(
    p.x,
    p.y + 12
  );

  ctx.lineTo(
    p.x,
    p.y - p.size
  );

  ctx.stroke();

  ctx.fillStyle = "#64b84e";

  ctx.beginPath();

  ctx.ellipse(
    p.x - 7,
    p.y - 2,
    p.size,
    p.size * 0.45,
    -0.5,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.ellipse(
    p.x + 7,
    p.y - 7,
    p.size,
    p.size * 0.45,
    0.5,
    0,
    Math.PI * 2
  );

  ctx.fill();

}


/* =========================
   ANIMAL
========================= */

function drawAnimal(
  x,
  y,
  type,
  isPlayer = false
){

  const scale =
    isPlayer ? 1.35 : 0.9;

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(scale,scale);


  /* shadow */

  ctx.fillStyle =
    "rgba(0,0,0,.28)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    20,
    28,
    8,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  if(type === "deer"){

    ctx.fillStyle = "#815331";

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      28,
      15,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.ellipse(
      25,
      -12,
      13,
      11,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle = "#4b321e";
    ctx.lineWidth = 5;

    for(const leg of [-15,-5,10,20]){

      ctx.beginPath();

      ctx.moveTo(
        leg,
        10
      );

      ctx.lineTo(
        leg,
        32
      );

      ctx.stroke();

    }

    ctx.strokeStyle = "#4b321e";
    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(22,-20);
    ctx.lineTo(15,-34);

    ctx.moveTo(28,-20);
    ctx.lineTo(35,-34);

    ctx.stroke();

  }

  else if(type === "rabbit"){

    ctx.fillStyle = "#c9c3b5";

    ctx.beginPath();

    ctx.ellipse(
      0,
      4,
      24,
      15,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
      22,
      -8,
      13,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.fillRect(
      16,
      -32,
      7,
      20
    );

    ctx.fillRect(
      27,
      -31,
      7,
      20
    );

  }

  else if(type === "lion"){

    /* mane */

    ctx.fillStyle = "#70411e";

    ctx.beginPath();

    ctx.arc(
      23,
      -8,
      22,
      0,
      Math.PI * 2
    );

    ctx.fill();

    /* body */

    ctx.fillStyle = "#b8792f";

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      29,
      16,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();

    /* head */

    ctx.fillStyle = "#d99c45";

    ctx.beginPath();

    ctx.arc(
      25,
      -8,
      15,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }

  else{

    /* wolf */

    ctx.fillStyle = "#686c69";

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      29,
      15,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
      24,
      -10,
      14,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = "#3f4542";

    ctx.beginPath();

    ctx.moveTo(17,-21);
    ctx.lineTo(20,-34);
    ctx.lineTo(27,-22);

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(29,-22);
    ctx.lineTo(37,-34);
    ctx.lineTo(39,-18);

    ctx.fill();

  }

  ctx.restore();

}


/* =========================
   PLAYER
========================= */

function drawPlayer(){

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );

  ctx.rotate(
    player.angle
  );

  drawAnimal(
    0,
    0,
    animal,
    true
  );

  ctx.restore();

}


/* =========================
   HUD
========================= */

function updateHUD(){

  energyEl.textContent =
    Math.max(
      0,
      Math.round(energy)
    );

  levelEl.textContent =
    level;

}
