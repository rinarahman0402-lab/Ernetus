
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Animal Life Simulator</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#07130b;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
}

/* START SCREEN */

#startScreen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  padding:25px;
  background:
    radial-gradient(
      circle at 50% 20%,
      #a7dc8c 0%,
      #4e9452 48%,
      #07130b 100%
    );
}

#startScreen h1{
  margin:12px 0;
  font-size:clamp(38px,10vw,64px);
}

#startScreen p{
  max-width:650px;
  font-size:18px;
  line-height:1.5;
}

.startIcon{
  font-size:85px;
}

#playButton{
  margin-top:20px;
  width:min(82vw,420px);
  padding:20px;
  border-radius:25px;
  background:#f1cf55;
  color:#17210e;
  font-size:27px;
  font-weight:900;
  box-shadow:0 7px 0 #9b7c2c;
}

#playButton:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #9b7c2c;
}


/* ANIMAL SELECT */

#animalSelect{
  display:none;
  position:fixed;
  inset:0;
  z-index:19;
  overflow:auto;
  padding:25px 15px;
  text-align:center;
  color:white;
  background:linear-gradient(
    #6eb9cf,
    #4d8c50
  );
}

#animalSelect h2{
  font-size:32px;
}

.animalButton{
  display:block;
  width:min(85vw,350px);
  margin:14px auto;
  padding:18px;
  border-radius:20px;
  background:#142d1b;
  color:white;
  font-size:20px;
  font-weight:bold;
}

.animalButton:active{
  transform:scale(.95);
}


/* GAME */

#game{
  display:none;
  position:fixed;
  inset:0;
  overflow:hidden;
}

#world{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}


/* HUD */

#hud{
  position:absolute;
  z-index:5;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.hud{
  padding:10px 14px;
  border-radius:15px;
  background:rgba(5,20,10,.85);
  color:white;
  font-weight:bold;
}


/* TASK */

#task{
  position:absolute;
  z-index:5;
  top:60px;
  left:50%;
  transform:translateX(-50%);
  width:min(90vw,500px);
  padding:11px;
  border-radius:15px;
  background:rgba(5,20,10,.85);
  color:white;
  text-align:center;
  font-weight:bold;
  pointer-events:none;
}


/* JOYSTICK */

#joystick{
  position:absolute;
  z-index:10;
  left:20px;
  bottom:22px;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(10,25,15,.55);
  border:4px solid rgba(255,255,255,.35);
  touch-action:none;
}

#stick{
  position:absolute;
  width:66px;
  height:66px;
  left:38px;
  top:38px;
  border-radius:50%;
  background:#f1cf55;
  border:4px solid rgba(255,255,255,.65);
  box-shadow:0 4px 12px rgba(0,0,0,.4);
  pointer-events:none;
}


/* ACTION */

#actionButton{
  position:absolute;
  z-index:10;
  right:20px;
  bottom:35px;
  padding:19px 24px;
  border-radius:20px;
  background:#f1cf55;
  color:#17210e;
  font-weight:900;
  font-size:17px;
}

#actionButton:active{
  transform:scale(.94);
}


/* MESSAGE */

#message{
  display:none;
  position:absolute;
  z-index:30;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(88vw,430px);
  padding:27px;
  border-radius:24px;
  background:rgba(5,15,8,.97);
  color:white;
  text-align:center;
}

#continueButton{
  margin-top:17px;
  padding:14px 25px;
  border-radius:15px;
  background:#f1cf55;
  color:#17210e;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- START -->

<section id="startScreen">

  <div class="startIcon">🌲</div>

  <h1>Animal Life Simulator</h1>

  <p>
    Choose an animal, explore the wilderness,
    find food, survive predators and grow stronger.
  </p>

  <button id="playButton" type="button">
    PLAY GAME
  </button>

</section>


<!-- ANIMAL SELECTION -->

<section id="animalSelect">

  <h2>CHOOSE YOUR ANIMAL</h2>

  <button
    class="animalButton"
    data-kind="herbivore"
    data-animal="deer"
    type="button">
    🦌 DEER
    <br>
    <small>HERBIVORE</small>
  </button>

  <button
    class="animalButton"
    data-kind="herbivore"
    data-animal="rabbit"
    type="button">
    🐇 RABBIT
    <br>
    <small>HERBIVORE</small>
  </button>

  <button
    class="animalButton"
    data-kind="carnivore"
    data-animal="lion"
    type="button">
    🦁 LION
    <br>
    <small>CARNIVORE</small>
  </button>

  <button
    class="animalButton"
    data-kind="carnivore"
    data-animal="wolf"
    type="button">
    🐺 WOLF
    <br>
    <small>CARNIVORE</small>
  </button>

</section>


<!-- GAME -->

<section id="game">

  <canvas id="world"></canvas>

  <div id="hud">

    <div class="hud">
      LEVEL:
      <span id="level">1</span>
    </div>

    <div class="hud">
      ENERGY:
      <span id="energy">100</span>%
    </div>

  </div>

  <div id="task">
    Choose your animal.
  </div>


  <!-- REAL TOUCH JOYSTICK -->

  <div id="joystick">
    <div id="stick"></div>
  </div>


  <button id="actionButton" type="button">
    EAT / HUNT
  </button>


  <div id="message">

    <div id="messageText"></div>

    <button id="continueButton" type="button">
      CONTINUE
    </button>

  </div>

</section>


<script>
"use strict";


/* ================================
   GET ELEMENTS
================================ */

const startScreen =
  document.getElementById("startScreen");

const animalSelect =
  document.getElementById("animalSelect");

const game =
  document.getElementById("game");

const playButton =
  document.getElementById("playButton");

const canvas =
  document.getElementById("world");

const ctx =
  canvas.getContext("2d");

const joystick =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");

const actionButton =
  document.getElementById("actionButton");

const task =
  document.getElementById("task");

const levelText =
  document.getElementById("level");

const energyText =
  document.getElementById("energy");

const message =
  document.getElementById("message");

const messageText =
  document.getElementById("messageText");

const continueButton =
  document.getElementById("continueButton");


/* ================================
   GAME STATE
================================ */

let running = false;

let animalKind = "";
let animalType = "";

let level = 1;
let energy = 100;

let player = {
  x:0,
  y:0,
  angle:0
};

let joyX = 0;
let joyY = 0;
let joyActive = false;

let plants = [];
let prey = [];
let predators = [];
let rocks = [];
let lakes = [];


/* ================================
   CANVAS
================================ */

function resize(){

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}

window.addEventListener(
  "resize",
  resize
);

resize();


/* ================================
   PLAY BUTTON
================================ */

playButton.addEventListener(
  "click",
  function(){

    startScreen.style.display =
      "none";

    animalSelect.style.display =
      "block";

  }
);


/* ================================
   ANIMAL BUTTONS
================================ */

document
.querySelectorAll(".animalButton")
.forEach(function(button){

  button.addEventListener(
    "click",
    function(){

      animalKind =
        button.dataset.kind;

      animalType =
        button.dataset.animal;

      animalSelect.style.display =
        "none";

      game.style.display =
        "block";

      startGame();

    }
  );

});


/* ================================
   START GAME
================================ */

function startGame(){

  running = true;

  level = 1;
  energy = 100;

  player.x =
    canvas.width / 2;

  player.y =
    canvas.height / 2;

  player.angle = 0;

  createWorld();

  updateTask();

  updateHUD();

  requestAnimationFrame(
    loop
  );

}


/* ================================
   WORLD GENERATION
================================ */

function createWorld(){

  plants = [];
  prey = [];
  predators = [];
  rocks = [];
  lakes = [];


  for(let i = 0; i < 40; i++){

    plants.push({

      x:
        Math.random() *
        canvas.width,

      y:
        150 +
        Math.random() *
        Math.max(
          100,
          canvas.height - 260
        ),

      size:
        7 +
        Math.random() * 8

    });

  }


  for(let i = 0; i < 14; i++){

    prey.push({

      x:
        Math.random() *
        canvas.width,

      y:
        160 +
        Math.random() *
        Math.max(
          100,
          canvas.height - 280
        ),

      type:
        Math.random() < .5
        ? "deer"
        : "rabbit",

      alive:true,

      phase:
        Math.random() * 20

    });

  }


  for(let i = 0; i < 5; i++){

    predators.push({

      x:
        Math.random() *
        canvas.width,

      y:
        160 +
        Math.random() *
        Math.max(
          100,
          canvas.height - 280
        ),

      type:
        Math.random() < .5
        ? "lion"
        : "wolf",

      speed:
        .25 +
        Math.random() * .3

    });

  }


  for(let i = 0; i < 20; i++){

    rocks.push({

      x:
        Math.random() *
        canvas.width,

      y:
        150 +
        Math.random() *
        Math.max(
          100,
          canvas.height - 260
        ),

      size:
        5 +
        Math.random() * 10

    });

  }


  for(let i = 0; i < 3; i++){

    lakes.push({

      x:
        Math.random() *
        canvas.width,

      y:
        180 +
        Math.random() *
        Math.max(
          100,
          canvas.height - 300
        ),

      width:
        100 +
        Math.random() * 100,

      height:
        40 +
        Math.random() * 40

    });

  }

}


/* ================================
   TASK
================================ */

function updateTask(){

  if(animalKind === "herbivore"){

    task.textContent =
      "SURVIVE: Find plants and escape predators.";

  }else{

    task.textContent =
      "SURVIVE: Hunt herbivores for food.";

  }

}


/* ================================
   JOYSTICK
================================ */

function updateJoystick(
  clientX,
  clientY
){

  const rect =
    joystick.getBoundingClientRect();

  const centerX =
    rect.left +
    rect.width / 2;

  const centerY =
    rect.top +
    rect.height / 2;

  let dx =
    clientX - centerX;

  let dy =
    clientY - centerY;

  const max =
    rect.width / 2 - 33;

  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  if(distance > max){

    dx =
      dx / distance * max;

    dy =
      dy / distance * max;

  }

  joyX =
    dx / max;

  joyY =
    dy / max;

  stick.style.transform =
    "translate(" +
    dx +
    "px," +
    dy +
    "px)";

}


function resetJoystick(){

  joyActive = false;

  joyX = 0;
  joyY = 0;

  stick.style.transform =
    "translate(0px,0px)";

}


joystick.addEventListener(
  "pointerdown",
  function(event){

    joyActive = true;

    joystick.setPointerCapture(
      event.pointerId
    );

    updateJoystick(
      event.clientX,
      event.clientY
    );

  }
);


joystick.addEventListener(
  "pointermove",
  function(event){

    if(!joyActive)
      return;

    updateJoystick(
      event.clientX,
      event.clientY
    );

  }
);


joystick.addEventListener(
  "pointerup",
  resetJoystick
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


/* ================================
   PLAYER
================================ */

function updatePlayer(){

  if(!running)
    return;

  const forward =
    -joyY;

  const turn =
    joyX * 0.06;

  player.angle +=
    turn;

  const speed = 3.2;

  player.x +=
    Math.cos(player.angle) *
    forward *
    speed;

  player.y +=
    Math.sin(player.angle) *
    forward *
    speed;


  player.x =
    Math.max(
      25,
      Math.min(
        canvas.width - 25,
        player.x
      )
    );

  player.y =
    Math.max(
      120,
      Math.min(
        canvas.height - 70,
        player.y
      )
    );


  if(
    Math.abs(joyX) > .05 ||
    Math.abs(joyY) > .05
  ){

    energy -= .035;

  }

}


/* ================================
   ACTION
================================ */

actionButton.addEventListener(
  "click",
  function(){

    if(!running)
      return;

    if(animalKind === "herbivore"){

      eat();

    }else{

      hunt();

    }

  }
);


/* ================================
   EAT
================================ */

function eat(){

  let target = null;
  let nearest = 70;

  for(const plant of plants){

    const d =
      distance(
        player.x,
        player.y,
        plant.x,
        plant.y
      );

    if(d < nearest){

      nearest = d;
      target = plant;

    }

  }

  if(target){

    target.x =
      Math.random() *
      canvas.width;

    target.y =
      150 +
      Math.random() *
      Math.max(
        100,
        canvas.height - 260
      );

    energy =
      Math.min(
        100,
        energy + 25
      );

    level++;

  }

}


/* ================================
   HUNT
================================ */

function hunt(){

  let target = null;
  let nearest = 80;

  for(const animal of prey){

    if(!animal.alive)
      continue;

    const d =
      distance(
        player.x,
        player.y,
        animal.x,
        animal.y
      );

    if(d < nearest){

      nearest = d;
      target = animal;

    }

  }

  if(target){

    target.alive = false;

    energy =
      Math.min(
        100,
        energy + 35
      );

    level++;

  }

}


/* ================================
   PREDATORS
================================ */

function updatePredators(){

  if(animalKind !== "herbivore")
    return;

  for(const predator of predators){

    const dx =
      player.x - predator.x;

    const dy =
      player.y - predator.y;

    const d =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    if(
      d < 250 &&
      d > 0
    ){

      predator.x +=
        dx / d *
        predator.speed;

      predator.y +=
        dy / d *
        predator.speed;

    }

    if(d < 35){

      energy -= .2;

    }

  }

}


/* ================================
   WILDLIFE
================================ */

function updateWildlife(time){

  for(const animal of prey){

    if(!animal.alive)
      continue;

    animal.x +=
      Math.sin(
        time * .001 +
        animal.phase
      ) * .25;

    animal.y +=
      Math.cos(
        time * .0008 +
        animal.phase
      ) * .2;

  }

}


/* ================================
   DRAW WORLD
================================ */

function drawWorld(){

  const sky =
    ctx.createLinearGradient(
      0,
      0,
      0,
      canvas.height
    );

  sky.addColorStop(
    0,
    "#69b7cf"
  );

  sky.addColorStop(
    .45,
    "#b4d795"
  );

  sky.addColorStop(
    1,
    "#315f34"
  );

  ctx.fillStyle = sky;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* mountains */

  ctx.fillStyle =
    "#4b744d";

  ctx.beginPath();

  ctx.moveTo(
    0,
    350
  );

  for(
    let x = 0;
    x <= canvas.width;
    x += 80
  ){

    ctx.lineTo(
      x,
      300 +
      Math.sin(x * .012) * 35
    );

  }

  ctx.lineTo(
    canvas.width,
    canvas.height
  );

  ctx.lineTo(
    0,
    canvas.height
  );

  ctx.fill();


  /* ground */

  ctx.fillStyle =
    "#3d7238";

  ctx.fillRect(
    0,
    canvas.height * .5,
    canvas.width,
    canvas.height
  );


  /* lakes */

  for(const lake of lakes){

    ctx.fillStyle =
      "rgba(48,132,174,.85)";

    ctx.beginPath();

    ctx.ellipse(
      lake.x,
      lake.y,
      lake.width,
      lake.height,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }


  /* rocks */

  for(const rock of rocks){

    ctx.fillStyle =
      "#676960";

    ctx.beginPath();

    ctx.arc(
      rock.x,
      rock.y,
      rock.size,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }


  /* trees */

  for(let i = 0; i < 15; i++){

    const x =
      (i * 177 + 60) %
      canvas.width;

    const y =
      150 +
      (i * 121) %
      Math.max(
        200,
        canvas.height - 290
      );

    drawTree(
      x,
      y
    );

  }


  /* plants */

  for(const plant of plants){

    drawPlant(plant);

  }


  /* prey */

  for(const animal of prey){

    if(animal.alive){

      drawAnimal(
        animal.x,
        animal.y,
        animal.type,
        false
      );

    }

  }


  /* predators */

  for(const predator of predators){

    drawAnimal(
      predator.x,
      predator.y,
      predator.type,
      false
    );

  }


  /* player */

  drawAnimal(
    player.x,
    player.y,
    animalType,
    true
  );

}


/* ================================
   TREE
================================ */

function drawTree(x,y){

  ctx.save();

  ctx.translate(
    x,
    y
  );

  const scale =
    .65 +
    y / canvas.height;

  ctx.scale(
    scale,
    scale
  );


  /* shadow */

  ctx.fillStyle =
    "rgba(0,0,0,.25)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    60,
    45,
    11,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* trunk */

  ctx.fillStyle =
    "#694326";

  ctx.fillRect(
    -10,
    0,
    20,
    62
  );


  /* leaves */

  ctx.fillStyle =
    "#205d2d";

  ctx.beginPath();

  ctx.arc(
    0,
    -20,
    42,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.fillStyle =
    "#347f3a";

  ctx.beginPath();

  ctx.arc(
    -26,
    0,
    28,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    26,
    0,
    28,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.restore();

}


/* ================================
   PLANT
================================ */

function drawPlant(p){

  ctx.strokeStyle =
    "#174b25";

  ctx.lineWidth = 4;

  ctx.beginPath();

  ctx.moveTo(
    p.x,
    p.y + 10
  );

  ctx.lineTo(
    p.x,
    p.y - p.size
  );

  ctx.stroke();


  ctx.fillStyle =
    "#69b84f";

  ctx.beginPath();

  ctx.ellipse(
    p.x - 7,
    p.y - 2,
    p.size,
    p.size * .45,
    -.5,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.ellipse(
    p.x + 7,
    p.y - 6,
    p.size,
    p.size * .45,
    .5,
    0,
    Math.PI * 2
  );

  ctx.fill();

}


/* ================================
   ANIMAL DRAWING
================================ */

function drawAnimal(
  x,
  y,
  type,
  isPlayer
){

  ctx.save();

  ctx.translate(
    x,
    y
  );

  if(isPlayer){

    ctx.rotate(
      player.angle
    );

  }

  const scale =
    isPlayer ? 1.35 : .85;

  ctx.scale(
    scale,
    scale
  );


  /* shadow */

  ctx.fillStyle =
    "rgba(0,0,0,.3)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    22,
    28,
    8,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  if(type === "deer"){

    ctx.fillStyle =
      "#87552e";

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      28,
      15,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
      25,
      -10,
      13,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle =
      "#4a2f1c";

    ctx.lineWidth = 4;

    for(
      const leg of [-15,-5,10,20]
    ){

      ctx.beginPath();

      ctx.moveTo(
        leg,
        10
      );

      ctx.lineTo(
        leg,
        31
      );

      ctx.stroke();

    }

  }

  else if(type === "rabbit"){

    ctx.fillStyle =
      "#c9c3b5";

    ctx.beginPath();

    ctx.ellipse(
      0,
      4,
      24,
      15,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
      22,
      -8,
      13,
      0,
      Math.PI * 2
    );

    ctx.fill();
