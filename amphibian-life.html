<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Amphibian Life Simulator</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #051008; user-select: none; -webkit-user-select: none; touch-action: none;
    }
    #ui-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10; display: flex; flex-direction: column;
      justify-content: space-between; padding: 15px;
    }
    .hud-box {
      background: rgba(10, 25, 15, 0.85); border: 2px solid #4ade80;
      border-radius: 12px; padding: 10px 18px; color: #f0fdf4;
      box-shadow: 0 0 15px rgba(74, 222, 128, 0.3); pointer-events: auto;
    }
    #char-select {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 16, 8, 0.95); z-index: 100; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; color: #f0fdf4; text-align: center; overflow-y: auto;
    }
    #char-select h1 { color: #4ade80; margin-bottom: 5px; font-size: 1.8rem; text-shadow: 0 0 10px #22c55e; }
    .grid-select {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
      width: 100%; max-width: 420px; margin-top: 15px;
    }
    .select-card {
      background: #0f291e; border: 2px solid #22c55e; border-radius: 10px;
      padding: 12px; color: #fff; font-weight: bold; font-size: 0.9rem;
      cursor: pointer; transition: all 0.2s ease; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
    }
    .select-card:active { transform: scale(0.95); background: #22c55e; color: #000; }
    #grow-btn {
      background: #22c55e; color: #051008; border: none; font-weight: bold;
      padding: 10px 20px; border-radius: 20px; font-size: 0.9rem; cursor: pointer;
      box-shadow: 0 0 10px #4ade80; margin-top: 5px; pointer-events: auto;
    }
    #grow-btn:active { transform: scale(0.92); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="char-select">
    <h1>🐸 AMPHIBIAN LIFE 🐊</h1>
    <p style="margin:0; font-size: 0.85rem; color: #86efac;">Choose your species & gender to start your life cycle:</p>
    <div class="grid-select">
      <div class="select-card" onclick="startSim('frog', 'male')">🐸 Male Frog</div>
      <div class="select-card" onclick="startSim('frog', 'female')">🐸 Female Frog</div>
      <div class="select-card" onclick="startSim('toad', 'male')">🟤 Male Toad</div>
      <div class="select-card" onclick="startSim('toad', 'female')">🟤 Female Toad</div>
      <div class="select-card" onclick="startSim('crocodile', 'male')">🐊 Male Crocodile</div>
      <div class="select-card" onclick="startSim('crocodile', 'female')">🐊 Female Crocodile</div>
      <div class="select-card" onclick="startSim('alligator', 'male')">🐊 Male Alligator</div>
      <div class="select-card" onclick="startSim('alligator', 'female')">🐊 Female Alligator</div>
    </div>
  </div>

  <div id="ui-container">
    <div class="hud-box">
      <div id="species-title" style="font-weight: bold; font-size: 1.1rem; color: #4ade80;">Species</div>
      <div id="stage-title" style="font-size: 0.85rem; color: #bbf7d0;">Stage: Hatchling</div>
      <button id="grow-btn" onclick="advanceStage()">Evolve Life Stage ✨</button>
    </div>
    <div class="hud-box" style="text-align: center; font-size: 0.8rem; border-color: #38bdf8;">
      🌊 DRAG TO SWIM/WALK • STEP IN WATER TO RIPPLE
    </div>
  </div>

  <script>
    let scene, camera, renderer, playerGroup, waterMesh, waterGeo;
    let selectedSpecies = '', selectedGender = '';
    let currentStage = 0; // 0: Hatchling/Tadpole, 1: Early Limbs, 2: Juvenile, 3: Full Adult
    let isDragging = false, lastTouchX = 0, lastTouchY = 0;

    const stages = ["Egg/Tadpole Hatchling", "Developing Limbs", "Juvenile", "Full Adult"];

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a1c12);
      scene.fog = new THREE.FogExp2(0x0a1c12, 0.03);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8, 12);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // Environment Lighting
      const sun = new THREE.DirectionalLight(0xfef08a, 1.3);
      sun.position.set(10, 20, 10);
      scene.add(sun);
      const ambient = new THREE.AmbientLight(0x22c55e, 0.5);
      scene.add(ambient);

      // Forest Floor & Water Plane Setup
      buildForestTerrain();
      buildInteractiveWater();

      playerGroup = new THREE.Group();
      scene.add(playerGroup);

      window.addEventListener('resize', onWindowResize);
      setupControls();
      animate();
    }

    function buildForestTerrain() {
      // Smooth Terrain Floor
      const groundGeo = new THREE.PlaneGeometry(60, 60, 32, 32);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x143823, roughness: 0.9 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.1;
      scene.add(ground);

      // Forest Trees
      const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 6, 16);
      const leavesGeo = new THREE.ConeGeometry(2, 5, 16);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3f2314, roughness: 0.9 });
      const leavesMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.4 });

      for (let i = 0; i < 25; i++) {
        const tree = new THREE.Group();
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 3;
        const leaves = new THREE.Mesh(leavesGeo, leavesMat);
        leaves.position.y = 6;
        tree.add(trunk, leaves);

        const angle = Math.random() * Math.PI * 2;
        const dist = 8 + Math.random() * 18;
        tree.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
        scene.add(tree);
      }
    }

    function buildInteractiveWater() {
      // Dynamic Wiggling Water Surface
      waterGeo = new THREE.PlaneGeometry(24, 24, 48, 48);
      const waterMat = new THREE.MeshPhysicalMaterial({
        color: 0x0284c7, transmission: 0.85, opacity: 1, transparent: true,
        roughness: 0.1, ior: 1.33, reflectivity: 0.9, thickness: 1.2
      });
      waterMesh = new THREE.Mesh(waterGeo, waterMat);
      waterMesh.rotation.x = -Math.PI / 2;
      waterMesh.position.set(0, 0, 2);
      scene.add(waterMesh);
    }

    function generateSmoothCreatureMesh(species, gender, stage) {
      while(playerGroup.children.length > 0) { playerGroup.remove(playerGroup.children[0]); }

      // Smooth Organic Color Matrix
      let baseColor = 0x22c55e;
      if (species === 'toad') baseColor = 0x854d0e;
      if (species === 'crocodile') baseColor = 0x3f6212;
      if (species === 'alligator') baseColor = 0x1e293b;
      if (gender === 'female') baseColor = THREE.Color.NAMES ? 0x047857 : baseColor;

      const bodyMat = new THREE.MeshStandardMaterial({ color: baseColor, roughness: 0.3, metalness: 0.1 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.1 });

      const scaleFactor = 0.4 + (stage * 0.3);

      if (stage === 0) { // Tadpole / Baby Hatchling Stage
        const headGeo = new THREE.SphereGeometry(0.6 * scaleFactor, 32, 32);
        const head = new THREE.Mesh(headGeo, bodyMat);

        const tailGeo = new THREE.ConeGeometry(0.2 * scaleFactor, 1.8 * scaleFactor, 32);
        const tail = new THREE.Mesh(tailGeo, bodyMat);
        tail.rotation.x = Math.PI / 2;
        tail.position.z = 1.0 * scaleFactor;

        playerGroup.add(head, tail);
      } else { // Developing to Adult Stage
        // Smooth Torso Body
        const torsoGeo = new THREE.SphereGeometry(1.0 * scaleFactor, 32, 32);
        torsoGeo.scale(1, 0.6, 1.4);
        const torso = new THREE.Mesh(torsoGeo, bodyMat);
        playerGroup.add(torso);

        // Smooth Eyes
        const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.2 * scaleFactor, 16, 16), eyeMat);
        eyeR.position.set(0.4 * scaleFactor, 0.4 * scaleFactor, -0.6 * scaleFactor);
        const eyeL = eyeR.clone();
        eyeL.position.x = -0.4 * scaleFactor;
        playerGroup.add(eyeR, eyeL);

        // Limbs (Legs/Arms)
        if (stage >= 1) {
          const legGeo = new THREE.CylinderGeometry(0.12 * scaleFactor, 0.08 * scaleFactor, 1.0 * scaleFactor, 16);
          const backLegL = new THREE.Mesh(legGeo, bodyMat);
          backLegL.position.set(-0.9 * scaleFactor, -0.2, 0.4 * scaleFactor);
          backLegL.rotation.z = Math.PI / 4;

          const backLegR = backLegL.clone();
          backLegR.position.x = 0.9 * scaleFactor;
          backLegR.rotation.z = -Math.PI / 4;

          playerGroup.add(backLegL, backLegR);
        }

        if (stage >= 2) {
          const armGeo = new THREE.CylinderGeometry(0.10 * scaleFactor, 0.06 * scaleFactor, 0.8 * scaleFactor, 16);
          const frontArmL = new THREE.Mesh(armGeo, bodyMat);
          frontArmL.position.set(-0.8 * scaleFactor, -0.2, -0.5 * scaleFactor);
          frontArmL.rotation.z = Math.PI / 6;

          const frontArmR = frontArmL.clone();
          frontArmR.position.x = 0.8 * scaleFactor;
          frontArmR.rotation.z = -Math.PI / 6;

          playerGroup.add(frontArmL, frontArmR);
        }

        // Tail for Alligators / Crocodiles or Adult Retained Features
        if (species === 'crocodile' || species === 'alligator' || stage < 3) {
          const tailLength = (species === 'crocodile' || species === 'alligator') ? 2.5 : 1.2;
          const tailGeo = new THREE.ConeGeometry(0.35 * scaleFactor, tailLength * scaleFactor, 32);
          const tail = new THREE.Mesh(tailGeo, bodyMat);
          tail.rotation.x = Math.PI / 2;
          tail.position.z = (1.2 + tailLength / 2) * scaleFactor;
          playerGroup.add(tail);
        }
      }

      playerGroup.position.y = 0.4 * scaleFactor;
    }

    function startSim(species, gender) {
      selectedSpecies = species;
      selectedGender = gender;
      currentStage = 0;

      document.getElementById('char-select').style.display = 'none';
      document.getElementById('species-title').innerText = `${gender.toUpperCase()} ${species.toUpperCase()}`;
      document.getElementById('stage-title').innerText = `Stage 1/4: ${stages[0]}`;

      if (!scene) init3D();
      generateSmoothCreatureMesh(selectedSpecies, selectedGender, currentStage);
    }

    function advanceStage() {
      if (currentStage < 3) {
        currentStage++;
        document.getElementById('stage-title').innerText = `Stage ${currentStage + 1}/4: ${stages[currentStage]}`;
        generateSmoothCreatureMesh(selectedSpecies, selectedGender, currentStage);
      }
    }

    function setupControls() {
      const onStart = (x, y) => { isDragging = true; lastTouchX = x; lastTouchY = y; };
      const onMove = (x, y) => {
        if (!isDragging) return;
        const dx = x - lastTouchX;
        const dy = y - lastTouchY;
        lastTouchX = x; lastTouchY = y;

        playerGroup.position.x += dx * 0.025;
        playerGroup.position.z += dy * 0.025;

        // Keep inside bounds
        playerGroup.position.x = Math.max(-12, Math.min(12, playerGroup.position.x));
        playerGroup.position.z = Math.max(-12, Math.min(12, playerGroup.position.z));

        // Face Movement Direction
        if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
          playerGroup.rotation.y = Math.atan2(dx, dy);
        }
      };
      const onEnd = () => { isDragging = false; };

      window.addEventListener('touchstart', e => onStart(e.touches[0].clientX, e.touches[0].clientY));
      window.addEventListener('touchmove', e => { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
      window.addEventListener('touchend', onEnd);
      window.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
      window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
      window.addEventListener('mouseup', onEnd);
    }

    function animate(time) {
      requestAnimationFrame(animate);

      // Water Ripple Surface Animation
      if (waterGeo) {
        const pos = waterGeo.attributes.position;
        const t = time * 0.003;
        for (let i = 0; i < pos.count; i++) {
          const u = pos.getX(i);
          const v = pos.getY(i);
          // Calculate distance from player for dynamic touch ripple
          const distToPlayer = Math.hypot(u - playerGroup.position.x, v - playerGroup.position.z);
          let ripple = Math.sin(u * 1.5 + t) * 0.08 + Math.cos(v * 1.5 + t) * 0.08;
          if (distToPlayer < 3.5) {
            ripple += Math.sin(distToPlayer * 5 - t * 4) * 0.18;
          }
          pos.setZ(i, ripple);
        }
        waterGeo.computeVertexNormals();
        waterGeo.attributes.position.needsUpdate = true;
      }

      // Camera Smooth Tracking
      if (playerGroup) {
        camera.position.x = playerGroup.position.x;
        camera.position.z = playerGroup.position.z + 10;
        camera.lookAt(playerGroup.position.x, 0.5, playerGroup.position.z);
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
