<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stalker: The Long Night</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

body {
    background: #050505;
    color: white;
}

#game {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
}

#box {
    max-width: 700px;
    padding: 35px;
    border: 3px solid #666;
    border-radius: 20px;
    background: #111;
    box-shadow: 0 0 40px rgba(255,255,255,0.08);
}

h1 {
    font-size: clamp(35px, 9vw, 70px);
    margin: 0 0 20px;
}

#scary {
    font-size: 60px;
    margin-bottom: 20px;
}

p {
    font-size: clamp(18px, 4vw, 28px);
    line-height: 1.5;
}

#laugh {
    display: none;
    font-size: clamp(25px, 6vw, 50px);
    font-weight: bold;
}

button {
    padding: 15px 30px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 12px;
    border: 2px solid white;
    background: #333;
    color: white;
    cursor: pointer;
}

button:active {
    transform: scale(0.95);
}
</style>
</head>

<body>

<div id="game">

<div id="box">

<div id="scary">🌙</div>

<h1 id="title">STALKER: THE LONG NIGHT</h1>

<p id="text">
Something is waiting for you in the darkness...
</p>

<button id="startButton">
START NIGHT
</button>

<div id="laugh">

🤣🤣🤣🤣🤣<br><br>

HAHA! THIS IS NOT A REAL GAME!<br>

GO PLAY ANOTHER GAME ON THIS WEBSITE! 😂

</div>

</div>

</div>

<script>

const startButton =
document.getElementById("startButton");

const title =
document.getElementById("title");

const text =
document.getElementById("text");

const scary =
document.getElementById("scary");

const laugh =
document.getElementById("laugh");

startButton.addEventListener(
    "click",
    function(){

        title.textContent =
        "YOU GOT PRANKED! 🤣";

        text.style.display =
        "none";

        scary.textContent =
        "🤡";

        startButton.style.display =
        "none";

        laugh.style.display =
        "block";

    }
);

</script>

</body>
</html>
