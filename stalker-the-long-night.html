<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Stalker: The Long Night</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#game{
    width:100%;
    height:100%;
    position:relative;
}

#startScreen{
    position:absolute;
    inset:0;
    z-index:20;
    background:
        radial-gradient(circle at center,#182331,#030507 75%);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

#startScreen h1{
    font-size:42px;
    margin:10px;
    text-shadow:0 0 20px #000;
}

#startScreen p{
    max-width:500px;
    line-height:1.5;
    color:#bbb;
}

button{
    border:0;
    border-radius:12px;
    padding:16px 30px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#startButton{
    background:#ddd;
    color:#111;
    margin-top:20px;
}

#startButton:active{
    transform:scale(.96);
}

#hud{
    display:none;
    position:absolute;
    z-index:10;
    top:10px;
    left:10px;
    right:10px;
    pointer-events:none;
    color:white;
    text-shadow:0 2px 4px #000;
}

#message{
    background:rgba(0,0,0,.45);
    padding:8px 12px;
    border-radius:8px;
    display:inline-block;
}

#controls{
    display:none;
    position:absolute;
    z-index:15;
    inset:0;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:25px;
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.3);
    pointer-events:auto;
    touch-action:none;
}

#stick{
    position:absolute;
    width:50px;
    height:50px;
    border-radius:50%;
    background:rgba(255,255,255,.45);
    left:35px;
    top:35px;
}

#lookArea{
    position:absolute;
    right:0;
    top:0;
    width:65%;
    height:100%;
    pointer-events:auto;
    touch-action:none;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:28px;
    text-shadow:0 0 5px black;
    display:none;
    z-index:12;
    pointer-events:none;
}

#error{
    color:#ff7777;
    margin-top:15px;
    max-width:500px;
}
</style>
</head>

<body>

<div id="game">

<div id="startScreen">
    <h1>STALKER: THE LONG NIGHT</h1>
    <p>
        The night has begun.<br>
        Explore the house, find your way through the darkness,
        and survive the thing that is following you.
    </p>

    <button id="startButton">START NIGHT</button>

    <div id="error"></div>
</div>

<div id="hud">
    <div id="message">10:00 PM — The front door locked itself.</div>
</div>

<div id="crosshair">+</div>

<div id="controls">
    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="lookArea"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;

let player;
let stalker;

let gameStarted=false;

let yaw=0;
let pitch=0;

let moveX=0;
let moveZ=0;

const game=document.getElementById("game");
const startScreen=document.getElementById("startScreen");
const startButton=document.getElementById("startButton");
const errorBox=document.getElementById("error");
const hud=document.getElementById("hud");
const message=document.getElementById("message");
const controls=document.getElementById("controls");
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
const lookArea=document.getElementById("lookArea");
const crosshair=document.getElementById("crosshair");

function startGame(){

    errorBox.textContent="";

    if(typeof THREE==="undefined"){
        errorBox.textContent=
        "The 3D engine could not load. Check your internet connection and reload the page.";
        return;
    }

    try{

        scene=new THREE.Scene();

        scene.background=new THREE.Color(0x05080c);

        scene.fog=new THREE.Fog(
            0x05080c,
            2,
            35
        );

        camera=new THREE.PerspectiveCamera(
            70,
            innerWidth/innerHeight,
            .05,
            100
        );

        renderer=new THREE.WebGLRenderer({
            antialias:true
        });

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        renderer.setPixelRatio(
            Math.min(devicePixelRatio,2)
        );

        renderer.shadowMap.enabled=true;

        game.appendChild(renderer.domElement);

        createWorld();

        createPlayer();

        createStalker();

        startScreen.style.display="none";
        hud.style.display="block";
        controls.style.display="block";
        crosshair.style.display="block";

        gameStarted=true;

        animate();

    }catch(error){

        console.error(error);

        errorBox.textContent=
        "Game error: "+error.message;
    }
}


function createWorld(){

    // Floor

    const floorMaterial=
    new THREE.MeshStandardMaterial({
        color:0x24272b,
        roughness:1
    });

    const floor=
    new THREE.Mesh(
        new THREE.BoxGeometry(30,.2,30),
        floorMaterial
    );

    floor.position.y=-.1;
    floor.receiveShadow=true;

    scene.add(floor);


    // Walls

    const wallMaterial=
    new THREE.MeshStandardMaterial({
        color:0x34383c,
        roughness:1
    });

    function wall(x,y,z,w,h,d){

        const mesh=
        new THREE.Mesh(
            new THREE.BoxGeometry(w,h,d),
            wallMaterial
        );

        mesh.position.set(x,y,z);
        mesh.castShadow=true;
        mesh.receiveShadow=true;

        scene.add(mesh);
    }


    // House walls

    wall(0,2,-10,20,4,.5);
    wall(-10,2,0,.5,4,20);
    wall(10,2,0,.5,4,20);
    wall(0,2,10,20,4,.5);

    // Interior walls

    wall(-3,2,-3,.5,4,14);
    wall(4,2,3,12,4,.5);


    // Door

    const doorMaterial=
    new THREE.MeshStandardMaterial({
        color:0x191919
    });

    const door=
    new THREE.Mesh(
        new THREE.BoxGeometry(2.5,3,.25),
        doorMaterial
    );

    door.position.set(
        0,
        1.5,
        -9.7
    );

    scene.add(door);


    // Furniture

    const furnitureMaterial=
    new THREE.MeshStandardMaterial({
        color:0x3b2920
    });

    function box(x,y,z,w,h,d){

        const mesh=
        new THREE.Mesh(
            new THREE.BoxGeometry(w,h,d),
            furnitureMaterial
        );

        mesh.position.set(x,y,z);
        mesh.castShadow=true;
        mesh.receiveShadow=true;

        scene.add(mesh);
    }

    box(-7,.6,-5,3,1.2,1.5);
    box(6,.5,-5,2,1,1);
    box(6,.7,6,3,1.4,1.5);
    box(-6,.5,6,2,1,2);


    // Ceiling light

    const light=
    new THREE.PointLight(
        0xffd6a0,
        12,
        18
    );

    light.position.set(
        0,
        3.5,
        0
    );

    light.castShadow=true;

    scene.add(light);


    // Moonlight

    const moon=
    new THREE.DirectionalLight(
        0x7187aa,
        1
    );

    moon.position.set(
        -5,
        10,
        5
    );

    moon.castShadow=true;

    scene.add(moon);


    // Ambient light

    scene.add(
        new THREE.HemisphereLight(
            0x52627a,
            0x080605,
            .45
        )
    );
}


function createPlayer(){

    player=
    new THREE.Object3D();

    player.position.set(
        0,
        1.6,
        7
    );

    camera.position.set(
        0,
        0,
        0
    );

    player.add(camera);

    scene.add(player);
}


function createStalker(){

    stalker=
    new THREE.Group();

    // Body

    const body=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .35,
            .45,
            1.8,
            12
        ),
        new THREE.MeshStandardMaterial({
            color:0x080808
        })
    );

    body.position.y=1;

    stalker.add(body);


    // Head

    const head=
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .42,
            16,
            16
        ),
        new THREE.MeshStandardMaterial({
            color:0x050505
        })
    );

    head.position.y=2.15;

    stalker.add(head);


    // Eyes

    const eyeMaterial=
    new THREE.MeshBasicMaterial({
        color:0xff3333
    });

    const eye1=
    new THREE.Mesh(
        new THREE.SphereGeometry(.045,8,8),
        eyeMaterial
    );

    const eye2=
    eye1.clone();

    eye1.position.set(-.14,2.18,.38);
    eye2.position.set(.14,2.18,.38);

    stalker.add(eye1);
    stalker.add(eye2);


    stalker.position.set(
        0,
        0,
        -7
    );

    scene.add(stalker);
}


function updateStalker(){

    if(!stalker || !player)
        return;

    const direction=
    new THREE.Vector3();

    direction.subVectors(
        player.position,
        stalker.position
    );

    direction.y=0;

    const distance=
    direction.length();

    if(distance>3){

        direction.normalize();

        stalker.position.addScaledVector(
            direction,
            .004
        );
    }

    stalker.lookAt(
        player.position.x,
        stalker.position.y+1,
        player.position.z
    );
}


function updateMovement(){

    if(!player)
        return;

    const speed=.07;

    const forward=
    new THREE.Vector3(
        Math.sin(yaw),
        0,
        Math.cos(yaw)
    );

    const right=
    new THREE.Vector3(
        Math.cos(yaw),
        0,
        -Math.sin(yaw)
    );

    player.position.addScaledVector(
        forward,
        moveZ*speed
    );

    player.position.addScaledVector(
        right,
        moveX*speed
    );

    player.position.x=
    Math.max(
        -9,
        Math.min(9,player.position.x)
    );

    player.position.z=
    Math.max(
        -9,
        Math.min(9,player.position.z)
    );
}


function animate(){

    if(!gameStarted)
        return;

    requestAnimationFrame(animate);

    updateMovement();

    updateStalker();

    camera.rotation.order="YXZ";

    camera.rotation.y=yaw;
    camera.rotation.x=pitch;

    renderer.render(
        scene,
        camera
    );
}


startButton.addEventListener(
    "click",
    startGame
);


window.addEventListener(
    "resize",
    function(){

        if(!camera || !renderer)
            return;

        camera.aspect=
        innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* =========================
   JOYSTICK
========================= */

let joystickActive=false;

joystick.addEventListener(
    "pointerdown",
    function(e){

        joystickActive=true;

        joystick.setPointerCapture(
            e.pointerId
        );
    }
);

joystick.addEventListener(
    "pointermove",
    function(e){

        if(!joystickActive)
            return;

        const rect=
        joystick.getBoundingClientRect();

        let x=
        e.clientX-
        (rect.left+rect.width/2);

        let y=
        e.clientY-
        (rect.top+rect.height/2);

        const max=35;

        const length=
        Math.hypot(x,y);

        if(length>max){

            x=x/length*max;
            y=y/length*max;
        }

        stick.style.left=
        (35+x)+"px";

        stick.style.top=
        (35+y)+"px";

        moveX=x/max;
        moveZ=-y/max;
    }
);

function stopJoystick(){

    joystickActive=false;

    moveX=0;
    moveZ=0;

    stick.style.left="35px";
    stick.style.top="35px";
}

joystick.addEventListener(
    "pointerup",
    stopJoystick
);

joystick.addEventListener(
    "pointercancel",
    stopJoystick
);


/* =========================
   LOOK
========================= */

let looking=false;
let lastX=0;
let lastY=0;

lookArea.addEventListener(
    "pointerdown",
    function(e){

        looking=true;

        lastX=e.clientX;
        lastY=e.clientY;

        lookArea.setPointerCapture(
            e.pointerId
        );
    }
);

lookArea.addEventListener(
    "pointermove",
    function(e){

        if(!looking)
            return;

        const dx=
        e.clientX-lastX;

        const dy=
        e.clientY-lastY;

        lastX=e.clientX;
        lastY=e.clientY;

        yaw-=dx*.004;

        pitch-=dy*.004;

        pitch=
        Math.max(
            -1.3,
            Math.min(1.3,pitch)
        );
    }
);

function stopLooking(){

    looking=false;
}

lookArea.addEventListener(
    "pointerup",
    stopLooking
);

lookArea.addEventListener(
    "pointercancel",
    stopLooking
);

</script>

</body>
</html>
