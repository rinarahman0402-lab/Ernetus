<script type="module">

import * as THREE from "three";

/* =====================================================
   BASIC SETUP
===================================================== */

const game=document.getElementById("game");
const loading=document.getElementById("loading");
const healthBar=document.getElementById("health");
const message=document.getElementById("message");
const restart=document.getElementById("restart");

let camera;
let renderer;
let clock;

try{

    scene=new THREE.Scene();

    scene.background=new THREE.Color(0x86c9ed);

    scene.fog=new THREE.Fog(0x86c9ed,45,240);

        65,

        window.innerHeight

    renderer.shadowMap.enabled=true;

    clock=new THREE.Clock();

}catch(error){

    throw error;
}

/* =====================================================
   LIGHTING
===================================================== */

const hemi=new THREE.HemisphereLight(

    0x41613a,

);

scene.add(hemi);

const sun=new THREE.DirectionalLight(

);

sun.position.set(60,100,40);

sun.castShadow=true;

sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;

sun.shadow.camera.far=220;

sun.shadow.camera.left=-90;
sun.shadow.camera.right=90;
sun.shadow.camera.top=90;

/* =====================================================

===================================================== */

const groundMaterial=new THREE.MeshStandardMaterial({

});

const ground=new THREE.Mesh(

/* =====================================================
   RANDOM HELPER
===================================================== */

function randomRange(a,b){
    return a+Math.random()*(b-a);
}

/* =====================================================
   TREES
===================================================== */

function makeTree(x,z,scale=1){

    const tree=new THREE.Group();

    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.35*scale,
            0.55*scale,
            4*scale,
            8
        ),
        new THREE.MeshStandardMaterial({
            color:0x704629
        })
    );

    trunk.position.y=2*scale;

    trunk.castShadow=true;
    trunk.receiveShadow=true;

    tree.add(trunk);

    const leavesMaterial=
        new THREE.MeshStandardMaterial({
            color:0x27783b,
            roughness:.9
        });

    for(let i=0;i<4;i++){

        const leaves=new THREE.Mesh(
            new THREE.IcosahedronGeometry(
                2.2*scale,
                1
            ),
            leavesMaterial
        );

        leaves.position.set(
            randomRange(-1,1)*scale,
            randomRange(4,7)*scale,
            randomRange(-1,1)*scale
        );

        leaves.castShadow=true;
        leaves.receiveShadow=true;

        tree.add(leaves);
    }

    tree.position.set(x,0,z);

    scene.add(tree);
}

/* create surrounding forest */

for(let i=0;i<90;i++){

    const x=randomRange(-220,220);
    const z=randomRange(-220,220);

    if(Math.abs(x)<15 && Math.abs(z)<15)continue;

    makeTree(
        x,
        z,

}

/* =====================================================
   MANTIS
===================================================== */

function createMantis(){

    const mantis=new THREE.Group();

    /* abdomen */

            0.75,
            16,
            12

        new THREE.MeshStandardMaterial({
            color:0x3c913e,

        })

        .75,

        .75
    );

    /* thorax */

    const thorax=new THREE.Mesh(
        new THREE.SphereGeometry(
            .72,
            16,
            12
        ),
        new THREE.MeshStandardMaterial({
            color:0x4ca947
        })
    );

    thorax.position.y=2.1;

    thorax.castShadow=true;

    mantis.add(thorax);

    /* head */

    const head=new THREE.Mesh(
        new THREE.SphereGeometry(
            .65,
            16,
            12
        ),
        new THREE.MeshStandardMaterial({
            color:0x69b94f
        })
    );

    head.position.y=3;

    head.castShadow=true;

    mantis.add(head);

    /* eyes */

    const eyeMaterial=
        new THREE.MeshStandardMaterial({
            color:0x101710,
            roughness:.2
        });

    const eye1=new THREE.Mesh(
        new THREE.SphereGeometry(.18,12,8),
        eyeMaterial
    );

    const eye2=eye1.clone();

    eye1.position.set(-.27,3.12,.55);
    eye2.position.set(.27,3.12,.55);

    mantis.add(eye1);
    mantis.add(eye2);

    /* antennae */

    const antennaMaterial=
        new THREE.MeshStandardMaterial({
            color:0x316e31
        });

    for(const side of [-1,1]){

        const antenna=new THREE.Mesh(
            new THREE.CylinderGeometry(
                .035,
                .035,
                1.4,
                6
            ),
            antennaMaterial
        );

        antenna.position.set(
            side*.22,
            3.65,
            .15
        );

        antenna.rotation.z=side*.35;
        antenna.rotation.x=-.25;

        antenna.castShadow=true;

        mantis.add(antenna);
    }

    /* legs */

    const legMaterial=
        new THREE.MeshStandardMaterial({
            color:0x337f37
        });

    const legPositions=[
        [-.42,1.6,.1],
        [.42,1.6,.1],
        [-.45,1.05,.05],
        [.45,1.05,.05],
        [-.4,.55,0],
        [.4,.55,0]
    ];

    for(const p of legPositions){

        const leg=new THREE.Mesh(
            new THREE.CylinderGeometry(
                .09,
                .07,
                1.6,
                6
            ),
            legMaterial
        );

        leg.position.set(
            p[0],
            p[1],
            p[2]
        );

        leg.rotation.z=
            p[0]<0
            ?-.65
            :.65;

        leg.castShadow=true;

        mantis.add(leg);
    }

    /* large folded front arms */

    for(const side of [-1,1]){

        const arm=new THREE.Mesh(
            new THREE.CylinderGeometry(
                .11,
                .08,
                1.9,
                7
            ),
            legMaterial
        );

        arm.position.set(
            side*.65,
            2.15,
            .25
        );

        arm.rotation.z=side*-.8;
        arm.rotation.x=-.35;

        arm.castShadow=true;

        mantis.add(arm);
    }

    return mantis;
}

/* =====================================================
   ANTS

const ants=[];

function createAnt(x,z){

    const ant=new THREE.Group();

    const bodyMaterial=
        new THREE.MeshStandardMaterial({
            color:0x292019
        });

    for(let i=0;i<3;i++){

        const part=new THREE.Mesh(
            new THREE.SphereGeometry(
                .17,
                8,
                6
            ),
            bodyMaterial
        );

        part.position.set(
            0,
            .25,
            (i-1)*.3
        );

        part.scale.z=1.2;

        part.castShadow=true;

        ant.add(part);
    }

    /* legs */

    for(let side of [-1,1]){

        for(let i=0;i<3;i++){

            const leg=new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .025,
                    .025,
                    .55,
                    5
                ),
                bodyMaterial
            );

            leg.position.set(
                side*.22,
                .22,
                (i-1)*.25
            );

            leg.rotation.z=side*.9;

            ant.add(leg);
        }
    }

    ant.position.set(x,0,z);

    scene.add(ant);

    ants.push({
        object:ant,
        baseX:x,
        baseZ:z,
        phase:Math.random()*Math.PI*2
    });
}

/* ants stay in fixed areas */

/* =====================================================
   ANIMALS
===================================================== */

    let bodyColor=

            color:bodyColor,

    const body=new THREE.Mesh(
        new THREE.SphereGeometry(1,12,8),
        material
    );

    body.scale.set(
        1.5,
        .8,

    );

    body.position.y=1;

    body.castShadow=true;

    animal.add(body);

    const head=new THREE.Mesh(
        new THREE.SphereGeometry(.7,12,8),
        material
    );

    head.position.set(
        0,
        1.25,
        1.7
    );

    head.castShadow=true;

    animal.add(head);

    /* ears */

    for(const side of [-1,1]){

        const ear=new THREE.Mesh(
            new THREE.ConeGeometry(
                .28,
                .7,
                4
            ),
            material
        );

        ear.position.set(
            side*.38,
            1.8,
            1.7
        );

        ear.rotation.x=.2;

        animal.add(ear);
    }

    /* legs */

    for(const side of [-1,1]){

        for(const front of [-1,1]){

            const leg=new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .16,
                    .12,
                    1,
                    8
                ),
                material
            );

            leg.position.set(
                side*.65,
                .5,
                front*.85
            );

            leg.castShadow=true;

            animal.add(leg);
        }
    }

    /* eyes */

    const eyeMaterial=
        new THREE.MeshStandardMaterial({
            color:0x111111
        });

    for(const side of [-1,1]){

        const eye=new THREE.Mesh(
            new THREE.SphereGeometry(
                .09,
                8,
                8
            ),
            eyeMaterial
        );

        eye.position.set(
            side*.25,
            1.45,
            2.28
        );

        animal.add(eye);
    }

    animal.position.set(x,0,z);

    scene.add(animal);

    animals.push({
        object:animal,
        type:type,
        speed:type==="wolf"?.035:.025,
        active:false
    });
}

/* =====================================================
   CONTROLS
===================================================== */

const movement={
    x:0,
    y:0
};

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joystickPointer=null;

function updateJoystick(e){

    const r=joystick.getBoundingClientRect();

    const centerX=r.left+r.width/2;
    const centerY=r.top+r.height/2;

    let dx=e.clientX-centerX;
    let dy=e.clientY-centerY;

    const max=45;

    const length=Math.hypot(dx,dy);

    if(length>max){

        dx=dx/length*max;
        dy=dy/length*max;
    }

    movement.x=dx/max;
    movement.y=dy/max;

    stick.style.transform=
        `translate(${dx}px,${dy}px)`;
}

joystick.addEventListener("pointerdown",e=>{

    e.preventDefault();

    joystickPointer=e.pointerId;

    try{
        joystick.setPointerCapture(e.pointerId);
    }catch(_){}

    updateJoystick(e);
});

joystick.addEventListener("pointermove",e=>{

    if(e.pointerId!==joystickPointer)return;

    e.preventDefault();

    updateJoystick(e);
});

function stopJoystick(e){

    if(e.pointerId!==joystickPointer)return;

    joystickPointer=null;

    movement.x=0;
    movement.y=0;

    stick.style.transform="translate(0,0)";
}

joystick.addEventListener("pointerup",stopJoystick);
joystick.addEventListener("pointercancel",stopJoystick);

/* =====================================================
   CAMERA LOOK
===================================================== */

let yaw=0;
let pitch=.35;

let lookPointer=null;
let lastLookX=0;
let lastLookY=0;

renderer.domElement.addEventListener(
    "pointerdown",
    e=>{

        if(
            e.clientX<
            window.innerWidth*.35
        )return;

        lookPointer=e.pointerId;

        lastLookX=e.clientX;
        lastLookY=e.clientY;
    }
);

renderer.domElement.addEventListener(
    "pointermove",
    e=>{

        if(e.pointerId!==lookPointer)return;

        const dx=e.clientX-lastLookX;
        const dy=e.clientY-lastLookY;

        lastLookX=e.clientX;
        lastLookY=e.clientY;

        yaw-=dx*.008;
        pitch-=dy*.006;

        pitch=Math.max(
            -.25,
            Math.min(.8,pitch)
        );
    }
);

function stopLook(e){

    if(e.pointerId===lookPointer){
        lookPointer=null;
    }
}

renderer.domElement.addEventListener(
    "pointerup",
    stopLook
);

renderer.domElement.addEventListener(
    "pointercancel",
    stopLook
);

    if(e.key==="s"||e.key==="ArrowDown")keys.s=false;

});
