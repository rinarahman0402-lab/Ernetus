<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Mantis Adventure 3D</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#79c95a;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
}

#loading{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:linear-gradient(#78c957,#397f38);
  color:white;
  text-align:center;
}

#loading h1{
  font-size:30px;
  margin:0 0 12px;
}

#loadingBar{
  width:230px;
  height:12px;
  margin-top:12px;
  border-radius:20px;
  background:rgba(255,255,255,.3);
  overflow:hidden;
}

#loadingFill{
  width:0%;
  height:100%;
  background:white;
  transition:.25s;
}

#error{
  display:none;
  position:fixed;
  inset:0;
  z-index:60;
  background:#172018;
  color:white;
  text-align:center;
  padding:30px;
  align-items:center;
  justify-content:center;
}

#ui{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  color:white;
  text-shadow:0 2px 4px #000;
}

#title{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  font-size:22px;
  font-weight:bold;
  white-space:nowrap;
}

#mission{
  position:absolute;
  top:45px;
  left:50%;
  transform:translateX(-50%);
  font-size:14px;
  white-space:nowrap;
}

#ants{
  position:absolute;
  top:72px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.45);
  padding:7px 13px;
  border-radius:15px;
  font-weight:bold;
}

#controls{
  position:absolute;
  left:18px;
  bottom:18px;
  width:170px;
  height:170px;
  pointer-events:auto;
}

.control{
  position:absolute;
  width:55px;
  height:55px;
  border:0;
  border-radius:16px;
  background:rgba(0,0,0,.5);
  color:white;
  font-size:25px;
  font-weight:bold;
  touch-action:none;
}

#up{left:58px;top:0}
#left{left:0;top:58px}
#down{left:58px;top:58px}
#right{left:116px;top:58px}

#look{
  position:absolute;
  right:18px;
  bottom:25px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  border:2px solid rgba(255,255,255,.3);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:13px;
  pointer-events:auto;
  text-shadow:0 1px 3px #000;
}

#message{
  position:absolute;
  left:50%;
  bottom:160px;
  transform:translateX(-50%);
  background:rgba(0,0,0,.65);
  padding:10px 16px;
  border-radius:14px;
  font-weight:bold;
  display:none;
}

#win{
  display:none;
  position:fixed;
  inset:0;
  z-index:40;
  background:rgba(10,30,10,.88);
  color:white;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
}

#winBox{
  max-width:420px;
}

#win h1{
  font-size:38px;
}

#restart{
  border:0;
  border-radius:15px;
  padding:14px 25px;
  background:#54ad50;
  color:white;
  font-size:18px;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
  <h1>🦗 Mantis Adventure 3D</h1>
  <div id="loadingText">Creating the garden...</div>
  <div id="loadingBar">
    <div id="loadingFill"></div>
  </div>
</div>

<div id="error">
  <div>
    <h1>⚠️ 3D Could Not Start</h1>
    <p>
      This browser could not start WebGL 2.
      Try opening the game in the latest Chrome.
    </p>
  </div>
</div>

<div id="ui">

  <div id="title">🦗 Mantis Adventure 3D</div>

  <div id="mission">
    Find the ants and explore the garden!
  </div>

  <div id="ants">
    🐜 Ants: <span id="antCount">0</span>/15
  </div>

  <div id="controls">
    <button class="control" id="up">▲</button>
    <button class="control" id="left">◀</button>
    <button class="control" id="down">▼</button>
    <button class="control" id="right">▶</button>
  </div>

  <div id="look">
    DRAG<br>
    TO LOOK
  </div>

  <div id="message"></div>

</div>

<div id="win">
  <div id="winBox">
    <h1>🎉 YOU DID IT!</h1>
    <p>
      You found all 15 ants!
      The garden is safe!
    </p>
    <button id="restart">Play Again</button>
  </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================
   BASIC SETUP
========================= */

const loading =
  document.getElementById("loading");

const loadingText =
  document.getElementById("loadingText");

const loadingFill =
  document.getElementById("loadingFill");

const error =
  document.getElementById("error");

function progress(n,text){

  loadingFill.style.width=n+"%";
  loadingText.textContent=text;

}


/* =========================
   WEBGL CHECK
========================= */

try{

  const test =
    document.createElement("canvas");

  if(!test.getContext("webgl2")){

    loading.style.display="none";
    error.style.display="flex";
    throw new Error("WebGL2 unavailable");

  }


  progress(10,"Starting the 3D engine...");


  /* =========================
     SCENE
  ========================= */

  const scene =
    new THREE.Scene();

  scene.background =
    new THREE.Color(0x82d8ff);

  scene.fog =
    new THREE.Fog(
      0x82d8ff,
      35,
      100
    );


  const camera =
    new THREE.PerspectiveCamera(
      65,
      innerWidth/innerHeight,
      .1,
      150
    );


  const renderer =
    new THREE.WebGLRenderer({
      antialias:false,
      powerPreference:"low-power"
    });


  renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  document
    .getElementById("game")
    .appendChild(renderer.domElement);


  progress(25,"Building the garden...");


  /* =========================
     LIGHT
  ========================= */

  const sun =
    new THREE.DirectionalLight(
      0xffffff,
      2.2
    );

  sun.position.set(
    10,20,10
  );

  scene.add(sun);


  const ambient =
    new THREE.HemisphereLight(
      0xc8efff,
      0x315b28,
      1.8
    );

  scene.add(ambient);


  /* =========================
     GROUND
  ========================= */

  const ground =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        100,100
      ),
      new THREE.MeshLambertMaterial({
        color:0x4d9b3c
      })
    );

  ground.rotation.x=
    -Math.PI/2;

  scene.add(ground);


  /* =========================
     PLANTS
  ========================= */

  const plantMaterial =
    new THREE.MeshLambertMaterial({
      color:0x28772f
    });

  for(let i=0;i<100;i++){

    const plant =
      new THREE.Mesh(
        new THREE.ConeGeometry(
          .12,
          .5+Math.random()*.8,
          5
        ),
        plantMaterial
      );

    plant.position.set(
      (Math.random()-.5)*75,
      .35,
      (Math.random()-.5)*75
    );

    scene.add(plant);
  }


  /* =========================
     ROCKS
  ========================= */

  const rockMaterial =
    new THREE.MeshLambertMaterial({
      color:0x73786d
    });

  for(let i=0;i<30;i++){

    const rock =
      new THREE.Mesh(
        new THREE.DodecahedronGeometry(
          .3+Math.random()*.55,
          0
        ),
        rockMaterial
      );

    rock.position.set(
      (Math.random()-.5)*70,
      .3,
      (Math.random()-.5)*70
    );

    rock.scale.y=.65;

    scene.add(rock);
  }


  progress(45,"Creating your mantis...");


  /* =========================
     MANTIS
     PROPER BODY SHAPE
  ========================= */

  const mantis =
    new THREE.Group();


  const green =
    new THREE.MeshLambertMaterial({
      color:0x4f9f32
    });

  const lightGreen =
    new THREE.MeshLambertMaterial({
      color:0x78bd48
    });

  const darkGreen =
    new THREE.MeshLambertMaterial({
      color:0x286522
    });

  const black =
    new THREE.MeshLambertMaterial({
      color:0x111111
    });


  /* ABDOMEN */

  const abdomen =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .38,
        1.05,
        6,
        10
      ),
      green
    );

  abdomen.rotation.x=
    Math.PI/2;

  abdomen.position.set(
    0,
    1.25,
    .35
  );

  abdomen.scale.set(
    1,
    1,
    1.35
  );

  mantis.add(abdomen);


  /* THORAX */

  const thorax =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .48,
        12,
        10
      ),
      darkGreen
    );

  thorax.scale.set(
    .8,
    1.15,
    1
  );

  thorax.position.set(
    0,
    1.4,
    -.45
  );

  mantis.add(thorax);


  /* TRIANGULAR-LOOKING HEAD */

  const head =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .42,
        8,
        6
      ),
      lightGreen
    );

  head.scale.set(
    1.15,
    .85,
    .85
  );

  head.position.set(
    0,
    1.9,
    -.9
  );

  mantis.add(head);


  /* LARGE MANTIS EYES */

  const eye1 =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .14,
        8,
        6
      ),
      black
    );

  const eye2 =
    eye1.clone();

  eye1.position.set(
    -.25,
    1.95,
    -1.23
  );

  eye2.position.set(
    .25,
    1.95,
    -1.23
  );

  mantis.add(eye1);
  mantis.add(eye2);


  /* ANTENNAE */

  function antenna(x){

    const a =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .025,
          .035,
          .75,
          6
        ),
        darkGreen
      );

    a.position.set(
      x,
      2.25,
      -1.05
    );

    a.rotation.z=
      x<0 ? -.28 : .28;

    a.rotation.x=
      -.15;

    mantis.add(a);


    const tip =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .055,
          6,
          5
        ),
        darkGreen
      );

    tip.position.set(
      x*1.35,
      2.57,
      -1.13
    );

    mantis.add(tip);
  }

  antenna(-.16);
  antenna(.16);


  /* =========================
     SIX LONG LEGS
  ========================= */

  function createLeg(
    x,z,
    angle1,
    angle2
  ){

    const upper =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .055,
          .075,
          .9,
          6
        ),
        darkGreen
      );

    upper.position.set(
      x,
      1.05,
      z
    );

    upper.rotation.z=
      angle1;

    mantis.add(upper);


    const lower =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .04,
          .055,
          .95,
          6
        ),
        green
      );

    lower.position.set(
      x*1.8,
      .58,
      z+angle2
    );

    lower.rotation.z=
      angle1*.45;

    mantis.add(lower);
  }


  createLeg(-.42,.1,-1.0,-.25);
  createLeg(.42,.1,1.0,-.25);

  createLeg(-.48,.35,-1.15,.05);
  createLeg(.48,.35,1.15,.05);

  createLeg(-.42,.62,-.8,.3);
  createLeg(.42,.62,.8,.3);


  /* =========================
     POWERFUL FRONT RAPTOR ARMS
  ========================= */

  function createArm(side){

    const upper =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .075,
          .095,
          .8,
          6
        ),
        darkGreen
      );

    upper.position.set(
      side*.43,
      1.55,
      -.72
    );

    upper.rotation.z=
      side*.75;

    upper.rotation.x=
      -.35;

    mantis.add(upper);


    const forearm =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .055,
          .075,
          .75,
          6
        ),
        green
      );

    forearm.position.set(
      side*.75,
      1.25,
      -1.0
    );

    forearm.rotation.z=
      side*1.05;

    forearm.rotation.x=
      -.15;

    mantis.add(forearm);


    /* little claw */

    for(let i=0;i<2;i++){

      const claw =
        new THREE.Mesh(
          new THREE.CylinderGeometry(
            .025,
            .035,
            .35,
            5
          ),
          darkGreen
        );

      claw.position.set(
        side*(.78+i*.06),
        1.02,
        -1.16
      );

      claw.rotation.z=
        side*(1.2+i*.25);

      mantis.add(claw);
    }
  }

  createArm(-1);
  createArm(1);


  mantis.position.set(
    0,0,5
  );

  scene.add(mantis);


  progress(65,"Creating 15 ants...");


  /* =========================
     ANTS
  ========================= */

  const ants=[];


  function createAnt(x,z){

    const ant =
      new THREE.Group();

    const antBody =
      new THREE.MeshLambertMaterial({
        color:0x151515
      });


    /* three body sections */

    const abdomen =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .18,
          7,
          6
        ),
        antBody
      );

    abdomen.scale.z=1.3;
    abdomen.position.z=.25;

    ant.add(abdomen);


    const middle =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .14,
          7,
          6
        ),
        antBody
      );

    ant.add(middle);


    const head =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .15,
          7,
          6
        ),
        antBody
      );

    head.position.z=-.25;

    ant.add(head);


    /* six tiny legs */

    for(let i=0;i<3;i++){

      for(const side of [-1,1]){

        const leg =
          new THREE.Mesh(
            new THREE.CylinderGeometry(
              .018,
              .025,
              .4,
              5
            ),
            antBody
          );

        leg.position.set(
          side*.18,
          .05,
          -.18+i*.2
        );

        leg.rotation.z=
          side*1.1;

        ant.add(leg);
      }
    }


    /* antennae */

    for(const side of [-1,1]){

      const antenna =
        new THREE.Mesh(
          new THREE.CylinderGeometry(
            .012,
            .018,
            .3,
            5
          ),
          antBody
        );

      antenna.position.set(
        side*.08,
        .13,
        -.38
      );

      antenna.rotation.z=
        side*.35;

      ant.add(antenna);
    }


    ant.position.set(
      x,
      .22,
      z
    );


    scene.add(ant);

    ants.push({
      object:ant,
      collected:false
    });
  }


  const antPositions=[
    [-8,-7],
    [7,-10],
    [-13,4],
    [11,8],
    [-3,-15],
    [15,-4],
    [-16,-9],
    [4,14],
    [-10,13],
    [16,14],
    [-18,2],
    [2,-22],
    [20,-15],
    [-5,22],
    [18,22]
  ];


  antPositions.forEach(
    p=>createAnt(p[0],p[1])
  );


  progress(85,"Almost ready...");


  /* =========================
     PLAYER
  ========================= */

  const player={
    x:0,
    z:5,
    rotation:0,
    speed:5
  };


  const keys={
    up:false,
    down:false,
    left:false,
    right:false
  };


  function button(id,key){

    const b=
      document.getElementById(id);


    b.addEventListener(
      "pointerdown",
      e=>{
        e.preventDefault();
        keys[key]=true;
      }
    );


    b.addEventListener(
      "pointerup",
      e=>{
        e.preventDefault();
        keys[key]=false;
      }
    );


    b.addEventListener(
      "pointercancel",
      ()=>{
        keys[key]=false;
      }
    );


    b.addEventListener(
      "pointerleave",
      ()=>{
        keys[key]=false;
      }
    );
  }


  button("up","up");
  button("down","down");
  button("left","left");
  button("right","right");


  /* keyboard */

  addEventListener(
    "keydown",
    e=>{

      if(e.key==="ArrowUp"||e.key==="w")
        keys.up=true;

      if(e.key==="ArrowDown"||e.key==="s")
        keys.down=true;

      if(e.key==="ArrowLeft"||e.key==="a")
        keys.left=true;

      if(e.key==="ArrowRight"||e.key==="d")
        keys.right=true;
    }
  );


  addEventListener(
    "keyup",
    e=>{

      if(e.key==="ArrowUp"||e.key==="w")
        keys.up=false;

      if(e.key==="ArrowDown"||e.key==="s")
        keys.down=false;

      if(e.key==="ArrowLeft"||e.key==="a")
        keys.left=false;

      if(e.key==="ArrowRight"||e.key==="d")
        keys.right=false;
    }
  );


  /* =========================
     CAMERA LOOK
  ========================= */

  const look =
    document.getElementById("look");

  let looking=false;
  let lastX=0;


  look.addEventListener(
    "pointerdown",
    e=>{
      looking=true;
      lastX=e.clientX;
      look.setPointerCapture(
        e.pointerId
      );
    }
  );


  look.addEventListener(
    "pointermove",
    e=>{

      if(!looking)return;

      const dx=
        e.clientX-lastX;

      player.rotation -=
        dx*.008;

      lastX=e.clientX;
    }
  );


  look.addEventListener(
    "pointerup",
    ()=>{
      looking=false;
    }
  );


  /* =========================
     ANT COUNTER
  ========================= */

  let collected=0;

  const antCount =
    document.getElementById(
      "antCount"
    );

  const message =
    document.getElementById(
      "message"
    );

  const win =
    document.getElementById("win");


  function showMessage(text){

    message.textContent=text;
    message.style.display="block";

    clearTimeout(
      showMessage.timer
    );

    showMessage.timer=
      setTimeout(()=>{
        message.style.display="none";
      },1800);
  }


  /* =========================
     GAME LOOP
  ========================= */

  let last=
    performance.now();


  function animate(now){

    const delta=
      Math.min(
        (now-last)/1000,
        .05
      );

    last=now;


    let forward=0;
    let sideways=0;


    if(keys.up)
      forward+=1;

    if(keys.down)
      forward-=1;

    /*
     * FIXED:
     * LEFT IS NOW LEFT
     * RIGHT IS NOW RIGHT
     */

    if(keys.left)
      sideways-=1;

    if(keys.right)
      sideways+=1;


    const length=
      Math.hypot(
        forward,
        sideways
      );


    if(length>0){

      forward/=length;
      sideways/=length;

      const speed=
        player.speed*delta;

      const sin=
        Math.sin(
          player.rotation
        );

      const cos=
        Math.cos(
          player.rotation
        );


      player.x +=
        (
          sideways*cos -
          forward*sin
        )*speed;


      player.z +=
        (
          sideways*sin +
          forward*cos
        )*speed;
    }


    /* boundaries */

    player.x=
      THREE.MathUtils.clamp(
        player.x,
        -35,
        35
      );

    player.z=
      THREE.MathUtils.clamp(
        player.z,
        -35,
        35
      );


    /* mantis follows player */

    mantis.position.x=
      player.x;

    mantis.position.z=
      player.z;

    mantis.rotation.y=
      player.rotation;


    /* walking animation */

    if(length>0){

      mantis.position.y=
        Math.sin(now*.012)*.035;

    }else{

      mantis.position.y=0;

    }


    /* camera */

    const distance=7;

    camera.position.x=
      player.x -
      Math.sin(
        player.rotation
      )*distance;

    camera.position.z=
      player.z -
      Math.cos(
        player.rotation
      )*distance;

    camera.position.y=3.5;


    camera.lookAt(
      player.x,
      1.2,
      player.z
    );


    /* =========================
       COLLECT ANTS
    ========================= */

    for(const ant of ants){

      if(ant.collected)
        continue;


      ant.object.rotation.y +=
        delta*.8;


      const dx=
        ant.object.position.x-
        player.x;

      const dz=
        ant.object.position.z-
        player.z;

      const distanceToAnt=
        Math.hypot(dx,dz);


      if(distanceToAnt<1.5){

        ant.collected=true;

        ant.object.visible=false;

        collected++;

        antCount.textContent=
          collected;

        showMessage(
          "🐜 Ant collected! "+
          collected+
          "/15"
        );


        if(collected===15){

          setTimeout(()=>{
            win.style.display="flex";
          },500);

        }
      }
    }


    renderer.render(
      scene,
      camera
    );


    requestAnimationFrame(
      animate
    );
  }


  /* =========================
     RESIZE
  ====================
