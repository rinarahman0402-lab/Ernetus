
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no">

<title>Mantis Adventure 3D</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#67c8e8;
}

#gameCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
}

#startScreen,
#winScreen{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:25px;
  color:white;
  background:
    linear-gradient(
      #55c8e9,
      #438a43
    );
}

#winScreen{
  display:none;
}

h1{
  font-size:clamp(38px,9vw,65px);
  margin:10px;
}

p{
  max-width:600px;
  font-size:18px;
  line-height:1.5;
}

#playGame,
#againButton{
  position:relative;
  z-index:200;

  border:0;
  border-radius:20px;

  padding:18px 35px;

  background:#f4d35e;
  color:#173b1b;

  font-size:21px;
  font-weight:bold;

  cursor:pointer;

  pointer-events:auto;

  touch-action:manipulation;

  user-select:none;
  -webkit-user-select:none;
}

#playGame:active,
#againButton:active{
  transform:scale(.94);
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  z-index:20;

  display:none;
  justify-content:space-between;

  pointer-events:none;
}

.hudBox{
  background:#000b;
  color:white;
  padding:9px 13px;
  border-radius:14px;
  font-weight:bold;
}

#task{
  position:fixed;
  top:58px;
  left:50%;
  transform:translateX(-50%);

  z-index:20;
  display:none;

  background:#000b;
  color:white;

  padding:10px 15px;
  border-radius:15px;

  font-weight:bold;
  text-align:center;

  pointer-events:none;
}

#controls{
  position:fixed;
  left:12px;
  bottom:12px;

  width:240px;
  height:170px;

  z-index:30;
  display:none;
}

.move{
  position:absolute;

  width:78px;
  height:56px;

  border:2px solid #ffffffaa;
  border-radius:16px;

  background:#17251ddd;
  color:white;

  font-size:11px;
  font-weight:bold;

  padding:0;
  margin:0;

  display:flex;
  align-items:center;
  justify-content:center;

  touch-action:none;

  user-select:none;
  -webkit-user-select:none;
}

.move:active{
  transform:scale(.94);
  background:#4d914e;
}

#forward{
  left:81px;
  top:0;
}

#back{
  left:81px;
  bottom:0;
}

#left{
  left:0;
  top:57px;
}

#right{
  right:0;
  top:57px;
}

#catchButton{
  position:fixed;
  right:15px;
  bottom:20px;

  z-index:30;
  display:none;

  border:0;
  border-radius:18px;

  padding:17px 22px;

  background:#f4d35e;
  color:#173b1b;

  font-size:16px;
  font-weight:bold;

  touch-action:manipulation;
}

#message{
  position:fixed;
  left:50%;
  bottom:100px;
  transform:translateX(-50%);

  z-index:40;
  display:none;

  background:#000d;
  color:white;

  padding:11px 17px;
  border-radius:16px;

  font-weight:bold;
  text-align:center;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<!-- START SCREEN -->
<div id="startScreen">

  <div style="font-size:80px">🦗</div>

  <h1>Mantis Adventure 3D</h1>

  <p>
    Explore the giant forest from the mantis's point of view.
    Find and catch all 15 ants.
  </p>

  <button id="playGame" type="button">
    PLAY GAME
  </button>

</div>


<!-- WIN SCREEN -->
<div id="winScreen">

  <div style="font-size:80px">🦗</div>

  <h1>YOU CAUGHT ALL 15 ANTS!</h1>

  <p>
    You completed Mantis Adventure!
  </p>

  <button id="againButton" type="button">
    PLAY AGAIN
  </button>

</div>


<!-- HUD -->
<div id="hud">

  <div class="hudBox">
    MANTIS ADVENTURE 3D
  </div>

  <div class="hudBox">
    ANTS:
    <span id="score">0</span>/15
  </div>

</div>

<div id="task">
  Explore the forest and find the ants.
</div>


<!-- CONTROLS -->
<div id="controls">

  <button class="move" id="forward" type="button">
    FORWARD
  </button>

  <button class="move" id="back" type="button">
    BACK
  </button>

  <button class="move" id="left" type="button">
    TURN LEFT
  </button>

  <button class="move" id="right" type="button">
    TURN RIGHT
  </button>

</div>


<button id="catchButton" type="button">
  CATCH ANT
</button>

<div id="message"></div>


<script>

/*
====================================================
  GAME STATE
====================================================
*/

let THREE;

let scene;
let camera;
let renderer;
let clock;

let player;
let ants=[];

let running=false;
let score=0;

const movement={
  forward:false,
  back:false,
  left:false,
  right:false
};


/*
====================================================
  ELEMENTS
====================================================
*/

const canvas=
document.getElementById("gameCanvas");

const startScreen=
document.getElementById("startScreen");

const winScreen=
document.getElementById("winScreen");

const playButton=
document.getElementById("playGame");

const againButton=
document.getElementById("againButton");

const hud=
document.getElementById("hud");

const controls=
document.getElementById("controls");

const task=
document.getElementById("task");

const catchButton=
document.getElementById("catchButton");

const scoreText=
document.getElementById("score");

const message=
document.getElementById("message");


/*
====================================================
  LOAD THREE.JS
====================================================
*/

function loadThree(){

  const script=
  document.createElement("script");

  script.src=
  "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.min.js";

  script.onload=()=>{

    THREE=window.THREE;

    playButton.disabled=false;

  };

  script.onerror=()=>{

    playButton.textContent=
      "RELOAD GAME";

  };

  document.head.appendChild(script);
}


/*
====================================================
  MESSAGE
====================================================
*/

function showMessage(text){

  message.textContent=text;
  message.style.display="block";

  clearTimeout(window.messageTimer);

  window.messageTimer=
  setTimeout(()=>{

    message.style.display="none";

  },1600);
}


/*
====================================================
  CREATE GAME
====================================================
*/

function createGame(){

  scene=
  new THREE.Scene();

  scene.background=
  new THREE.Color(0x70cbea);

  scene.fog=
  new THREE.Fog(
    0x70cbea,
    20,
    150
  );


  camera=
  new THREE.PerspectiveCamera(
    75,
    innerWidth/innerHeight,
    .05,
    250
  );


  try{

    renderer=
    new THREE.WebGLRenderer({
      canvas:canvas,
      antialias:true
    });

  }catch(error){

    showMessage(
      "3D graphics could not start on this device."
    );

    return false;

  }


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      1.5
    )
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.shadowMap.enabled=true;


  /*
  LIGHTING
  */

  const skyLight=
  new THREE.HemisphereLight(
    0xc9f3ff,
    0x315a32,
    2
  );

  scene.add(skyLight);


  const sun=
  new THREE.DirectionalLight(
    0xffffff,
    2.5
  );

  sun.position.set(
    30,
    50,
    20
  );

  sun.castShadow=true;

  scene.add(sun);


  /*
  GROUND
  */

  const ground=
  new THREE.Mesh(

    new THREE.PlaneGeometry(
      500,
      500
    ),

    new THREE.MeshStandardMaterial({
      color:0x4d9946
    })

  );

  ground.rotation.x=
    -Math.PI/2;

  ground.receiveShadow=true;

  scene.add(ground);


  /*
  MANTIS
  */

  player=
  new THREE.Group();

  player.position.set(
    0,
    .7,
    0
  );

  scene.add(player);


  /*
  CAMERA IS ATTACHED TO MANTIS
  */

  camera.position.set(
    0,
    .1,
    -.7
  );

  player.add(camera);


  /*
  TREES
  */

  for(
    let i=0;
    i<100;
    i++
  ){

    const angle=
      Math.random()*
      Math.PI*2;

    const distance=
      12+
      Math.random()*120;

    createTree(
      Math.cos(angle)*distance,
      Math.sin(angle)*distance,
      .7+
      Math.random()*.9
    );

  }


  /*
  15 ANTS
  */

  ants=[];

  for(
    let i=0;
    i<15;
    i++
  ){

    const angle=
      Math.random()*
      Math.PI*2;

    const distance=
      12+
      Math.random()*90;

    createAnt(
      Math.cos(angle)*distance,
      Math.sin(angle)*distance
    );

  }


  clock=
    new THREE.Clock();


  return true;
}


/*
====================================================
  TREE
====================================================
*/

function createTree(x,z,size){

  const tree=
  new THREE.Group();


  const trunk=
  new THREE.Mesh(

    new THREE.CylinderGeometry(
      .25*size,
      .35*size,
      3*size,
      8
    ),

    new THREE.MeshStandardMaterial({
      color:0x654327
    })

  );

  trunk.position.y=
    1.5*size;

  trunk.castShadow=true;

  tree.add(trunk);


  const leaves=
  new THREE.Mesh(

    new THREE.SphereGeometry(
      1.4*size,
      12,
      10
    ),

    new THREE.MeshStandardMaterial({
      color:0x277a3b
    })

  );

  leaves.position.y=
    3.1*size;

  leaves.castShadow=true;

  tree.add(leaves);


  tree.position.set(
    x,
    0,
    z
  );

  scene.add(tree);
}


/*
====================================================
  ANT
====================================================
*/

function createAnt(x,z){

  const ant=
  new THREE.Group();


  const material=
  new THREE.MeshStandardMaterial({
    color:0x1c120d
  });


  for(
    let i=0;
    i<3;
    i++
  ){

    const bodyPart=
    new THREE.Mesh(

      new THREE.SphereGeometry(
        .13,
        8,
        6
      ),

      material

    );

    bodyPart.position.set(
      (i-1)*.22,
      .13,
      0
    );

    ant.add(bodyPart);

  }


  for(
    const side of[-1,1]
  ){

    for(
      let i=0;
      i<3;
      i++
    ){

      const leg=
      new THREE.Mesh(

        new THREE.CylinderGeometry(
          .018,
          .018,
          .35,
          5
        ),

        material

      );

      leg.rotation.z=
        side*.9;

      leg.position.set(
        side*.13,
        .12,
        (i-1)*.16
      );

      ant.add(leg);

    }

  }


  ant.position.set(
    x,
    0,
    z
  );

  scene.add(ant);

  ants.push(ant);
}


/*
====================================================
  START GAME
====================================================
*/

function startGame(){

  /*
    THIS IS THE IMPORTANT FIX:
    The button directly calls this function.
  */

  if(!THREE){

    playButton.textContent=
      "LOADING 3D...";

    return;

  }


  const success=
    createGame();

  if(!success)
    return;


  startScreen.style.display=
    "none";

  hud.style.display=
    "flex";

  controls.style.display=
    "block";

  task.style.display=
    "block";

  score=0;

  scoreText.textContent=
    "0";

  running=true;

  clock.start();

  showMessage(
    "Find 15 ants!"
  );

  requestAnimationFrame(
    gameLoop
  );
}


/*
====================================================
  PLAY BUTTON
====================================================
*/

playButton.addEventListener(
  "click",
  startGame
);

playButton.addEventListener(
  "pointerup",
  event=>{
    event.preventDefault();
  }
);


/*
====================================================
  MOVEMENT BUTTONS
====================================================
*/

function setupMovement(id,key){

  const button=
    document.getElementById(id);


  button.addEventListener(
    "pointerdown",
    event=>{

      event.preventDefault();

      movement[key]=true;

    }
  );


  button.addEventListener(
    "pointerup",
    event=>{

      event.preventDefault();

      movement[key]=false;

    }
  );


  button.addEventListener(
    "pointercancel",
    event=>{

      event.preventDefault();

      movement[key]=false;

    }
  );


  button.addEventListener(
    "pointerleave",
    event=>{

      event.preventDefault();

      movement[key]=false;

    }
  );

}


setupMovement(
  "forward",
  "forward"
);

setupMovement(
  "back",
  "back"
);

setupMovement(
  "left",
  "left"
);

setupMovement(
  "right",
  "right"
);


/*
====================================================
  KEYBOARD
====================================================
*/

window.addEventListener(
  "keydown",
  event=>{

    if(event.key==="ArrowUp")
      movement.forward=true;

    if(event.key==="ArrowDown")
      movement.back=true;

    if(event.key==="ArrowLeft")
      movement.left=true;

    if(event.key==="ArrowRight")
      movement.right=true;

  }
);


window.addEventListener(
  "keyup",
  event=>{

    if(event.key==="ArrowUp")
      movement.forward=false;

    if(event.key==="ArrowDown")
      movement.back=false;

    if(event.key==="ArrowLeft")
      movement.left=false;

    if(event.key==="ArrowRight")
      movement.right=false;

  }
);


/*
====================================================
  UPDATE
====================================================
*/

function update(dt){

  const speed=6;


  /*
    LEFT AND RIGHT ARE CORRECTLY ORIENTED.
  */

  if(movement.left)
    player.rotation.y+=2.2*dt;

  if(movement.right)
    player.rotation.y-=2.2*dt;


  let amount=0;

  if(movement.forward)
    amount+=1;

  if(movement.back)
    amount-=1;


  if(amount!==0){

    const direction=
    new THREE.Vector3(
      0,
      0,
      -1
    );

    direction.applyQuaternion(
      player.quaternion
    );

    player.position.addScaledVector(
      direction,
      amount*speed*dt
    );

  }


  player.position.y=.7;


  /*
    FIND NEAREST ANT
  */

  let nearest=null;
  let nearestDistance=999;


  ants.forEach(
    ant=>{

      if(!ant.visible)
        return;


      const dx=
        ant.position.x-
        player.position.x;

      const dz=
        ant.position.z-
        player.position.z;


      const distance=
        Math.hypot(dx,dz);


      if(
        distance<
        nearestDistance
      ){

        nearestDistance=
          distance;

        nearest=
          ant;

      }

    }
  );


  if(
    nearest &&
    nearestDistance<3
  ){

    catchButton.style.display=
      "block";

    catchButton.onclick=
      ()=>catchAnt(nearest);

  }else{

    catchButton.style.display=
      "none";

  }

}


/*
====================================================
  CATCH ANT
====================================================
*/

function catchAnt(ant){

  if(
    !ant ||
    !ant.visible
  )
    return;


  const distance=
    Math.hypot(

      ant.position.x-
      player.position.x,

      ant.position.z-
      player.position.z

    );


  if(distance>3)
    return;


  ant.visible=false;

  score++;

  scoreText.textContent=
    score;

  catchButton.style.display=
    "none";

  showMessage(
    "ANT CAUGHT! "+
    score+
    " / 15"
  );


  if(score>=15){

    running=false;

    hud.style.display=
      "none";

    controls.style.display=
      "none";

    task.style.display=
      "none";

    winScreen.style.display=
      "flex";

  }

}


/*
====================================================
  GAME LOOP
====================================================
*/

function gameLoop(){

  if(!running)
    return;


  requestAnimationFrame(
    gameLoop
  );


  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );


  update(dt);


  renderer.render(
    scene,
    camera
  );

}


/*
====================================================
  PLAY AGAIN
====================================================
*/

againButton.addEventListener(
  "click",
  ()=>{

    winScreen.style.display=
      "none";

    if(renderer){

      renderer.dispose();

    }

    score=0;

    scoreText.textContent=
      "0";

    const success=
      createGame();

    if(!success)
      return;

    running=true;

    hud.style.display=
      "flex";

    controls.style.display=
      "block";

    task.style.display=
      "block";

    clock.start();

    requestAnimationFrame(
      gameLoop
    );

  }
);


/*
====================================================
  RESIZE
====================================================
*/

window.addEventListener(
  "resize",
  ()=>{

    if(!camera || !renderer)
      return;


    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/*
====================================================
  BEGIN LOADING
====================================================
*/

playButton.disabled=true;

loadThree();

</script>

</body>
</html>
```
