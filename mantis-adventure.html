<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mantis Adventure</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#79bce0;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
}

#controls{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.control{
  position:absolute;
  width:74px;
  height:74px;
  border:0;
  padding:0;
  background:rgba(255,255,255,.18);
  border-radius:22px;
  pointer-events:auto;
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 4px 12px rgba(0,0,0,.18);
}

.control:active{
  background:rgba(255,255,255,.35);
  transform:scale(.94);
}

.triangle{
  width:0;
  height:0;
  margin:auto;
}

.up .triangle{
  border-left:17px solid transparent;
  border-right:17px solid transparent;
  border-bottom:28px solid white;
}

.down .triangle{
  border-left:17px solid transparent;
  border-right:17px solid transparent;
  border-top:28px solid white;
}

.left .triangle{
  border-top:17px solid transparent;
  border-bottom:17px solid transparent;
  border-right:28px solid white;
}

.right .triangle{
  border-top:17px solid transparent;
  border-bottom:17px solid transparent;
  border-left:28px solid white;
}

#forward{
  left:calc(50% - 37px);
  bottom:118px;
}

#back{
  left:calc(50% - 37px);
  bottom:22px;
}

#left{
  left:18px;
  bottom:70px;
}

#right{
  right:18px;
  bottom:70px;
}

#message{
  position:fixed;
  left:50%;
  top:12%;
  transform:translateX(-50%);
  width:80%;
  max-width:520px;
  text-align:center;
  font-family:Arial,sans-serif;
  font-size:25px;
  font-weight:bold;
  color:white;
  text-shadow:0 3px 8px #000;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s;
}

#message.show{
  opacity:1;
}

#dot{
  position:fixed;
  left:50%;
  top:50%;
  width:7px;
  height:7px;
  margin:-3px;
  border-radius:50%;
  background:rgba(255,255,255,.9);
  box-shadow:0 0 4px #000;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="dot"></div>

<div id="message"></div>

<div id="controls">

  <button class="control up" id="forward">
    <div class="triangle"></div>
  </button>

  <button class="control down" id="back">
    <div class="triangle"></div>
  </button>

  <button class="control left" id="left">
    <div class="triangle"></div>
  </button>

  <button class="control right" id="right">
    <div class="triangle"></div>
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
/* =========================================================
   MANTIS ADVENTURE
   First-person 3D exploration
   ========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x78bce0);

scene.fog = new THREE.Fog(
  0x78bce0,
  70,
  430
);


/* =========================================================
   CAMERA
   ========================================================= */

const camera = new THREE.PerspectiveCamera(
  72,
  innerWidth / innerHeight,
  0.05,
  900
);

camera.position.set(0,2.4,0);


/* =========================================================
   RENDERER
   ========================================================= */

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.7)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.getElementById("game").appendChild(
  renderer.domElement
);


/* =========================================================
   LIGHT
   ========================================================= */

const skyLight = new THREE.HemisphereLight(
  0xcceeff,
  0x315225,
  1.25
);

scene.add(skyLight);


const sun = new THREE.DirectionalLight(
  0xffffff,
  1.45
);

sun.position.set(
  80,
  140,
  70
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -180;
sun.shadow.camera.right = 180;
sun.shadow.camera.top = 180;
sun.shadow.camera.bottom = -180;

sun.shadow.camera.near = 1;
sun.shadow.camera.far = 500;

scene.add(sun);


/* =========================================================
   GROUND
   ========================================================= */

const groundMaterial =
  new THREE.MeshStandardMaterial({
    color:0x4e8d3b,
    roughness:1
  });

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2200,2200),
  groundMaterial
);

ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   PATH
   ========================================================= */

const pathMaterial =
  new THREE.MeshStandardMaterial({
    color:0x9c774c,
    roughness:1
  });

const path = new THREE.Mesh(
  new THREE.PlaneGeometry(2200,170),
  pathMaterial
);

path.rotation.x = -Math.PI/2;
path.position.y = 0.012;

scene.add(path);


/* =========================================================
   RANDOM
   ========================================================= */

function random(min,max){
  return min + Math.random()*(max-min);
}

function randomSign(){
  return Math.random()<.5 ? -1 : 1;
}


/* =========================================================
   TREES
   ========================================================= */

const trees = [];

function makeTree(x,z,scale=1){

  const tree = new THREE.Group();

  const trunkMaterial =
    new THREE.MeshStandardMaterial({
      color:0x654126,
      roughness:1
    });

  const leafMaterial =
    new THREE.MeshStandardMaterial({
      color:0x236b2d,
      roughness:1
    });

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(
      0.75*scale,
      1.05*scale,
      9*scale,
      8
    ),
    trunkMaterial
  );

  trunk.position.y = 4.5*scale;
  trunk.castShadow = true;
  trunk.receiveShadow = true;

  tree.add(trunk);


  const crown1 = new THREE.Mesh(
    new THREE.SphereGeometry(
      4.8*scale,
      10,
      8
    ),
    leafMaterial
  );

  crown1.position.y = 9*scale;
  crown1.castShadow = true;

  tree.add(crown1);


  const crown2 = new THREE.Mesh(
    new THREE.SphereGeometry(
      3.7*scale,
      10,
      8
    ),
    leafMaterial
  );

  crown2.position.set(
    -2*scale,
    11*scale,
    1*scale
  );

  crown2.castShadow = true;

  tree.add(crown2);


  const crown3 = new THREE.Mesh(
    new THREE.SphereGeometry(
      3.4*scale,
      10,
      8
    ),
    leafMaterial
  );

  crown3.position.set(
    2*scale,
    11*scale,
    -1*scale
  );

  crown3.castShadow = true;

  tree.add(crown3);


  tree.position.set(x,0,z);

  scene.add(tree);

  trees.push(tree);

  return tree;
}


/* =========================================================
   CREATE FOREST
   ========================================================= */

for(let i=0;i<220;i++){

  let x = random(-500,500);
  let z = random(-500,500);

  if(Math.abs(x)<25) continue;

  if(Math.abs(z)<25) continue;

  makeTree(
    x,
    z,
    random(.75,1.45)
  );
}


/* =========================================================
   ROCKS
   ========================================================= */

const rocks = [];

function makeRock(x,z,s){

  const material =
    new THREE.MeshStandardMaterial({
      color:0x697269,
      roughness:1
    });

  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(
      s,
      0
    ),
    material
  );

  rock.position.set(
    x,
    s*.5,
    z
  );

  rock.rotation.set(
    random(0,Math.PI),
    random(0,Math.PI),
    random(0,Math.PI)
  );

  rock.scale.y = random(.5,1);

  rock.castShadow = true;
  rock.receiveShadow = true;

  scene.add(rock);

  rocks.push(rock);
}

for(let i=0;i<160;i++){

  makeRock(
    random(-500,500),
    random(-500,500),
    random(.4,1.5)
  );
}


/* =========================================================
   ANT MATERIALS
   ========================================================= */

const antBodyMaterial =
  new THREE.MeshStandardMaterial({
    color:0x321b0b,
    roughness:.9
  });

const antHeadMaterial =
  new THREE.MeshStandardMaterial({
    color:0x47220c,
    roughness:.9
  });


/* =========================================================
   ANT CREATION
   ========================================================= */

const ants = [];

function makeAnt(x,z){

  const ant = new THREE.Group();

  const abdomen = new THREE.Mesh(
    new THREE.SphereGeometry(
      1.15,
      10,
      8
    ),
    antBodyMaterial
  );

  abdomen.scale.set(
    1.35,
    .8,
    1.65
  );

  abdomen.position.z = .95;

  ant.add(abdomen);


  const thorax = new THREE.Mesh(
    new THREE.SphereGeometry(
      .85,
      10,
      8
    ),
    antBodyMaterial
  );

  ant.add(thorax);


  const head = new THREE.Mesh(
    new THREE.SphereGeometry(
      .72,
      10,
      8
    ),
    antHeadMaterial
  );

  head.position.z = -.95;

  ant.add(head);


  /* legs */

  for(let side=-1;side<=1;side+=2){

    for(let j=0;j<3;j++){

      const leg = new THREE.Mesh(
        new THREE.CylinderGeometry(
          .11,
          .16,
          2.2,
          6
        ),
        antBodyMaterial
      );

      leg.position.set(
        side*.9,
        .1,
        (j-1)*.65
      );

      leg.rotation.z =
        side * Math.PI/3;

      leg.rotation.x =
        random(-.2,.2);

      ant.add(leg);
    }
  }


  ant.position.set(
    x,
    1.15,
    z
  );

  ant.scale.setScalar(1.45);

  ant.castShadow = true;

  ant.userData = {

    homeX:x,
    homeZ:z,

    targetX:x,
    targetZ:z,

    alive:true,

    nextMove:0,

    speed:random(.08,.22)

  };

  scene.add(ant);

  ants.push(ant);

  return ant;
}


/* =========================================================
   ANT AREAS
   ========================================================= */

for(let i=0;i<14;i++){

  const x =
    random(-300,300);

  const z =
    random(-300,300);

  makeAnt(x,z);

}


/* =========================================================
   ANIMAL MATERIALS
   ========================================================= */

const deerBodyMaterial =
  new THREE.MeshStandardMaterial({
    color:0x8b5a32,
    roughness:1
  });

const deerDarkMaterial =
  new THREE.MeshStandardMaterial({
    color:0x5d371c,
    roughness:1
  });

const elephantMaterial =
  new THREE.MeshStandardMaterial({
    color:0x777b78,
    roughness:1
  });


/* =========================================================
   DEER
   ========================================================= */

const deer = [];

function makeDeer(x,z){

  const animal = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(
      4.2,
      2.4,
      7
    ),
    deerBodyMaterial
  );

  body.position.y = 5;

  body.castShadow = true;

  animal.add(body);


  const neck = new THREE.Mesh(
    new THREE.BoxGeometry(
      2,
      5,
      2
    ),
    deerBodyMaterial
  );

  neck.position.set(
    0,
    7.1,
    -2.3
  );

  neck.rotation.x = -.25;

  neck.castShadow = true;

  animal.add(neck);


  const head = new THREE.Mesh(
    new THREE.BoxGeometry(
      2.1,
      2.1,
      3.2
    ),
    deerBodyMaterial
  );

  head.position.set(
    0,
    9.3,
    -3.5
  );

  head.castShadow = true;

  animal.add(head);


  for(let side=-1;side<=1;side+=2){

    const antler = new THREE.Mesh(
      new THREE.CylinderGeometry(
        .15,
        .2,
        2.5,
        6
      ),
      deerDarkMaterial
    );

    antler.position.set(
      side*.75,
      10.6,
      -3.4
    );

    antler.rotation.z =
      side*.35;

    antler.castShadow = true;

    animal.add(antler);
  }


  for(let side=-1;side<=1;side+=2){

    for(let j=0;j<2;j++){

      const leg = new THREE.Mesh(
        new THREE.CylinderGeometry(
          .35,
          .42,
          5
        ),
        deerDarkMaterial
      );

      leg.position.set(
        side*1.3,
        2.5,
        j===0 ? -1.8 : 1.8
      );

      leg.castShadow = true;

      animal.add(leg);
    }
  }


  animal.position.set(
    x,
    0,
    z
  );

  animal.userData = {

    type:"deer",

    targetX:x,
    targetZ:z,

    speed:random(1.1,2.2),

    dangerTimer:random(2,8),

    direction:random(0,Math.PI*2)

  };

  scene.add(animal);

  deer.push(animal);

  return animal;
}


for(let i=0;i<4;i++){

  makeDeer(
    random(-250,250),
    random(-250,250)
  );

}


/* =========================================================
   ELEPHANTS
   ========================================================= */

const elephants = [];

function makeElephant(x,z){

  const animal = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.SphereGeometry(
      5.5,

    ),

  );

  body.scale.set(

  );

  );

  trunk.position.set(

  );

  trunk.castShadow = true;

  for(let side=-1;side<=1;side+=2){

        ),

for(let i=0;i<3;i++){

  makeElephant(
    random(-300,300),
    random(-300,300)
  );

}


/* =========================================================
   PLAYER
   ========================================================= */

const player = {

  x:0,

  z:0,

  angle:0,

  speed:8,

  turnSpeed:1.8,

  alive:true,

  caught:0,

  goal:8

};


/* =========================================================
   CONTROLS
   ========================================================= */

const keys = {

  forward:false,

  back:false,

  left:false,

  right:false
};


function touchButton(id,key){

  const button =
    document.getElementById(id);


  function down(e){

    e.preventDefault();

    keys[key] = true;

    if(button.setPointerCapture){

      try{
        button.setPointerCapture(e.pointerId);
      }catch(_){}
    }
  }


  function up(e){

    e.preventDefault();

    keys[key] = false;
  }


  button.addEventListener(
    "pointerdown",
    down,
    {passive:false}
  );

  button.addEventListener(
    "pointerup",
    up,
    {passive:false}
  );

  button.addEventListener(
    "pointercancel",
    up,
    {passive:false}
  );

  button.addEventListener(
    "pointerleave",
    up,
    {passive:false}
  );
}


touchButton("forward","forward");
touchButton("back","back");
touchButton("left","left");
touchButton("right","right");


/* =========================================================
   KEYBOARD
   ========================================================= */

addEventListener(
  "keydown",
  e=>{

    const k =
      e.key.toLowerCase();

    if(k==="w" || k==="arrowup")
      keys.forward=true;

    if(k==="s" || k==="arrowdown")
      keys.back=true;

    if(k==="a" || k==="arrowleft")
      keys.left=true;

    if(k==="d" || k==="arrowright")
      keys.right=true;
  }
);


addEventListener(
  "keyup",
  e=>{

    const k =
      e.key.toLowerCase();

    if(k==="w" || k==="arrowup")
      keys.forward=false;

    if(k==="s" || k==="arrowdown")
      keys.back=false;

    if(k==="a" || k==="arrowleft")
      keys.left=false;

    if(k==="d" || k==="arrowright")
      keys.right=false;
  }
);


/* =========================================================
   NATURAL MOVEMENT
   ========================================================= */

function updatePlayer(dt){

  if(!player.alive)
    return;


  let forward = 0;

  if(keys.forward)
    forward += 1;

  if(keys.back)
    forward -= 1;


  let turning = 0;

  if(keys.right)
    turning += 1;

  if(keys.left)
    turning -= 1;


  /*
    RIGHT turns right.
    LEFT turns left.
    No inversion.
  */

  player.angle +=
    turning *
    player.turnSpeed *
    dt;


  /*
    The camera looks in the direction
    of the same vector used for movement.
  */

  const forwardX =
    Math.sin(player.angle);

  const forwardZ =
    Math.cos(player.angle);


  player.x +=
    forwardX *
    forward *
    player.speed *
    dt;

  player.z +=
    forwardZ *
    forward *
    player.speed *
    dt;


  /*
    Keep the world effectively endless.
    The player never reaches an edge.
  */

  const wrap = 900;

  if(player.x > wrap)
    player.x = -wrap;

  if(player.x < -wrap)
    player.x = wrap;

  if(player.z > wrap)
    player.z = -wrap;

  if(player.z < -wrap)
    player.z = wrap;
}


/* =========================================================
   ANT AI
   ========================================================= */

function updateAnts(dt){

  for(const ant of ants){

    if(!ant.userData.alive)
      continue;


    ant.userData.nextMove -= dt;


    if(ant.userData.nextMove <= 0){

      ant.userData.nextMove =
        random(3,8);


      /*
        Ants choose another point
        close to their original home.
        They do NOT wander everywhere.
      */

      ant.userData.targetX =
        ant.userData.homeX +
        random(-8,8);

      ant.userData.targetZ =
        ant.userData.homeZ +
        random(-8,8);
    }


    const dx =
      ant.userData.targetX -
      ant.position.x;

    const dz =
      ant.userData.targetZ -
      ant.position.z;

    const distance =
      Math.hypot(dx,dz);


    if(distance > .5){

      ant.position.x +=
        dx/distance *
        ant.userData.speed *
        dt;

      ant.position.z +=
        dz/distance *
        ant.userData.speed *
        dt;

      ant.rotation.y =
        Math.atan2(dx,dz);
    }


    /*
      Ant catching.
      Several ants must be caught.
      One ant does NOT win the game.
    */

    const px =
      player.x -
      ant.position.x;

    const pz =
      player.z -
      ant.position.z;

    const d =
      Math.hypot(px,pz);


    if(d < 3.2){

      ant.userData.alive=false;

      ant.visible=false;

      player.caught++;

      if(player.caught >= player.goal){

        winGame();
      }
    }
  }
}


/* =========================================================
   ANIMAL AI
   ========================================================= */

function updateAnimals(list,dt){

  for(const animal of list){

    const data =
      animal.userData;

    data.dangerTimer -= dt;


    /*
      Animals normally wander.
    */

    if(data.dangerTimer <= 0){

      data.dangerTimer =
        random(3,8);


      const dx =
        player.x -
        animal.position.x;

      const dz =
        player.z -
        animal.position.z;

      const distance =
        Math.hypot(dx,dz);


      /*
        Sometimes an animal decides
        to move toward the player.
      */

      if(distance < 70 &&
         Math.random() < .55)
