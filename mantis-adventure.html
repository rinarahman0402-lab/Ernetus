<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Mantis Adventure</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#75b9d8;
  touch-action:none;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
  touch-action:none;
}

.control{
  position:fixed;
  width:64px;
  height:64px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.9);
  background:rgba(20,55,35,.72);
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.control:active{
  transform:scale(.92);
  background:rgba(45,110,60,.9);
}

#left{
  left:20px;
  bottom:24px;
}

#right{
  left:96px;
  bottom:24px;
}

#up{
  right:96px;
  bottom:100px;
}

#down{
  right:96px;
  bottom:24px;
}

.triangle{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:0;
  height:0;
  border-left:13px solid transparent;
  border-right:13px solid transparent;
}

.leftShape{
  border-top:13px solid transparent;
  border-bottom:13px solid transparent;
  border-right:20px solid white;
  border-left:0;
}

.rightShape{
  border-top:13px solid transparent;
  border-bottom:13px solid transparent;
  border-left:20px solid white;
  border-right:0;
}

.upShape{
  border-left:13px solid transparent;
  border-right:13px solid transparent;
  border-bottom:20px solid white;
}

.downShape{
  border-left:13px solid transparent;
  border-right:13px solid transparent;
  border-top:20px solid white;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="left" class="control">
  <div class="triangle leftShape"></div>
</div>

<div id="right" class="control">
  <div class="triangle rightShape"></div>
</div>

<div id="up" class="control">
  <div class="triangle upShape"></div>
</div>

<div id="down" class="control">
  <div class="triangle downShape"></div>
</div>

<script>
"use strict";

/* =========================
   CANVAS
========================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=window.innerWidth;
let H=window.innerHeight;

function resize(){
  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=Math.floor(W*devicePixelRatio);
  canvas.height=Math.floor(H*devicePixelRatio);

  ctx.setTransform(
    devicePixelRatio,0,0,devicePixelRatio,0,0
  );
}

window.addEventListener("resize",resize);
resize();

/* =========================
   CONTROLS
========================= */

const input={
  left:false,
  right:false,
  up:false,
  down:false
};

function hold(id,key){
  const el=document.getElementById(id);

  const start=e=>{
    e.preventDefault();
    input[key]=true;
    if(e.pointerId!==undefined){
      try{el.setPointerCapture(e.pointerId);}catch(_){}
    }
  };

  const stop=e=>{
    e.preventDefault();
    input[key]=false;
  };

  el.addEventListener("pointerdown",start);
  el.addEventListener("pointerup",stop);
  el.addEventListener("pointercancel",stop);
  el.addEventListener("lostpointercapture",stop);
}

hold("left","left");
hold("right","right");
hold("up","up");
hold("down","down");

/* =========================
   KEYBOARD SUPPORT
   ========================= */

window.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")input.left=true;
  if(e.key==="ArrowRight")input.right=true;
  if(e.key==="ArrowUp")input.up=true;
  if(e.key==="ArrowDown")input.down=true;
});

window.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft")input.left=false;
  if(e.key==="ArrowRight")input.right=false;
  if(e.key==="ArrowUp")input.up=false;
  if(e.key==="ArrowDown")input.down=false;
});

/* =========================
   WORLD
========================= */

/*
  The world is mathematically infinite.
  Objects are generated from their world coordinates,
  so there is no giant map to run out of.
*/

const CELL=420;

function hash(x,y){
  let n=x*374761393+y*668265263;
  n=(n^(n>>>13))*1274126177;
  n=n^(n>>>16);
  return (n>>>0)/4294967295;
}

function wrap(v){
  const SIZE=1000000000;

  if(v>SIZE)v-=SIZE;
  if(v<-SIZE)v+=SIZE;

  return v;
}

/* =========================
   PLAYER
========================= */

const player={
  x:0,
  y:0,
  speed:4.2,
  radius:20,
  health:100,
  invincible:0
};

/* =========================
   PREDATORS
========================= */

const predators=[];

function createPredator(x,y,type){
  predators.push({
    x:x,
    y:y,
    type:type,
    radius:type==="tiger"?25:20,
    speed:type==="tiger"?0.75:0.55,
    angle:Math.random()*Math.PI*2,
    wander:0
  });
}

/* A few predators start near the player. */

createPredator(700,220,"tiger");
createPredator(-700,-350,"wolf");
createPredator(900,-650,"tiger");

/* =========================
   FIXED ANTS
========================= */

/*
  Ants are anchored to world cells.
  They do NOT wander around.
  They only make a tiny slow animation.
*/

function antAt(cx,cy){
  const r=hash(cx*3+17,cy*5+31);

  if(r<0.43)return null;

  return {
    x:cx*CELL+90+hash(cx+4,cy+9)*240,
    y:cy*CELL+90+hash(cx+12,cy+15)*240,
    phase:hash(cx+30,cy+50)*6.28
  };
}

/* =========================
   DRAW WORLD
========================= */

function drawGround(){
  ctx.fillStyle="#8fcf70";
  ctx.fillRect(0,0,W,H);

  const startX=Math.floor((player.x-W/2)/CELL)-2;
  const endX=Math.floor((player.x+W/2)/CELL)+2;

  const startY=Math.floor((player.y-H/2)/CELL)-2;
  const endY=Math.floor((player.y+H/2)/CELL)+2;

  for(let cy=startY;cy<=endY;cy++){
    for(let cx=startX;cx<=endX;cx++){

      const sx=cx*CELL-player.x+W/2;
      const sy=cy*CELL-player.y+H/2;

      const r=hash(cx,cy);

      if(r<0.25){
        ctx.fillStyle="#76bd5d";
        ctx.fillRect(sx,sy,CELL,CELL);
      }else if(r<0.5){
        ctx.fillStyle="#84c968";
        ctx.fillRect(sx,sy,CELL,CELL);
      }

      drawPlants(cx,cy,sx,sy);
    }
  }
}

/* =========================
   PLANTS
========================= */

function drawPlants(cx,cy,sx,sy){

  const amount=2+Math.floor(hash(cx+71,cy+93)*4);

  for(let i=0;i<amount;i++){

    const px=sx+hash(cx*7+i+1,cy*11+i+4)*CELL;
    const py=sy+hash(cx*13+i+8,cy*17+i+9)*CELL;

    if(px<-50||px>W+50||py<-50||py>H+50)continue;

    const size=12+hash(cx+i,cy-i)*18;

    ctx.fillStyle="#4d9c43";

    ctx.beginPath();
    ctx.arc(px,py,size,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#2e7938";

    ctx.beginPath();
    ctx.arc(px-size*.45,py+size*.2,size*.55,0,Math.PI*2);
    ctx.arc(px+size*.45,py+size*.2,size*.55,0,Math.PI*2);
    ctx.fill();
  }
}

/* =========================
   ANTS
========================= */

function drawAnts(time){

  const startX=Math.floor((player.x-W/2)/CELL)-2;
  const endX=Math.floor((player.x+W/2)/CELL)+2;

  const startY=Math.floor((player.y-H/2)/CELL)-2;
  const endY=Math.floor((player.y+H/2)/CELL)+2;

  for(let cy=startY;cy<=endY;cy++){
    for(let cx=startX;cx<=endX;cx++){

      const ant=antAt(cx,cy);

      if(!ant)continue;

      const sx=ant.x-player.x+W/2;
      const sy=ant.y-player.y+H/2;

      if(sx<-60||sx>W+60||sy<-60||sy>H+60)continue;

      /*
        Very small movement only.
        The ant remains in its own spot.
      */

      const tiny=Math.sin(time*.00035+ant.phase)*2;

      const x=sx;
      const y=sy+tiny;

      /* shadow */

      ctx.fillStyle="rgba(0,0,0,.18)";
      ctx.beginPath();
      ctx.ellipse(x,y+7,13,5,0,0,Math.PI*2);
      ctx.fill();

      /* body */

      ctx.fillStyle="#34251d";

      ctx.beginPath();
      ctx.ellipse(x,y,10,7,0,0,Math.PI*2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x-9,y,5,0,Math.PI*2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x+8,y,5,0,Math.PI*2);
      ctx.fill();

      /* legs */

      ctx.strokeStyle="#34251d";
      ctx.lineWidth=2;

      for(let l=-1;l<=1;l++){

        ctx.beginPath();
        ctx.moveTo(x-5,y+l*3);
        ctx.lineTo(x-15,y+l*7);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x+5,y+l*3);
        ctx.lineTo(x+15,y+l*7);
        ctx.stroke();
      }
    }
  }
}

/* =========================
   ANIMAL SHADOWS
========================= */

function drawAnimalShadow(x,y,size){

  ctx.fillStyle="rgba(0,0,0,.28)";

  ctx.beginPath();
  ctx.ellipse(
    x,
    y+size*.45,
    size*1.15,
    size*.38,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();
}

/* =========================
   ANIMALS
========================= */

function drawTiger(x,y){

  drawAnimalShadow(x,y,25);

  ctx.fillStyle="#d88b32";

  ctx.beginPath();
  ctx.ellipse(x,y,26,17,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#222";

  for(let i=-2;i<=2;i++){
    ctx.fillRect(x+i*9-2,y-13,4,26);
  }

  ctx.fillStyle="#d88b32";

  ctx.beginPath();
  ctx.arc(x+25,y-5,12,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(x+29,y-7,2.5,0,Math.PI*2);
  ctx.fill();
}

function drawWolf(x,y){

  drawAnimalShadow(x,y,20);

  ctx.fillStyle="#656b72";

  ctx.beginPath();
  ctx.ellipse(x,y,23,15,0,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x+22,y-5,12,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#333";

  ctx.beginPath();
  ctx.moveTo(x+14,y-14);
  ctx.lineTo(x+18,y-30);
  ctx.lineTo(x+25,y-16);
  ctx.fill();

  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(x+26,y-7,2.5,0,Math.PI*2);
  ctx.fill();
}

/* =========================
   PREDATOR UPDATE
========================= */

function updatePredators(){

  for(const a of predators){

    const dx=player.x-a.x;
    const dy=player.y-a.y;

    const distance=Math.hypot(dx,dy);

    /*
      Animals chase the player only when reasonably close.
    */

    if(distance<700){

      a.x+=dx/distance*a.speed;
      a.y+=dy/distance*a.speed;

    }else{

      a.wander+=0.01;

      a.x+=Math.cos(a.wander+a.angle)*.12;
      a.y+=Math.sin(a.wander+a.angle)*.12;
    }

    const hitDistance=a.radius+player.radius;

    if(
      distance<hitDistance &&
      player.invincible<=0
    ){

      player.health-=8;
      player.invincible=50;

      a.x-=dx/distance*80;
      a.y-=dy/distance*80;
    }

    /*
      Keep the world effectively endless by wrapping predators.
    */

    a.x=wrap(a.x);
    a.y=wrap(a.y);
  }
}

/* =========================
   DRAW PREDATORS
========================= */

function drawPredators(){

  for(const a of predators){

    const x=a.x-player.x+W/2;
    const y=a.y-player.y+H/2;

    if(x<-100||x>W+100||y<-100||y>H+100)continue;

    if(a.type==="tiger"){
      drawTiger(x,y);
    }else{
      drawWolf(x,y);
    }
  }
}

/* =========================
   PLAYER MANTIS
========================= */

function drawPlayer(){

  const x=W/2;
  const y=H/2;

  ctx.save();

  if(player.invincible>0){
    ctx.globalAlpha=
      Math.floor(player.invincible/5)%2===0
      ? .35
      : 1;
  }

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.25)";
  ctx.beginPath();
  ctx.ellipse(x,y+24,25,9,0,0,Math.PI*2);
  ctx.fill();

  /* body */

  ctx.fillStyle="#3e8f39";

  ctx.beginPath();
  ctx.ellipse(x,y+10,18,28,0,0,Math.PI*2);
  ctx.fill();

  /* head */

  ctx.fillStyle="#63ae43";

  ctx.beginPath();
  ctx.arc(x,y-19,18,0,Math.PI*2);
  ctx.fill();

  /* eyes */

  ctx.fillStyle="#172016";

  ctx.beginPath();
  ctx.arc(x-7,y-22,4,0,Math.PI*2);
  ctx.arc(x+7,y-22,4,0,Math.PI*2);
  ctx.fill();

  /* arms */

  ctx.strokeStyle="#367633";
  ctx.lineWidth=6;
  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(x-12,y-1);
  ctx.lineTo(x-35,y-17);
  ctx.lineTo(x-43,y-5);

  ctx.moveTo(x+12,y-1);
  ctx.lineTo(x+35,y-17);
  ctx.lineTo(x+43,y-5);

  ctx.stroke();

  /* legs */

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(x-9,y+30);
  ctx.lineTo(x-25,y+45);

  ctx.moveTo(x+9,y+30);
  ctx.lineTo(x+25,y+45);

  ctx.stroke();

  ctx.restore();
}

/* =========================
   HEALTH BAR
========================= */

function drawHealth(){

  const width=150;
  const height=12;

  const x=18;
  const y=18;

  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.fillRect(x,y,width,height);

  ctx.fillStyle="#59b94a";
  ctx.fillRect(
    x,
    y,
    width*Math.max(0,player.health/100),
    height
  );
}

/* =========================
   MAIN LOOP
========================= */

let previous=performance.now();

function loop(now){

  const dt=Math.min(
    (now-previous)/16.666,
    2
  );

  previous=now;

  /*
    NORMAL CONTROLS:
    left  = x decreases
    right = x increases
    up    = y decreases
    down  = y increases

    Nothing is inverted.
  */

  const speed=player.speed*dt;

  if(input.left)player.x-=speed;
  if(input.right)player.x+=speed;
  if(input.up)player.y-=speed;
  if(input.down)player.y+=speed;

  player.x=wrap(player.x);
  player.y=wrap(player.y);

  if(player.invincible>0){
    player.invincible-=dt;
  }

  updatePredators();

  drawGround();
  drawAnts(now);
  drawPredators();
  drawPlayer();
  drawHealth();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
</body>
</html>
