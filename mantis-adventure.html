
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Mantis Adventure 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
    text-shadow:0 2px 4px #000;
}

#title{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    font-size:24px;
    font-weight:bold;
    white-space:nowrap;
}

#ants{
    position:absolute;
    top:52px;
    left:50%;
    transform:translateX(-50%);
    background:#0009;
    padding:9px 17px;
    border-radius:20px;
    font-size:18px;
    font-weight:bold;
}

#warning{
    position:absolute;
    top:95px;
    left:50%;
    transform:translateX(-50%);
    background:#8b2200dd;
    padding:9px 16px;
    border-radius:18px;
    display:none;
    font-weight:bold;
    white-space:nowrap;
}

#controls{
    position:fixed;
    left:18px;
    bottom:18px;
    width:235px;
    height:180px;
    pointer-events:none;
}

.control{
    position:absolute;
    width:76px;
    height:58px;
    border:2px solid #ffffff66;
    border-radius:16px;
    background:#16251ddd;
    color:white;
    font-size:15px;
    font-weight:bold;
    box-shadow:0 4px 10px #0007;
    pointer-events:auto;
    touch-action:none;
}

.control:active{
    background:#3e6749;
    transform:scale(.96);
}

#forward{
    left:79px;
    top:0;
}

#back{
    left:79px;
    bottom:0;
}

#left{
    left:0;
    top:61px;
}

#right{
    right:0;
    top:61px;
}

#look{
    position:fixed;
    right:18px;
    bottom:25px;
    width:155px;
    height:155px;
    border:2px solid #ffffff44;
    border-radius:50%;
    background:#0002;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#fff;
    font-weight:bold;
    pointer-events:auto;
    touch-action:none;
}

#message{
    position:fixed;
    left:50%;
    bottom:200px;
    transform:translateX(-50%);
    background:#000c;
    color:white;
    padding:12px 20px;
    border-radius:18px;
    font-weight:bold;
    display:none;
    z-index:5;
}

#start{
    position:fixed;
    inset:0;
    z-index:20;
    background:linear-gradient(#70c9ef,#43894c);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    text-align:center;
    padding:25px;
}

#start h1{
    font-size:38px;
    margin:10px 0;
}

#start p{
    max-width:500px;
    font-size:18px;
    line-height:1.5;
}

#startButton{
    border:0;
    border-radius:18px;
    padding:17px 32px;
    font-size:20px;
    font-weight:bold;
    background:#50d37b;
    color:#082713;
}

#finish{
    position:fixed;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    background:#06130ddf;
    color:white;
    text-align:center;
}

#finishBox{
    background:#10241a;
    border:2px solid #4ed77b;
    border-radius:25px;
    padding:30px;
    margin:20px;
}

#finish button{
    border:0;
    border-radius:14px;
    padding:13px 24px;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div id="title">Mantis Adventure 3D</div>
    <div id="ants">Ants caught: 0 / 15</div>
    <div id="warning">WATCH OUT!</div>
</div>

<div id="controls">
    <button class="control" id="forward">FORWARD</button>
    <button class="control" id="back">BACK</button>
    <button class="control" id="left">TURN LEFT</button>
    <button class="control" id="right">TURN RIGHT</button>
</div>

<div id="look">
    DRAG<br>TO LOOK
</div>

<div id="message"></div>

<div id="start">
    <div style="font-size:80px;">🦗</div>
    <h1>Mantis Adventure 3D</h1>
    <p>
        You are tiny in a giant world.
        Find and catch 15 giant ants while exploring the forest.
        Watch out for animals walking nearby!
    </p>
    <button id="startButton">START ADVENTURE</button>
</div>

<div id="finish">
    <div id="finishBox">
        <div style="font-size:75px;">🏆</div>
        <h1>15 Ants Caught!</h1>
        <p>You survived the giant forest and completed the adventure.</p>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>
</div>

<script>
"use strict";

/* =========================================================
   MANTIS ADVENTURE 3D
   Standalone canvas version.
   No external libraries.
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let FOV = 0;

function resize(){
    W = window.innerWidth;
    H = window.innerHeight;

    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);

    FOV = Math.min(W,H) * 0.95;
}

window.addEventListener("resize",resize);
resize();


/* =========================================================
   PLAYER
   ========================================================= */

const player = {
    x:0,
    z:0,
    yaw:0,
    speed:8
};


/* =========================================================
   CONTROLS
   ========================================================= */

const keys = {
    forward:false,
    back:false,
    left:false,
    right:false
};

function holdButton(id,name){

    const button = document.getElementById(id);

    button.addEventListener("pointerdown",function(e){
        e.preventDefault();
        keys[name] = true;
        button.setPointerCapture(e.pointerId);
    });

    button.addEventListener("pointerup",function(e){
        e.preventDefault();
        keys[name] = false;
    });

    button.addEventListener("pointercancel",function(){
        keys[name] = false;
    });

    button.addEventListener("lostpointercapture",function(){
        keys[name] = false;
    });
}

holdButton("forward","forward");
holdButton("back","back");
holdButton("left","left");
holdButton("right","right");


/* =========================================================
   LOOK CONTROL
   ========================================================= */

const look = document.getElementById("look");

let looking = false;
let lastLookX = 0;

look.addEventListener("pointerdown",function(e){
    e.preventDefault();
    looking = true;
    lastLookX = e.clientX;
    look.setPointerCapture(e.pointerId);
});

look.addEventListener("pointermove",function(e){

    if(!looking) return;

    const dx = e.clientX - lastLookX;

    /*
       Drag RIGHT = look RIGHT
       Drag LEFT  = look LEFT
    */

    player.yaw += dx * 0.009;

    lastLookX = e.clientX;
});

look.addEventListener("pointerup",function(){
    looking = false;
});

look.addEventListener("pointercancel",function(){
    looking = false;
});


/* =========================================================
   WORLD OBJECTS
   ========================================================= */

const objects = [];

const ants = [];
const animals = [];
const trees = [];
const rocks = [];


/* deterministic random */

let seed = 72931;

function random(){

    seed = (seed * 1664525 + 1013904223) >>> 0;

    return seed / 4294967296;
}


/* =========================================================
   ANT CREATION
   ========================================================= */

function createAnt(x,z){

    ants.push({
        x:x,
        z:z,
        size:2.0,
        caught:false,
        phase:random()*10
    });
}


/*
   Exactly 15 ants.
*/

createAnt(12,-18);
createAnt(-18,-30);
createAnt(27,-42);
createAnt(-35,-55);
createAnt(50,-20);

createAnt(-60,15);
createAnt(-35,35);
createAnt(15,40);
createAnt(48,48);
createAnt(75,25);

createAnt(-80,70);
createAnt(-25,85);
createAnt(35,90);
createAnt(85,75);
createAnt(110,35);


/* =========================================================
   TREES
   ========================================================= */

for(let i=0;i<95;i++){

    const angle = random()*Math.PI*2;
    const distance = 35 + random()*330;

    trees.push({
        x:Math.cos(angle)*distance,
        z:Math.sin(angle)*distance,
        size:1.4+random()*1.8,
        type:random()
    });
}


/* =========================================================
   ROCKS
   ========================================================= */

for(let i=0;i<65;i++){

    const angle = random()*Math.PI*2;
    const distance = 25+random()*340;

    rocks.push({
        x:Math.cos(angle)*distance,
        z:Math.sin(angle)*distance,
        size:.5+random()*1.1
    });
}


/* =========================================================
   ANIMALS
   ========================================================= */

animals.push({
    type:"deer",
    x:35,
    z:-5,
    size:7,
    direction:1,
    speed:2
});

animals.push({
    type:"deer",
    x:-55,
    z:45,
    size:8,
    direction:-1,
    speed:1.5
});

animals.push({
    type:"elephant",
    x:70,
    z:-70,
    size:13,
    direction:1,
    speed:1.1
});

animals.push({
    type:"elephant",
    x:-95,
    z:-30,
    size:14,
    direction:-1,
    speed:1
});


/* =========================================================
   PROJECTION
   ========================================================= */

function project(x,y,z){

    const dx = x-player.x;
    const dz = z-player.z;

    const cos = Math.cos(player.yaw);
    const sin = Math.sin(player.yaw);

    /*
       Camera forward:
       positive transformed Z = in front
    */

    const cameraX =
        dx*cos - dz*sin;

    const cameraZ =
        dx*sin + dz*cos;

    if(cameraZ <= 0.2){
        return null;
    }

    const scale = FOV / cameraZ;

    return {
        x:W/2 + cameraX*scale,
        y:H*0.53 - y*scale,
        scale:scale,
        depth:cameraZ
    };
}


/* =========================================================
   SKY
   ========================================================= */

function drawSky(){

    const gradient =
        ctx.createLinearGradient(
            0,0,0,H*.6
        );

    gradient.addColorStop(
        0,
        "#55bfe8"
    );

    gradient.addColorStop(
        1,
        "#b9e6f1"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,0,W,H
    );
}


/* =========================================================
   GROUND
   ========================================================= */

function drawGround(){

    const horizon = H*.53;

    ctx.fillStyle="#4c8e3b";

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );


    /*
       Perspective ground lines.
    */

    ctx.strokeStyle="#6fae51";
    ctx.globalAlpha=.35;
    ctx.lineWidth=1;

    for(let i=1;i<14;i++){

        const p =
            i/14;

        const y =
            horizon +
            Math.pow(p,1.7)*(H-horizon);

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();
    }

    ctx.globalAlpha=1;
}


/* =========================================================
   TREE
   ========================================================= */

function drawTree(tree){

    const base =
        project(
            tree.x,
            0,
            tree.z
        );

    if(!base) return;

    if(base.x<-200 ||
       base.x>W+200 ||
       base.y<-300 ||
       base.y>H+200) return;

    const s =
        tree.size*base.scale;

    if(s<2) return;


    /*
       shadow
    */

    ctx.fillStyle="#183b1c99";

    ctx.beginPath();

    ctx.ellipse(
        base.x,
        base.y+3,
        s*.75,
        s*.22,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       trunk
    */

    const top =
        project(
            tree.x,
            tree.size*5,
            tree.z
        );

    if(!top) return;

    ctx.fillStyle="#65422c";

    ctx.fillRect(
        base.x-s*.18,
        top.y,
        s*.36,
        base.y-top.y
    );


    /*
       foliage
    */

    let leaf="#237538";

    if(tree.type<.3){
        leaf="#17652d";
    }

    if(tree.type>.8){
        leaf="#3e963e";
    }

    ctx.fillStyle=leaf;

    ctx.beginPath();

    ctx.moveTo(
        top.x,
        top.y-s*1.1
    );

    ctx.lineTo(
        top.x-s*.9,
        top.y+s*.2
    );

    ctx.lineTo(
        top.x+s*.9,
        top.y+s*.2
    );

    ctx.closePath();

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
        top.x,
        top.y-s*.5
    );

    ctx.lineTo(
        top.x-s*1.15,
        top.y+s*.65
    );

    ctx.lineTo(
        top.x+s*1.15,
        top.y+s*.65
    );

    ctx.closePath();

    ctx.fill();
}


/* =========================================================
   ROCK
   ========================================================= */

function drawRock(rock){

    const p =
        project(
            rock.x,
            rock.size,
            rock.z
        );

    if(!p) return;

    const s =
        rock.size*p.scale;

    if(s<1) return;

    ctx.fillStyle="#777d76";

    ctx.beginPath();

    ctx.ellipse(
        p.x,
        p.y,
        s,
        s*.6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================================================
   ANT
   ========================================================= */

function drawAnt(ant,time){

    if(ant.caught) return;

    const bob =
        Math.sin(
            time*.005+ant.phase
        )*.12;

    const base =
        project(
            ant.x,
            0,
            ant.z
        );

    if(!base) return;

    const body =
        project(
            ant.x,
            ant.size*1.4+bob,
            ant.z
        );

    if(!body) return;

    const s =
        ant.size*body.scale;

    if(s<2) return;

    /*
       shadow
    */

    ctx.fillStyle="#18251a99";

    ctx.beginPath();

    ctx.ellipse(
        base.x,
        base.y+3,
        s*1.4,
        s*.38,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       legs
    */

    ctx.strokeStyle="#3b2418";
    ctx.lineWidth=Math.max(2,s*.13);
    ctx.lineCap="round";

    for(let i=-1;i<=1;i++){

        const yy =
            body.y + i*s*.25;

        ctx.beginPath();

        ctx.moveTo(
            body.x-s*.15,
            yy
        );

        ctx.lineTo(
            body.x-s*1.15,
            yy+s*.45
        );

        ctx.moveTo(
            body.x+s*.15,
            yy
        );

        ctx.lineTo(
            body.x+s*1.15,
            yy+s*.45
        );

        ctx.stroke();
    }


    /*
       abdomen
    */

    ctx.fillStyle="#5b3322";

    ctx.beginPath();

    ctx.ellipse(
        body.x,
        body.y,
        s*1.05,
        s*.55,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       thorax
    */

    ctx.fillStyle="#7b4930";

    ctx.beginPath();

    ctx.arc(
        body.x-s*.75,
        body.y,
        s*.45,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       head
    */

    ctx.fillStyle="#382116";

    ctx.beginPath();

    ctx.arc(
        body.x-s*1.2,
        body.y-s*.05,
        s*.32,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       antennae
    */

    ctx.strokeStyle="#382116";
    ctx.lineWidth=Math.max(1,s*.07);

    ctx.beginPath();

    ctx.moveTo(
        body.x-s*1.35,
        body.y-s*.25
    );

    ctx.lineTo(
        body.x-s*1.9,
        body.y-s*.9
    );

    ctx.moveTo(
        body.x-s*1.2,
        body.y-s*.25
    );

    ctx.lineTo(
        body.x-s*1.45,
        body.y-s*1
    );

    ctx.stroke();
}


/* =========================================================
   ANIMALS
   ========================================================= */

function drawAnimal(animal){

    const p =
        project(
            animal.x,
            0,
            animal.z
        );

    if(!p) return;

    const s =
        animal.size*p.scale;

    if(s<2) return;


    /*
       large shadow
    */

    ctx.fillStyle="#17251a99";

    ctx.beginPath();

    ctx.ellipse(
        p.x,
        p.y+4,
        s*1.5,
        s*.5,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    if(animal.type==="deer"){

        const body =
            project(
                animal.x,
                animal.size*1.25,
                animal.z
            );

        if(!body) return;

        ctx.fillStyle="#9a623b";

        ctx.beginPath();

        ctx.ellipse(
            body.x,
            body.y,
            s*1.35,
            s*.55,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();


        /*
           legs
        */

        ctx.strokeStyle="#704326";
        ctx.lineWidth=Math.max(2,s*.13);

        for(let i=-1;i<=1;i+=2){

            ctx.beginPath();

            ctx.moveTo(
                body.x+i*s*.55,
                body.y+s*.35
            );

            ctx.lineTo(
                body.x+i*s*.55,
                body.y+s*1.4
            );

            ctx.stroke();
        }


        /*
           neck and head
        */

        ctx.strokeStyle="#9a623b";
        ctx.lineWidth=s*.3;

        ctx.beginPath();

        ctx.moveTo(
            body.x-s*.75,
            body.y
        );

        ctx.lineTo(
            body.x-s*1.15,
            body.y-s*.9
        );

        ctx.stroke();


        ctx.fillStyle="#9a623b";

        ctx.beginPath();

        ctx.arc(
            body.x-s*1.25,
            body.y-s*1,
            s*.4,
            0,
            Math.PI*2
        );

        ctx.fill();


    }else{

        /*
           elephant
        */

        const body =
            project(
                animal.x,
                animal.size*1.1,
                animal.z
            );

        if(!body) return;

        ctx.fillStyle="#777b7d";

        ctx.beginPath();

        ctx.ellipse(
            body.x,
            body.y,
            s*1.45,
            s*.85,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();


        /*
           legs
        */

        ctx.strokeStyle="#666a6c";
        ctx.lineWidth=s*.28;

        for(let i=-1;i<=1;i+=2){

            ctx.beginPath();

            ctx.moveTo(
                body.x+i*s*.7,
                body.y+s*.45
            );

            ctx.lineTo(
                body.x+i*s*.7,
                body.y+s*1.45
            );

            ctx.stroke();
        }


        /*
           head
        */

        ctx.fillStyle="#777b7d";

        ctx.beginPath();

        ctx.arc(
            body.x-s*1.15,
            body.y-s*.1,
            s*.65,
            0,
            Math.PI*2
        );

        ctx.fill();


        /*
           trunk
        */

        ctx.strokeStyle="#777b7d";
        ctx.lineWidth=s*.22;

        ctx.beginPath();

        ctx.moveTo(
            body.x-s*1.55,
            body.y
        );

        ctx.lineTo(
            body.x-s*2.05,
            body.y+s*.65
        );

        ctx.stroke();
    }
}


/* =========================================================
   RENDER ALL OBJECTS IN DEPTH ORDER
   ========================================================= */

function drawWorld(time){

    const renderables=[];

    for(const tree of trees){

        const dx=tree.x-player.x;
        const dz=tree.z-player.z;

        const depth=
            dx*Math.sin(player.yaw)
            +
            dz*Math.cos(player.yaw);

        renderables.push({
            depth:depth,
            draw:()=>drawTree(tree)
