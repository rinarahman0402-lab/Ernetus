<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mantis Adventure 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#6bc7e8;font-family:Arial;touch-action:none}canvas{width:100%;height:100%;display:block}
#start{position:fixed;inset:0;z-index:5;background:linear-gradient(#55c4e9,#4d9950);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px}
#start h1{font-size:clamp(35px,9vw,65px);margin:10px}#start p{max-width:550px;font-size:18px;line-height:1.5}
#play,#again{border:0;border-radius:18px;padding:17px 32px;font-size:21px;font-weight:bold;background:#f4d35e;color:#173b1b}
#hud{position:fixed;top:10px;left:10px;right:10px;z-index:3;display:flex;justify-content:space-between;color:white;font-weight:bold}
.panel{background:#0009;padding:9px 12px;border-radius:14px}
#controls{position:fixed;bottom:12px;left:12px;width:230px;height:160px;z-index:4}
.b{position:absolute;width:72px;height:54px;border:2px solid #fff7;border-radius:15px;background:#17251ddd;color:white;font-weight:bold;font-size:11px;touch-action:none}
#f{left:79px;top:0}#b{left:79px;bottom:0}#l{left:0;top:54px}#r{right:0;top:54px}
.b:active{background:#4d8b4d;transform:scale(.95)}
#msg{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);background:#000c;color:white;padding:10px 16px;border-radius:16px;display:none;font-weight:bold}
#done{position:fixed;inset:0;z-index:6;background:#000c;color:white;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div class="panel">MANTIS ADVENTURE 3D</div><div class="panel">ANTS: <span id="n">0</span> / 15</div></div>
<div id="controls"><button class="b" id="f">FORWARD</button><button class="b" id="b">BACK</button><button class="b" id="l">TURN LEFT</button><button class="b" id="r">TURN RIGHT</button></div>
<div id="msg"></div>
<div id="done"><h1>15 ANTS CAUGHT!</h1><p>You completed Mantis Adventure.</p><button id="again">PLAY AGAIN</button></div>
<div id="start"><div style="font-size:70px">🦗</div><h1>Mantis Adventure 3D</h1><p>You are a mantis in a giant forest. Explore and catch 15 ants.</p><button id="play">PLAY GAME</button></div>
<script>
"use strict";
const c=document.getElementById("c"),x=c.getContext("2d"),n=document.getElementById("n"),start=document.getElementById("start"),done=document.getElementById("done"),msg=document.getElementById("msg");
let W=innerWidth,H=innerHeight,d=1;
function size(){W=innerWidth;H=innerHeight;d=Math.min(devicePixelRatio||1,1.5);c.width=W*d;c.height=H*d;c.style.width=W+"px";c.style.height=H+"px";x.setTransform(d,0,0,d,0,0)}addEventListener("resize",size);size();
const p={x:0,y:0,a:0,s:95},q={f:false,b:false,l:false,r:false};let ants=[],got=0,run=false,last=0,seed=1234567;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function reset(){ants=[];for(let i=0;i<15;i++){let a=rnd()*6.283,R=180+i*75+rnd()*650;ants.push({x:Math.cos(a)*R,y:Math.sin(a)*R,z:false})}got=0;n.textContent="0";p.x=0;p.y=0;p.a=0}
reset();
function hold(id,k){let e=document.getElementById(id);let on=v=>z=>{z.preventDefault();q[k]=v};e.addEventListener("pointerdown",on(true));["pointerup","pointercancel","pointerleave"].forEach(t=>e.addEventListener(t,on(false)))}hold("f","f");hold("b","b");hold("l","l");hold("r","r");
addEventListener("keydown",e=>{if(e.key==="ArrowUp")q.f=true;if(e.key==="ArrowDown")q.b=true;if(e.key==="ArrowLeft")q.l=true;if(e.key==="ArrowRight")q.r=true});
addEventListener("keyup",e=>{if(e.key==="ArrowUp")q.f=false;if(e.key==="ArrowDown")q.b=false;if(e.key==="ArrowLeft")q.l=false;if(e.key==="ArrowRight")q.r=false});
function say(t){msg.textContent=t;msg.style.display="block";clearTimeout(say.t);say.t=setTimeout(()=>msg.style.display="none",1200)}
function proj(X,Y){let dx=X-p.x,dy=Y-p.y,co=Math.cos(p.a),si=Math.sin(p.a),fw=dx*co+dy*si,sd=-dx*si+dy*co;if(fw<12)return null;let sc=560/fw;return{x:W/2+sd*sc,y:H*.55,sc,fw}}
function sky(){let g=x.createLinearGradient(0,0,0,H*.55);g.addColorStop(0,"#62c9ed");g.addColorStop(1,"#d8f0f3");x.fillStyle=g;x.fillRect(0,0,W,H)}
function ground(){x.fillStyle="#4d9845";x.fillRect(0,H*.55,W,H*.45);x.strokeStyle="#3d8439";x.globalAlpha=.3;for(let i=0;i<12;i++){let y=H*.55+Math.pow(i/11,1.7)*H*.45;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}x.globalAlpha=1}
function tree(X,Y,S){let v=proj(X,Y);if(!v)return;let s=S*v.sc;if(s<2)return;x.fillStyle="#24512788";x.beginPath();x.ellipse(v.x,v.y,s,s*.2,0,0,6.283);x.fill();x.fillStyle="#66452e";x.fillRect(v.x-s*.15,v.y-s*3,s*.3,s*3);x.fillStyle="#28743b";[[-.7,-2.8,.7],[.7,-2.8,.7],[0,-3.3,1]].forEach(a=>{x.beginPath();x.arc(v.x+s*a[0],v.y+s*a[1],s*a[2],0,6.283);x.fill()})}
function rock(X,Y,S){let v=proj(X,Y);if(!v)return;let s=S*v.sc;if(s<2)return;x.fillStyle="#737b72";x.beginPath();x.ellipse(v.x,v.y,s,s*.5,0,0,6.283);x.fill()}
function ant(a){let v=proj(a.x,a.y);if(!v)return;let s=Math.max(2,10*v.sc);if(s<2)return;x.save();x.translate(v.x,v.y);x.fillStyle="#21150f";x.beginPath();x.ellipse(-s*.65,0,s*.65,s*.5,0,0,6.283);x.fill();x.beginPath();x.arc(s*.15,0,s*.45,0,6.283);x.fill();x.beginPath();x.arc(s*.65,0,s*.38,0,6.283);x.fill();x.strokeStyle="#21150f";x.lineWidth=Math.max(1,s*.12);for(let i=-1;i<2;i++){x.beginPath();x.moveTo(i*s*.2,0);x.lineTo(i*s*.55,-s*.65);x.stroke();x.beginPath();x.moveTo(i*s*.2,0);x.lineTo(i*s*.55,s*.65);x.stroke()}x.restore()}
function mantis(){x.strokeStyle="#398743";x.lineWidth=9;x.lineCap="round";x.beginPath();x.moveTo(W*.18,H-25);x.quadraticCurveTo(W*.25,H*.72,W*.34,H*.84);x.stroke();x.beginPath();x.moveTo(W*.82,H-25);x.quadraticCurveTo(W*.75,H*.72,W*.66,H*.84);x.stroke()}
function objects(){let a=[];for(let i=-8;i<=8;i++)for(let j=1;j<9;j++){let X=i*150,Y=j*170+(i&1)*70,dx=X-p.x,dy=Y-p.y,fw=dx*Math.cos(p.a)+dy*Math.sin(p.a);if(fw>15)a.push({X,Y,fw})}a.sort((A,B)=>B.fw-A.fw);a.forEach(o=>Math.abs(o.X+o.Y)%3<2?tree(o.X,o.Y,38):rock(o.X,o.Y,24));ants.filter(a=>!a.z).map(a=>{let dx=a.x-p.x,dy=a.y-p.y;return{a,fw:dx*Math.cos(p.a)+dy*Math.sin(p.a)}}).filter(v=>v.fw>12).sort((A,B)=>B.fw-A.fw).forEach(v=>ant(v.a))}
function update(dt){if(q.l)p.a-=2.2*dt;if(q.r)p.a+=2.2*dt;let z=(q.f?1:0)-(q.b?1:0);p.x+=Math.cos(p.a)*p.s*z*dt;p.y+=Math.sin(p.a)*p.s*z*dt;ants.forEach(a=>{if(!a.z&&Math.hypot(a.x-p.x,a.y-p.y)<42){a.z=true;got++;n.textContent=got;say("Ant caught! "+got+" / 15");if(got===15){run=false;done.style.display="flex"}}})}
function draw(){sky();ground();objects();mantis()}
function loop(t){if(!run)return;let dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
document.getElementById("play").addEventListener("click",()=>{start.style.display="none";done.style.display="none";reset();run=true;last=performance.now();draw();requestAnimationFrame(loop)});
document.getElementById("again").addEventListener("click",()=>{done.style.display="none";reset();run=true;last=performance.now();requestAnimationFrame(loop)});
</script></body></html>
