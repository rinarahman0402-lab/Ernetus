
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mantis Adventure 3D</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#73bde5;
  font-family:Arial,sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#start,
#win{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:25px;
  color:white;
}

#start{
  background:
    linear-gradient(
      #4caed8 0%,
      #77c96b 55%,
      #275c2d 100%
    );
}

#win{
  display:none;
  background:
    linear-gradient(
      #e9bd4b,
      #478d45
    );
}

.title{
  font-size:clamp(38px,10vw,68px);
  font-weight:900;
  text-shadow:3px 4px 0 #173b20;
}

.subtitle{
  max-width:650px;
  font-size:18px;
  line-height:1.5;
}

#playButton,
#againButton{
  margin-top:22px;
  border:0;
  border-radius:20px;
  padding:18px 34px;
  background:#ffd447;
  color:#17351d;
  font-size:21px;
  font-weight:900;
}

#playButton:active,
#againButton:active{
  transform:scale(.94);
}

#hud{
  display:none;
  position:fixed;
  z-index:10;
  top:10px;
  left:10px;
  right:10px;
  justify-content:space-between;
  gap:8px;
  pointer-events:none;
}

.info{
  background:#102016dd;
  color:white;
  padding:10px 14px;
  border-radius:14px;
  font-weight:bold;
}

#controls{
  display:none;
  position:fixed;
  z-index:11;
  left:10px;
  bottom:10px;
  width:280px;
  height:190px;
}

.control{
  position:absolute;
  width:88px;
  height:58px;
  border:2px solid #ffffff88;
  border-radius:17px;
  background:#102016dd;
  color:white;
  font-size:11px;
  font-weight:900;
}

.control:active{
  background:#4c9149;
  transform:scale(.94);
}

#forward{
  left:96px;
  top:0;
}

#back{
  left:96px;
  bottom:0;
}

#left{
  left:0;
  top:65px;
}

#right{
  right:0;
  top:65px;
}

#catchButton{
  display:none;
  position:fixed;
  z-index:12;
  right:15px;
  bottom:35px;
  border:0;
  border-radius:20px;
  padding:20px;
  background:#ffd447;
  color:#17351d;
  font-size:16px;
  font-weight:900;
}

#message{
  display:none;
  position:fixed;
  z-index:15;
  top:75px;
  left:50%;
  transform:translateX(-50%);
  background:#102016ee;
  color:white;
  padding:13px 18px;
  border-radius:16px;
  font-weight:bold;
  text-align:center;
}

#danger{
  display:none;
  position:fixed;
  z-index:13;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:#a62525dd;
  color:white;
  padding:10px 18px;
  border-radius:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<!-- START SCREEN -->
<div id="start">

  <div style="font-size:90px">🦗</div>

  <div class="title">
    MANTIS ADVENTURE 3D
  </div>

  <div class="subtitle">
    You are a tiny mantis in a gigantic forest.
    Catch all <b>15 ants</b> while avoiding giant
    animals.
  </div>

  <button id="playButton">
    PLAY GAME
  </button>

</div>


<!-- WIN SCREEN -->
<div id="win">

  <div style="font-size:90px">🏆</div>

  <div class="title">
    15 ANTS CAUGHT!
  </div>

  <div class="subtitle">
    You completed Mantis Adventure!
  </div>

  <button id="againButton">
    PLAY AGAIN
  </button>

</div>


<!-- HUD -->
<div id="hud">

  <div class="info">
    ANTS:
    <span id="antCount">0 / 15</span>
  </div>

  <div class="info">
    MANTIS ADVENTURE
  </div>

</div>


<!-- CONTROLS -->
<div id="controls">

  <button class="control" id="forward">
    MOVE FORWARD
  </button>

  <button class="control" id="back">
    MOVE BACK
  </button>

  <button class="control" id="left">
    TURN LEFT
  </button>

  <button class="control" id="right">
    TURN RIGHT
  </button>

</div>


<button id="catchButton">
  CATCH ANT
</button>

<div id="danger">
  GIANT ANIMAL NEARBY!
</div>

<div id="message"></div>


<script>

const canvas =
  document.getElementById("gameCanvas");

const ctx =
  canvas.getContext("2d");


let width=innerWidth;
let height=innerHeight;

let playing=false;

let antsCaught=0;

let player={
  x:0,
  z:20,
  angle:0
};

const keys={
  forward:false,
  back:false,
  left:false,
  right:false
};

let ants=[];
let trees=[];
let animals=[];


/* =========================================
   RESIZE
========================================= */

function resize(){

  width=innerWidth;
  height=innerHeight;

  const dpr=
    Math.min(
      devicePixelRatio || 1,
      2
    );

  canvas.width=
    width*dpr;

  canvas.height=
    height*dpr;

  canvas.style.width=
    width+"px";

  canvas.style.height=
    height+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );
}

addEventListener(
  "resize",
  resize
);

resize();


/* =========================================
   RANDOM
========================================= */

function random(min,max){
  return min+
    Math.random()*(max-min);
}


/* =========================================
   CREATE WORLD
========================================= */

function createWorld(){

  ants=[];
  trees=[];
  animals=[];

  antsCaught=0;

  player.x=0;
  player.z=20;
  player.angle=0;


  /* 15 ANTS */

  for(let i=0;i<15;i++){

    let x,z;

    do{

      x=random(-70,70);
      z=random(-90,5);

    }while(
      Math.hypot(x,z-player.z)<15
    );

    ants.push({
      x:x,
      z:z,
      alive:true,
      bob:Math.random()*6
    });
  }


  /* TREES */

  for(let i=0;i<65;i++){

    const x=random(-100,100);
    const z=random(-100,100);

    if(
      Math.abs(x)<12 &&
      Math.abs(z)<12
    ) continue;

    trees.push({
      x:x,
      z:z,
      size:random(.8,1.5)
    });
  }


  /* DEER */

  for(let i=0;i<4;i++){

    animals.push({
      type:"deer",
      x:random(-70,70),
      z:random(-70,0),
      angle:random(0,Math.PI*2),
      speed:random(1.2,2)
    });
  }


  /* ELEPHANTS */

  for(let i=0;i<2;i++){

    animals.push({
      type:"elephant",
      x:random(-60,60),
      z:random(-70,-20),
      angle:random(0,Math.PI*2),
      speed:.7
    });
  }


  updateCount();
}


/* =========================================
   WORLD TO SCREEN
   Simple perspective projection
========================================= */

function project(x,z,size){

  const dx=x-player.x;
  const dz=z-player.z;

  /*
    Rotate world according to
    the direction the mantis faces.
  */

  const sin=Math.sin(player.angle);
  const cos=Math.cos(player.angle);

  const forward=
    -dx*sin+
    -dz*cos;

  const side=
    dx*cos+
    -dz*sin;


  if(forward<=1)
    return null;


  const scale=
    430/forward;


  return {

    x:
      width/2+
      side*scale,

    y:
      height*.50+
      150*scale,

    size:
      size*scale,

    depth:forward
  };
}


/* =========================================
   DRAW TREE
========================================= */

function drawTree(tree){

  const p=
    project(
      tree.x,
      tree.z,
      tree.size
    );

  if(!p)
    return;


  if(
    p.x<-100 ||
    p.x>width+100
  )
    return;


  /* trunk */

  ctx.fillStyle="#633a1c";

  ctx.fillRect(
    p.x-p.size*.18,
    p.y-p.size*2.5,
    p.size*.36,
    p.size*2.5
  );


  /* leaves */

  ctx.fillStyle="#19652b";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y-p.size*2.8,
    p.size*1.35,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#2c8b39";

  ctx.beginPath();

  ctx.arc(
    p.x-p.size*.55,
    p.y-p.size*3.1,
    p.size*.9,
    0,
    Math.PI*2
  );

  ctx.fill();

}


/* =========================================
   DRAW ANT
========================================= */

function drawAnt(ant){

  if(!ant.alive)
    return;


  const p=
    project(
      ant.x,
      ant.z,
      1
    );

  if(!p)
    return;


  const s=
    Math.max(
      4,
      Math.min(
        30,
        p.size
      )
    );


  ctx.save();

  ctx.translate(
    p.x,
    p.y
  );


  /* body */

  ctx.fillStyle="#17100c";

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    s*.65,
    s*.35,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* head */

  ctx.beginPath();

  ctx.arc(
    s*.65,
    0,
    s*.35,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* legs */

  ctx.strokeStyle="#120c08";

  ctx.lineWidth=
    Math.max(1,s*.10);


  for(let i=-1;i<=1;i++){

    ctx.beginPath();

    ctx.moveTo(
      i*s*.25,
      -s*.2
    );

    ctx.lineTo(
      i*s*.7,
      -s*.55
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
      i*s*.25,
      s*.2
    );

    ctx.lineTo(
      i*s*.7,
      s*.55
    );

    ctx.stroke();

  }


  ctx.restore();

}


/* =========================================
   DRAW ANIMALS
========================================= */

function drawAnimal(a){

  const p=
    project(
      a.x,
      a.z,
      a.type==="elephant"
      ? 8
      : 5
    );

  if(!p)
    return;


  const s=
    Math.max(
      8,
      Math.min(
        90,
        p.size
      )
    );


  ctx.save();

  ctx.translate(
    p.x,
    p.y
  );


  if(a.type==="elephant"){

    ctx.fillStyle="#72777b";

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      s*1.1,
      s*.7,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
      0,
      -s*.55,
      s*.6,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillRect(
      -s*.65,
      s*.35,
      s*.25,
      s*.75
    );

    ctx.fillRect(
      -s*.15,
      s*.35,
      s*.25,
      s*.75
    );

    ctx.fillRect(
      s*.35,
      s*.35,
      s*.25,
      s*.75
    );


  }else{

    ctx.fillStyle="#7a4a21";

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      s,
      s*.55,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
      0,
      -s*.55,
      s*.42,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillRect(
      -s*.65,
      s*.35,
      s*.18,
      s*.8
    );

    ctx.fillRect(
      -s*.15,
      s*.35,
      s*.18,
      s*.8
    );

    ctx.fillRect(
      s*.35,
      s*.35,
      s*.18,
      s*.8
    );

  }


  ctx.restore();

}


/* =========================================
   DRAW GROUND
========================================= */

function drawGround(){

  const gradient=
    ctx.createLinearGradient(
      0,
      0,
      0,
      height
    );

  gradient.addColorStop(
    0,
    "#8bd0ed"
  );

  gradient.addColorStop(
    .48,
    "#5fae50"
  );

  gradient.addColorStop(
    1,
    "#285b2c"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  /* ground perspective lines */

  ctx.strokeStyle="#ffffff20";

  ctx.lineWidth=1;


  for(let i=0;i<12;i++){

    const y=
      height*.55+
      i*i*8;

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      width,
      y
    );

    ctx.stroke();

  }

}


/* =========================================
   DRAW PLAYER MANTIS
========================================= */

function drawPlayer(){

  const x=
    width/2;

  const y=
    height*.62;


  ctx.save();

  ctx.translate(
    x,
    y
  );


  /* body */

  ctx.fillStyle="#2b8d43";

  ctx.beginPath();

  ctx.ellipse(
    0,
    18,
    18,
    35,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* head */

  ctx.fillStyle="#47a94d";

  ctx.beginPath();

  ctx.ellipse(
    0,
    -25,
    24,
    19,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* eyes */

  ctx.fillStyle="#101610";

  ctx.beginPath();

  ctx.arc(
    -9,
    -28,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    9,
    -28,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* arms */

  ctx.strokeStyle="#28783b";

  ctx.lineWidth=7;

  ctx.beginPath();

  ctx.moveTo(
    -13,
    0
  );

  ctx.lineTo(
    -34,
    -20
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    13,
    0
  );

  ctx.lineTo(
    34,
    -20
  );

  ctx.stroke();


  /* legs */

  ctx.lineWidth=6;

  ctx.beginPath();

  ctx.moveTo(
    -10,
    40
  );

  ctx.lineTo(
    -28,
    60
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    10,
    40
  );

  ctx.lineTo(
    28,
    60
  );

  ctx.stroke();


  ctx.restore();

}


/* =========================================
   UPDATE ANIMALS
========================================= */

function updateAnimals(dt){

  let danger=false;


  for(const a of animals){

    a.x +=
      Math.sin(a.angle)*
      a.speed*
      dt;

    a.z +=
      -Math.cos(a.angle)*
      a.speed*
      dt;


    if(
      Math.abs(a.x)>90 ||
      Math.abs(a.z)>90
    ){

      a.angle+=Math.PI;

    }


    const distance=
      Math.hypot(
        a.x-player.x,
        a.z-player.z
      );


    if(distance<10){

      danger=true;

      player.x +=
        (player.x-a.x)*
        .01;

      player.z +=
        (player.z-a.z)*
        .01;

    }

  }


  document.getElementById(
    "danger"
  ).style.display=
    danger
    ? "block"
    : "none";

}


/* =========================================
   MOVEMENT
========================================= */

function updatePlayer(dt){

  const moveSpeed=
    8*dt;

  const turnSpeed=
    2.5*dt;


  /* LEFT = LEFT */

  if(keys.left){

    player.angle -=
      turnSpeed;

  }


  /* RIGHT = RIGHT */

  if(keys.right){

    player.angle +=
      turnSpeed;

  }


  if(keys.forward){

    player.x +=
      Math.sin(player.angle)*
      moveSpeed;

    player.z +=
      -Math.cos(player.angle)*
      moveSpeed;

  }


  if(keys.back){

    player.x -=
      Math.sin(player.angle)*
      moveSpeed;

    player.z -=
      -Math.cos(player.angle)*
      moveSpeed;

  }


  player.x=
    Math.max(
      -95,
      Math.min(
        95,
        player.x
      )
    );

  player.z=
    Math.max(
      -95,
      Math.min(
        95,
        player.z
      )
    );

}


/* =========================================
   FIND NEAREST ANT
========================================= */

function nearestAnt(){

  let best=null;
  let distance=9999;


  for(const ant of ants){

    if(!ant.alive)
      continue;


    const d=
      Math.hypot(
        ant.x-player.x,
        ant.z-player.z
      );


    if(d<distance){

      distance=d;
      best=ant;

    }

  }


  return {
    ant:best,
    distance:distance
  };

}


/* =========================================
   CATCH ANT
========================================= */

document
.getElementById("catchButton")
.addEventListener(
  "click",
  function(){

    if(!playing)
      return;


    const n=
      nearestAnt();


    if(!n.ant){

      return;

    }


    if(n.distance>7){

      showMessage(
        "Move closer to the ant!"
      );

      return;

    }


    n.ant.alive=false;

    antsCaught++;


    updateCount();


    showMessage(
      "ANT CAUGHT! "+
      antsCaught+
      " / 15"
    );


    if(antsCaught>=15){

      setTimeout(
        winGame,
        700
      );

    }

  }
);


/* =========================================
   UPDATE CATCH BUTTON
========================================= */

function updateCatchButton(){

  const n=
    nearestAnt();


  document.getElementById(
    "catchButton"
  ).style.display=
    n.ant &&
    n.distance<7
    ? "block"
    : "none";

}


/* =========================================
   COUNT
========================================= */

function updateCount(){

  document.getElementById(
    "antCount"
  ).textContent=
    antsCaught+
    " / 15";

}


/* =========================================
   MESSAGE
========================================= */

let messageTimer;

function showMessage(text){

  const box=
    document.getElementById(
      "message"
    );

  box.textContent=text;

  box.style.display="block";

  clearTimeout(
    messageTimer
  );

  messageTimer=
    setTimeout(
      function(){

        box.style.display="none";

      },
      1600
    );

}


/* =========================================
   CONTROLS
========================================= */

function holdButton(
  id,
  key
){

  const button=
    document.getElementById(id);


  button.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      keys[key]=true;

      button.setPointerCapture(
        e.pointerId
      );

    }
  );


  button.addEventListener(
    "pointerup",
    function(e){

      e.preventDefault();

      keys[key]=false;

    }
  );


  button.addEventListener(
    "pointercancel",
    function(){

      keys[key]=false;

    }
  );


  button.addEventListener(
    "lostpointercapture",
    function(){

      keys[key]=false;

    }
  );

}


holdButton(
  "forward",
  "forward"
);

holdButton(
  "back",
  "back"
);

holdButton(
  "left",
  "left"
);

holdButton(
  "right",
  "right"
);


/* =========================================
   KEYBOARD
========================================= */

addEventListener(
  "keydown",
  function(e){

    if(e.key==="ArrowUp")
      keys.forward=true;

    if(e.key==="ArrowDown")
      keys.back=true;

    if(e.key==="ArrowLeft")
      keys.left=true;

    if(e.key==="ArrowRight")
      keys.right=true;

  }
);


addEventListener(
  "keyup",
  function(e){

    if(e.key==="ArrowUp")
      keys.forward=false;

    if(e.key==="ArrowDown")
      keys.back=false;

    if(e.key==="ArrowLeft")
      keys.left=false;

    if(e.key==="ArrowRight")
      keys.right=false;

  }
);


/* =========================================
   RENDER
========================================= */

let lastTime=0;


function gameLoop(time){

  const dt=
    Math.min(
      .04,
      (time-lastTime)/1000
    );

  lastTime=time;


  if(playing){

    updatePlayer(dt);

    updateAnimals(dt);

    updateCatchButton();

    drawGround();


    /*
      Draw distant objects first.
      This gives the scene a
      perspective/3D appearance.
    */

    const things=[];


    for(
      const tree of trees
    ){

      things.push({
        depth:
          Math.hypot(
            tree.x-player.x,
            tree.z-player.z
          ),
        draw:
          function(){
            drawTree(tree);
          }
      });

    }


    for(
      const ant of ants
    ){

      if(ant.alive){

        things.push({
          depth:
            Math.hypot(
              ant.x-player.x,
              ant.z-player.z
            ),
          draw:
            function(){
              drawAnt(ant);
            }
        });

      }

    }


    for(
      const animal of animals
    ){

      things.push({
        depth:
          Math.hypot(
            animal.x-player.x,
            animal.z-player.z
          ),
        draw:
          function(){
            drawAnimal(animal);
          }
      });

    }


    things.sort(
      (a,b)=>
        b.depth-a.depth
    );


    for(
      const thing of things
    ){

      thing.draw();

    }


    drawPlayer();

  }


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================
   THE IMPORTANT PLAY BUTTON
========================================= */

document
.getElementById("playButton")
.addEventListener(
  "click",
  function(){

    /*
      This directly starts the game.
      No external library.
      No loading screen.
    */

    createWorld();

    playing=true;
