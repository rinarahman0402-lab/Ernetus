<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Mantis Adventure</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#79bce0;
  font-family:Arial,sans-serif;
}

#game{
  display:block;
  width:100vw;
  height:100vh;
  touch-action:none;
}

#title{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  font-size:22px;
  font-weight:bold;
  text-shadow:2px 2px 4px #16452c;
  z-index:5;
  pointer-events:none;
}

#info{
  position:fixed;
  top:45px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  font-size:14px;
  text-shadow:1px 1px 3px #16452c;
  z-index:5;
  pointer-events:none;
}

.controls{
  position:fixed;
  bottom:22px;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 22px;
  z-index:10;
  pointer-events:none;
}

.leftControls{
  display:flex;
  gap:12px;
}

button{
  width:72px;
  height:72px;
  border:3px solid white;
  border-radius:50%;
  background:rgba(25,70,45,.78);
  color:white;
  font-size:30px;
  font-weight:bold;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

button:active{
  background:rgba(65,150,90,.95);
  transform:scale(.94);
}

#restart{
  position:fixed;
  top:80px;
  right:15px;
  width:auto;
  height:45px;
  padding:0 18px;
  border-radius:22px;
  font-size:16px;
  display:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="title">🌿 Mantis Adventure</div>
<div id="info">Collect the glowing fireflies!</div>

<div class="controls">
  <div class="leftControls">
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <button id="jump">▲</button>
</div>

<button id="restart">Play Again</button>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
  W=innerWidth;
  H=innerHeight;
  canvas.width=W;
  canvas.height=H;
}

addEventListener("resize",resize);
resize();

/* ---------------- GAME STATE ---------------- */

const world={
  width:5000,
  ground:0
};

let cameraX=0;
let score=0;
let won=false;

const player={
  x:160,
  y:300,
  w:48,
  h:55,
  vx:0,
  vy:0,
  speed:4.5,
  jump:-12,
  grounded:false
};

const keys={
  left:false,
  right:false,
  jump:false
};

/* ---------------- PLATFORMS ---------------- */

const platforms=[
  {x:0,y:430,w:900,h:100},
  {x:1030,y:400,w:500,h:130},
  {x:1660,y:440,w:700,h:90},
  {x:2490,y:370,w:500,h:160},
  {x:3100,y:430,w:650,h:100},
  {x:3900,y:350,w:600,h:180},
  {x:4600,y:430,w:400,h:100}
];

/* ---------------- FIREFLIES ---------------- */

const fireflies=[
  {x:350,y:350,taken:false},
  {x:650,y:300,taken:false},
  {x:1180,y:320,taken:false},
  {x:1400,y:330,taken:false},
  {x:1900,y:370,taken:false},
  {x:2200,y:350,taken:false},
  {x:2630,y:300,taken:false},
  {x:2860,y:300,taken:false},
  {x:3300,y:360,taken:false},
  {x:3500,y:350,taken:false},
  {x:4100,y:290,taken:false},
  {x:4350,y:290,taken:false}
];

/* ---------------- DECORATION ---------------- */

const trees=[];

for(let x=100;x<5000;x+=180){
  trees.push({
    x:x+Math.random()*60,
    h:80+Math.random()*80
  });
}

const clouds=[];

for(let i=0;i<20;i++){
  clouds.push({
    x:Math.random()*5000,
    y:50+Math.random()*150,
    s:.7+Math.random()*.8
  });
}

/* ---------------- INPUT ---------------- */

function holdButton(id,property){
  const b=document.getElementById(id);

  const down=e=>{
    e.preventDefault();
    keys[property]=true;
  };

  const up=e=>{
    e.preventDefault();
    keys[property]=false;
  };

  b.addEventListener("pointerdown",down);
  b.addEventListener("pointerup",up);
  b.addEventListener("pointercancel",up);
  b.addEventListener("pointerleave",up);
}

holdButton("left","left");
holdButton("right","right");

document.getElementById("jump").addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys.jump=true;
});

document.getElementById("jump").addEventListener("pointerup",e=>{
  e.preventDefault();
  keys.jump=false;
});

addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
  if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
  if(e.key==="ArrowUp"||e.key==="w"||e.key===" ")keys.jump=true;
});

addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
  if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
  if(e.key==="ArrowUp"||e.key==="w"||e.key===" ")keys.jump=false;
});

/* ---------------- PHYSICS ---------------- */

function update(){

  if(won)return;

  if(keys.left)player.vx=-player.speed;
  else if(keys.right)player.vx=player.speed;
  else player.vx*=.78;

  if(keys.jump && player.grounded){
    player.vy=player.jump;
    player.grounded=false;
  }

  player.vy+=.55;

  player.x+=player.vx;
  player.y+=player.vy;

  if(player.x<0)player.x=0;
  if(player.x>world.width-player.w)
    player.x=world.width-player.w;

  player.grounded=false;

  for(const p of platforms){

    const hitX=
      player.x+player.w>p.x &&
      player.x<p.x+p.w;

    const hitY=
      player.y+player.h<=p.y+12 &&
      player.y+player.h+player.vy>=p.y;

    if(hitX&&hitY&&player.vy>=0){
      player.y=p.y-player.h;
      player.vy=0;
      player.grounded=true;
    }
  }

  /* Collect fireflies */

  for(const f of fireflies){

    if(f.taken)continue;

    const dx=player.x+player.w/2-f.x;
    const dy=player.y+player.h/2-f.y;

    if(Math.hypot(dx,dy)<42){
      f.taken=true;
      score++;
    }
  }

  /* Falling */

  if(player.y>H+300){
    player.x=160;
    player.y=250;
    player.vx=0;
    player.vy=0;
    cameraX=0;
  }

  /* Camera */

  cameraX=player.x-W*.35;

  if(cameraX<0)cameraX=0;

  if(cameraX>world.width-W)
    cameraX=world.width-W;

  /* Win */

  if(player.x>4700){
    won=true;
    document.getElementById("restart").style.display="block";
  }
}

/* ---------------- DRAWING ---------------- */

function drawSky(){

  const g=ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#55a9dc");
  g.addColorStop(.55,"#8ed5e7");
  g.addColorStop(1,"#d4f0c0");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}

function drawCloud(c){

  const x=c.x-cameraX*.25;
  const y=c.y;
  const s=c.s;

  ctx.fillStyle="rgba(255,255,255,.82)";

  ctx.beginPath();
  ctx.arc(x,y,25*s,0,Math.PI*2);
  ctx.arc(x+28*s,y-12*s,32*s,0,Math.PI*2);
  ctx.arc(x+60*s,y,24*s,0,Math.PI*2);
  ctx.fill();
}

function drawTree(t){

  const x=t.x-cameraX;
  const ground=480;
  const h=t.h;

  if(x<-100||x>W+100)return;

  /* trunk */

  ctx.fillStyle="#70452b";
  ctx.fillRect(x-10,ground-h*.55,20,h*.55);

  /* leaves */

  ctx.fillStyle="#247a3b";

  ctx.beginPath();
  ctx.arc(x,ground-h,45,0,Math.PI*2);
  ctx.arc(x-35,ground-h+25,35,0,Math.PI*2);
  ctx.arc(x+35,ground-h+25,35,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#3e9b45";
  ctx.beginPath();
  ctx.arc(x,ground-h-15,25,0,Math.PI*2);
  ctx.fill();
}

function drawPlatforms(){

  for(const p of platforms){

    const x=p.x-cameraX;

    if(x+p.w<0||x>W)continue;

    /* soil */

    ctx.fillStyle="#6b472c";
    ctx.fillRect(x,p.y,p.w,p.h);

    /* grass */

    ctx.fillStyle="#3f9b45";
    ctx.fillRect(x,p.y,p.w,14);

    /* little grass blades */

    ctx.strokeStyle="#75bd4a";
    ctx.lineWidth=3;

    for(let i=0;i<p.w;i+=25){
      ctx.beginPath();
      ctx.moveTo(x+i,p.y+13);
      ctx.lineTo(x+i+5,p.y+5);
      ctx.stroke();
    }
  }
}

function drawFirefly(f){

  if(f.taken)return;

  const x=f.x-cameraX;
  const y=f.y;

  const pulse=
    8+Math.sin(Date.now()/180+f.x)*3;

  ctx.fillStyle="rgba(255,239,90,.18)";
  ctx.beginPath();
  ctx.arc(x,y,pulse*2.2,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#fff56b";
  ctx.beginPath();
  ctx.arc(x,y,6,0,Math.PI*2);
  ctx.fill();
}

function drawMantis(){

  const x=player.x-cameraX;
  const y=player.y;

  ctx.save();

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.18)";
  ctx.beginPath();
  ctx.ellipse(x+24,y+player.h+5,27,7,0,0,Math.PI*2);
  ctx.fill();

  /* body */

  ctx.fillStyle="#5a9e35";
  ctx.beginPath();
  ctx.ellipse(x+25,y+34,19,25,0,0,Math.PI*2);
  ctx.fill();

  /* head */

  ctx.fillStyle="#74bd42";
  ctx.beginPath();
  ctx.arc(x+25,y+10,17,0,Math.PI*2);
  ctx.fill();

  /* eyes */

  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(x+18,y+7,4,0,Math.PI*2);
  ctx.arc(x+32,y+7,4,0,Math.PI*2);
  ctx.fill();

  /* antennae */

  ctx.strokeStyle="#477b2e";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(x+18,y-3);
  ctx.quadraticCurveTo(x+5,y-25,x-2,y-18);
  ctx.moveTo(x+32,y-3);
  ctx.quadraticCurveTo(x+45,y-25,x+52,y-18);
  ctx.stroke();

  /* arms */

  ctx.strokeStyle="#477b2e";
  ctx.lineWidth=6;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(x+10,y+28);
  ctx.lineTo(x-5,y+18);
  ctx.lineTo(x-12,y+27);

  ctx.moveTo(x+40,y+28);
  ctx.lineTo(x+55,y+18);
  ctx.lineTo(x+62,y+27);

  ctx.stroke();

  /* legs */

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(x+15,y+48);
  ctx.lineTo(x+2,y+60);
  ctx.lineTo(x-5,y+60);

  ctx.moveTo(x+35,y+48);
  ctx.lineTo(x+48,y+60);
  ctx.lineTo(x+55,y+60);

  ctx.stroke();

  ctx.restore();
}

function drawHUD(){

  ctx.fillStyle="rgba(15,50,35,.72)";
  ctx.fillRect(12,85,190,45);

  ctx.fillStyle="white";
  ctx.font="bold 18px Arial";
  ctx.fillText("✨ Fireflies: "+score+" / "+fireflies.length,25,114);
}

function drawWin(){

  if(!won)return;

  ctx.fillStyle="rgba(5,35,25,.82)";
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle="#fff";
  ctx.textAlign="center";

  ctx.font="bold 42px Arial";
  ctx.fillText("🌿 Adventure Complete!",W/2,H/2-45);

  ctx.font="22px Arial";
  ctx.fillText(
    "You collected "+score+" fireflies!",
    W/2,H/2+5
  );

  ctx.font="18px Arial";
  ctx.fillText(
    "You reached the end of the jungle.",
    W/2,H/2+42
  );

  ctx.textAlign="left";
}

/* ---------------- MAIN LOOP ---------------- */

function draw(){

  drawSky();

  for(const c of clouds)drawCloud(c);

  for(const t of trees)drawTree(t);

  drawPlatforms();

  for(const f of fireflies)drawFirefly(f);

  drawMantis();

  drawHUD();

  drawWin();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

/* ---------------- RESTART ---------------- */

document.getElementById("restart").addEventListener("click",()=>{
  player.x=160;
  player.y=250;
  player.vx=0;
  player.vy=0;
  cameraX=0;
  score=0;
  won=false;

  for(const f of fireflies)f.taken=false;

  document.getElementById("restart").style.display="none";
});

/* START */

loop();
</script>

</body>
</html>
