
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mantis Adventure 3D</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#79c8e8}
canvas{position:fixed;inset:0;width:100%;height:100%}

#start,#win{
 position:fixed;inset:0;z-index:50;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 text-align:center;padding:24px;color:white
}
#start{background:linear-gradient(#68c5ea,#78c963 55%,#315f32)}
#win{display:none;background:#173d21ee}

.title{font-size:clamp(38px,10vw,70px);font-weight:900;text-shadow:4px 4px #234d2a}
.subtitle{max-width:650px;font-size:18px;line-height:1.5}

.bigButton{
 margin-top:20px;border:0;border-radius:20px;
 padding:18px 34px;background:#ffd447;
 color:#18351d;font-size:21px;font-weight:900
}
.bigButton:active{transform:scale(.94)}

#hud{
 display:none;position:fixed;z-index:20;top:10px;left:10px;right:10px;
 justify-content:space-between;gap:8px;pointer-events:none
}
.info{
 background:#112016dd;color:white;padding:10px 14px;
 border-radius:14px;font-weight:bold
}

#controls{
 display:none;position:fixed;z-index:30;
 left:10px;bottom:10px;width:285px;height:185px
}
.move{
 position:absolute;width:88px;height:58px;
 border:2px solid #ffffff77;border-radius:17px;
 background:#112016dd;color:white;font-size:10px;font-weight:900
}
.move:active{background:#438d46;transform:scale(.93)}
#forward{left:98px;top:0}
#back{left:98px;bottom:0}
#left{left:0;top:63px}
#right{right:0;top:63px}

#catch{
 display:none;position:fixed;z-index:30;
 right:14px;bottom:30px;width:125px;min-height:60px;
 border:0;border-radius:18px;background:#ffd447;
 color:#18351d;font-size:13px;font-weight:900
}

#message{
 display:none;position:fixed;z-index:40;
 top:80px;left:50%;transform:translateX(-50%);
 background:#112016ee;color:white;padding:12px 18px;
 border-radius:15px;font-weight:bold;text-align:center
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="start">
 <div style="font-size:90px">🦗</div>
 <div class="title">MANTIS ADVENTURE 3D</div>
 <p class="subtitle">
   You are a tiny mantis in a gigantic forest.
   Catch all <b>15 ants</b> and avoid the giant animals!
 </p>
 <button class="bigButton" id="playButton">PLAY GAME</button>
</div>

<div id="win">
 <div style="font-size:85px">🏆</div>
 <div class="title">15 ANTS CAUGHT!</div>
 <p class="subtitle">You completed Mantis Adventure!</p>
 <button class="bigButton" id="againButton">PLAY AGAIN</button>
</div>

<div id="hud">
 <div class="info">ANTS: <span id="count">0 / 15</span></div>
 <div class="info">MANTIS ADVENTURE</div>
</div>

<div id="controls">
 <button class="move" id="forward">MOVE FORWARD</button>
 <button class="move" id="back">MOVE BACK</button>
 <button class="move" id="left">TURN LEFT</button>
 <button class="move" id="right">TURN RIGHT</button>
</div>

<button id="catch">CATCH ANT</button>
<div id="message"></div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight;
let playing=false;
let caught=0;

const player={
 x:0,
 z:35,
 angle:0
};

const keys={
 forward:false,
 back:false,
 left:false,
 right:false
};

let ants=[];
let trees=[];
let animals=[];

function resize(){
 W=innerWidth;
 H=innerHeight;

 const dpr=Math.min(devicePixelRatio||1,2);

 canvas.width=W*dpr;
 canvas.height=H*dpr;
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";

 ctx.setTransform(dpr,0,0,dpr,0,0);
}

resize();
addEventListener("resize",resize);

function random(a,b){
 return a+Math.random()*(b-a);
}

/* ---------- WORLD ---------- */

function createWorld(){

 caught=0;

 player.x=0;
 player.z=35;
 player.angle=0;

 ants=[];
 trees=[];
 animals=[];

 for(let i=0;i<15;i++){

  let x,z;

  do{
   x=random(-80,80);
   z=random(-105,-10);
  }while(Math.hypot(x,z-player.z)<18);

  ants.push({
   x:x,
   z:z,
   alive:true
  });
 }

 for(let i=0;i<70;i++){

  trees.push({
   x:random(-105,105),
   z:random(-110,100),
   size:random(.7,1.5)
  });
 }

 for(let i=0;i<5;i++){

  animals.push({
   type:i<3?"deer":"elephant",
   x:random(-80,80),
   z:random(-90,0),
   angle:random(0,Math.PI*2),
   speed:i<3?1.5:.7
  });
 }

 updateCount();
}

/* ---------- 3D PROJECTION ---------- */

function project(x,z,size){

 const dx=x-player.x;
 const dz=z-player.z;

 const sin=Math.sin(player.angle);
 const cos=Math.cos(player.angle);

 const forward=-dx*sin-dz*cos;
 const side=dx*cos-dz*sin;

 if(forward<=1)return null;

 const scale=440/forward;

 return{
  x:W/2+side*scale,
  y:H*.49+145*scale,
  size:Math.max(2,size*scale),
  depth:forward
 };
}

/* ---------- GROUND ---------- */

function drawGround(){

 const gradient=ctx.createLinearGradient(0,0,0,H);

 gradient.addColorStop(0,"#79cceb");
 gradient.addColorStop(.48,"#5eaa4e");
 gradient.addColorStop(1,"#28562c");

 ctx.fillStyle=gradient;
 ctx.fillRect(0,0,W,H);

 ctx.strokeStyle="#ffffff20";

 for(let i=0;i<13;i++){

  const y=H*.53+i*i*8;

  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(W,y);
  ctx.stroke();
 }
}

/* ---------- TREES ---------- */

function drawTree(o){

 const p=project(o.x,o.z,o.size);
 if(!p)return;

 ctx.fillStyle="#633b1d";

 ctx.fillRect(
  p.x-p.size*.18,
  p.y-p.size*2.5,
  p.size*.36,
  p.size*2.5
 );

 ctx.fillStyle="#237637";

 ctx.beginPath();
 ctx.arc(
  p.x,
  p.y-p.size*2.8,
  p.size*1.35,
  0,
  Math.PI*2
 );
 ctx.fill();

 ctx.fillStyle="#329344";

 ctx.beginPath();
 ctx.arc(
  p.x-p.size*.55,
  p.y-p.size*3.1,
  p.size*.85,
  0,
  Math.PI*2
 );
 ctx.fill();
}

/* ---------- ANTS ---------- */

function drawAnt(a){

 if(!a.alive)return;

 const p=project(a.x,a.z,1);
 if(!p)return;

 const s=Math.max(4,Math.min(30,p.size));

 ctx.save();
 ctx.translate(p.x,p.y);

 ctx.fillStyle="#17100c";

 ctx.beginPath();
 ctx.ellipse(0,0,s*.7,s*.4,0,0,Math.PI*2);
 ctx.fill();

 ctx.beginPath();
 ctx.arc(s*.65,0,s*.4,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle="#17100c";
 ctx.lineWidth=Math.max(1,s*.1);

 for(let i=-1;i<=1;i++){

  ctx.beginPath();
  ctx.moveTo(i*s*.25,-s*.2);
  ctx.lineTo(i*s*.7,-s*.55);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(i*s*.25,s*.2);
  ctx.lineTo(i*s*.7,s*.55);
  ctx.stroke();
 }

 ctx.restore();
}

/* ---------- GIANT ANIMALS ---------- */

function drawAnimal(a){

 const p=project(
  a.x,
  a.z,
  a.type==="elephant"?8:5
 );

 if(!p)return;

 const s=Math.max(8,Math.min(95,p.size));

 ctx.save();
 ctx.translate(p.x,p.y);

 if(a.type==="elephant"){

  ctx.fillStyle="#74797c";

  ctx.beginPath();
  ctx.ellipse(0,0,s*1.1,s*.65,0,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0,-s*.55,s*.58,0,Math.PI*2);
  ctx.fill();

  ctx.fillRect(-s*.65,s*.3,s*.23,s*.8);
  ctx.fillRect(-s*.15,s*.3,s*.23,s*.8);
  ctx.fillRect(s*.35,s*.3,s*.23,s*.8);

 }else{

  ctx.fillStyle="#794a22";

  ctx.beginPath();
  ctx.ellipse(0,0,s,s*.52,0,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0,-s*.55,s*.4,0,Math.PI*2);
  ctx.fill();

  ctx.fillRect(-s*.6,s*.3,s*.17,s*.75);
  ctx.fillRect(-s*.15,s*.3,s*.17,s*.75);
  ctx.fillRect(s*.3,s*.3,s*.17,s*.75);
 }

 ctx.restore();
}

/* ---------- MANTIS ---------- */

function drawMantis(){

 const x=W/2;
 const y=H*.65;

 ctx.save();
 ctx.translate(x,y);

 /* body */
 ctx.fillStyle="#2b8d43";

 ctx.beginPath();
 ctx.ellipse(0,18,17,34,0,0,Math.PI*2);
 ctx.fill();

 /* head */
 ctx.fillStyle="#49a94f";

 ctx.beginPath();
 ctx.ellipse(0,-25,23,18,0,0,Math.PI*2);
 ctx.fill();

 /* eyes */
 ctx.fillStyle="#101610";

 ctx.beginPath();
 ctx.arc(-9,-28,4,0,Math.PI*2);
 ctx.fill();

 ctx.beginPath();
 ctx.arc(9,-28,4,0,Math.PI*2);
 ctx.fill();

 /* arms */
 ctx.strokeStyle="#27773a";
 ctx.lineWidth=7;

 ctx.beginPath();
 ctx.moveTo(-12,0);
 ctx.lineTo(-34,-22);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(12,0);
 ctx.lineTo(34,-22);
 ctx.stroke();

 /* legs */
 ctx.lineWidth=6;

 ctx.beginPath();
 ctx.moveTo(-10,40);
 ctx.lineTo(-28,60);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(10,40);
 ctx.lineTo(28,60);
 ctx.stroke();

 ctx.restore();
}

/* ---------- FIND NEAREST ANT ---------- */

function nearestAnt(){

 let best=null;
 let distance=Infinity;

 for(const a of ants){

  if(!a.alive)continue;

  const d=Math.hypot(
   a.x-player.x,
   a.z-player.z
  );

  if(d<distance){
   distance=d;
   best=a;
  }
 }

 return{
  ant:best,
  distance:distance
 };
}

/* ---------- CATCH ---------- */

document.getElementById("catch")
.addEventListener("click",function(){

 if(!playing)return;

 const n=nearestAnt();

 if(!n.ant)return;

 if(n.distance>8){

  showMessage("Move closer to the ant!");

  return;
 }

 n.ant.alive=false;

 caught++;

 updateCount();

 showMessage(
  "ANT CAUGHT! "+caught+" / 15"
 );

 if(caught>=15){

  setTimeout(winGame,500);
 }
});

/* ---------- CATCH BUTTON ---------- */

function updateCatchButton(){

 const n=nearestAnt();

 document.getElementById("catch").style.display=
  n.ant && n.distance<8
  ? "block"
  : "none";
}

/* ---------- MOVEMENT ---------- */

function updatePlayer(dt){

 const speed=9*dt;
 const turn=2.5*dt;

 /* LEFT IS LEFT */
 if(keys.left)
  player.angle-=turn;

 /* RIGHT IS RIGHT */
 if(keys.right)
  player.angle+=turn;

 if(keys.forward){

  player.x+=
   Math.sin(player.angle)*speed;

  player.z+=
   -Math.cos(player.angle)*speed;
 }

 if(keys.back){

  player.x-=
   Math.sin(player.angle)*speed;

  player.z-=
   -Math.cos(player.angle)*speed;
 }

 player.x=Math.max(-105,Math.min(105,player.x));
 player.z=Math.max(-110,Math.min(100,player.z));
}

/* ---------- ANIMAL MOVEMENT ---------- */

function updateAnimals(dt){

 for(const a of animals){

  a.x+=
   Math.sin(a.angle)*
   a.speed*
   dt;

  a.z+=
   -Math.cos(a.angle)*
   a.speed*
   dt;

  if(Math.abs(a.x)>105||Math.abs(a.z)>105)
   a.angle+=Math.PI;
 }
}

/* ---------- RENDER ---------- */

function drawWorld(){

 drawGround();

 const things=[];

 for(const t of trees){

  things.push({
   depth:Math.hypot(
    t.x-player.x,
    t.z-player.z
   ),
   draw:()=>drawTree(t)
  });
 }

 for(const a of ants){

  if(a.alive){

   things.push({
    depth:Math.hypot(
     a.x-player.x,
     a.z-player.z
    ),
    draw:()=>drawAnt(a)
   });
  }
 }

 for(const a of animals){

  things.push({
   depth:Math.hypot(
    a.x-player.x,
    a.z-player.z
   ),
   draw:()=>drawAnimal(a)
  });
 }

 things.sort(
  (a,b)=>b.depth-a.depth
 );

 for(const t of things)
  t.draw();

 drawMantis();
}

/* ---------- COUNT ---------- */

function updateCount(){

 document.getElementById("count")
 .textContent=caught+" / 15";
}

/* ---------- MESSAGE ---------- */

let messageTimer=null;

function showMessage(text){

 const box=document.getElementById("message");

 box.textContent=text;
 box.style.display="block";

 clearTimeout(messageTimer);

 messageTimer=setTimeout(()=>{
  box.style.display="none";
 },1800);
}

/* ---------- TOUCH CONTROLS ---------- */

function holdButton(id,key){

 const button=document.getElementById(id);

 button.addEventListener(
  "pointerdown",
  function(e){

   e.preventDefault();

   keys[key]=true;

   button.setPointerCapture(e.pointerId);
  }
 );

 function stop(){
  keys[key]=false;
 }

 button.addEventListener("pointerup",stop);
 button.addEventListener("pointercancel",stop);
 button.addEventListener("lostpointercapture",stop);
}

holdButton("forward","forward");
holdButton("back","back");
holdButton("left","left");
holdButton("right","right");

/* ---------- KEYBOARD ---------- */

addEventListener("keydown",function(e){

 if(e.key==="ArrowUp")
  keys.forward=true;

 if(e.key==="ArrowDown")
  keys.back=true;

 if(e.key==="ArrowLeft")
  keys.left=true;

 if(e.key==="ArrowRight")
  keys.right=true;
});

addEventListener("keyup",function(e){

 if(e.key==="ArrowUp")
  keys.forward=false;

 if(e.key==="ArrowDown")
  keys.back=false;

 if(e.key==="ArrowLeft")
  keys.left=false;

 if(e.key==="ArrowRight")
  keys.right=false;
});

/* ---------- START BUTTON ---------- */

document.getElementById("playButton")
.addEventListener("click",function(){

 /*
   IMPORTANT:
   The game starts DIRECTLY here.
   No loading screen.
   No external library.
 */

 createWorld();

 playing=true;

 document.getElementById("start")
 .style.display="none";

 document.getElementById("hud")
 .style.display="flex";

 document.getElementById("controls")
 .style.display="block";

 showMessage(
  "Catch all 15 ants!"
 );
});

/* ---------- PLAY AGAIN ---------- */

document.getElementById("againButton")
.addEventListener("click",function(){

 document.getElementById("win")
 .style.display="none";

 createWorld();

 playing=true;

 document.getElementById("hud")
 .style.display="flex";

 document.getElementById("controls")
 .style.display="block";

});

/* ---------- WIN ---------- */

function winGame(){

 playing=false;

 document.getElementById("hud")
 .style.display="none";

 document.getElementById("controls")
 .style.display="none";

 document.getElementById("catch")
 .style.display="none";

 document.getElementById("win")
 .style.display="flex";
}

/* ---------- GAME LOOP ---------- */

let last=0;

function gameLoop(time){

 const dt=
  Math.min(
   .04,
   last ? (time-last)/1000 : 0
  );

 last=time;

 if(playing){

  updatePlayer(dt);
  updateAnimals(dt);
  updateCatchButton();
  drawWorld();
 }

 requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

</script>
</body>
</html>
```
