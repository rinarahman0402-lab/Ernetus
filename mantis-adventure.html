
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mantis Adventure 3D</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#76c95b;
font-family:Arial,sans-serif;
touch-action:none;
}

#game{
position:fixed;
inset:0;
}

#loading{
position:fixed;
inset:0;
z-index:20;
background:linear-gradient(#79d2ff,#3c8438);
color:white;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}

#loading h1{
font-size:34px;
}

#bar{
width:240px;
height:12px;
background:rgba(255,255,255,.3);
border-radius:20px;
overflow:hidden;
}

#fill{
width:20%;
height:100%;
background:white;
}

#ui{
position:fixed;
inset:0;
z-index:10;
pointer-events:none;
color:white;
text-shadow:0 2px 4px black;
}

#title{
position:absolute;
top:12px;
left:50%;
transform:translateX(-50%);
font-size:23px;
font-weight:bold;
}

#count{
position:absolute;
top:50px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,.5);
padding:8px 15px;
border-radius:20px;
font-weight:bold;
}

#controls{
position:absolute;
left:15px;
bottom:15px;
width:170px;
height:170px;
pointer-events:auto;
}

.move{
position:absolute;
width:55px;
height:55px;
border:0;
border-radius:15px;
background:rgba(0,0,0,.55);
color:white;
font-size:25px;
font-weight:bold;
}

#up{left:57px;top:0}
#left{left:0;top:57px}
#down{left:57px;top:57px}
#right{left:114px;top:57px}

#look{
position:absolute;
right:18px;
bottom:25px;
width:120px;
height:120px;
border-radius:50%;
border:2px solid rgba(255,255,255,.4);
background:rgba(0,0,0,.15);
display:flex;
align-items:center;
justify-content:center;
text-align:center;
pointer-events:auto;
}

#message{
position:absolute;
bottom:165px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,.7);
padding:10px 16px;
border-radius:15px;
display:none;
}

#win{
position:fixed;
inset:0;
z-index:30;
background:rgba(10,30,10,.9);
color:white;
display:none;
align-items:center;
justify-content:center;
text-align:center;
}

#win button{
padding:15px 25px;
font-size:18px;
font-weight:bold;
border:0;
border-radius:14px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
<h1>🦗 Mantis Adventure 3D</h1>
<p id="loadText">Loading the garden...</p>
<div id="bar"><div id="fill"></div></div>
</div>

<div id="ui">

<div id="title">🦗 Mantis Adventure 3D</div>

<div id="count">
🐜 Ants: <span id="antCount">0</span>/15
</div>

<div id="controls">
<button class="move" id="up">▲</button>
<button class="move" id="left">◀</button>
<button class="move" id="down">▼</button>
<button class="move" id="right">▶</button>
</div>

<div id="look">
DRAG<br>TO LOOK
</div>

<div id="message"></div>

</div>

<div id="win">
<div>
<div style="font-size:80px">🎉</div>
<h1>All 15 Ants Found!</h1>
<p>You completed Mantis Adventure!</p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>
</div>


<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script>

/* ==========================
CHECK THREE.JS
========================== */

if(typeof THREE==="undefined"){

document.getElementById("loadText").textContent=
"3D engine could not load. Please refresh.";

throw new Error("Three.js failed to load");

}


/* ==========================
SCENE
========================== */

const scene=
new THREE.Scene();

scene.background=
new THREE.Color(0x78d2ff);

scene.fog=
new THREE.Fog(
0x78d2ff,
35,
100
);


/* ==========================
CAMERA
========================== */

const camera=
new THREE.PerspectiveCamera(
65,
innerWidth/innerHeight,
0.1,
150
);


/* ==========================
RENDERER
========================== */

const renderer=
new THREE.WebGLRenderer({
antialias:false,
powerPreference:"low-power"
});

renderer.setPixelRatio(
Math.min(devicePixelRatio,1.5)
);

renderer.setSize(
innerWidth,
innerHeight
);

document
.getElementById("game")
.appendChild(renderer.domElement);


/* ==========================
LIGHT
========================== */

const sunlight=
new THREE.DirectionalLight(
0xffffff,
2
);

sunlight.position.set(
10,20,10
);

scene.add(sunlight);


scene.add(
new THREE.HemisphereLight(
0xccefff,
0x315b28,
1.8
)
);


/* ==========================
GROUND
========================== */

const ground=
new THREE.Mesh(
new THREE.PlaneGeometry(90,90),
new THREE.MeshLambertMaterial({
color:0x4c9d3d
})
);

ground.rotation.x=
-Math.PI/2;

scene.add(ground);


/* ==========================
PLANTS
========================== */

const leafMaterial=
new THREE.MeshLambertMaterial({
color:0x277b30
});

const flowerColors=[
0xffe45c,
0xff719c,
0xc78cff,
0xffffff
];

for(let i=0;i<100;i++){

const plant=
new THREE.Mesh(
new THREE.ConeGeometry(
.08,
.3+Math.random()*.7,
5
),
leafMaterial
);

plant.position.set(
(Math.random()-.5)*75,
.25,
(Math.random()-.5)*75
);

scene.add(plant);
}


for(let i=0;i<60;i++){

const flower=
new THREE.Mesh(
new THREE.SphereGeometry(
.07,6,5
),
new THREE.MeshLambertMaterial({
color:
flowerColors[
Math.floor(
Math.random()*flowerColors.length
)
]
})
);

flower.position.set(
(Math.random()-.5)*70,
.08,
(Math.random()-.5)*70
);

scene.add(flower);
}


/* ==========================
ROCKS
========================== */

for(let i=0;i<35;i++){

const rock=
new THREE.Mesh(
new THREE.DodecahedronGeometry(
.25+Math.random()*.5,
0
),
new THREE.MeshLambertMaterial({
color:0x777b72
})
);

rock.position.set(
(Math.random()-.5)*75,
.25,
(Math.random()-.5)*75
);

rock.scale.y=.6;

scene.add(rock);
}


/* ==========================
MANTIS
========================== */

const mantis=
new THREE.Group();

const green=
new THREE.MeshLambertMaterial({
color:0x4d9632
});

const lightGreen=
new THREE.MeshLambertMaterial({
color:0x78bd4c
});

const darkGreen=
new THREE.MeshLambertMaterial({
color:0x245d24
});

const black=
new THREE.MeshLambertMaterial({
color:0x111111
});


/* abdomen */

const abdomen=
new THREE.Mesh(
new THREE.CapsuleGeometry(
.35,1.0,6,10
),
green
);

abdomen.rotation.x=
Math.PI/2;

abdomen.position.set(
0,1.2,.35
);

abdomen.scale.z=1.3;

mantis.add(abdomen);


/* thorax */

const thorax=
new THREE.Mesh(
new THREE.SphereGeometry(
.48,12,10
),
darkGreen
);

thorax.scale.y=1.15;

thorax.position.set(
0,1.35,-.45
);

mantis.add(thorax);


/* head */

const head=
new THREE.Mesh(
new THREE.SphereGeometry(
.42,10,8
),
lightGreen
);

head.scale.set(
1.15,.85,.9
);

head.position.set(
0,1.9,-.9
);

mantis.add(head);


/* eyes */

for(const side of [-1,1]){

const eye=
new THREE.Mesh(
new THREE.SphereGeometry(
.14,8,6
),
black
);

eye.position.set(
side*.24,
1.95,
-1.25
);

mantis.add(eye);
}


/* antennae */

for(const side of [-1,1]){

const antenna=
new THREE.Mesh(
new THREE.CylinderGeometry(
.02,.035,.8,6
),
darkGreen
);

antenna.position.set(
side*.16,
2.25,
-1.05
);

antenna.rotation.z=
side*.25;

antenna.rotation.x=
-.15;

mantis.add(antenna);
}


/* legs */

function makeLeg(
side,
z,
tilt
){

const upper=
new THREE.Mesh(
new THREE.CylinderGeometry(
.045,.07,.9,6
),
darkGreen
);

upper.position.set(
side*.4,
1.0,
z
);

upper.rotation.z=
side*tilt;

mantis.add(upper);


const lower=
new THREE.Mesh(
new THREE.CylinderGeometry(
.035,.05,.85,6
),
green
);

lower.position.set(
side*.8,
.55,
z+.15
);

lower.rotation.z=
side*(tilt*.5);

mantis.add(lower);
}


makeLeg(-1,.05,1);
makeLeg(1,.05,1);

makeLeg(-1,.35,1.15);
makeLeg(1,.35,1.15);

makeLeg(-1,.65,.8);
makeLeg(1,.65,.8);


/* front arms */

function makeArm(side){

const upper=
new THREE.Mesh(
new THREE.CylinderGeometry(
.06,.09,.75,6
),
darkGreen
);

upper.position.set(
side*.45,
1.55,
-.7
);

upper.rotation.z=
side*.8;

mantis.add(upper);


const lower=
new THREE.Mesh(
new THREE.CylinderGeometry(
.045,.065,.7,6
),
green
);

lower.position.set(
side*.75,
1.25,
-1
);

lower.rotation.z=
side*1.1;

mantis.add(lower);
}

makeArm(-1);
makeArm(1);


mantis.position.set(
0,0,5
);

scene.add(mantis);


/* ==========================
ANTS
========================== */

const ants=[];

const antPositions=[
[-8,-7],
[7,-10],
[-13,4],
[11,8],
[-3,-15],
[15,-4],
[-16,-9],
[4,14],
[-10,13],
[16,14],
[-18,2],
[2,-22],
[20,-15],
[-5,22],
[18,22]
];


function createAnt(x,z){

const ant=
new THREE.Group();

const material=
new THREE.MeshLambertMaterial({
color:0x171717
});


const body=
new THREE.Mesh(
new THREE.SphereGeometry(
.18,7,6
),
material
);

body.scale.z=1.3;

ant.add(body);


const head=
new THREE.Mesh(
new THREE.SphereGeometry(
.15,7,6
),
material
);

head.position.z=-.25;

ant.add(head);


for(let i=0;i<3;i++){

for(const side of [-1,1]){

const leg=
new THREE.Mesh(
new THREE.CylinderGeometry(
.015,.025,.35,5
),
material
);

leg.position.set(
side*.18,
.02,
-.15+i*.18
);

leg.rotation.z=
side*1.1;

ant.add(leg);

}
}


ant.position.set(
x,.25,z
);

scene.add(ant);

ants.push({
object:ant,
collected:false
});

}


antPositions.forEach(
p=>createAnt(p[0],p[1])
);


/* ==========================
PLAYER
========================== */

const player={
x:0,
z:5,
rotation:0,
speed:5
};


const keys={
up:false,
down:false,
left:false,
right:false
};


/* ==========================
BUTTONS
========================== */

function control(
id,
key
){

const button=
document.getElementById(id);

button.addEventListener(
"pointerdown",
e=>{
e.preventDefault();
keys[key]=true;
}
);

button.addEventListener(
"pointerup",
e=>{
e.preventDefault();
keys[key]=false;
}
);

button.addEventListener(
"pointercancel",
()=>{
keys[key]=false;
}
);
}

control("up","up");
control("down","down");
control("left","left");
control("right","right");


/* keyboard */

addEventListener(
"keydown",
e=>{

if(e.key==="ArrowUp"||e.key==="w")
keys.up=true;

if(e.key==="ArrowDown"||e.key==="s")
keys.down=true;

if(e.key==="ArrowLeft"||e.key==="a")
keys.left=true;

if(e.key==="ArrowRight"||e.key==="d")
keys.right=true;

}
);


addEventListener(
"keyup",
e=>{

if(e.key==="ArrowUp"||e.key==="w")
keys.up=false;

if(e.key==="ArrowDown"||e.key==="s")
keys.down=false;

if(e.key==="ArrowLeft"||e.key==="a")
keys.left=false;

if(e.key==="ArrowRight"||e.key==="d")
keys.right=false;

}
);


/* ==========================
LOOK
========================== */

const look=
document.getElementById("look");

let looking=false;
let lastX=0;

look.addEventListener(
"pointerdown",
e=>{
looking=true;
lastX=e.clientX;

look.setPointerCapture(
e.pointerId
);
}
);

look.addEventListener(
"pointermove",
e=>{

if(!looking)return;

const dx=
e.clientX-lastX;

player.rotation -=
dx*.008;

lastX=e.clientX;

}
);

look.addEventListener(
"pointerup",
()=>{
looking=false;
}
);


/* ==========================
COLLECTION
========================== */

let collected=0;

const antCounter=
document.getElementById(
"antCount"
);

const message=
document.getElementById(
"message"
);


function say(text){

message.textContent=
text;

message.style.display=
"block";

clearTimeout(
say.timer
);

say.timer=
setTimeout(
()=>{
message.style.display=
"none";
},
1600
);
}


/* ==========================
GAME LOOP
========================== */

let last=
performance.now();


function animate(now){

requestAnimationFrame(
animate
);


const delta=
Math.min(
(now-last)/1000,
.05
);

last=now;


let forward=0;
let sideways=0;

if(keys.up)
forward+=1;

if(keys.down)
forward-=1;


/*
IMPORTANT:
LEFT = negative
RIGHT = positive
*/

if(keys.left)
sideways-=1;

if(keys.right)
sideways+=1;


const length=
Math.hypot(
forward,
sideways
);


if(length>0){

forward/=length;
sideways/=length;


const speed=
player.speed*delta;


const sin=
Math.sin(
player.rotation
);

const cos=
Math.cos(
player.rotation
);


/* correct movement */

player.x +=
(
sideways*cos-
forward*sin
)*speed;

player.z +=
(
sideways*sin+
forward*cos
)*speed;

}


/* boundaries */

player.x=
THREE.MathUtils.clamp(
player.x,-35,35
);

player.z=
THREE.MathUtils.clamp(
player.z,-35,35
);


/* mantis follows player */

mantis.position.x=
player.x;

mantis.position.z=
player.z;

mantis.rotation.y=
player.rotation;


/* camera */

camera.position.x=
player.x-
Math.sin(player.rotation)*7;

camera.position.z=
player.z-
Math.cos(player.rotation)*7;

camera.position.y=3.6;

camera.lookAt(
player.x,
1.2,
player.z
);


/* collect ants */

for(const ant of ants){

if(ant.collected)
continue;

ant.object.rotation.y+=
delta*.8;

const dx=
ant.object.position.x-
player.x;

const dz=
ant.object.position.z-
player.z;


if(
Math.hypot(dx,dz)<1.5
){

ant.collected=true;

ant.object.visible=false;

collected++;

antCounter.textContent=
collected;

say(
"🐜 Ant found! "+
collected+
"/15"
);


if(collected===15){

setTimeout(
()=>{
document.getElementById(
"win"
).style.display="flex";
},
400
);

}

}

}


/* render */

renderer.render(
scene,
camera
);

}


/* ==========================
RESIZE
========================== */

addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

}
);


/* ==========================
START
========================== */

document.getElementById(
"loadText"
).textContent=
"Ready!";

document.getElementById(
"fill"
).style.width="100%";


setTimeout(
()=>{
document.getElementById(
"loading"
).style.display="none";
},
500
);


requestAnimationFrame(
animate
);

</script>

</body>
</html>
```
