<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shield Defender 3D</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }

    h1 { color: #38bdf8; margin-bottom: 5px; }
    #hud { font-size: 1.2rem; color: #facc15; margin-bottom: 15px; font-weight: bold; }

    #canvas-container {
      width: 320px;
      height: 320px;
      border: 4px solid #38bdf8;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 20px;
    }

    .btn {
      background: #38bdf8;
      color: #0b0f19;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:active { background: #7dd3fc; }
  </style>

  <!-- Load 3D Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <h1>🛡️ Shield Defender 3D</h1>
  <div id="hud">Level: <span id="lvl">1 / 3</span> | Blocked: <span id="score">0</span> / 10</div>

  <div id="canvas-container"></div>

  <div class="controls">
    <button class="btn" id="btn-left">⬅️ Rotate Left</button>
    <button class="btn" id="btn-right">Rotate Right ➡️</button>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const lvlText = document.getElementById('lvl');
    const scoreText = document.getElementById('score');

    let currentLevel = 1;
    let blockedCount = 0;
    let shieldAngle = 0; // in radians
    let gameOver = false;
    let missiles = [];

    const levelSettings = [
      { speed: 0.08, spawnRate: 1500 },
      { speed: 0.12, spawnRate: 1100 },
      { speed: 0.16, spawnRate: 800 }
    ];

    // --- 3D SCENE SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 0, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(320, 320);
    container.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xfacc15, 2, 20);
    scene.add(pointLight);

    // 3D Power Core (Yellow Sphere)
    const coreGeo = new THREE.SphereGeometry(1, 32, 32);
    const coreMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xfacc15, emissiveIntensity: 0.5 });
    const core = new THREE.Mesh(coreGeo, coreMat);
    scene.add(core);

    // 3D Shield (Blue Arc Ring)
    const shieldPivot = new THREE.Group();
    scene.add(shieldPivot);

    const shieldGeo = new THREE.RingGeometry(3, 3.5, 32, 1, 0, Math.PI / 2); // 90 degree arc
    const shieldMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide });
    const shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
    shieldMesh.rotation.x = Math.PI / 2; // Flat circle
    shieldMesh.position.y = 0;
    shieldPivot.add(shieldMesh);

    // Rotate Shield Controls
    function rotateShield(delta) {
      if (gameOver) return;
      shieldAngle += delta;
      shieldPivot.rotation.z = shieldAngle;
    }

    function spawnMissile() {
      if (gameOver) return;

      const angle = Math.random() * Math.PI * 2;
      const radius = 10;
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius;

      const mGeo = new THREE.SphereGeometry(0.3, 16, 16);
      const mMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xef4444 });
      const mesh = new THREE.Mesh(mGeo, mMat);
      mesh.position.set(x, y, 0);
      scene.add(mesh);

      missiles.push({ mesh, angle, dist: radius });

      if (blockedCount < 10 && !gameOver) {
        setTimeout(spawnMissile, levelSettings[currentLevel - 1].spawnRate);
      }
    }

    function animate() {
      if (!gameOver) requestAnimationFrame(animate);

      const speed = levelSettings[currentLevel - 1].speed;

      for (let i = missiles.length - 1; i >= 0; i--) {
        const m = missiles[i];
        m.dist -= speed;
        m.mesh.position.x = Math.cos(m.angle) * m.dist;
        m.mesh.position.y = Math.sin(m.angle) * m.dist;

        // Shield Collision Check (Radius ~3.2)
        if (m.dist <= 3.4 && m.dist >= 2.8) {
          let shieldNorm = (shieldPivot.rotation.z % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
          let missileNorm = (m.angle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);

          let diff = Math.abs(shieldNorm - missileNorm);
          if (diff > Math.PI) diff = Math.PI * 2 - diff;

          // Arc length covers ~ 1.2 radians
          if (diff < 0.8) {
            scene.remove(m.mesh);
            missiles.splice(i, 1);
            blockedCount++;
            scoreText.innerText = blockedCount;

            if (blockedCount >= 10) {
              if (currentLevel < 3) {
                currentLevel++;
                resetLevel();
              } else {
                gameOver = true;
                document.getElementById('hud').innerText = "🏆 3D CORE DEFENDED! YOU WIN!";
              }
            }
            continue;
          }
        }

        // Core Collision Check (Radius ~1)
        if (m.dist <= 1) {
          gameOver = true;
          document.getElementById('hud').innerText = "💥 CORE DESTROYED! Refresh to retry.";
          break;
        }
      }

      renderer.render(scene, camera);
    }

    function resetLevel() {
      missiles.forEach(m => scene.remove(m.mesh));
      missiles = [];
      blockedCount = 0;
      lvlText.innerText = `${currentLevel} / 3`;
      scoreText.innerText = blockedCount;
      spawnMissile();
    }

    document.getElementById('btn-left').onclick = () => rotateShield(0.3);
    document.getElementById('btn-right').onclick = () => rotateShield(-0.3);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') rotateShield(0.3);
      if (e.key === 'ArrowRight') rotateShield(-0.3);
    });

    resetLevel();
    animate();
  </script>
</body>
</html>
