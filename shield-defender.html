<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shield Defender</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }

    h1 { color: #38bdf8; margin-bottom: 5px; }
    #hud { font-size: 1.2rem; color: #facc15; margin-bottom: 15px; font-weight: bold; }

    #arena {
      width: 300px;
      height: 300px;
      background: #1e293b;
      border: 4px solid #38bdf8;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    #core {
      width: 30px;
      height: 30px;
      background: #facc15;
      border-radius: 50%;
      position: absolute;
      top: 135px;
      left: 135px;
      box-shadow: 0 0 15px #facc15;
    }

    #shield {
      width: 80px;
      height: 12px;
      background: #38bdf8;
      border-radius: 6px;
      position: absolute;
      top: 144px;
      left: 110px;
      transform-origin: 40px -40px;
      box-shadow: 0 0 10px #38bdf8;
    }

    .missile {
      width: 12px;
      height: 12px;
      background: #ef4444;
      border-radius: 50%;
      position: absolute;
      box-shadow: 0 0 8px #ef4444;
    }
  </style>
</head>
<body>

  <h1>🛡️ Shield Defender</h1>
  <div id="hud">Level: <span id="lvl">1 / 3</span> | Blocked: <span id="score">0</span> / 10</div>

  <div id="arena">
    <div id="core"></div>
    <div id="shield"></div>
  </div>

  <script>
    const arena = document.getElementById('arena');
    const shield = document.getElementById('shield');
    const lvlText = document.getElementById('lvl');
    const scoreText = document.getElementById('score');

    let currentLevel = 1;
    let blockedCount = 0;
    let shieldAngle = 0;
    let gameOver = false;
    let activeMissiles = [];
    let gameLoop = null;

    const levelSettings = [
      { speed: 2, spawnRate: 1500 }, // Level 1
      { speed: 3, spawnRate: 1100 }, // Level 2
      { speed: 4, spawnRate: 800 }   // Level 3
    ];

    // Rotate Shield on Tap/Click
    arena.addEventListener('pointerdown', (e) => {
      if (gameOver) return;
      const rect = arena.getBoundingClientRect();
      const cx = rect.left + 150;
      const cy = rect.top + 150;
      shieldAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI) + 90;
      shield.style.transform = `rotate(${shieldAngle}deg) translateY(-50px)`;
    });

    function spawnMissile() {
      if (gameOver) return;

      const angle = Math.random() * Math.PI * 2;
      const startX = 150 + Math.cos(angle) * 140;
      const startY = 150 + Math.sin(angle) * 140;

      const el = document.createElement('div');
      el.className = 'missile';
      el.style.left = (startX - 6) + 'px';
      el.style.top = (startY - 6) + 'px';
      arena.appendChild(el);

      activeMissiles.push({
        el,
        x: startX,
        y: startY,
        angle
      });

      const delay = levelSettings[currentLevel - 1].spawnRate;
      if (blockedCount < 10 && !gameOver) {
        setTimeout(spawnMissile, delay);
      }
    }

    function updateGame() {
      if (gameOver) return;

      const speed = levelSettings[currentLevel - 1].speed;

      for (let i = activeMissiles.length - 1; i >= 0; i--) {
        const m = activeMissiles[i];
        m.x -= Math.cos(m.angle) * speed;
        m.y -= Math.sin(m.angle) * speed;

        m.el.style.left = (m.x - 6) + 'px';
        m.el.style.top = (m.y - 6) + 'px';

        const distToCenter = Math.hypot(m.x - 150, m.y - 150);

        // Shield Collision Check (~50px radius)
        if (distToCenter <= 55 && distToCenter >= 40) {
          const missileAngleDeg = (Math.atan2(m.y - 150, m.x - 150) * (180 / Math.PI) + 450) % 360;
          const currentShieldDeg = (shieldAngle % 360 + 360) % 360;
          const diff = Math.abs(missileAngleDeg - currentShieldDeg);

          if (diff < 35 || diff > 325) {
            // Blocked!
            m.el.remove();
            activeMissiles.splice(i, 1);
            blockedCount++;
            scoreText.innerText = blockedCount;

            if (blockedCount >= 10) {
              if (currentLevel < 3) {
                currentLevel++;
                startLevel();
              } else {
                gameOver = true;
                document.getElementById('hud').innerText = "🏆 CORE PROTECTED! YOU BEAT GAME 31!";
              }
            }
            continue;
          }
        }

        // Core Collision Check (~15px radius)
        if (distToCenter <= 18) {
          gameOver = true;
          document.getElementById('hud').innerText = "💥 CORE DESTROYED! Refresh to retry.";
          m.el.remove();
          break;
        }
      }

      if (!gameOver) requestAnimationFrame(updateGame);
    }

    function startLevel() {
      blockedCount = 0;
      activeMissiles.forEach(m => m.el.remove());
      activeMissiles = [];
      lvlText.innerText = `${currentLevel} / 3`;
      scoreText.innerText = blockedCount;
      shield.style.transform = `rotate(0deg) translateY(-50px)`;
      shieldAngle = 0;
      spawnMissile();
    }

    startLevel();
    requestAnimationFrame(updateGame);
  </script>
</body>
</html>
