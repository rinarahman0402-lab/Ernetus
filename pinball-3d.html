<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Pinball Arcade</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #020617;
      user-select: none;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #38bdf8;
      font-weight: bold;
      font-size: 1.2rem;
      text-shadow: 0 0 10px #0284c7;
      pointer-events: none;
    }
    #instructions {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: #facc15;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 24px;
      border-radius: 8px;
      pointer-events: none;
      text-align: center;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 15px #0284c7;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">🏆 SCORE: <span id="score">0</span> | ⚽ BALLS LEFT: <span id="balls">3</span></div>
  <div id="instructions">SPACE: Launch Ball | LEFT ARROW / A: Left Flipper | RIGHT ARROW / D: Right Flipper</div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 18, 14);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(10, 25, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x38bdf8, 0.8));

    // Table Container (Tilted)
    const tableGroup = new THREE.Group();
    tableGroup.rotation.x = 0.15; // Slanted table plane
    scene.add(tableGroup);

    // Pinball Surface
    const board = new THREE.Mesh(
      new THREE.BoxGeometry(10, 0.4, 18),
      new THREE.MeshStandardMaterial({ color: 0x1e1b4b, roughness: 0.1 })
    );
    board.position.y = -0.2;
    tableGroup.add(board);

    // Table Walls
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xa855f7 });
    function addWall(x, z, w, d) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 0.8, d), wallMat);
      wall.position.set(x, 0.4, z);
      tableGroup.add(wall);
      return wall;
    }

    addWall(-5, 0, 0.4, 18);  // Left wall
    addWall(5, 0, 0.4, 18);   // Right outer wall
    addWall(3.8, 0, 0.4, 18); // Plunger lane wall
    addWall(0, -9, 10, 0.4);  // Top wall

    // Bumpers (Score Boosters)
    const bumpers = [];
    const bumperMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xb91c1c });

    function createBumper(x, z) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.6, 16), bumperMat);
      mesh.position.set(x, 0.3, z);
      tableGroup.add(mesh);
      bumpers.push({ x, z, mesh });
    }

    createBumper(-1.8, -4);
    createBumper(1.8, -4);
    createBumper(0, -6.5);

    // Flippers
    const flipperGeo = new THREE.BoxGeometry(2.2, 0.5, 0.4);
    const flipperMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7 });

    const leftFlipperPivot = new THREE.Group();
    leftFlipperPivot.position.set(-2.2, 0.3, 6.5);
    const leftFlipperMesh = new THREE.Mesh(flipperGeo, flipperMat);
    leftFlipperMesh.position.x = 1.1;
    leftFlipperPivot.add(leftFlipperMesh);
    tableGroup.add(leftFlipperPivot);

    const rightFlipperPivot = new THREE.Group();
    rightFlipperPivot.position.set(2.2, 0.3, 6.5);
    const rightFlipperMesh = new THREE.Mesh(flipperGeo, flipperMat);
    rightFlipperMesh.position.x = -1.1;
    rightFlipperPivot.add(rightFlipperMesh);
    tableGroup.add(rightFlipperPivot);

    // Pinball Steel Ball
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0xf1f5f9, metalness: 0.9, roughness: 0.1 })
    );
    tableGroup.add(ball);

    // Game Physics State
    let velX = 0, velZ = 0;
    let score = 0;
    let ballsLeft = 3;
    let ballActive = false;

    function resetBall() {
      ball.position.set(4.4, 0.4, 7.5);
      velX = 0;
      velZ = 0;
      ballActive = false;
    }
    resetBall();

    // Input States
    const keys = { left: false, right: false };
    window.addEventListener('keydown', e => {
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
      if (e.key === ' ' && !ballActive && ballsLeft > 0) {
        ballActive = true;
        velZ = -0.42; // Launch Plunger Force
      }
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
    });

    function animate() {
      requestAnimationFrame(animate);

      // Flipper Rotations
      const targetLeftRot = keys.left ? -0.6 : 0.3;
      const targetRightRot = keys.right ? 0.6 : -0.3;
      leftFlipperPivot.rotation.y += (targetLeftRot - leftFlipperPivot.rotation.y) * 0.3;
      rightFlipperPivot.rotation.y += (targetRightRot - rightFlipperPivot.rotation.y) * 0.3;

      if (ballActive) {
        // Gravity down table
        velZ += 0.006;

        // Apply velocities
        ball.position.x += velX;
        ball.position.z += velZ;

        // Plunger Lane Wall Bounce
        if (ball.position.x > 3.4 && ball.position.x < 3.8 && ball.position.z < 6.5) {
          velX = -Math.abs(velX);
        }

        // Side Walls Bounce
        if (ball.position.x < -4.4) { ball.position.x = -4.4; velX = Math.abs(velX) * 0.8; }
        if (ball.position.x > 4.4) { ball.position.x = 4.4; velX = -Math.abs(velX) * 0.8; }

        // Top Wall Bounce
        if (ball.position.z < -8.4) { ball.position.z = -8.4; velZ = Math.abs(velZ) * 0.8; }

        // Bumper Collisions
        bumpers.forEach(b => {
          const dist = Math.hypot(ball.position.x - b.x, ball.position.z - b.z);
          if (dist < 1.2) {
            score += 250;
            document.getElementById('score').innerText = score;

            // Bounce Impulse away from Bumper
            const angle = Math.atan2(ball.position.z - b.z, ball.position.x - b.x);
            velX = Math.cos(angle) * 0.35;
            velZ = Math.sin(angle) * 0.35;
          }
        });

        // Flipper Collisions
        if (ball.position.z >= 6.1 && ball.position.z <= 6.8) {
          // Left Flipper Hit
          if (keys.left && ball.position.x >= -2.2 && ball.position.x <= 0) {
            velZ = -0.35;
            velX = 0.15;
            score += 50;
            document.getElementById('score').innerText = score;
          }
          // Right Flipper Hit
          if (keys.right && ball.position.x >= 0 && ball.position.x <= 2.2) {
            velZ = -0.35;
            velX = -0.15;
            score += 50;
            document.getElementById('score').innerText = score;
          }
        }

        // Drain / Ball Out
        if (ball.position.z > 9) {
          ballsLeft--;
          document.getElementById('balls').innerText = ballsLeft;

          if (ballsLeft <= 0) {
            document.getElementById('instructions').innerText = `🏆 GAME OVER! Milestone Score: ${score}. Reload to play again!`;
            ballActive = false;
          } else {
            resetBall();
          }
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
