<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Princess Doll Dress-Up 3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #fbcfe8; user-select: none; -webkit-user-select: none; touch-action: none;
    }
    #ui {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      text-align: center; color: #be185d; z-index: 10; pointer-events: none; width: 90%;
    }
    #controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 10; width: 95%; max-width: 500px;
      flex-wrap: wrap; justify-content: center;
    }
    .btn {
      background: #f472b6; color: #fff; border: 2px solid #fff;
      padding: 10px 14px; border-radius: 12px; font-weight: bold;
      font-size: 0.85rem; cursor: pointer; box-shadow: 0 4px 10px rgba(190, 24, 93, 0.3);
    }
    .btn:active { transform: scale(0.95); background: #db2777; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">
    <h1 style="margin: 0; font-size: 1.6rem; text-shadow: 0 2px 4px rgba(255,255,255,0.8);">👑 PRINCESS DOLL DRESS-UP</h1>
    <div style="font-size: 0.9rem; color: #9d174d; font-weight: bold;">Styling standard 3D doll!</div>
  </div>

  <div id="controls">
    <button class="btn" onclick="cycleDress()">👗 DRESS</button>
    <button class="btn" onclick="cycleHair()">💇 HAIR</button>
    <button class="btn" onclick="cycleCrown()">👑 CROWN</button>
    <button class="btn" onclick="cycleBg()">✨ BACKGROUND</button>
  </div>

  <script>
    let scene, camera, renderer;
    let dressMesh, hairMesh, crownMesh;
    
    let dressIdx = 0, hairIdx = 0, crownIdx = 0, bgIdx = 0;

    const dresses = [
      { color: 0xec4899, name: "Pink Princess Gown" },
      { color: 0x8b5cf6, name: "Royal Purple Gown" },
      { color: 0x06b6d4, name: "Magic Diamond Blue" },
      { color: 0xeab308, name: "Golden Sunrise" }
    ];

    const hairs = [
      { color: 0xfde047 }, // Blonde
      { color: 0x78350f }, // Brown
      { color: 0xef4444 }, // Red
      { color: 0x38bdf8 }  // Pastels
    ];

    const crowns = [
      { color: 0xfacc15, show: true },
      { color: 0xe2e8f0, show: true },
      { color: 0x000000, show: false }
    ];

    const backgrounds = [0xfbcfe8, 0xc084fc, 0xa5f3fc, 0xfef08a];

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(backgrounds[0]);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.8, 4.5);
      camera.lookAt(0, 1.4, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1.4);
      light.position.set(2, 5, 5);
      scene.add(light, new THREE.AmbientLight(0xffffff, 0.6));

      // Doll Body Base
      const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.4 });
      const head = new THREE.Mesh(headGeo, skinMat);
      head.position.set(0, 2.2, 0);
      scene.add(head);

      const torsoGeo = new THREE.CylinderGeometry(0.25, 0.35, 0.8, 16);
      const torso = new THREE.Mesh(torsoGeo, skinMat);
      torso.position.set(0, 1.4, 0);
      scene.add(torso);

      // Dress (Cone/Gown)
      const dressGeo = new THREE.ConeGeometry(1.2, 1.5, 32);
      const dressMat = new THREE.MeshStandardMaterial({ color: dresses[0].color, roughness: 0.3 });
      dressMesh = new THREE.Mesh(dressGeo, dressMat);
      dressMesh.position.set(0, 0.75, 0);
      scene.add(dressMesh);

      // Hair Mesh
      const hairGeo = new THREE.SphereGeometry(0.45, 16, 16);
      hairGeo.scale(1, 1.2, 1.1);
      const hairMat = new THREE.MeshStandardMaterial({ color: hairs[0].color, roughness: 0.6 });
      hairMesh = new THREE.Mesh(hairGeo, hairMat);
      hairMesh.position.set(0, 2.3, -0.05);
      scene.add(hairMesh);

      // Crown Mesh
      const crownGeo = new THREE.CylinderGeometry(0.25, 0.2, 0.2, 5);
      const crownMat = new THREE.MeshStandardMaterial({ color: crowns[0].color, metalness: 0.8, roughness: 0.2 });
      crownMesh = new THREE.Mesh(crownGeo, crownMat);
      crownMesh.position.set(0, 2.7, 0);
      scene.add(crownMesh);

      animate();
    }

    function cycleDress() {
      dressIdx = (dressIdx + 1) % dresses.length;
      dressMesh.material.color.setHex(dresses[dressIdx].color);
    }

    function cycleHair() {
      hairIdx = (hairIdx + 1) % hairs.length;
      hairMesh.material.color.setHex(hairs[hairIdx].color);
    }

    function cycleCrown() {
      crownIdx = (crownIdx + 1) % crowns.length;
      crownMesh.visible = crowns[crownIdx].show;
      if (crowns[crownIdx].show) {
        crownMesh.material.color.setHex(crowns[crownIdx].color);
      }
    }

    function cycleBg() {
      bgIdx = (bgIdx + 1) % backgrounds.length;
      scene.background.setHex(backgrounds[bgIdx]);
    }

    function animate() {
      requestAnimationFrame(animate);

      // Doll rotating gracefully in 3D
      scene.rotation.y = Math.sin(Date.now() * 0.001) * 0.3;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
  </script>
</body>
</html>
