<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Time Stop Dodge 3D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #090d16;
      user-select: none;
      touch-action: none;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #38bdf8;
      font-weight: bold;
      font-size: 1.2rem;
      text-shadow: 0 0 10px #0284c7;
      pointer-events: none;
      z-index: 10;
    }
    #instructions {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #facc15;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 20px;
      border-radius: 8px;
      text-align: center;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 15px #0284c7;
      z-index: 10;
      font-size: 0.9rem;
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">⏱️ SCORE: <span id="score">0</span></div>
  <div id="instructions" id="msg">DRAG SCREEN TO MOVE & ADVANCE TIME</div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090d16);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 12, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lights
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(0, 20, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x38bdf8, 0.5));

    // Floor Grid
    const grid = new THREE.GridHelper(20, 20, 0x38bdf8, 0x1e293b);
    scene.add(grid);

    // Player Object
    const player = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, roughness: 0.2 })
    );
    player.position.set(0, 0.5, 4);
    scene.add(player);

    // Obstacles
    const obstacles = [];
    const obsMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 });

    function spawnObstacle() {
      if (obstacles.length >= 12) return;
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), obsMat);
      mesh.position.set((Math.random() - 0.5) * 16, 0.5, -12 - Math.random() * 10);
      scene.add(mesh);
      obstacles.push({ mesh, speed: 0.15 + Math.random() * 0.1 });
    }

    for (let i = 0; i < 8; i++) spawnObstacle();

    // Game Physics State
    let isMoving = false;
    let score = 0;
    let gameOver = false;

    // Mobile Drag Tracking
    let lastTouchX = 0, lastTouchY = 0;

    window.addEventListener('touchstart', (e) => {
      if (gameOver) return restartGame();
      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
    });

    window.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (gameOver) return;

      const deltaX = e.touches[0].clientX - lastTouchX;
      const deltaY = e.touches[0].clientY - lastTouchY;

      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;

      if (Math.abs(deltaX) > 0.5 || Math.abs(deltaY) > 0.5) {
        player.position.x += deltaX * 0.03;
        player.position.z += deltaY * 0.03;

        // Boundaries
        player.position.x = Math.max(-8, Math.min(8, player.position.x));
        player.position.z = Math.max(-8, Math.min(8, player.position.z));

        isMoving = true;
      }
    });

    window.addEventListener('touchend', () => { isMoving = false; });

    // Mouse Fallback
    let isMouseDown = false;
    window.addEventListener('mousedown', (e) => {
      if (gameOver) return restartGame();
      isMouseDown = true;
      lastTouchX = e.clientX;
      lastTouchY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown || gameOver) return;
      const deltaX = e.clientX - lastTouchX;
      const deltaY = e.clientY - lastTouchY;
      lastTouchX = e.clientX;
      lastTouchY = e.clientY;

      if (Math.abs(deltaX) > 0.5 || Math.abs(deltaY) > 0.5) {
        player.position.x += deltaX * 0.03;
        player.position.z += deltaY * 0.03;
        player.position.x = Math.max(-8, Math.min(8, player.position.x));
        player.position.z = Math.max(-8, Math.min(8, player.position.z));
        isMoving = true;
      }
    });

    window.addEventListener('mouseup', () => { isMouseDown = false; isMoving = false; });

    function restartGame() {
      score = 0;
      gameOver = false;
      player.position.set(0, 0.5, 4);
      document.getElementById('score').innerText = score;
      document.getElementById('instructions').innerText = "DRAG SCREEN TO MOVE & ADVANCE TIME";
      obstacles.forEach(o => {
        o.mesh.position.set((Math.random() - 0.5) * 16, 0.5, -12 - Math.random() * 10);
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      if (!gameOver) {
        // Time Stop Mechanic: Obstacles only advance when player moves
        if (isMoving) {
          score++;
          document.getElementById('score').innerText = Math.floor(score / 5);

          obstacles.forEach(o => {
            o.mesh.position.z += o.speed;

            // Reset obstacle to top
            if (o.mesh.position.z > 8) {
              o.mesh.position.z = -12;
              o.mesh.position.x = (Math.random() - 0.5) * 16;
            }

            // Collision Check
            if (player.position.distanceTo(o.mesh.position) < 0.9) {
              gameOver = true;
              document.getElementById('instructions').innerText = `💥 HIT! Score: ${Math.floor(score / 5)}. Tap to retry!`;
            }
          });

          // Reset movement toggle until next drag step
          isMoving = false;
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
