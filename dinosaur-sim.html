<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Dinosaur Simulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #1a2e1a; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; touch-action: none;
    }

    #game-container { width: 100%; height: 100%; }

    /* UI HUD */
    #hud {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10; pointer-events: none;
    }

    .badge {
      background: rgba(15, 23, 42, 0.85); border: 2px solid #22c55e;
      padding: 8px 16px; border-radius: 20px; font-weight: 800;
      color: #86efac; font-size: 0.95rem; backdrop-filter: blur(6px);
    }

    /* TOUCH CONTROLS */
    .touch-btn {
      position: absolute; width: 75px; height: 75px; border-radius: 50%;
      background: rgba(34, 197, 94, 0.35); border: 2px solid #22c55e;
      color: #fff; font-size: 1.8rem; display: flex; align-items: center;
      justify-content: center; z-index: 20; touch-action: manipulation;
      backdrop-filter: blur(4px);
    }
    .touch-btn:active { background: rgba(34, 197, 94, 0.7); }

    #btn-roar { bottom: 25px; right: 25px; width: 85px; height: 85px; background: rgba(239, 68, 68, 0.4); border-color: #ef4444; }

    /* SELECTION OVERLAY */
    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 20, 10, 0.94); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px;
    }

    .dino-select-container {
      display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; justify-content: center;
    }

    .dino-card {
      background: #142e14; border: 2px solid #22c55e; border-radius: 16px;
      padding: 16px; width: 140px; cursor: pointer; transition: transform 0.2s, border-color 0.2s;
    }
    .dino-card:hover, .dino-card:active { transform: scale(1.05); border-color: #86efac; }
    .dino-card div { font-size: 3rem; }
    .dino-card h3 { margin-top: 8px; color: #86efac; font-size: 1.1rem; }
  </style>
  <!-- THREE.JS 3D ENGINE -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="hud">
    <div class="badge">🦖 Dino: <span id="dino-type-txt">T-Rex</span></div>
    <div class="badge">🍖 Prey Hunted: <span id="score-txt">0</span></div>
  </div>

  <div id="btn-roar" class="touch-btn">🥩</div>

  <div id="overlay-start" class="overlay">
    <h1 style="font-size: 2.2rem; color: #86efac; text-shadow: 0 0 15px rgba(34,197,94,0.5);">3D DINOSAUR SIMULATOR</h1>
    <p style="font-size: 0.95rem; color: #cbd5e1; max-width: 320px; margin-top: 10px;">
      Choose your dinosaur species and explore the prehistoric island!
    </p>

    <div class="dino-select-container">
      <div class="dino-card" onclick="selectDino('trex')">
        <div>🦖</div>
        <h3>T-REX</h3>
        <p style="font-size:0.75rem; color:#aaa;">Apex Predator</p>
      </div>
      <div class="dino-card" onclick="selectDino('triceratops')">
        <div>🦕</div>
        <h3>TRICERATOPS</h3>
        <p style="font-size:0.75rem; color:#aaa;">Horned Defender</p>
      </div>
    </div>
  </div>

  <div id="game-container"></div>

  <script>
    let scene, camera, renderer, playerDino, terrain;
    let selectedType = 'trex';
    let moveTarget = new THREE.Vector3();
    let isMoving = false;
    let preyList = [];
    let score = 0;

    // PROCEDURAL 3D DINOSAUR BUILDERS
    function createTRexMesh() {
      const group = new THREE.Group();
      const skinMat = new THREE.MeshStandardMaterial({ color: 0x3a5a40, roughness: 0.8 });
      const bellyMat = new THREE.MeshStandardMaterial({ color: 0xa3b18a, roughness: 0.9 });
      const toothMat = new THREE.MeshStandardMaterial({ color: 0xffffff });

      // Body / Torso
      const bodyGeo = new THREE.SphereGeometry(1.6, 16, 16);
      bodyGeo.scale(1, 1.2, 1.8);
      const body = new THREE.Mesh(bodyGeo, skinMat);
      body.position.y = 2.8;
      body.castShadow = true;
      group.add(body);

      // Head & Jaw
      const headGeo = new THREE.BoxGeometry(1.2, 1.2, 2.0);
      const head = new THREE.Mesh(headGeo, skinMat);
      head.position.set(0, 4.4, 1.2);
      head.castShadow = true;
      group.add(head);

      const jawGeo = new THREE.BoxGeometry(1.0, 0.4, 1.8);
      const jaw = new THREE.Mesh(jawGeo, bellyMat);
      jaw.position.set(0, 3.7, 1.2);
      group.add(jaw);

      // Teeth
      for(let i = -0.4; i <= 0.4; i += 0.2) {
        const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.2, 4), toothMat);
        tooth.rotation.x = Math.PI;
        tooth.position.set(i, 3.8, 2.0);
        group.add(tooth);
      }

      // Tail
      const tailGeo = new THREE.ConeGeometry(0.9, 3.5, 8);
      const tail = new THREE.Mesh(tailGeo, skinMat);
      tail.rotation.x = -Math.PI / 2.5;
      tail.position.set(0, 2.6, -2.4);
      tail.castShadow = true;
      group.add(tail);

      // Powerful Hind Legs
      const legGeo = new THREE.BoxGeometry(0.6, 2.2, 0.8);
      const leftLeg = new THREE.Mesh(legGeo, skinMat);
      leftLeg.position.set(1.1, 1.1, 0);
      leftLeg.castShadow = true;
      group.add(leftLeg);

      const rightLeg = leftLeg.clone();
      rightLeg.position.x = -1.1;
      group.add(rightLeg);

      // Tiny Arms
      const armGeo = new THREE.BoxGeometry(0.2, 0.6, 0.2);
      const leftArm = new THREE.Mesh(armGeo, skinMat);
      leftArm.position.set(0.7, 3.2, 1.3);
      leftArm.rotation.z = -0.3;
      group.add(leftArm);

      const rightArm = leftArm.clone();
      rightArm.position.x = -0.7;
      rightArm.rotation.z = 0.3;
      group.add(rightArm);

      return group;
    }

    function createTriceratopsMesh() {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x7f5539, roughness: 0.85 });
      const hornMat = new THREE.MeshStandardMaterial({ color: 0xe6ccb2, roughness: 0.5 });

      // Barrel Body
      const bodyGeo = new THREE.SphereGeometry(1.8, 16, 16);
      bodyGeo.scale(1.2, 1.1, 1.6);
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 2.0;
      body.castShadow = true;
      group.add(body);

      // Head & Frill
      const headGeo = new THREE.ConeGeometry(1.0, 1.8, 8);
      const head = new THREE.Mesh(headGeo, bodyMat);
      head.rotation.x = Math.PI / 3;
      head.position.set(0, 2.2, 1.6);
      group.add(head);

      // Neck Frill Shield
      const frillGeo = new THREE.CylinderGeometry(1.8, 1.8, 0.3, 8, 1, false, 0, Math.PI);
      const frill = new THREE.Mesh(frillGeo, bodyMat);
      frill.rotation.x = -Math.PI / 4;
      frill.position.set(0, 2.8, 1.0);
      frill.castShadow = true;
      group.add(frill);

      // 3 Horns
      const browHornGeo = new THREE.ConeGeometry(0.15, 1.4, 6);
      const hornL = new THREE.Mesh(browHornGeo, hornMat);
      hornL.position.set(0.5, 3.2, 2.0);
      hornL.rotation.x = Math.PI / 4;
      group.add(hornL);

      const hornR = hornL.clone();
      hornR.position.x = -0.5;
      group.add(hornR);

      const noseHorn = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.7, 6), hornMat);
      noseHorn.position.set(0, 2.2, 2.5);
      noseHorn.rotation.x = Math.PI / 3;
      group.add(noseHorn);

      // 4 Heavy Legs
      const legGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.6, 8);
      const positions = [[1.2, 0.8, 1.0], [-1.2, 0.8, 1.0], [1.2, 0.8, -1.0], [-1.2, 0.8, -1.0]];
      positions.forEach(p => {
        const leg = new THREE.Mesh(legGeo, bodyMat);
        leg.position.set(...p);
        leg.castShadow = true;
        group.add(leg);
      });

      return group;
    }

    function selectDino(type) {
      selectedType = type;
      document.getElementById('dino-type-txt').innerText = type === 'trex' ? 'T-Rex' : 'Triceratops';
      document.getElementById('overlay-start').style.display = 'none';
      init3D();
    }

    function init3D() {
      const container = document.getElementById('game-container');

      // Scene Setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb); // Sky blue
      scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

      // Camera
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xfffaed, 0.9);
      sunLight.position.set(50, 80, 40);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 1024;
      sunLight.shadow.mapSize.height = 1024;
      scene.add(sunLight);

      // Terrain / Ground
      const groundGeo = new THREE.PlaneGeometry(300, 300);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.9 });
      terrain = new THREE.Mesh(groundGeo, groundMat);
      terrain.rotation.x = -Math.PI / 2;
      terrain.receiveShadow = true;
      scene.add(terrain);

      // Trees
      for(let i = 0; i < 40; i++) {
        const treeGroup = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 4), new THREE.MeshStandardMaterial({ color: 0x4a2e16 }));
        trunk.position.y = 2;
        trunk.castShadow = true;
        treeGroup.add(trunk);

        const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.5, 6, 6), new THREE.MeshStandardMaterial({ color: 0x1e4620 }));
        leaves.position.y = 6;
        leaves.castShadow = true;
        treeGroup.add(leaves);

        treeGroup.position.set((Math.random() - 0.5) * 200, 0, (Math.random() - 0.5) * 200);
        scene.add(treeGroup);
      }

      // Add Player Dinosaur
      playerDino = selectedType === 'trex' ? createTRexMesh() : createTriceratopsMesh();
      scene.add(playerDino);

      // Spawn Initial Prey
      for(let i = 0; i < 8; i++) spawnPrey();

      // Controls setup
      window.addEventListener('pointerdown', (e) => {
        if(e.target.id === 'btn-roar') return;
        const mouse = new THREE.Vector2(
          (e.clientX / window.innerWidth) * 2 - 1,
          -(e.clientY / window.innerHeight) * 2 + 1
        );
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(terrain);
        if(intersects.length > 0) {
          moveTarget.copy(intersects[0].point);
          isMoving = true;
        }
      });

      // Eat / Attack Button
      document.getElementById('btn-roar').addEventListener('pointerdown', () => {
        preyList.forEach((p, idx) => {
          if(playerDino.position.distanceTo(p.position) < 6) {
            scene.remove(p);
            preyList.splice(idx, 1);
            score++;
            document.getElementById('score-txt').innerText = score;
            spawnPrey();
          }
        });
      });

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function spawnPrey() {
      const preyMat = new THREE.MeshStandardMaterial({ color: 0xd4a373 });
      const preyMesh = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8), preyMat);
      preyMesh.position.set((Math.random() - 0.5) * 160, 0.8, (Math.random() - 0.5) * 160);
      preyMesh.castShadow = true;
      scene.add(preyMesh);
      preyList.push(preyMesh);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      // Player Movement Logic
      if (isMoving) {
        const dir = new THREE.Vector3().subVectors(moveTarget, playerDino.position);
        dir.y = 0;
        if (dir.length() > 0.5) {
          dir.normalize();
          playerDino.position.addScaledVector(dir, 0.25);
          playerDino.rotation.y = Math.atan2(dir.x, dir.z);

          // Walking Wiggle Animation
          playerDino.rotation.z = Math.sin(Date.now() * 0.01) * 0.05;
        } else {
          isMoving = false;
        }
      }

      // Smooth Camera Follow
      const camOffset = new THREE.Vector3(0, 12, 18);
      const targetCamPos = playerDino.position.clone().add(camOffset);
      camera.position.lerp(targetCamPos, 0.05);
      camera.lookAt(playerDino.position);

      renderer.render(scene, camera);
    }
  </script>
</body>
  </html>
