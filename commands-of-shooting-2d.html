<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Commands of Shooting 2D</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#101418;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#26333b;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
}

/* COMMANDER SCREEN */

#briefing{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.88);
}

#briefingBox{
    width:min(620px,94vw);
    padding:28px;
    text-align:center;
    border-radius:20px;
    background:#20272d;
    border:2px solid #aaa;
    box-shadow:0 15px 50px rgba(0,0,0,.7);
}

#briefingBox h1{
    margin:0 0 15px;
    font-size:30px;
}

#command{
    min-height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1.55;
    font-size:21px;
}

#begin{
    border:0;
    border-radius:12px;
    padding:15px 28px;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
    background:#e5bd36;
    color:#111;
}

/* HUD */

#hud{
    position:absolute;
    z-index:10;
    top:10px;
    left:10px;
    right:10px;
    display:none;
    justify-content:space-between;
    color:white;
    font-weight:bold;
    font-size:17px;
    text-shadow:0 2px 5px #000;
    pointer-events:none;
}

#message{
    position:absolute;
    z-index:11;
    top:48px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
    pointer-events:none;
    text-align:center;
}

/* CROSSHAIR */

#crosshair{
    position:absolute;
    z-index:8;
    left:50%;
    top:50%;
    width:44px;
    height:44px;
    transform:translate(-50%,-50%);
    border:2px solid rgba(255,255,255,.8);
    border-radius:50%;
    pointer-events:none;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
}

#crosshair:before{
    width:2px;
    height:62px;
    left:19px;
    top:-11px;
}

#crosshair:after{
    width:62px;
    height:2px;
    left:-11px;
    top:19px;
}

/* SNIPER */

#gun{
    position:absolute;
    z-index:9;
    width:280px;
    height:175px;
    left:50%;
    bottom:-15px;
    transform:translateX(-50%);
    pointer-events:none;
}

.gun-body{
    position:absolute;
    left:55px;
    bottom:25px;
    width:125px;
    height:55px;
    background:#171717;
    border-radius:8px;
    transform:skewX(-10deg);
}

.gun-barrel{
    position:absolute;
    left:145px;
    bottom:65px;
    width:130px;
    height:16px;
    background:#090909;
    border-radius:6px;
}

.gun-scope{
    position:absolute;
    left:90px;
    bottom:78px;
    width:72px;
    height:18px;
    background:#333;
    border-radius:5px;
}

.gun-stock{
    position:absolute;
    left:10px;
    bottom:30px;
    width:75px;
    height:35px;
    background:#111;
    border-radius:10px;
}

.gun-grip{
    position:absolute;
    left:105px;
    bottom:-3px;
    width:32px;
    height:62px;
    background:#151515;
    transform:rotate(14deg);
    border-radius:5px;
}

#muzzle{
    position:absolute;
    left:267px;
    bottom:62px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:#444;
}

#muzzle.flash{
    background:white;
    box-shadow:
        0 0 15px white,
        0 0 35px orange;
}

/* LEVEL COMPLETE */

#complete{
    position:absolute;
    inset:0;
    z-index:19;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.8);
}

#completeBox{
    background:#20272d;
    padding:30px;
    border-radius:20px;
    text-align:center;
    width:min(500px,90vw);
    border:2px solid #aaa;
}

#nextLevel{
    border:0;
    border-radius:12px;
    padding:14px 25px;
    font-size:18px;
    font-weight:bold;
    background:#e5bd36;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<!-- HUD -->

<div id="hud">
    <span>LEVEL <b id="level">1</b>/50</span>
    <span>TARGETS: <b id="targets">0</b></span>
    <span>LEFT: <b id="left">0</b></span>
</div>

<div id="message"></div>

<!-- CROSSHAIR -->

<div id="crosshair"></div>

<!-- SNIPER -->

<div id="gun">

    <div class="gun-stock"></div>
    <div class="gun-body"></div>
    <div class="gun-barrel"></div>
    <div class="gun-scope"></div>
    <div class="gun-grip"></div>
    <div id="muzzle"></div>

</div>

<!-- COMMANDER -->

<div id="briefing">

    <div id="briefingBox">

        <h1>🧑‍✈️ COMMANDER</h1>

        <div id="command"></div>

        <button id="begin">
            BEGIN MISSION
        </button>

    </div>

</div>

<!-- COMPLETE -->

<div id="complete">

    <div id="completeBox">

        <h1 id="completeTitle">
            LEVEL COMPLETE
        </h1>

        <p id="completeText"></p>

        <button id="nextLevel">
            NEXT LEVEL
        </button>

    </div>

</div>

</div>

<script>

/* =====================================================
   BASIC SETUP
===================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const briefing =
document.getElementById("briefing");

const command =
document.getElementById("command");

const begin =
document.getElementById("begin");

const hud =
document.getElementById("hud");

const message =
document.getElementById("message");

const levelText =
document.getElementById("level");

const targetsText =
document.getElementById("targets");

const leftText =
document.getElementById("left");

const muzzle =
document.getElementById("muzzle");

const complete =
document.getElementById("complete");

const completeTitle =
document.getElementById("completeTitle");

const completeText =
document.getElementById("completeText");

const nextLevel =
document.getElementById("nextLevel");


/* =====================================================
   GAME VARIABLES
===================================================== */

let level=1;

let enemies=[];

let missionType="color";

let targetColor="";

let playing=false;

let gameLoopRunning=false;


/* =====================================================
   ONLY FOUR COLOURS
===================================================== */

const colors={
    RED:"#ef4444",
    GREEN:"#22c55e",
    BLUE:"#3b82f6",
    YELLOW:"#facc15"
};

const colorNames=[
    "RED",
    "GREEN",
    "BLUE",
    "YELLOW"
];


/* =====================================================
   CANVAS SIZE
===================================================== */

function resizeCanvas(){

    const rect =
    canvas.getBoundingClientRect();

    const dpr =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );

    canvas.width =
    rect.width*dpr;

    canvas.height =
    rect.height*dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =====================================================
   COMMANDER
===================================================== */

function makeMission(){

    /*
       Some missions require one colour.
       Some missions require everybody.
    */

    if(Math.random()<0.4){

        missionType="all";

        targetColor="";

        command.innerHTML=`

            <b>LEVEL ${level}</b><br><br>

            🚨 <b>ELIMINATE EVERY STICKMAN.</b><br><br>

            All four colours are targets:<br><br>

            🔴 RED &nbsp;&nbsp;
            🟢 GREEN &nbsp;&nbsp;
            🔵 BLUE &nbsp;&nbsp;
            🟡 YELLOW

        `;

    }else{

        missionType="color";

        targetColor =
        colorNames[
            Math.floor(
                Math.random()*
                colorNames.length
            )
        ];

        command.innerHTML=`

            <b>LEVEL ${level}</b><br><br>

            🎯 <b>
            ELIMINATE ONLY THE
            ${targetColor}
            STICKMAN.
            </b><br><br>

            The ${targetColor}
            target will be placed
            directly in front of you.

        `;
    }
}


/* =====================================================
   CREATE ENEMIES
===================================================== */

function createEnemies(){

    enemies=[];

    const w =
    canvas.clientWidth;

    const h =
    canvas.clientHeight;


    /*
       Difficulty increases with level.
    */

    const amount =
    Math.min(
        6 + Math.floor(level*0.55),
        34
    );


    /*
       IMPORTANT:

       For a colour mission,
       the required Stickman is ALWAYS
       placed directly in front of
       the sniper.
    */

    if(missionType==="color"){

        enemies.push({

            x:w/2,

            y:h*0.48,

            size:36,

            color:targetColor,

            alive:true,

            vx:
            (Math.random()-.5)*
            (0.25+level*.008),

            vy:
            (Math.random()-.5)*
            (0.18+level*.005),

            required:true

        });
    }


    /*
       Add the other Stickmen.
    */

    while(enemies.length<amount){

        const c =
        colorNames[
            Math.floor(
                Math.random()*
                colorNames.length
            )
        ];


        enemies.push({

            x:
            90 +
            Math.random()*
            (w-180),

            y:
            h*.32 +
            Math.random()*
            (h*.30),

            size:
            27 +
            Math.random()*8,

            color:c,

            alive:true,

            vx:
            (Math.random()-.5)*
            (0.35+level*.012),

            vy:
            (Math.random()-.5)*
            (0.20+level*.008),

            required:false

        });
    }

    updateHUD();
}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    const alive =
    enemies.filter(
        e=>e.alive
    );


    let targets=0;


    if(missionType==="all"){

        targets=alive.length;

    }else{

        targets =
        alive.filter(
            e =>
            e.color===targetColor
        ).length;
    }


    levelText.textContent=
    level;

    targetsText.textContent=
    targets;

    leftText.textContent=
    alive.length;
}


/* =====================================================
   START LEVEL
===================================================== */

function startLevel(){

    complete.style.display="none";

    briefing.style.display="none";

    hud.style.display="flex";

    playing=true;

    createEnemies();

    message.textContent =
    missionType==="all"
    ?
    "🎯 SHOOT EVERY COLOUR"
    :
    "🎯 TARGET: "+targetColor;

    if(!gameLoopRunning){

        gameLoopRunning=true;

        requestAnimationFrame(
            gameLoop
        );
    }
}


/* =====================================================
   BEGIN BUTTON
===================================================== */

begin.addEventListener(
    "click",
    startLevel
);


/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground(){

    const w =
    canvas.clientWidth;

    const h =
    canvas.clientHeight;


    /*
       Sky
    */

    const sky =
    ctx.createLinearGradient(
        0,
        0,
        0,
        h
    );

    sky.addColorStop(
        0,
        "#0d1720"
    );

    sky.addColorStop(
        .65,
        "#27343c"
    );

    sky.addColorStop(
        1,
        "#151b1e"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    /*
       Moon
    */

    ctx.fillStyle=
    "#e9e5c8";

    ctx.beginPath();

    ctx.arc(
        w*.82,
        h*.14,
        38,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Ground
    */

    ctx.fillStyle=
    "#20282c";

    ctx.fillRect(
        0,
        h*.68,
        w,
        h*.32
    );


    /*
       Distant buildings
    */

    ctx.fillStyle=
    "#182126";

    ctx.fillRect(
        30,
        h*.38,
        190,
        h*.30
    );

    ctx.fillRect(
        w-220,
        h*.32,
        190,
        h*.36
    );


    /*
       Windows
    */

    ctx.fillStyle=
    "#555d5d";

    for(
        let x=55;
        x<205;
        x+=42
    ){

        for(
            let y=h*.42;
            y<h*.62;
            y+=42
        ){

            ctx.fillRect(
                x,
                y,
                18,
                23
            );
        }
    }


    /*
       Ground lines
    */

    ctx.strokeStyle=
    "rgba(255,255,255,.05)";

    ctx.lineWidth=2;

    for(
        let y=h*.70;
        y<h;
        y+=35
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            w,
            y
        );

        ctx.stroke();
    }
}


/* =====================================================
   DRAW STICKMAN
===================================================== */

function drawStickman(e){

    if(!e.alive)
        return;


    ctx.save();


    /*
       Required target gets a subtle
       glow so it is easy to see.
    */

    if(e.required){

        ctx.shadowColor=
        colors[e.color];

        ctx.shadowBlur=18;
    }


    ctx.strokeStyle=
    colors[e.color];

    ctx.fillStyle=
    colors[e.color];

    ctx.lineWidth=6;

    ctx.lineCap="round";


    /*
       Head
    */

    ctx.beginPath();

    ctx.arc(
        e.x,
        e.y-e.size*1.45,
        e.size*.45,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Body
    */

    ctx.beginPath();

    ctx.moveTo(
        e.x,
        e.y-e.size
    );

    ctx.lineTo(
        e.x,
        e.y+e.size
    );

    ctx.stroke();


    /*
       Arms
    */

    ctx.beginPath();

    ctx.moveTo(
        e.x-e.size,
        e.y-e.size*.4
    );

    ctx.lineTo(
        e.x+e.size,
        e.y-e.size*.4
    );

    ctx.stroke();


    /*
       Legs
    */

    ctx.beginPath();

    ctx.moveTo(
        e.x,
        e.y+e.size
    );

    ctx.lineTo(
        e.x-e.size*.7,
        e.y+e.size*1.9
    );

    ctx.moveTo(
        e.x,
        e.y+e.size
    );

    ctx.lineTo(
        e.x+e.size*.7,
        e.y+e.size*1.9
    );

    ctx.stroke();


    /*
       Required target marker
    */

    if(e.required){

        ctx.shadowBlur=0;

        ctx.strokeStyle=
        "rgba(255,255,255,.8)";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.arc(
            e.x,
            e.y-e.size*.6,
            e.size*1.9,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }


    ctx.restore();
}


/* =====================================================
   UPDATE ENEMIES
===================================================== */

function updateEnemies(){

    const w =
    canvas.clientWidth;

    const h =
    canvas.clientHeight;


    for(const e of enemies){

        if(!e.alive)
            continue;


        e.x += e.vx;

        e.y += e.vy;


        /*
           Required target stays
           near the middle.
        */

        if(e.required){

            const minX =
            w*.35;

            const maxX =
            w*.65;

            const minY =
            h*.38;

            const maxY =
            h*.58;


            if(
                e.x<minX ||
                e.x>maxX
            ){

                e.vx*=-1;
            }


            if(
                e.y<minY ||
                e.y>maxY
            ){

                e.vy*=-1;
            }

        }else{

            /*
               Other Stickmen stay
               inside the battlefield.
            */

            if(
                e.x<50 ||
                e.x>w-50
            ){

                e.vx*=-1;
            }

            if(
                e.y<h*.27 ||
                e.y>h*.66
            ){

                e.vy*=-1;
            }
        }
    }
}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    drawBackground();

    for(const e of enemies){

        drawStickman(e);
    }
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(){

    if(!playing){

        gameLoopRunning=false;

        return;
    }


    updateEnemies();

    draw();

    updateHUD();

    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   SHOOT
===================================================== */

function shoot(clientX,clientY){

    if(!playing)
        return;


    const rect =
    canvas.getBoundingClientRect();


    const x =
    clientX-rect.left;

    const y =
    clientY-rect.top;


    let hit=null;

    let best=Infinity;


    /*
       Find the closest Stickman
       to the shot.
    */

    for(const e of enemies){

        if(!e.alive)
            continue;


        const hitX =
        e.x;

        const hitY =
        e.y-e.size*.65;


        const distance =
        Math.hypot(
            hitX-x,
            hitY-y
        );


        const hitRadius =
        e.size*1.8;


        if(
            distance<hitRadius &&
            distance<best
        ){

            best=distance;

            hit=e;
        }
    }


    /*
       Gun muzzle flash
    */

    muzzle.classList.remove(
        "flash"
    );

    void muzzle.offsetWidth;

    muzzle.classList.add(
        "flash"
    );


    if(!hit){

        message.textContent=
        "💨 MISSED!";

        return;
    }


    /*
       Wrong colour
    */

    if(
        missionType==="color" &&
        hit.color!==targetColor
    ){

        message.textContent=
        "❌ WRONG TARGET!";

        return;
    }


    /*
       Correct shot
    */

    hit.alive=false;

    message.textContent=
    "🎯 TARGET HIT!";


    checkMission();
}


/* =====================================================
   CHECK MISSION
===================================================== */

function checkMission(){

    const alive =
    enemies.filter(
        e=>e.alive
    );


    let targetsLeft;


    if(missionType==="all"){

        targetsLeft=
        alive.length;

    }else{

        targetsLeft=
        alive.filter(
            e =>
            e.color===targetColor
        ).length;
    }


    updateHUD();


    if(targetsLeft>0)
        return;


    /*
       Mission complete
    */

    playing=false;


    setTimeout(
        showLevelComplete,
        600
    );
}


/* =====================================================
   LEVEL COMPLETE
===================================================== */

function showLevelComplete(){

    complete.style.display=
    "flex";


    if(level>=50){

        completeTitle.textContent=
        "🏆 MISSION COMPLETE!";

        completeText.textContent=
        "You completed all 50 levels.";

        nextLevel.textContent=
        "PLAY AGAIN";

    }else{

        completeTitle.textContent=
        "🎯 LEVEL "+level+" COMPLETE!";

        completeText.textContent=
        "The commander has another mission.";

        nextLevel.textContent=
        "NEXT LEVEL";
    }
}


/* =====================================================
   NEXT LEVEL
===================================================== */

nextLevel.addEventListener(
    "click",
    function(){

        if(level>=50){
