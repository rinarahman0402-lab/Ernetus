<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Commands of Shooting 2D</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    background:linear-gradient(#18232d,#34434d);
}

canvas{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

#briefing{
    position:absolute;
    inset:0;
    z-index:10;
    background:rgba(0,0,0,.9);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

#briefingBox{
    width:min(600px,95%);
    background:#20252a;
    border:3px solid #aaa;
    border-radius:18px;
    padding:25px;
    text-align:center;
}

#briefingBox h1{
    margin-top:0;
}

#command{
    font-size:22px;
    line-height:1.5;
    margin:25px 0;
}

button{
    border:0;
    border-radius:12px;
    padding:15px 28px;
    font-size:20px;
    font-weight:bold;
    background:#e4bd36;
    cursor:pointer;
}

#hud{
    position:absolute;
    z-index:5;
    top:10px;
    left:10px;
    right:10px;
    display:none;
    justify-content:space-between;
    pointer-events:none;
    font-weight:bold;
    font-size:18px;
    text-shadow:0 2px 4px #000;
}

#message{
    position:absolute;
    z-index:6;
    top:50px;
    left:50%;
    transform:translateX(-50%);
    font-weight:bold;
    text-shadow:0 2px 4px #000;
    pointer-events:none;
}

#gun{
    position:absolute;
    z-index:4;
    left:50%;
    bottom:-8px;
    transform:translateX(-50%);
    width:230px;
    height:150px;
    pointer-events:none;
}

.gun-body{
    position:absolute;
    left:75px;
    bottom:20px;
    width:110px;
    height:55px;
    background:#191919;
    border-radius:8px;
    transform:skewX(-8deg);
}

.gun-barrel{
    position:absolute;
    left:145px;
    bottom:62px;
    width:100px;
    height:18px;
    background:#090909;
    border-radius:5px;
}

.gun-scope{
    position:absolute;
    left:105px;
    bottom:72px;
    width:55px;
    height:18px;
    background:#333;
    border-radius:5px;
}

.gun-grip{
    position:absolute;
    left:85px;
    bottom:-5px;
    width:32px;
    height:65px;
    background:#151515;
    transform:rotate(15deg);
    border-radius:5px;
}

#muzzle{
    position:absolute;
    left:240px;
    bottom:62px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#555;
}

.flash{
    animation:flash .08s linear;
}

@keyframes flash{
    0%{background:#fff}
    100%{background:#555}
}

#crosshair{
    position:absolute;
    z-index:3;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:45px;
    height:45px;
    border:2px solid rgba(255,255,255,.75);
    border-radius:50%;
    pointer-events:none;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
}

#crosshair:before{
    width:2px;
    height:65px;
    left:20px;
    top:-12px;
}

#crosshair:after{
    width:65px;
    height:2px;
    left:-12px;
    top:20px;
}

.hidden{
    display:none!important;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas" width="1000" height="650"></canvas>

<div id="hud">
    <span>LEVEL <b id="level">1</b>/50</span>
    <span>TARGETS: <b id="targets">0</b></span>
    <span>LEFT: <b id="left">0</b></span>
</div>

<div id="message"></div>

<div id="crosshair"></div>

<div id="gun">
    <div class="gun-body"></div>
    <div class="gun-barrel"></div>
    <div class="gun-scope"></div>
    <div class="gun-grip"></div>
    <div id="muzzle"></div>
</div>

<div id="briefing">
    <div id="briefingBox">
        <h1>🧑‍✈️ COMMANDER</h1>
        <div id="command"></div>
        <button id="begin">BEGIN MISSION</button>
    </div>
</div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const briefing=document.getElementById("briefing");
const command=document.getElementById("command");
const begin=document.getElementById("begin");

const hud=document.getElementById("hud");
const message=document.getElementById("message");

const levelText=document.getElementById("level");
const targetsText=document.getElementById("targets");
const leftText=document.getElementById("left");

const muzzle=document.getElementById("muzzle");

let level=1;
let enemies=[];
let missionType="color";
let targetColor="";
let playing=false;

const colors={
    RED:"#ef4444",
    GREEN:"#22c55e",
    BLUE:"#3b82f6",
    YELLOW:"#facc15"
};

const colorNames=[
    "RED",
    "GREEN",
    "BLUE",
    "YELLOW"
];

function resizeCanvas(){

    const dpr=Math.min(devicePixelRatio||1,2);

    const rect=canvas.getBoundingClientRect();

    canvas.width=rect.width*dpr;
    canvas.height=rect.height*dpr;

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


function makeMission(){

    /*
      About 40% of missions:
      eliminate everyone.

      About 60%:
      eliminate one colour.
    */

    if(Math.random()<.4){

        missionType="all";
        targetColor="";

        command.innerHTML=
        `
        <b>LEVEL ${level}</b><br><br>
        🚨 <b>ELIMINATE EVERY STICKMAN.</b><br><br>
        All four colours are targets:<br>
        🔴 RED &nbsp;
        🟢 GREEN &nbsp;
        🔵 BLUE &nbsp;
        🟡 YELLOW
        `;

    }else{

        missionType="color";

        targetColor=
        colorNames[
            Math.floor(
                Math.random()*colorNames.length
            )
        ];

        command.innerHTML=
        `
        <b>LEVEL ${level}</b><br><br>
        🎯 <b>ELIMINATE ONLY THE ${targetColor} STICKMEN.</b><br><br>
        Do NOT shoot the other colours.
        `;
    }
}


function createEnemies(){

    enemies=[];

    /*
      More enemies as levels increase.
      Level 1 = 7
      Level 50 = 31
    */

    const amount=
    Math.min(
        7+Math.floor(level*.5),
        31
    );

    /*
      Make sure that a colour mission
      ALWAYS contains at least one
      correct target.
    */

    if(missionType==="color"){

        const first={
            x:120+Math.random()*760,
            y:150+Math.random()*330,
            size:28+Math.random()*8,
            color:targetColor,
            alive:true,
            vx:(Math.random()-.5)*
                (.4+level*.015),
            vy:(Math.random()-.5)*
                (.25+level*.01)
        };

        enemies.push(first);
    }

    while(enemies.length<amount){

        const c=
        colorNames[
            Math.floor(
                Math.random()*colorNames.length
            )
        ];

        enemies.push({

            x:80+Math.random()*840,

            y:130+Math.random()*370,

            size:28+Math.random()*8,

            color:c,

            alive:true,

            vx:(Math.random()-.5)*
               (.4+level*.015),

            vy:(Math.random()-.5)*
               (.25+level*.01)
        });
    }

    updateHUD();
}


function updateHUD(){

    const alive=
    enemies.filter(e=>e.alive);

    let targets;

    if(missionType==="all"){

        targets=alive.length;

    }else{

        targets=
        alive.filter(
            e=>e.color===targetColor
        ).length;
    }

    levelText.textContent=level;
    targetsText.textContent=targets;
    leftText.textContent=alive.length;
}


function startLevel(){

    briefing.classList.add("hidden");

    hud.style.display="flex";

    playing=true;

    createEnemies();

    message.textContent=
    missionType==="all"
    ?"🎯 Shoot EVERY Stickman!"
    :"🎯 Target ONLY "+targetColor+"!";

    requestAnimationFrame(gameLoop);
}


begin.addEventListener(
    "click",
    startLevel
);


function drawBackground(){

    const w=canvas.clientWidth;
    const h=canvas.clientHeight;

    /*
      Night sky
    */

    const sky=
    ctx.createLinearGradient(
        0,0,0,h
    );

    sky.addColorStop(
        0,
        "#101923"
    );

    sky.addColorStop(
        1,
        "#303b42"
    );

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,w,h);

    /*
      Moon
    */

    ctx.fillStyle="#e8e6cf";

    ctx.beginPath();

    ctx.arc(
        w*.82,
        h*.15,
        38,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
      Ground
    */

    ctx.fillStyle="#222a2e";

    ctx.fillRect(
        0,
        h*.68,
        w,
        h*.32
    );

    /*
      Buildings
    */

    ctx.fillStyle="#1b2227";

    ctx.fillRect(
        40,
        h*.34,
        180,
        h*.34
    );

    ctx.fillRect(
        w-240,
        h*.28,
        190,
        h*.40
    );

    /*
      Windows
    */

    ctx.fillStyle="#70736b";

    for(let x=65;x<200;x+=45){

        for(
            let y=h*.39;
            y<h*.62;
            y+=45
        ){

            ctx.fillRect(
                x,y,20,25
            );
        }
    }
}


function drawStickman(e){

    if(!e.alive)return;

    ctx.save();

    ctx.strokeStyle=
    colors[e.color];

    ctx.fillStyle=
    colors[e.color];

    ctx.lineWidth=6;

    ctx.lineCap="round";

    /*
      Head
    */

    ctx.beginPath();

    ctx.arc(
        e.x,
        e.y-e.size*1.45,
        e.size*.45,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
      Body
    */

    ctx.beginPath();

    ctx.moveTo(
        e.x,
        e.y-e.size
    );

    ctx.lineTo(
        e.x,
        e.y+e.size
    );

    ctx.stroke();

    /*
      Arms
    */

    ctx.beginPath();

    ctx.moveTo(
        e.x-e.size,
        e.y-e.size*.4
    );

    ctx.lineTo(
        e.x+e.size,
        e.y-e.size*.4
    );

    ctx.stroke();

    /*
      Legs
    */

    ctx.beginPath();

    ctx.moveTo(
        e.x,
        e.y+e.size
    );

    ctx.lineTo(
        e.x-e.size*.7,
        e.y+e.size*1.9
    );

    ctx.moveTo(
        e.x,
        e.y+e.size
    );

    ctx.lineTo(
        e.x+e.size*.7,
        e.y+e.size*1.9
    );

    ctx.stroke();

    ctx.restore();
}


function updateEnemies(){

    for(const e of enemies){

        if(!e.alive)continue;

        e.x+=e.vx;
        e.y+=e.vy;

        const w=canvas.clientWidth;
        const h=canvas.clientHeight;

        if(
            e.x<40 ||
            e.x>w-40
        ){

            e.vx*=-1;
        }

        if(
            e.y<h*.25 ||
            e.y>h*.65
        ){

            e.vy*=-1;
        }
    }
}


function draw(){

    drawBackground();

    for(const e of enemies){

        drawStickman(e);
    }
}


function gameLoop(){

    if(!playing)return;

    updateEnemies();

    draw();

    updateHUD();

    requestAnimationFrame(
        gameLoop
    );
}


function shoot(clientX,clientY){

    if(!playing)return;

    const rect=
    canvas.getBoundingClientRect();

    const x=
    clientX-rect.left;

    const y=
    clientY-rect.top;

    /*
      Find the closest Stickman
      to where the player tapped.
    */

    let hit=null;
    let best=Infinity;

    for(const e of enemies){

        if(!e.alive)continue;

        const distance=
        Math.hypot(
            e.x-x,
            (e.y-e.size*.6)-y
        );

        const hitRadius=
        e.size*1.8;

        if(
            distance<hitRadius &&
            distance<best
        ){

            best=distance;
            hit=e;
        }
    }

    /*
      Gun flash
    */

    muzzle.classList.remove("flash");

    void muzzle.offsetWidth;

    muzzle.classList.add("flash");


    if(!hit){

        message.textContent=
        "💨 MISSED!";

        return;
    }


    /*
      Wrong colour
    */

    if(
        missionType==="color" &&
        hit.color!==targetColor
    ){

        message.textContent=
        "❌ WRONG COLOUR! TARGET "+
        targetColor+
        ".";

        return;
    }


    /*
      Correct target
    */

    hit.alive=false;

    message.textContent=
    "🎯 TARGET CLEARED!";

    checkMission();
}


function checkMission(){

    const alive=
    enemies.filter(
        e=>e.alive
    );

    let targetsLeft;

    if(missionType==="all"){

        targetsLeft=alive.length;

    }else{

        targetsLeft=
        alive.filter(
            e=>e.color===targetColor
        ).length;
    }

    if(targetsLeft>0){

        updateHUD();

        return;
    }

    playing=false;

    setTimeout(
        nextLevel,
        700
    );
}


function nextLevel(){

    if(level>=50){

        briefing.classList.remove(
            "hidden"
        );

        hud.style.display="none";

        command.innerHTML=
        `
        🏆 <b>ALL 50 LEVELS COMPLETE!</b><br><br>
        You followed every commander order
        and completed the entire mission.
        `;

        begin.textContent=
        "PLAY AGAIN";

        begin.onclick=function(){

            level=1;

            begin.textContent=
            "BEGIN MISSION";

            begin.onclick=
            startLevel;

            makeMission();
        };

        return;
    }

    level++;

    makeMission();

    briefing.classList.remove(
        "hidden"
    );

    begin.textContent=
    "BEGIN LEVEL "+level;
}


/*
  Shooting controls
*/

canvas.addEventListener(
    "pointerdown",
    function(e){

        shoot(
            e.clientX,
            e.clientY
        );
    }
);


/*
  Start first briefing
*/

makeMission();

</script>

</body>
</html>
