<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bubble Pop Relax</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #fbcfe8 0%, #e0e7ff 50%, #bae6fd 100%);
      user-select: none; -webkit-user-select: none; touch-action: manipulation;
    }

    canvas { display: block; width: 100%; height: 100%; }

    /* TOP HUD */
    #hud {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 16px; align-items: center; z-index: 10;
      background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(8px);
      padding: 8px 20px; border-radius: 24px; border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 90%; max-width: 400px;
      justify-content: space-between;
    }
    .hud-title { font-size: 1.1rem; font-weight: bold; color: #475569; }
    .hud-score { font-size: 1.3rem; font-weight: 800; color: #ec4899; }
    .bgm-btn {
      background: rgba(255, 255, 255, 0.9); border: none; border-radius: 50%;
      width: 36px; height: 36px; font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* TOAST / POPUP */
    .pop-text {
      position: absolute; font-weight: 800; font-size: 1.2rem; pointer-events: none;
      animation: floatUp 0.8s ease-out forwards; z-index: 20;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-30px) scale(1.3); }
    }
  </style>
</head>
<body>

  <!-- AUDIO ELEMENTS -->
  <audio id="snd-pop" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
  <audio id="bgm" loop src="https://assets.mixkit.co/music/preview/mixkit-game-level-music-689.mp3"></audio>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-title">🫧 Bubble Pop</div>
    <div class="hud-score">Score: <span id="score-txt">0</span></div>
    <button class="bgm-btn" onclick="toggleBGM()">🎵</button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let bgmPlaying = false;
    let bubbles = [];
    let particles = [];
    let spawnTimer = 0;

    // PASTEL BUBBLE TYPES
    const BUBBLE_TYPES = [
      { color: 'rgba(244, 114, 182, 0.65)', border: '#ec4899', points: 1, radius: 36, speed: 1.2 },  // Pink (1 pt)
      { color: 'rgba(167, 139, 250, 0.65)', border: '#8b5cf6', points: 3, radius: 28, speed: 1.8 },  // Purple (3 pts)
      { color: 'rgba(56, 189, 248, 0.65)',  border: '#0284c7', points: 5, radius: 22, speed: 2.5 }   // Cyan Fast (5 pts)
    ];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnBubble() {
      const type = BUBBLE_TYPES[Math.floor(Math.random() * BUBBLE_TYPES.length)];
      const radius = type.radius + Math.random() * 6;

      bubbles.push({
        x: radius + Math.random() * (canvas.width - radius * 2),
        y: canvas.height + radius + 10,
        radius: radius,
        speed: type.speed + Math.random() * 0.4,
        color: type.color,
        border: type.border,
        points: type.points,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.02 + Math.random() * 0.03
      });
    }

    function createParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 3 + Math.random() * 4,
          color: color,
          life: 1.0
        });
      }
    }

    function showPopText(x, y, text, color) {
      const el = document.createElement('div');
      el.className = 'pop-text';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.color = color;
      el.innerText = '+' + text;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    // TOUCH / CLICK EVENT
    function handleTap(e) {
      const rect = canvas.getBoundingClientRect();
      const tapX = e.clientX - rect.left;
      const tapY = e.clientY - rect.top;

      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        const dist = Math.hypot(b.x - tapX, b.y - tapY);

        if (dist <= b.radius + 10) { // Slightly forgiving hit box
          score += b.points;
          document.getElementById('score-txt').innerText = score;

          playSound('snd-pop');
          createParticles(b.x, b.y, b.border);
          showPopText(b.x, b.y, b.points, b.border);

          bubbles.splice(i, 1);
          break; // Pop one bubble per tap
        }
      }
    }

    canvas.addEventListener('pointerdown', handleTap);

    function playSound(id) {
      const snd = document.getElementById(id);
      if (snd) {
        // Soft random pitch variation for relaxing sound
        snd.playbackRate = 0.9 + Math.random() * 0.3;
        snd.currentTime = 0;
        snd.play().catch(() => {});
      }
    }

    function toggleBGM() {
      const bgm = document.getElementById('bgm');
      if (!bgmPlaying) {
        bgm.play().catch(() => {});
        bgmPlaying = true;
      } else {
        bgm.pause();
        bgmPlaying = false;
      }
    }

    // MAIN ANIMATION LOOP
    function animate() {
      requestAnimationFrame(animate);

      // Clear Canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Spawn Bubbles Continuously
      spawnTimer++;
      if (spawnTimer % 35 === 0) {
        spawnBubble();
      }

      // Update & Render Bubbles
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.y -= b.speed;
        b.wobble += b.wobbleSpeed;
        const currentX = b.x + Math.sin(b.wobble) * 1.5;

        // Draw Bubble Outer Shell
        ctx.beginPath();
        ctx.arc(currentX, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = b.border;
        ctx.stroke();

        // Draw Pastel Gloss Highlight
        ctx.beginPath();
        ctx.arc(currentX - b.radius * 0.35, b.y - b.radius * 0.35, b.radius * 0.25, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.fill();

        // Remove Offscreen Bubbles
        if (b.y < -b.radius * 2) {
          bubbles.splice(i, 1);
        }
      }

      // Update & Render Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }
    }

    // Initial Spawns
    for (let i = 0; i < 6; i++) spawnBubble();
    animate();
  </script>
</body>
</html>
