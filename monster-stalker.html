<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Monster Stalker</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05060b;
  font-family:Arial,sans-serif;
  color:white;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  background:#101827;
}

#hud{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.box{
  background:rgba(10,10,20,.85);
  border:2px solid #6d3bc4;
  border-radius:12px;
  padding:10px 14px;
  font-weight:bold;
}

#message{
  position:absolute;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  text-align:center;
  background:rgba(0,0,0,.7);
  padding:10px;
  border-radius:10px;
  font-size:16px;
}

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:20px;
  height:150px;
  pointer-events:none;
}

#joystick{
  position:absolute;
  left:25px;
  bottom:0;
  width:130px;
  height:130px;
  border:4px solid #777;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  pointer-events:auto;
  touch-action:none;
}

#stick{
  position:absolute;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#6d35a8;
  border:3px solid #b88cff;
  left:32px;
  top:32px;
}

.action{
  position:absolute;
  bottom:10px;
  width:105px;
  height:105px;
  border-radius:50%;
  border:3px solid white;
  color:white;
  font-weight:bold;
  font-size:16px;
  pointer-events:auto;
  touch-action:none;
}

#bomb{
  right:145px;
  background:#6c1698;
}

#grab{
  right:25px;
  background:#c90c45;
}

#startScreen,
#endScreen{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#070812;
  z-index:10;
}

.panel{
  width:min(90vw,600px);
  padding:28px;
  border-radius:20px;
  background:#171326;
  border:3px solid #743fc5;
  text-align:center;
}

h1{
  font-size:clamp(32px,8vw,58px);
  margin-top:0;
}

p{
  line-height:1.6;
  font-size:18px;
}

.mainButton{
  padding:16px 35px;
  border:none;
  border-radius:12px;
  background:#743fc5;
  color:white;
  font-size:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">
  <div class="box" id="score">Score: 0</div>
  <div class="box" id="status">Status: CRAWLING</div>
</div>

<div id="message">
  Find and grab the glowing crystals. Avoid the monsters!
</div>

<div id="controls">

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button class="action" id="bomb">BOMB</button>

  <button class="action" id="grab">GRAB</button>

</div>

<div id="startScreen">
  <div class="panel">
    <h1>MONSTER STALKER</h1>

    <p>
      You are trapped in a dark monster world.
    </p>

    <p>
      Move using the purple joystick.<br>
      Get close to a glowing crystal and press GRAB.<br>
      Monsters chase you. Use BOMB to scare them away!
    </p>

    <button class="mainButton" id="startButton">
      START GAME
    </button>
  </div>
</div>

<div id="endScreen" style="display:none;">
  <div class="panel">
    <h1 id="endTitle">YOU ESCAPED!</h1>
    <p id="endText"></p>

    <button class="mainButton" id="restartButton">
      PLAY AGAIN
    </button>
  </div>
</div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

resize();
window.addEventListener("resize",resize);

const scoreText=document.getElementById("score");
const statusText=document.getElementById("status");
const message=document.getElementById("message");

let running=false;
let score=0;
let crystals=[];
let monsters=[];
let moveX=0;
let moveY=0;

const player={
  x:0,
  y:0,
  r:20,
  speed:4
};

function setupGame(){

  score=0;

  player.x=canvas.width/2;
  player.y=canvas.height/2;

  crystals=[];
  monsters=[];

  for(let i=0;i<8;i++){
    crystals.push({
      x:80+Math.random()*(canvas.width-160),
      y:140+Math.random()*(canvas.height-330),
      r:16,
      taken:false
    });
  }

  for(let i=0;i<5;i++){
    monsters.push({
      x:Math.random()*canvas.width,
      y:120+Math.random()*(canvas.height-320),
      r:25,
      speed:0.7+Math.random()*0.5
    });
  }

  updateHUD();
}

function updateHUD(){

  scoreText.textContent="Score: "+score;

  if(score>=8){
    statusText.textContent="Status: ESCAPING";
  }else if(score>=4){
    statusText.textContent="Status: HUNTING";
  }else{
    statusText.textContent="Status: CRAWLING";
  }
}

function drawBackground(){

  ctx.fillStyle="#101827";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<35;i++){

    const x=(i*97)%canvas.width;
    const y=100+(i*157)%(canvas.height-200);

    ctx.fillStyle="rgba(120,80,180,.12)";
    ctx.beginPath();
    ctx.arc(x,y,25+(i%4)*12,0,Math.PI*2);
    ctx.fill();
  }
}

function drawPlayer(){

  ctx.save();
  ctx.translate(player.x,player.y);

  ctx.shadowColor="#a64cff";
  ctx.shadowBlur=18;

  ctx.fillStyle="#7035aa";
  ctx.beginPath();
  ctx.arc(0,0,player.r,0,Math.PI*2);
  ctx.fill();

  ctx.shadowBlur=0;

  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(-7,-4,4,0,Math.PI*2);
  ctx.arc(7,-4,4,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawCrystal(c){

  if(c.taken)return;

  ctx.save();

  ctx.shadowColor="#55eaff";
  ctx.shadowBlur=20;

  ctx.fillStyle="#4de7ff";

  ctx.beginPath();
  ctx.moveTo(c.x,c.y-c.r);
  ctx.lineTo(c.x+c.r,c.y);
  ctx.lineTo(c.x,c.y+c.r);
  ctx.lineTo(c.x-c.r,c.y);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawMonster(m){

  ctx.save();

  ctx.shadowColor="#ff174f";
  ctx.shadowBlur=15;

  ctx.fillStyle="#9c1239";

  ctx.beginPath();
  ctx.arc(m.x,m.y,m.r,0,Math.PI*2);
  ctx.fill();

  ctx.shadowBlur=0;

  ctx.fillStyle="white";

  ctx.beginPath();
  ctx.arc(m.x-8,m.y-5,5,0,Math.PI*2);
  ctx.arc(m.x+8,m.y-5,5,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(m.x-8,m.y-5,2,0,Math.PI*2);
  ctx.arc(m.x+8,m.y-5,2,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function movePlayer(){

  player.x+=moveX*player.speed;
  player.y+=moveY*player.speed;

  player.x=Math.max(
    player.r,
    Math.min(canvas.width-player.r,player.x)
  );

  player.y=Math.max(
    100+player.r,
    Math.min(canvas.height-170-player.r,player.y)
  );
}

function moveMonsters(){

  for(const m of monsters){

    const dx=player.x-m.x;
    const dy=player.y-m.y;

    const d=Math.hypot(dx,dy);

    if(d>0){

      m.x+=(dx/d)*m.speed;
      m.y+=(dy/d)*m.speed;
    }

    if(d<player.r+m.r){

      gameOver();
    }
  }
}

function grabCrystal(){

  if(!running)return;

  for(const c of crystals){

    if(c.taken)continue;

    const d=Math.hypot(
      player.x-c.x,
      player.y-c.y
    );

    if(d<70){

      c.taken=true;
      score++;

      updateHUD();

      message.textContent=
      "Crystal collected! Find the others.";

      if(score===8){
        winGame();
      }

      return;
    }
  }

  message.textContent=
  "Get closer to a glowing crystal!";
}

function useBomb(){

  if(!running)return;

  message.textContent=
  "BOOM! The monsters ran away!";

  for(const m of monsters){

    const dx=m.x-player.x;
    const dy=m.y-player.y;
    const d=Math.hypot(dx,dy)||1;

    m.x+=(dx/d)*180;
    m.y+=(dy/d)*180;

    m.x=Math.max(
      m.r,
      Math.min(canvas.width-m.r,m.x)
    );

    m.y=Math.max(
      100+m.r,
      Math.min(canvas.height-170-m.r,m.y)
    );
  }
}

function winGame(){

  running=false;

  document.getElementById("endTitle").textContent=
  "YOU ESCAPED!";

  document.getElementById("endText").textContent=
  "You collected all 8 crystals and escaped the monsters!";

  document.getElementById("endScreen").style.display="flex";
}

function gameOver(){

  if(!running)return;

  running=false;

  document.getElementById("endTitle").textContent=
  "THE MONSTERS FOUND YOU!";

  document.getElementById("endText").textContent=
  "Score: "+score+" out of 8 crystals.";

  document.getElementById("endScreen").style.display="flex";
}

function draw(){

  drawBackground();

  for(const c of crystals){
    drawCrystal(c);
  }

  for(const m of monsters){
    drawMonster(m);
  }

  drawPlayer();
}

function loop(){

  if(running){
    movePlayer();
    moveMonsters();
  }

  draw();

  requestAnimationFrame(loop);
}

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joystickActive=false;

function updateJoystick(e){

  const rect=joystick.getBoundingClientRect();

  const clientX=e.clientX;
  const clientY=e.clientY;

  let x=clientX-(rect.left+rect.width/2);
  let y=clientY-(rect.top+rect.height/2);

  const distance=Math.hypot(x,y);
  const max=36;

  if(distance>max){
    x=x/distance*max;
    y=y/distance*max;
  }

  stick.style.left=(32+x)+"px";
  stick.style.top=(32+y)+"px";

  moveX=x/max;
  moveY=y/max;
}

joystick.addEventListener("pointerdown",function(e){

  joystickActive=true;
  joystick.setPointerCapture(e.pointerId);

  updateJoystick(e);
});

joystick.addEventListener("pointermove",function(e){

  if(joystickActive){
    updateJoystick(e);
  }
});

function resetJoystick(){

  joystickActive=false;

  moveX=0;
  moveY=0;

  stick.style.left="32px";
  stick.style.top="32px";
}

joystick.addEventListener("pointerup",resetJoystick);
joystick.addEventListener("pointercancel",resetJoystick);

document.getElementById("grab").addEventListener(
  "click",
  grabCrystal
);

document.getElementById("bomb").addEventListener(
  "click",
  useBomb
);

document.getElementById("startButton").addEventListener(
  "click",
  function(){

    document.getElementById("startScreen").style.display="none";

    setupGame();

    running=true;

    message.textContent=
    "Find all 8 glowing crystals!";
  }
);

document.getElementById("restartButton").addEventListener(
  "click",
  function(){

    document.getElementById("endScreen").style.display="none";

    setupGame();

    running=true;

    message.textContent=
    "Find all 8 glowing crystals!";
  }
);

setupGame();
loop();

</script>

</body>
</html>
